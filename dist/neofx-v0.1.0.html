// ---- gpu/mapgen.js
const { MapGen } = (() => {
// The map pipeline of the engine (plan §7.3 – §7.6): generate -> blur (2 passes) -> adjust, into a
// map texture. The custom map (image or video frames) is an R8 texture array.





const QUAD_VERT = "#version 300 es\n// One triangle that covers the target. v_uv: 0..1, v = 0 at the first row (image top, in texture space).\nout vec2 v_uv;\nvoid main() {\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n  v_uv = p;\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}\n";
const STORE_GLSL = "// Read the frame store (plan §6.3): Y and CbCr layers -> RGB (BT.709 full range).\nuniform highp sampler2DArray u_storeY;\nuniform highp sampler2DArray u_storeC;\nuniform highp isampler2D u_layers; // N x 1: the frame index in each store layer\nuniform int u_n;\n\nvec3 storeRgb(vec2 uv, float layer) {\n  float y = texture(u_storeY, vec3(uv, layer)).r;\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n\n// The layer of frame k, or -1 when frame k is not in the store (or k < 0).\nint layerOf(int k) {\n  if (k < 0 || u_n < 1) return -1;\n  int l = k % u_n;\n  return texelFetch(u_layers, ivec2(l, 0), 0).r == k ? l : -1;\n}\n\n// The colour of frame k at uv, and a = 1 when frame k is in the store (else black, a = 0).\nvec4 frameAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? vec4(0.0) : vec4(storeRgb(uv, float(l)), 1.0);\n}\n\n// The luma of frame k at uv (0 when not in the store).\nfloat lumaAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? 0.0 : texture(u_storeY, vec3(uv, float(l))).r;\n}\n";
const GEN_FRAG = "// Map generator (plan §7.3, §7.4, §7.6). Into the raw map texture (one value for each pixel).\n// The coordinates: offset -> tile (repeat or mirror) -> animation (rotate, pulse, about the frame\n// centre) -> the source: a built-in map (u_type), the custom image / video map, the luma of frame t\n// (self), or the motion of frames t-K .. t.\n#define PI 3.14159265359\nuniform vec2 u_res;\nuniform int u_src;      // 0 built-in, 1 custom (image or video)\nuniform int u_type;     // MAPS index\nuniform float u_k[12];  // the params of the map\nuniform float u_phase;  // phase speed × t (cycles)\nuniform float u_rot;    // rotation speed × t (degrees)\nuniform float u_pulse;  // the pulse scale at t\nuniform float u_seed;   // the seed change: floor(t / every)\nuniform vec2 u_offset;  // 0..1 of the frame\nuniform vec2 u_tile;\nuniform bool u_mirror;\nuniform int u_t;\nuniform highp sampler2D u_mask;  // the subject mask (Subject mask map)\nuniform highp sampler2D u_dist;  // the nearest subject pixel (Subject distance map)\nuniform vec2 u_workRes;\n// Custom map (R8 array: an image = 1 layer, a video = its frames).\nuniform highp sampler2DArray u_custom;\nuniform float u_layer;\nuniform vec2 u_csize;   // its size in pixels\nuniform int u_fit;      // 0 fill, 1 fit, 2 stretch\nuniform float u_outside;\nuniform vec2 u_pos;     // 0..1 of the frame\nuniform float u_scale;\nuniform float u_crot;   // degrees\nuniform vec2 u_flip;    // -1 or 1\nin vec2 v_uv;\nout vec4 o;\n\nuint hash3(uvec3 v) {\n  v = v * 1664525u + 1013904223u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  v ^= v >> 16u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  return v.x ^ v.y ^ v.z;\n}\n// 0..1 for an integer cell and a seed.\nfloat rnd(vec2 cell, float seed) {\n  return float(hash3(uvec3(ivec3(int(floor(cell.x)) + 32768, int(floor(cell.y)) + 32768, int(seed)))) & 0xffffffu) / 16777216.0;\n}\nfloat vnoise(vec2 p, float seed) {\n  vec2 i = floor(p), f = fract(p);\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(rnd(i, seed), rnd(i + vec2(1, 0), seed), u.x), mix(rnd(i + vec2(0, 1), seed), rnd(i + vec2(1, 1), seed), u.x), u.y);\n}\nvec2 rnd2(vec2 cell, float seed) {\n  return vec2(rnd(cell, seed), rnd(cell, seed + 7919.0));\n}\n// Phase: a clamped ramp (phase 0), or a repeated ramp that moves (phase != 0).\nfloat ramp(float s) {\n  return u_phase == 0.0 ? clamp(s, 0.0, 1.0) : fract(s - u_phase);\n}\nvec2 dir(float deg) {\n  float a = radians(deg);\n  return vec2(cos(a), sin(a));\n}\n\nfloat builtin(vec2 P) {\n  vec2 R = u_res;\n  float seed = u_k[3] + u_seed; // where the seed is param 3 (fbm); others set their own below\n  if (u_type == 0) { // linear: angle, x, y, width\n    vec2 d = dir(u_k[0]);\n    float span = abs(R.x * d.x) + abs(R.y * d.y);\n    return ramp(dot(P - vec2(u_k[1], u_k[2]) * R, d) / max(u_k[3] * span, 1e-3) + 0.5);\n  }\n  if (u_type == 1) { // mirrored: angle, x, y, width\n    vec2 d = dir(u_k[0]);\n    float span = abs(R.x * d.x) + abs(R.y * d.y);\n    return ramp(abs(dot(P - vec2(u_k[1], u_k[2]) * R, d)) / max(0.5 * u_k[3] * span, 1e-3));\n  }\n  vec2 q = (P - vec2(u_k[0], u_k[1]) * R) / R.y; // from the centre, in frame heights\n  if (u_type == 2) { // radial: x, y, radius, aspect\n    q.x /= u_k[3];\n    return ramp(length(q) / u_k[2]);\n  }\n  if (u_type == 3) { // angular: x, y, start, turns\n    float a = atan(q.y, q.x) - radians(u_k[2]);\n    return fract(a / (2.0 * PI) * u_k[3] - u_phase);\n  }\n  if (u_type == 4) { // spiral: x, y, arms, tightness\n    float a = atan(q.y, q.x);\n    return fract(a / (2.0 * PI) * u_k[2] + length(q) * u_k[3] - u_phase);\n  }\n  if (u_type == 5) { // box: x, y, size, roundness (0 box, 0.5 circle, 1 diamond)\n    float r = u_k[3];\n    float n = r < 0.5 ? exp2(4.0 - 6.0 * r) : 2.0 - 2.0 * (r - 0.5);\n    vec2 a = abs(q) / u_k[2];\n    float m = max(a.x, a.y);\n    float norm = m <= 0.0 ? 0.0 : m * pow(pow(a.x / m, n) + pow(a.y / m, n), 1.0 / n);\n    return ramp(norm);\n  }\n  vec2 uv = P / R;\n  if (u_type == 6) { // four corners\n    float v = mix(mix(u_k[0], u_k[1], uv.x), mix(u_k[2], u_k[3], uv.x), uv.y);\n    return u_phase == 0.0 ? v : fract(v - u_phase);\n  }\n  vec2 h = P / R.y; // frame-height units from the top left\n  if (u_type == 7) { // stripes: count, angle, softness, duty\n    float f = fract(dot(h, dir(u_k[1])) * u_k[0] - u_phase);\n    float duty = u_k[3];\n    float f2 = f > 0.5 * (1.0 + duty) ? f - 1.0 : f;\n    float e = min(f2, duty - f2);\n    return clamp(e / max(u_k[2], 1e-4) + 0.5, 0.0, 1.0);\n  }\n  if (u_type == 8) { // sine: fx, fy, angle, phase\n    vec2 d = dir(u_k[2]);\n    float x = dot(h, d), y = dot(h, vec2(-d.y, d.x));\n    float ph = u_k[3] + u_phase, s = 0.0, n = 0.0;\n    if (u_k[0] > 0.0) { s += sin(2.0 * PI * (u_k[0] * x + ph)); n += 1.0; }\n    if (u_k[1] > 0.0) { s += sin(2.0 * PI * (u_k[1] * y + ph)); n += 1.0; }\n    return 0.5 + 0.5 * s / max(n, 1.0);\n  }\n  if (u_type == 9) { // rings: x, y, count, softness\n    float f = fract(length(q) * u_k[2] - u_phase);\n    return mix(f, 0.5 - 0.5 * cos(2.0 * PI * f), u_k[3]);\n  }\n  if (u_type == 10) { // checker: cells, softness\n    vec2 c = h * u_k[0] + vec2(u_phase, 0.0);\n    float s = sin(PI * c.x) * sin(PI * c.y);\n    return u_k[1] < 1e-4 ? step(0.0, s) : clamp(0.5 + s / (2.0 * u_k[1]), 0.0, 1.0);\n  }\n  if (u_type == 11) { // fbm: scale, octaves, roughness, seed\n    vec2 p = h * u_k[0] + vec2(u_phase, 0.0);\n    float sum = 0.0, amp = 1.0, total = 0.0;\n    for (int i = 0; i < 8; i++) {\n      if (float(i) >= u_k[1]) break;\n      sum += amp * vnoise(p, seed + float(i) * 101.0);\n      total += amp;\n      amp *= u_k[2];\n      p *= 2.0;\n    }\n    return sum / max(total, 1e-4);\n  }\n  if (u_type == 12) { // ridged: scale, octaves, seed\n    vec2 p = h * u_k[0] + vec2(u_phase, 0.0);\n    float sum = 0.0, amp = 1.0, total = 0.0;\n    for (int i = 0; i < 8; i++) {\n      if (float(i) >= u_k[1]) break;\n      float n = 1.0 - abs(2.0 * vnoise(p, u_k[2] + u_seed + float(i) * 101.0) - 1.0);\n      sum += amp * n * n;\n      total += amp;\n      amp *= 0.5;\n      p *= 2.0;\n    }\n    return sum / max(total, 1e-4);\n  }\n  if (u_type == 13 || u_type == 14) { // worley: scale, seed, metric; voronoi: scale, seed\n    vec2 p = h * u_k[0] + vec2(u_phase, 0.0);\n    vec2 i = floor(p);\n    float best = 1e9, val = 0.0;\n    for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {\n      vec2 c = i + vec2(x, y);\n      vec2 d = c + rnd2(c, u_k[1] + u_seed) - p;\n      float m = u_type == 13 && u_k[2] > 1.5 ? max(abs(d.x), abs(d.y)) : u_type == 13 && u_k[2] > 0.5 ? abs(d.x) + abs(d.y) : length(d);\n      if (m < best) { best = m; val = rnd(c, u_k[1] + u_seed + 31.0); }\n    }\n    return u_type == 13 ? clamp(best, 0.0, 1.0) : val;\n  }\n  if (u_type == 15) { // blocks: bw, bh, seed\n    return rnd(floor((P + vec2(u_phase * u_k[0], 0.0)) / vec2(u_k[0], u_k[1])), u_k[2] + u_seed);\n  }\n  if (u_type == 16) { // rows: size, direction (1 = columns), seed\n    float c = u_k[1] > 0.5 ? P.x : P.y;\n    return rnd(vec2(floor(c / u_k[0] + u_phase), 0.0), u_k[2] + u_seed);\n  }\n  if (u_type == 17) { // bayer: matrix (2^n), base\n    int n = int(u_k[0] + 0.5);\n    ivec2 ip = ivec2(floor(P));\n    int b = 0;\n    for (int i = 0; i < 3; i++) {\n      if (i >= n) break;\n      int sh = n - 1 - i;\n      int x = (ip.x >> i) & 1, y = (ip.y >> i) & 1;\n      b |= ((x ^ y) << (2 * sh + 1)) | (y << (2 * sh));\n    }\n    float size = float(1 << (2 * n));\n    return u_k[1] > (float(b) + 0.5) / size ? 1.0 : 0.0;\n  }\n  if (u_type == 18) return lumaAt(u_t, P / R); // self: the luma of frame t\n  if (u_type == 19) { // motion: gain, frames\n    float s = 0.0;\n    int K = int(u_k[1] + 0.5);\n    for (int k = 0; k < 8; k++) {\n      if (k >= K) break;\n      if (layerOf(u_t - k - 1) < 0) break;\n      s += abs(lumaAt(u_t - k, P / R) - lumaAt(u_t - k - 1, P / R));\n    }\n    return clamp(s / float(K) * u_k[0], 0.0, 1.0);\n  }\n  if (u_type == 20) return mix(u_k[1], u_k[0], texture(u_mask, P / R).r); // subject: subject value, background value\n  if (u_type == 21) { // subject distance: falloff (working px)\n    vec2 q = P / R * u_workRes;\n    ivec2 sz = textureSize(u_dist, 0);\n    vec2 sd = texelFetch(u_dist, clamp(ivec2(q), ivec2(0), sz - 1), 0).rg;\n    return sd.x < 0.0 ? 1.0 : clamp(length(sd - q) / max(u_k[0], 1.0), 0.0, 1.0);\n  }\n  return 0.0;\n}\n\nfloat custom(vec2 P) {\n  vec2 R = u_res;\n  vec2 p = P - R * 0.5 - u_pos * R;\n  float a = radians(-u_crot);\n  p = mat2(cos(a), sin(a), -sin(a), cos(a)) * p / max(u_scale, 1e-3);\n  p *= u_flip;\n  vec2 uv;\n  if (u_fit == 2) uv = p / R + 0.5;\n  else {\n    float s = u_fit == 0 ? max(R.x / u_csize.x, R.y / u_csize.y) : min(R.x / u_csize.x, R.y / u_csize.y);\n    uv = p / (u_csize * s) + 0.5;\n  }\n  if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return u_outside;\n  return texture(u_custom, vec3(uv, u_layer)).r;\n}\n\nvoid main() {\n  vec2 R = u_res;\n  vec2 uv = v_uv + u_offset;\n  // Tile: each tile has the full map; mirror: every second tile is flipped.\n  vec2 tu = uv * u_tile;\n  vec2 f = fract(tu);\n  if (u_mirror) f = mix(f, 1.0 - f, mod(floor(tu), 2.0));\n  vec2 P = f * R;\n  if (u_src == 1) { o = vec4(custom(P)); return; }\n  // Animation: rotate and scale about the frame centre.\n  vec2 c = R * 0.5;\n  float a = radians(-u_rot);\n  P = c + mat2(cos(a), sin(a), -sin(a), cos(a)) * (P - c) / u_pulse;\n  o = vec4(builtin(P));\n}\n";
const BLUR_FRAG = "// Map blur (plan §7.5): one direction of a separable Gaussian (sigma = radius / 2).\nprecision highp float;\nuniform highp sampler2D u_in;\nuniform vec2 u_dir; // (1, 0) or (0, 1)\nuniform float u_radius;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  ivec2 size = textureSize(u_in, 0);\n  ivec2 p = ivec2(floor(v_uv * vec2(size)));\n  float sigma = max(u_radius * 0.5, 0.5);\n  float sum = 0.0, wsum = 0.0;\n  int r = int(ceil(u_radius));\n  for (int i = -64; i <= 64; i++) {\n    if (i < -r || i > r) continue;\n    ivec2 q = clamp(p + ivec2(u_dir) * i, ivec2(0), size - 1);\n    float w = exp(-float(i * i) / (2.0 * sigma * sigma));\n    sum += w * texelFetch(u_in, q, 0).r;\n    wsum += w;\n  }\n  o = vec4(sum / wsum);\n}\n";
const ADJUST_FRAG = "// Map adjustments (plan §7.5), in the fixed order: levels -> gamma / contrast -> curve -> posterize\n// -> invert. (The transform and the tile are in mapgen.frag; the blur is mapblur.frag.)\nprecision highp float;\nuniform highp sampler2D u_in;\nuniform highp sampler2D u_curve; // 256 x 1\nuniform bool u_useCurve;\nuniform float u_black, u_white, u_gamma, u_contrast;\nuniform int u_posterize; // 0, or 2..64 levels\nuniform bool u_invert;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  float v = texelFetch(u_in, ivec2(floor(v_uv * vec2(textureSize(u_in, 0)))), 0).r;\n  v = clamp((v - u_black) / max(u_white - u_black, 1e-4), 0.0, 1.0);\n  v = pow(v, 1.0 / max(u_gamma, 1e-3));\n  float k = tan((u_contrast + 1.0) * 0.785398); // contrast -1..1 -> slope 0..inf (0 -> 1)\n  v = clamp((v - 0.5) * k + 0.5, 0.0, 1.0);\n  if (u_useCurve) {\n    float x = v * 255.0;\n    float i = floor(min(x, 254.0));\n    v = mix(texelFetch(u_curve, ivec2(int(i), 0), 0).r, texelFetch(u_curve, ivec2(int(i) + 1, 0), 0).r, x - i);\n  }\n  if (u_posterize > 1) v = min(floor(v * float(u_posterize)), float(u_posterize - 1)) / float(u_posterize - 1);\n  if (u_invert) v = 1.0 - v;\n  o = vec4(v);\n}\n";
const FITS = { fill: 0, fit: 1, stretch: 2 };

class MapGen {
  constructor(engine) {
    this.e = engine;
    const gl = (this.gl = engine.gl);
    this.float = engine.caps.floatTargets;
    this.gen = program(gl, QUAD_VERT, `#version 300 es\nprecision highp float;\nprecision highp int;\n${STORE_GLSL}\n${GEN_FRAG}`);
    this.blur = program(gl, QUAD_VERT, `#version 300 es\n${BLUR_FRAG}`);
    this.adjust = program(gl, QUAD_VERT, `#version 300 es\n${ADJUST_FRAG}`);
    this.curveTex = gl.createTexture();
    this.curveKey = '';
    this.custom = null; // { tex, w, h, layers, count, rotation }
    this.emptyCustom = this.makeArray(1, 1, 1);
    this.targets = null;
  }

  // A map texture (R32F, or RGBA8 without float targets).
  makeTarget(w, h) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, this.float ? gl.R32F : gl.RGBA8, w, h);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    return t;
  }

  makeArray(w, h, layers) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, layers);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    return t;
  }

  // The work textures for a size: { w, h, raw, a, b }.
  work(w, h) {
    const gl = this.gl;
    if (this.targets && this.targets.w === w && this.targets.h === h) return this.targets;
    if (this.targets) for (const k of ['raw', 'a', 'b']) gl.deleteTexture(this.targets[k]);
    this.targets = { w, h, raw: this.makeTarget(w, h), a: this.makeTarget(w, h), b: this.makeTarget(w, h) };
    return this.targets;
  }

  into(tex, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.e.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.viewport(0, 0, w, h);
  }

  // Custom map: allocate for count frames of w x h (an image: count 1).
  beginCustom(w, h, count, rotation = 0) {
    this.clearCustom();
    this.custom = { tex: this.makeArray(w, h, count), w, h, layers: count, count: 0, rotation };
    return this.custom;
  }

  clearCustom() {
    if (this.custom) this.gl.deleteTexture(this.custom.tex);
    this.custom = null;
  }

  // Put a picture (ImageBitmap or VideoFrame) into layer i of the custom map, as luma.
  putCustom(i, source, rotation) {
    const c = this.custom;
    this.e.lumaInto(c.tex, i, c.w, c.h, source, rotation);
    c.count = Math.max(c.count, i + 1);
  }

  empty2D() {
    if (!this.empty) this.empty = this.makeTarget(1, 1);
    return this.empty;
  }

  curve(points) {
    const gl = this.gl;
    const key = JSON.stringify(points);
    if (key === this.curveKey) return;
    this.curveKey = key;
    const table = curveTable(points);
    gl.bindTexture(gl.TEXTURE_2D, this.curveTex);
    if (this.float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, 256, 1, 0, gl.RED, gl.FLOAT, table);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 256, 1, 0, gl.RED, gl.UNSIGNED_BYTE, Uint8Array.from(table, (v) => Math.round(v * 255)));
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
  }

  // Render the map of frame t (map: the map settings) into out (w x h).
  run(map, t, out, w, h) {
    const gl = this.gl;
    const e = this.e;
    const W = this.work(w, h);
    const A = map.adjust, an = map.anim;
    const custom = (map.source === 'image' || map.source === 'video') && this.custom && this.custom.count;

    // The subject maps: the mask and the jump flood distance (plan §7.3, §9). Made first: the
    // distance pass uses its own programs (set before the uniforms of the map program).
    const mk = e.mask;
    const subj = map.source === 'builtin' && (map.type === 'subject' || map.type === 'subjectdist') && mk.tex;
    const dist = subj && map.type === 'subjectdist' ? mk.distance() : null;
    // 1. Generate.
    const g = this.gen;
    this.into(W.raw, w, h);
    gl.useProgram(g.prog);
    e.bindStore(g);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, e.layersTex);
    gl.uniform1i(g.u.u_layers, 4);
    gl.uniform1i(g.u.u_n, e.n);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, custom ? this.custom.tex : this.emptyCustom);
    gl.uniform1i(g.u.u_custom, 5);
    gl.uniform2f(g.u.u_res, w, h);
    gl.uniform1i(g.u.u_t, t);
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, subj ? mk.tex.out : this.empty2D());
    gl.uniform1i(g.u.u_mask, 6);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, dist || this.empty2D());
    gl.uniform1i(g.u.u_dist, 7);
    gl.uniform2f(g.u.u_workRes, e.w, e.h);
    this.into(W.raw, w, h);
    gl.useProgram(g.prog);
    gl.uniform1i(g.u.u_src, custom ? 1 : 0);
    gl.uniform2f(g.u.u_offset, A.offsetX, A.offsetY);
    gl.uniform2f(g.u.u_tile, Math.max(1, A.tileX), Math.max(1, A.tileY));
    gl.uniform1i(g.u.u_mirror, A.mirrorTile ? 1 : 0);
    if (custom) {
      const c = this.custom, im = map.image;
      const layer = map.source === 'video' ? videoMapFrame(t, c.count, map.video.speed, map.video.offset, map.video.end) : 0;
      gl.uniform1f(g.u.u_layer, layer);
      gl.uniform2f(g.u.u_csize, c.w, c.h);
      gl.uniform1i(g.u.u_fit, FITS[im.fit] ?? 0);
      gl.uniform1f(g.u.u_outside, im.outside);
      gl.uniform2f(g.u.u_pos, im.x, im.y);
      gl.uniform1f(g.u.u_scale, im.scale);
      gl.uniform1f(g.u.u_crot, im.rotation);
      gl.uniform2f(g.u.u_flip, im.flipX ? -1 : 1, im.flipY ? -1 : 1);
    } else {
      const type = MAP_INDEX[map.type] ?? 0;
      const k = new Float32Array(12);
      k.set(paramArray(map.type, map.params[map.type]));
      gl.uniform1i(g.u.u_type, type);
      gl.uniform1fv(g.u['u_k[0]'], k);
      gl.uniform1f(g.u.u_phase, an.phaseSpeed * t);
      gl.uniform1f(g.u.u_rot, an.rotSpeed * t);
      gl.uniform1f(g.u.u_pulse, 1 + an.pulseAmount * Math.sin((2 * Math.PI * t) / Math.max(1, an.pulsePeriod)));
      gl.uniform1f(g.u.u_seed, an.seedEvery > 0 ? Math.floor(t / an.seedEvery) : 0);
    }
    drawQuad(gl);

    // 2. Blur (two passes).
    let src = W.raw;
    if (A.blur > 0) {
      gl.useProgram(this.blur.prog);
      gl.uniform1f(this.blur.u.u_radius, Math.min(64, A.blur));
      gl.uniform1i(this.blur.u.u_in, 0);
      gl.activeTexture(gl.TEXTURE0);
      this.into(W.a, w, h);
      gl.bindTexture(gl.TEXTURE_2D, W.raw);
      gl.uniform2f(this.blur.u.u_dir, 1, 0);
      drawQuad(gl);
      this.into(W.b, w, h);
      gl.bindTexture(gl.TEXTURE_2D, W.a);
      gl.uniform2f(this.blur.u.u_dir, 0, 1);
      drawQuad(gl);
      src = W.b;
    }

    // 3. Adjust.
    const ad = this.adjust;
    const pts = Array.isArray(A.curve) ? A.curve : CURVE_PRESETS[A.curve] || CURVE_PRESETS.linear;
    const useCurve = JSON.stringify(pts) !== JSON.stringify(CURVE_PRESETS.linear);
    if (useCurve) this.curve(pts);
    this.into(out, w, h);
    gl.useProgram(ad.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.curveTex);
    gl.uniform1i(ad.u.u_in, 0);

    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let any = false;
    for (let i = 0; i < px.length; i += 4) if (px[i] || px[i + 1]) { any = true; break; }
    return { cmd: 'matte', width: w, height: h, pixels: px, empty: !any };
  }

  // Set the matte from an image of the matte size (a preset).
  matteSet(bitmap) {
    const gl = this.gl;
    const [w, h] = this.matteSize;
    gl.bindTexture(gl.TEXTURE_2D, this.matte[0]);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
    bitmap.close();
    this.version++;
    return { cmd: 'matte', width: w, height: h };
  }

  // A brush stroke (plan §9.1 step 3). points: [[u, v], ...] in 0..1 of the picture; size: the brush
  // diameter in working pixels; mode: 'always' | 'never' | 'erase'.
  stroke(points, size, hardness, mode) {
    const gl = this.gl;
    const [mw, mh] = this.matteSize;
    const scale = mw / this.e.w;
    const p = this.brush;
    for (let i = 0; i < points.length; i += 63) {
      const part = points.slice(i, i + 64);
      const flat = new Float32Array(128);
      part.forEach(([u, v], k) => flat.set([u * mw, v * mh], k * 2));
      this.into(this.matte[1], mw, mh);
      gl.useProgram(p.prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.matte[0]);
      gl.uniform1i(p.u.u_in, 0);
      gl.uniform2fv(p.u['u_pts[0]'], flat);
      gl.uniform1i(p.u.u_np, part.length);
      gl.uniform1f(p.u.u_radius, Math.max(0.5, (size * scale) / 2));
      gl.uniform1f(p.u.u_hardness, Math.min(0.99, Math.max(0, hardness)));
      gl.uniform1i(p.u.u_mode, { always: 0, never: 1, erase: 2 }[mode] ?? 2);
      drawQuad(gl);
      this.matte.reverse();
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.version++;
  }

  // The clean plate (plan §9.2). It goes through the same YUV 4:2:0 conversion as the frames of the
  // store, so that the background difference compares like with like. upload(): put the picture
  // (already turned) into the bound TEXTURE_2D.
  setPlate(upload) {
    const gl = this.gl;
    const e = this.e;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, e.src2);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    upload();
    gl.generateMipmap(gl.TEXTURE_2D);
    texParams(gl, gl.TEXTURE_2D, gl.LINEAR, gl.LINEAR_MIPMAP_LINEAR);
    gl.useProgram(e.upload.prog);
    gl.uniform1i(e.upload.u.u_src, 0);
    gl.uniform1i(e.upload.u.u_rot, 0);
    gl.uniform1i(e.upload.u.u_mode, 0);
    e.target(this.plateY, 0, e.w, e.h);
    drawQuad(gl);
    gl.uniform1i(e.upload.u.u_mode, 1);
    e.target(this.plateC, 0, e.w / 2, e.h / 2);
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.hasPlate = true;
    this.version++;
    return true;
  }

  // A frame converted as the store does it (into a staging layer), read back: { Y, C } bytes.
  grabYuv(frame) {
    const gl = this.gl;
    const e = this.e;
    const st = e.slit;
    e.putYuv(frame, st.stY, st.stC, 0);
    const read = (tex, w, h, ch) => {
      e.target(tex, 0, w, h);
      const px = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const out = new Uint8Array(w * h * ch);
      for (let i = 0; i < w * h; i++) for (let c = 0; c < ch; c++) out[i * ch + c] = px[i * 4 + c];
      return out;
    };
    const Y = read(st.stY, e.w, e.h, 1), C = read(st.stC, e.w / 2, e.h / 2, 2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { cmd: 'yuv', Y, C };
  }

  // The clean plate from Y and CbCr bytes (the median of grabYuv frames).
  setPlateYuv(Y, C) {
    const gl = this.gl;
    const e = this.e;
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateY);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, 0, e.w, e.h, 1, gl.RED, gl.UNSIGNED_BYTE, Y);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateC);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, 0, e.w / 2, e.h / 2, 1, gl.RG, gl.UNSIGNED_BYTE, C);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
    this.hasPlate = true;
    this.version++;
    return true;
  }

  setPlateImage(bitmap) {
    const gl = this.gl;
    try {
      return this.setPlate(() => gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, bitmap));
    } finally {
      bitmap.close();
    }
  }

  // The stored frame t: render it (RGB) into a texture, copy that into the source texture.
  setPlateFrame(t) {
    const gl = this.gl;
    const e = this.e;
    if (e.layerOf(t) < 0) return false;
    const tmp = this.tex2(e.w, e.h, gl.RGBA8);
    this.into(tmp, e.w, e.h);
    gl.useProgram(e.show.prog);
    e.bindStore(e.show);
    gl.uniform1f(e.show.u.u_layer, e.layerOf(t));
    gl.uniform1i(e.show.u.u_noFlip, 1);
    drawQuad(gl);
    gl.uniform1i(e.show.u.u_noFlip, 0); // the uniform stays with the program
    const ok = this.setPlate(() => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, e.fb);
      gl.copyTexImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 0, 0, e.w, e.h, 0);
    });
    gl.deleteTexture(tmp);
    return ok;
  }

  // The imported mask (plan §9.3): an R8 array, one layer for each frame of the mask video.
  beginImport(w, h, count) {
    const gl = this.gl;
    this.clearImport();
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, count);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.imp = { tex: t, w, h, layers: count, count: 0 };
    this.version++;
  }

  importFrame(i, frame, rotation) {
    this.e.lumaInto(this.imp.tex, i, this.imp.w, this.imp.h, frame, rotation);
    this.imp.count = Math.max(this.imp.count, i + 1);
    this.version++;
  }

  clearImport() {
    if (this.imp) this.gl.deleteTexture(this.imp.tex);
    this.imp = null;
    this.version++;
  }

  // One pass: prog with the input texture on unit 0, into out.
  pass(prog, input, out, set) {
    const gl = this.gl;
    const e = this.e;
    this.into(out, e.w, e.h);
    gl.useProgram(prog.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, input);
    gl.uniform1i(prog.u.u_in, 0);
    if (set) set(prog.u);
    drawQuad(gl);
  }

  // Erode (r < 0) or dilate (r > 0) src by |r| px (two passes); the result is in dst.
  morphOp(src, tmp, dst, r) {
    const gl = this.gl;
    if (!r) return src;
    const set = (dir) => (u) => {
      gl.uniform2f(u.u_dir, ...dir);
      gl.uniform1i(u.u_r, Math.min(64, Math.abs(Math.round(r))));
      gl.uniform1i(u.u_max, r > 0 ? 1 : 0);
    };
    this.pass(this.morph, src, tmp, set([1, 0]));
    this.pass(this.morph, tmp, dst, set([0, 1]));
    return dst;
  }

  blurOp(src, tmp, dst, radius) {
    const gl = this.gl;
    if (!(radius > 0)) return src;
    const set = (dir) => (u) => {
      gl.uniform2f(u.u_dir, ...dir);
      gl.uniform1f(u.u_radius, Math.min(64, radius));
    };
    this.pass(this.blur, src, tmp, set([1, 0]));
    this.pass(this.blur, tmp, dst, set([0, 1]));
    return dst;
  }

  // Copy src into dst (a pass of the post shader without work).
  copy(src, dst) {
    const gl = this.gl;
    this.pass(this.post, src, dst, (u) => {
      gl.uniform1i(u.u_doFix, 0);
      gl.uniform1i(u.u_doTemporal, 0);
    });
  }

  // The mask of frame t (plan §9.1). Returns false when it is the same as before. src (optional):
  // { Y, C, layer } arrays to read the frame from (the analysis staging), in place of the store.
  update(t, src) {
    const s = this.e.settings;
    const C = s.cutout, Sb = s.subject;
    const base = JSON.stringify([C, Sb, this.version, this.e.w, this.e.h]);
    const key = `${base}@${t}${src ? 'A' : ''}`;
    if (key === this.key) return false;
    const gl = this.gl;
    const e = this.e;
    const T = this.tex;
    // 1–3. Methods, or the imported mask; the garbage matte.
    const m = this.methods;
    this.into(T.a, e.w, e.h);
    gl.useProgram(m.prog);
    e.bindStore(m);
    if (src) {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, src.Y);
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, src.C);
    }
    gl.uniform1i(m.u.u_override, src ? src.layer : -1);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, e.layersTex);
    gl.uniform1i(m.u.u_layers, 4);
    gl.uniform1i(m.u.u_n, e.n);
    gl.uniform1i(m.u.u_t, t);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateY);
    gl.uniform1i(m.u.u_plateY, 3);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateC);
    gl.uniform1i(m.u.u_plateC, 7);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, this.matte[0]);
    gl.uniform1i(m.u.u_matte, 5);
    gl.activeTexture(gl.TEXTURE6);
    const imp = C.import.on && this.imp && this.imp.count;
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, imp ? this.imp.tex : this.emptyArray);
    gl.uniform1i(m.u.u_impTex, 6);
    gl.uniform1i(m.u.u_imp, imp ? 1 : 0);
    gl.uniform1f(m.u.u_impLayer, imp ? Math.min(t, this.imp.count - 1) : 0);
    gl.uniform1i(m.u.u_bgOn, C.bgdiff.on && this.hasPlate ? 1 : 0);
    gl.uniform1f(m.u.u_lightTol, C.bgdiff.lightTol);
    gl.uniform1f(m.u.u_thr, C.bgdiff.threshold);
    gl.uniform1f(m.u.u_soft, C.bgdiff.softness);
    gl.uniform1f(m.u.u_shadow, C.bgdiff.shadow);
    gl.uniform1i(m.u.u_ckOn, C.chroma.on ? 1 : 0);
    const k = ycc(hexRgb(C.chroma.key));
    gl.uniform2f(m.u.u_keyC, k[1], k[2]);
    gl.uniform1f(m.u.u_ckTol, C.chroma.tolerance);
    gl.uniform1f(m.u.u_ckSoft, C.chroma.softness);
    gl.uniform1i(m.u.u_lkOn, C.luma.on ? 1 : 0);
    gl.uniform1f(m.u.u_low, C.luma.low);
    gl.uniform1f(m.u.u_high, C.luma.high);
    gl.uniform1f(m.u.u_lkSoft, C.luma.softness);
    gl.uniform1i(m.u.u_lkInvert, C.luma.invert ? 1 : 0);
    gl.uniform1i(m.u.u_union, C.combine === 'intersect' ? 0 : 1);
    drawQuad(gl);
    // 4. Open (erode, dilate), Close (dilate, erode).
    let cur = T.a;
    const other = (x) => (x === T.a ? T.b : T.a);
    if (C.open > 0) {
      cur = this.morphOp(cur, T.c, other(cur), -C.open);
      cur = this.morphOp(cur, T.c, other(cur), C.open);
    }
    if (C.close > 0) {
      cur = this.morphOp(cur, T.c, other(cur), C.close);
      cur = this.morphOp(cur, T.c, other(cur), -C.close);
    }
    // 4. Fill holes, Keep largest region: on a small copy (CPU).
    if (C.fillHoles > 0 || C.keepLargest) {
      this.fix(cur, C.fillHoles, C.keepLargest);
      const dst = other(cur);
      this.pass(this.post, cur, dst, (u) => {
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, this.fixTex);
        gl.uniform1i(u.u_fix, 1);
        gl.uniform1i(u.u_doFix, 1);
        gl.uniform1i(u.u_doTemporal, 0);
      });
      cur = dst;
    }
    // 5. Grow / shrink.
    if (C.grow) cur = this.morphOp(cur, T.c, other(cur), C.grow);
    // 6. Temporal smooth and hysteresis (with the mask of frame t − 1, when it was the last one).
    if (C.smooth > 0 || C.hysteresis) {
      const usePrev = this.prev.t === t - 1 && this.prev.key === base;
      const dst = other(cur);
      this.pass(this.post, cur, dst, (u) => {
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, T.prev);
        gl.uniform1i(u.u_prev, 1);
        gl.uniform1i(u.u_doFix, 0);
        gl.uniform1i(u.u_doTemporal, 1);
        gl.uniform1i(u.u_usePrev, usePrev ? 1 : 0);
        gl.uniform1f(u.u_smooth, Math.min(0.95, C.smooth));
        gl.uniform1i(u.u_hyst, C.hysteresis ? 1 : 0);
        gl.uniform1f(u.u_tLow, C.tLow);
        gl.uniform1f(u.u_tHigh, C.tHigh);
      });
      cur = dst;
      this.copy(cur, T.prev);
      this.prev = { t, key: base };
    }
    // 7. Feather.
    cur = this.blurOp(cur, T.c, other(cur), C.feather);
    this.copy(cur, T.out);
    // The subject layer: its own grow and feather (§10.4), and the outline.
    let sub = T.out;
    if (Sb.grow || Sb.feather > 0) {
      sub = this.morphOp(T.out, T.c, T.a, Sb.grow);
      sub = this.blurOp(sub, T.c, sub === T.a ? T.b : T.a, Sb.feather);
    }
    this.copy(sub, T.sub);
    if (Sb.outline > 0) this.morphOp(T.sub, T.c, T.outline, Sb.outline);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.key = key;
    this.distT = -1;
    return true;
  }

  // Fill holes / Keep largest region on a copy of at most FIX_SIZE px (the long side).
  fix(src, fillPercent, keepLargest) {
    const gl = this.gl;
    const e = this.e;
    const s = Math.min(1, FIX_SIZE / Math.max(e.w, e.h));
    const w = Math.max(1, Math.round(e.w * s)), h = Math.max(1, Math.round(e.h * s));
    // The two textures of this size are made once (not for each frame: WebKit frees deleted
    // textures late).
    if (this.fixKey !== `${w}x${h}`) {
      if (this.fixSmall) gl.deleteTexture(this.fixSmall);
      gl.deleteTexture(this.fixTex);
      this.fixSmall = this.tex2(w, h, gl.RGBA8);
      this.fixTex = this.tex2(w, h, gl.RG8);
      this.fixKey = `${w}x${h}`;
    }
    const small = this.fixSmall;
    this.into(small, w, h);
    gl.useProgram(this.post.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.uniform1i(this.post.u.u_in, 0);
    gl.uniform1i(this.post.u.u_doFix, 0);
    gl.uniform1i(this.post.u.u_doTemporal, 0);
    drawQuad(gl);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const b = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) b[i] = px[i * 4] > 127 ? 1 : 0;
    const r = cleanRegions(b, w, h, fillPercent, keepLargest);
    const rg = new Uint8Array(w * h * 2);
    for (let i = 0; i < w * h; i++) {
      rg[i * 2] = r.fill[i] * 255;
      rg[i * 2 + 1] = r.remove[i] * 255;
    }
    gl.bindTexture(gl.TEXTURE_2D, this.fixTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RG, gl.UNSIGNED_BYTE, rg);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  }

  // Jump flooding: the nearest subject pixel of each pixel (for the Subject distance map).
  distance() {
    const gl = this.gl;
    const T = this.tex;
    if (!T.j1 || this.distT === this.key) return T.j1 ? this.distTex : null;
    let a = T.j1, b = T.j2;
    this.pass(this.jfa, T.out, a, (u) => gl.uniform1i(u.u_init, 1));
    for (let k = 2 ** Math.ceil(Math.log2(Math.max(this.e.w, this.e.h))); k >= 1; k >>= 1) {
      this.pass(this.jfa, a, b, (u) => {
        gl.uniform1i(u.u_init, 0);
        gl.uniform1i(u.u_k, k);
      });
      [a, b] = [b, a];
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.distTex = a;
    this.distT = this.key;
    return a;
  }

  // The uniforms of subject.glsl for an effect program.
  subjectUniforms(p, on) {
    const gl = this.gl;
    const s = this.e.settings;
    const Sb = s.subject;
    gl.uniform1i(p.u.u_subOn, on ? 1 : 0);
    gl.activeTexture(gl.TEXTURE8);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.sub);
    gl.uniform1i(p.u.u_subMask, 8);
    gl.activeTexture(gl.TEXTURE9);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.outline);
    gl.uniform1i(p.u.u_outline, 9);
    gl.uniform1i(p.u.u_outlineOn, Sb.outline > 0 ? 1 : 0);
    gl.uniform3fv(p.u.u_outlineColor, hexRgb(Sb.outlineColor));
    gl.uniform1f(p.u.u_subOpacity, Sb.opacity);
    gl.uniform1i(p.u.u_subBlend, BLEND_INDEX[Sb.blend] ?? 0);
    gl.uniform1f(p.u.u_spill, s.cutout.chroma.on ? s.cutout.chroma.spill : 0);
    gl.uniform3fv(p.u.u_keyRgb, hexRgb(s.cutout.chroma.key));
  }

  // The Mask view.
  render() {
    const gl = this.gl;
    gl.useProgram(this.show.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.out);
    gl.uniform1i(this.show.u.u_in, 0);
    drawQuad(gl);
  }
}

return { Mask };
})();

// ---- gpu/edge.js
const { EDGE_K, EDGE_HISTORY, EDGE_TARGET_MS, Edge } = (() => {
// Mode 2, Subject edge source (plan §8.4): the emitter history and the trail render.
// The rotated space is a square of D x D px about the frame centre; rows go along the scan direction.
// Emitter history: R32F positions and RGBA8 colours, D x (H K) (slot = frame mod H, K = 4 emitters
// for each row), and the frame of each slot. The trail: instanced quads into a D x D texture with a
// depth buffer (depth = age: the youngest pixel wins). The draw time is measured (gl.finish) and

const EMIT_FRAG = "// Edge source emitters (plan §8.4). The rotated space: a square of u_D x u_D px about the frame\n// centre; x' along the scan direction u_d, y' along u_e. Each fragment is (row r, emitter k) of one\n// frame: march the row, find the k-th place where the mask goes from inside (>= 0.5) to outside\n// along +x'. Out 0: x' of the edge (sub-pixel; −1e6 = no emitter). Out 1: the colour of the last\n// subject pixel.\nprecision highp float;\nprecision highp int;\nuniform highp sampler2D u_mask;\nuniform highp sampler2DArray u_Y;\nuniform highp sampler2DArray u_C;\nuniform float u_layer;\nuniform vec2 u_res;\nuniform vec2 u_d, u_e;\nuniform float u_D;\nuniform int u_K;\nuniform int u_slot;\nlayout(location = 0) out vec4 oPos;\nlayout(location = 1) out vec4 oCol;\n\nfloat maskAt(vec2 p) {\n  if (p.x < 0.0 || p.y < 0.0 || p.x >= u_res.x || p.y >= u_res.y) return 0.0;\n  return texture(u_mask, p / u_res).r;\n}\n\nvec3 rgbAt(vec2 p) {\n  vec2 uv = p / u_res;\n  float y = texture(u_Y, vec3(uv, u_layer)).r;\n  vec2 c = texture(u_C, vec3(uv, u_layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n\nvoid main() {\n  int r = int(gl_FragCoord.x);\n  int k = int(gl_FragCoord.y) - u_slot * u_K;\n  vec2 c = u_res * 0.5;\n  float yp = float(r) + 0.5 - 0.5 * u_D;\n  vec2 base = c + yp * u_e;\n  int n = int(u_D);\n  int found = 0;\n  float prev = maskAt(base + (0.5 - 0.5 * u_D) * u_d);\n  for (int i = 0; i < 8192; i++) {\n    if (i + 1 >= n) break;\n    float x0 = float(i) + 0.5 - 0.5 * u_D;\n    float m1 = maskAt(base + (x0 + 1.0) * u_d);\n    if (prev >= 0.5 && m1 < 0.5) {\n      if (found == k) {\n        oPos = vec4(x0 + (prev - 0.5) / max(prev - m1, 1e-4), 0.0, 0.0, 1.0);\n        oCol = vec4(rgbAt(base + x0 * u_d), 1.0);\n        return;\n      }\n      found++;\n    }\n    prev = m1;\n  }\n  oPos = vec4(-1e6, 0.0, 0.0, 1.0);\n  oCol = vec4(0.0);\n}\n";

    gl.uniform2f(p.u.u_ed, ...d);
