<!-- neofx v0.1.0 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<title>neofx</title>
<style>
:root{
  --bg:#111214;
  --panel:#1a1b1e;
  --line:#2a2c30;
  --text:#e6e6e6;
  --dim:#8b8d92;
  --accent:#4fd1c5;
  --warn:#f5a524;
  --top:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:6px;
  min-height:32px;padding:0 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#app{display:grid;grid-template-rows:var(--top) 1fr auto;grid-template-columns:minmax(0,1fr);height:100%}
#topBar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#logo{font-weight:700;letter-spacing:.02em;margin-right:8px}
.spacer{flex:1}
#status{min-width:0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#exportBtn{background:var(--accent);color:#000}
#stage{display:grid;grid-template-columns:1fr 340px;min-height:0}
#preview{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:#000}
#inspector{border-left:1px solid var(--line);background:var(--panel);overflow:auto}
#transport{min-height:48px;border-top:1px solid var(--line);background:var(--panel)}
#startScreen{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;max-width:520px;width:100%}
#dropArea{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:40px 16px;
  border:2px dashed var(--line);border-radius:12px;cursor:pointer;text-align:center}
#dropArea span{color:var(--dim)}
body.drag #dropArea{border-color:var(--accent)}
#modeInfo{display:grid;gap:8px;color:var(--dim)}
#modeInfo b{color:var(--text)}
#message{position:absolute;inset:auto 16px 16px;padding:12px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--warn)}
body:not([data-state="start"]) #startScreen{display:none}
@media (max-width:999px){
  #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(200px,1fr) auto}
  #inspector{border-left:0;border-top:1px solid var(--line);max-height:45vh}
  button{min-height:44px}
}
</style>
</head>
<body data-state="start">
<div id="app">
  <header id="topBar">
    <span id="logo">neofx</span>
    <button id="openBtn" type="button">Open</button>
    <span class="spacer"></span>
    <span id="status" aria-live="polite"></span>
    <button id="exportBtn" type="button" disabled>Export</button>
  </header>

  <main id="stage">
    <section id="preview" aria-label="Preview">
      <div id="startScreen">
        <label id="dropArea" for="fileInput">
          <strong>Open a video (MP4 or MOV)</strong>
          <span>Drop a file here, or touch to select one.</span>
        </label>
        <div id="modeInfo">
          <div><b>Time Map</b> — a greyscale map gives each pixel a delay in frames.</div>
          <div><b>Slit Scan</b> — a 1 px line repeats in one direction, and gets older with distance.</div>
        </div>
      </div>
      <div id="message" hidden></div>
    </section>
    <aside id="inspector" aria-label="Inspector"></aside>
  </main>

  <footer id="transport"></footer>
  <input id="fileInput" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" hidden>
</div>
<script>
'use strict';
// ---- app/platform.js
const { checkPlatform } = (() => {
// Platform checks at startup (plan §4). Each check gives { ok, fatal, message }.

async function checkPlatform() {
  const out = { ok: true, fatal: null, notes: [], gl: null };
  let gl = null;
  try {
    gl = document.createElement('canvas').getContext('webgl2');
  } catch {
    gl = null;
  }
  if (!gl) {
    out.ok = false;
    out.fatal = 'This browser has no WebGL2.';
    return out;
  }
  const floatTargets = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
  if (!floatTargets) out.notes.push('No float render targets: some modes lose precision.');
  out.gl = {
    floatTargets,
    maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
    maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  };
  const lose = gl.getExtension('WEBGL_lose_context');
  if (lose) lose.loseContext();
  if (typeof VideoDecoder === 'undefined') {
    out.ok = false;
    out.fatal = 'This browser cannot decode video (no WebCodecs VideoDecoder).';
    return out;
  }
  out.encoder = typeof VideoEncoder !== 'undefined';
  if (!out.encoder) out.notes.push('No H.264 encoder: export is disabled.');
  out.offscreen = typeof OffscreenCanvas !== 'undefined' && (() => {
    try {
      return !!new OffscreenCanvas(1, 1).getContext('webgl2');
    } catch {
      return false;
    }
  })();
  return out;
}

return { checkPlatform };
})();

// ---- app/main.js
const {  } = (() => {
// neofx app shell (plan Phase 1). The later phases add the decode, GPU, and UI parts.



const $ = (id) => document.getElementById(id);
const VERSION = '0.1.0';

function showMessage(text) {
  const m = $('message');
  m.textContent = text;
  m.hidden = !text;
}

function openFile(file) {
  if (!file) return;
  if (!/\.(mp4|mov|m4v)$/i.test(file.name) && !/^video\/(mp4|quicktime)$/.test(file.type)) {
    showMessage('Only MP4 and MOV files are supported.');
    return;
  }
  showMessage(`${file.name}: video loading comes in a later version.`);
}

async function start() {
  document.title = `neofx ${VERSION}`;
  const p = await checkPlatform();
  window.neofx = { version: VERSION, platform: p };
  if (!p.ok) {
    document.body.dataset.state = 'unsupported';
    showMessage(p.fatal);
    return;
  }
  if (p.gl) $('status').textContent = `WebGL2 · max layers ${p.gl.maxLayers} · v${VERSION}`;
  if (p.notes.length) showMessage(p.notes.join(' '));
  $('openBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', (e) => openFile(e.target.files[0]));
  document.addEventListener('dragover', (e) => {
    e.preventDefault();
    document.body.classList.add('drag');
  });
  document.addEventListener('dragleave', () => document.body.classList.remove('drag'));
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('drag');
    openFile(e.dataTransfer.files[0]);
  });
}

start();

return {  };
})();
</script>
</body>
</html>
