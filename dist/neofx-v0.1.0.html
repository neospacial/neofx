  if (opts.def !== undefined && opts.max > opts.min) row.style.setProperty('--def', `${((opts.def - opts.min) / (opts.max - opts.min)) * 100}%`);
  row.append(label, range, num, unit);
  set(opts.value, false);
  row.setValue = (v) => set(v, false);
  return row;
}

// opts: { label, options: [[value, text, disabled?, why?]], value, onChange(v), key }
function segmented(opts) {
  const row = el('div', 'setting seg');
  row.dataset.key = opts.key || '';
  if (opts.label) row.append(el('label', null, opts.label));
  const box = el('div', 'segs');
  box.setAttribute('role', 'radiogroup');
  const buttons = opts.options.map(([v, text, disabled, why]) => {
    const b = el('button', null, text);
    b.type = 'button';
    b.dataset.value = v;
    b.disabled = !!disabled;
    if (disabled) b.title = why || 'Not available here';
    b.addEventListener('click', () => {
      row.setValue(v);
      opts.onChange(v);
    });
    box.append(b);
    return b;
  });
  row.setValue = (v) => buttons.forEach((b) => b.classList.toggle('on', b.dataset.value === String(v)));
  row.setValue(opts.value);
  row.append(box);
  return row;
}

// opts: { label, value, onChange(v), key }
function toggle(opts) {
  return segmented({ ...opts, options: [['true', 'On'], ['false', 'Off']], value: String(opts.value), onChange: (v) => opts.onChange(v === 'true') });
}

// A collapsible section.
function section(title, open = true) {
  const d = el('details', 'section');
  d.open = open;
  d.append(el('summary', null, title));
  return d;
}

// opts: { label, options: [[value, text]], value, onChange(v), key }
function select(opts) {
  const row = el('div', 'setting select');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  const s = el('select');
  s.setAttribute('aria-label', opts.label);
  for (const [v, text] of opts.options) {
    const o = el('option', null, text);
    o.value = v;
    s.append(o);
  }
  s.value = opts.value;
  s.addEventListener('change', () => opts.onChange(s.value));
  row.setValue = (v) => (s.value = v);
  row.append(label, s);
  return row;
}

// A ramp of 2 to 4 colours. opts: { label, value: ['#rrggbb', ...], onChange(list), key }
function colors(opts) {
  const row = el('div', 'setting colors');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  const box = el('div', 'colorList');
  let list = opts.value.slice();
  const draw = () => {
    box.textContent = '';
    list.forEach((c, i) => {
      const inp = el('input');
      inp.type = 'color';
      inp.value = c;
      inp.setAttribute('aria-label', `${opts.label} ${i + 1}`);
      inp.addEventListener('input', () => {
        list[i] = inp.value;
        opts.onChange(list.slice());
      });
      box.append(inp);
    });
    const more = el('button', null, '+');
    more.type = 'button';
    more.disabled = list.length >= 4;
    more.setAttribute('aria-label', 'Add a colour');
    more.addEventListener('click', () => {
      list.push(list[list.length - 1]);
      draw();
      opts.onChange(list.slice());
    });
    const less = el('button', null, '−');
    less.type = 'button';
    less.disabled = list.length <= 2;
    less.setAttribute('aria-label', 'Remove a colour');
    less.addEventListener('click', () => {
      list.pop();
      draw();
      opts.onChange(list.slice());
    });
    box.append(less, more);
  };
  row.setValue = (v) => {
    list = v.slice();
    draw();
  };
  draw();
  row.append(label, box);
  return row;
}

return { slider, segmented, toggle, section, select, colors };
})();

// ---- app/ui/curve.js
const { curveEditor } = (() => {
// Curve editor (plan §12.6): one widget for the map curve, the rate curve, and the decay curve.
// Points with drag; add a point with a click / tap on the line; remove a point with a double-click
// or a long press. Presets: Linear, Ease in, Ease out, S-curve, Step. Monotone cubic interpolation.



const NAMES = { linear: 'Linear', easeIn: 'Ease in', easeOut: 'Ease out', sCurve: 'S-curve', step: 'Step' };
const HIT = 12; // px

const points = (v) => (Array.isArray(v) ? v.map((p) => [p[0], p[1]]) : (CURVE_PRESETS[v] || CURVE_PRESETS.linear).map((p) => [p[0], p[1]]));

// opts: { label, value (preset name or points), onChange(value, final), key }
function curveEditor(opts) {
  const row = document.createElement('div');
  row.className = 'setting curve';
  row.dataset.key = opts.key || '';
  const label = document.createElement('label');
  label.textContent = opts.label;
  const canvas = document.createElement('canvas');
  canvas.className = 'curveCanvas';
  canvas.setAttribute('aria-label', `${opts.label} curve`);
  const presets = document.createElement('div');
  presets.className = 'segs curvePresets';
  let pts = points(opts.value);
  let name = Array.isArray(opts.value) ? null : opts.value;
  const W = 220, H = 120, PAD = 8;
  const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  const toPx = ([x, y]) => [PAD + x * (W - 2 * PAD), H - PAD - y * (H - 2 * PAD)];
  const toVal = (px, py) => [Math.min(1, Math.max(0, (px - PAD) / (W - 2 * PAD))), Math.min(1, Math.max(0, (H - PAD - py) / (H - 2 * PAD)))];
  const draw = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const a = PAD + (i * (W - 2 * PAD)) / 4, b = PAD + (i * (H - 2 * PAD)) / 4;
      ctx.beginPath(); ctx.moveTo(a, PAD); ctx.lineTo(a, H - PAD); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(PAD, b); ctx.lineTo(W - PAD, b); ctx.stroke();
    }
    const f = monotoneCurve(pts);
    ctx.strokeStyle = getComputedStyle(row).getPropertyValue('--accent').trim() || '#eee100';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const [x, y] = toPx([i / 100, Math.min(1, Math.max(0, f(i / 100)))]);
      if (i) ctx.lineTo(x, y);
      else ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = '#fff';
    for (const p of pts) {
      const [x, y] = toPx(p);
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, 2 * Math.PI);
      ctx.fill();
    }
    for (const b of presets.children) b.classList.toggle('on', b.dataset.value === name);
  };
  const emit = (final) => opts.onChange(name || pts.map((p) => [+p[0].toFixed(4), +p[1].toFixed(4)]), final);
  const local = (e) => {
    const r = canvas.getBoundingClientRect();
    return [((e.clientX - r.left) * W) / r.width, ((e.clientY - r.top) * H) / r.height];
  };
  const nearest = (px, py) => {
    let best = -1, bd = HIT;
    pts.forEach((p, i) => {
      const [x, y] = toPx(p);
      const d = Math.hypot(x - px, y - py);
      if (d < bd) [best, bd] = [i, d];
    });
    return best;
  };
  const remove = (i) => {
    if (i <= 0 || i >= pts.length - 1) return; // the ends stay
    pts.splice(i, 1);
    name = null;
    draw();
    emit(true);
  };
  let drag = -1, press = 0, moved = false;
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const [px, py] = local(e);
    let i = nearest(px, py);
    if (i < 0) {
      // A click on the line adds a point there.
      const [x] = toVal(px, py);
      const [, cy] = toPx([x, monotoneCurve(pts)(x)]);
      if (Math.abs(cy - py) > HIT * 1.5) return;
      pts.push([x, toVal(px, py)[1]]);
      pts.sort((a, b) => a[0] - b[0]);
      i = pts.findIndex((p) => p[0] === x);
      name = null;
      draw();
      emit(false);
    }
    drag = i;
    moved = false;
    canvas.setPointerCapture(e.pointerId);
    clearTimeout(press);
    press = setTimeout(() => {
      if (!moved && drag >= 0) {
        const k = drag;
        drag = -1;
        remove(k); // a long press removes the point
      }
    }, 600);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (drag < 0) return;
    const [px, py] = local(e);
    let [x, y] = toVal(px, py);
    moved = true;
    clearTimeout(press);
    // The ends keep their x; the other points stay between their neighbours.
    if (drag === 0) x = 0;
    else if (drag === pts.length - 1) x = 1;
    else x = Math.min(pts[drag + 1][0] - 0.01, Math.max(pts[drag - 1][0] + 0.01, x));
    pts[drag] = [x, y];
    name = null;
    draw();
    emit(false);
  });
  const end = () => {
    clearTimeout(press);
    if (drag >= 0 && moved) emit(true);
    drag = -1;
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('dblclick', (e) => remove(nearest(...local(e))));
  for (const [k, text] of Object.entries(NAMES)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.dataset.value = k;
    b.addEventListener('click', () => {
      name = k;
      pts = points(k);
      draw();
      emit(true);
    });
    presets.append(b);
  }
  row.setValue = (v) => {
    pts = points(v);
    name = Array.isArray(v) ? null : v;
    draw();
  };
  row.points = () => pts.map((p) => p.slice());
  row.append(label, canvas, presets);
  requestAnimationFrame(draw);
  draw();
  return row;
}

return { curveEditor };
})();

// ---- app/random.js
const { rng, RANDOM_SECTIONS, randomizeSection } = (() => {
// Randomize (plan §12.5): safe random values for one section of the settings. A seed makes it
// repeatable (the same seed gives the same look).





// mulberry32: a small seeded random generator, 0 <= r() < 1.
function rng(seed) {

// Change the settings S of one section with r. limits: { maxDelay, maxAge, maxAgeEdge }.

  const M = S.map;

    const list = MAPS.filter((m) => !m.usesMask && m.id !== 'motion').map((m) => m.id);
    M.source = 'builtin';
    M.type = pick(r, list);
    const spec = MAPS.find((m) => m.id === M.type);
    for (const [k, , min, max, step, def] of spec.params) {
      // Near the default: half of the range around it (safe looks).
      const lo = Math.max(min, def - (max - min) / 4), hi = Math.min(max, def + (max - min) / 4);
      M.params[M.type][k] = Math.min(max, Math.max(min, range(r, lo, hi, step)));
    }
  } else if (section === 'adjust') {
    Object.assign(M.adjust, {
      invert: r() < 0.3, gamma: range(r, 0.6, 1.8, 0.01), contrast: range(r, -0.3, 0.5, 0.01),
      posterize: r() < 0.25 ? Math.floor(range(r, 3, 12)) : 0, curve: pick(r, ['linear', 'linear', 'easeIn', 'easeOut', 'sCurve']),
      blur: r() < 0.3 ? range(r, 1, 8, 0.5) : 0,
    });
  } else if (section === 'anim') {
    const on = r() < 0.5;
    Object.assign(M.anim, { phaseSpeed: on ? range(r, -0.02, 0.02, 0.001) : 0, rotSpeed: on && r() < 0.5 ? range(r, -1, 1, 0.1) : 0, pulseAmount: 0, seedEvery: 0 });
  } else if (section === 'time') {
    Object.assign(S.timemap, {
      maxDelay: Math.max(1, Math.round(range(r, 8, Math.max(9, Math.min(120, limits.maxDelay))))),
      steps: r() < 0.3 ? Math.floor(range(r, 2, 16)) : 0, blend: r() < 0.7,
    });
  } else if (section === 'source') {
    const sl = S.slitscan;
    if (sl.source === 'edge' || S.cutout.mode === 'scan') sl.edgeAngle = Math.round(range(r, 0, 360));
    else Object.assign(sl, { x: range(r, 0.25, 0.75, 0.001), y: range(r, 0.25, 0.75, 0.001), angle: Math.round(range(r, 0, 360)) });
    sl.flip = r() < 0.5;
  } else if (section === 'time2') {
    const sl = S.slitscan;
    Object.assign(sl, {
      time: r() < 0.85, rateType: pick(r, RATE_TYPES.map(([id]) => id).filter((id) => id !== 'curve')),
      rate: range(r, 0.25, 4, 0.05), rateEnd: range(r, 0.25, 6, 0.05),
      maxAge: Math.max(1, Math.round(range(r, 30, Math.max(31, Math.min(600, limits.maxAge))))),
      maxAgeEdge: Math.max(1, Math.round(range(r, 20, Math.max(21, Math.min(240, limits.maxAgeEdge))))),
      sampling: r() < 0.5 ? 'sharp' : 'blend',
    });
  } else if (section === 'composite') {
    const blend = r() < 0.5;
    Object.assign(S.composite, {
      mode: blend ? 'blend' : 'replace', blend: pick(r, BLEND_MODES.map(([id]) => id)), opacity: range(r, 0.6, 1, 0.01),
      decay: pick(r, ['full', 'full', 'linear', 'exp']), decayLength: 0, linear: false,
    });
  } else if (section === 'look') {
    const tint = r() < 0.5;
    Object.assign(S.look, { tint, tintColors: [hex(r), hex(r)], tintAmount: range(r, 0.4, 1, 0.01), ageBrightness: range(r, 0.6, 1.4, 0.01) });
  }
  return S;
}

return { rng, RANDOM_SECTIONS, randomizeSection };
})();

// ---- app/ui/inspector.js
const { THUMB_W, THUMB_H, Inspector } = (() => {
// The inspector (plan §12.4): Mode, Map (source, map grid with thumbnails, params, fit and transform,
// adjustments, animation), Time. Settings that do not apply are hidden (§12.1).









const THUMB_W = 72;
const THUMB_H = 40;

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

class Inspector {
  // app: { change(path, value), openMap(kind), info() -> { mapName, mapFrames } }
  constructor(root, app) {
    this.root = root;
    this.app = app;
    this.rows = {};

  // limits: { maxDelay (the store limit, N - 1), maxAge (the slit history rows), maxAgeEdge }.
  build(settings, limits) {
    const S = settings;
    const r = this.root;
    const open = {};
    for (const d of r.querySelectorAll('details[data-name]')) open[d.dataset.name] = d.open;
    r.textContent = '';
    this.rows = {};
    this.tiles = {};
    const add = (parent, row) => {
      this.rows[row.dataset.key] = row;
      parent.append(row);
      return row;
    };
    const on = (key) => (v) => this.app.change(key, v);
    // The tab of each section in the narrow layout (plan §12.3).
    const TABS = { presets: 'presets', mode: 'mode', map: 'map', adjust: 'map', anim: 'map', source: 'map', time: 'time', time2: 'time', cutout: 'cutout', subject: 'cutout', composite: 'mix', look: 'look' };
    const sec = (name, title, def = true) => {
      const d = section(title, open[name] ?? def);
      d.dataset.name = name;
      d.dataset.tab = TABS[name] || 'mode';
      // Randomize (plan §12.5): a lock keeps the section; the dice changes only it.
      if (RANDOM_SECTIONS.includes(name)) {
        const tools = document.createElement('span');
        tools.className = 'secTools';
        const locked = this.app.locks && this.app.locks.has(name);
        const lock = Object.assign(document.createElement('button'), { type: 'button', className: `lock${locked ? ' on' : ''}`, textContent: locked ? '🔒' : '🔓' });
        lock.title = 'Lock: Randomize keeps this section';
        lock.dataset.lock = name;
        lock.setAttribute('aria-pressed', String(!!locked));
        lock.addEventListener('click', (e) => {
          e.preventDefault();
          this.app.toggleLock(name);
        });
        const dice = Object.assign(document.createElement('button'), { type: 'button', className: 'dice', textContent: '🎲' });
        dice.title = 'Randomize this section';
        dice.dataset.dice = name;
        dice.addEventListener('click', (e) => {
          e.preventDefault();
          this.app.randomize([name]);
        });
        tools.append(dice, lock);
        d.querySelector('summary').append(tools);
      }
      r.append(d);
      return d;
    };
    const num = (parent, key, label, min, max, step, def, unit) => add(parent, slider({ key, label, min, max, step, value: getPath(S, key), def, unit, onChange: on(key) }));
    const bool = (parent, key, label) => add(parent, toggle({ key, label, value: getPath(S, key), onChange: on(key) }));

    // Presets (plan §12.5): Randomize all, Reset to defaults, the looks, Save and Load.
    if (this.app.presetPanel) this.app.presetPanel(sec('presets', 'Presets', false));

    const mode = sec('mode', 'Mode');
    add(mode, segmented({ key: 'mode', options: [['timemap', 'Time Map'], ['slitscan', 'Slit Scan']], value: S.mode, onChange: on('mode') }));

    if (S.mode === 'timemap') {
      // Map.
      const M = S.map;
      const map = sec('map', 'Map');
      add(map, segmented({ key: 'map.source', label: 'Source', options: [['builtin', 'Built-in'], ['image', 'Image'], ['video', 'Video']], value: M.source, onChange: on('map.source') }));

      this.drawThumbs({ ...this.thumbCache });

      const adj = sec('adjust', 'Map adjust', false);

      }

      const time = sec('time', 'Time');
      const T = S.timemap;

      add(time, slider({ key: 'timemap.steps', label: 'Delay steps', min: 0, max: 64, step: 1, value: T.steps, def: 0, onChange: (v) => {
        const f = fixSteps(v, T.steps);

      add(time, toggle({ key: 'timemap.perfectLoop', label: 'Perfect loop', value: !!T.perfectLoop, onChange: on('timemap.perfectLoop') }));
      time.append(el('p', 'note', 'Perfect loop: the delayed pixels at the start take their frames from the end of the video, so the result loops without a cut (no black start). The Max delay is at most the loop length − 1.'));
    } else {
      // Mode 2, Slit Scan (§8.5).

// ---- app/analysis.js
const { Analysis } = (() => {
// The analysis pass of Mode 2 (plan §8.3): when the line changes, decode the full video (a second
// decode worker, not in real time) and give each frame to the engine, which writes its row of the
// slit history. A new pass cancels the one that runs.



class Analysis {
  // opts: { onProgress(fraction | null), onRows() (some rows are new), onDone(key) }
  constructor(workerSrc, gpu, opts) {
    this.src = workerSrc;
    this.gpu = gpu;
    this.opts = opts;
    this.wk = null;
    this.key = ''; // the key of the pass that runs
    this.doneKey = ''; // the key of the last pass that ended
    this.progress = 0;
  }

  get running() {
    return !!this.wk;
  }

  stop() {
    if (this.wk) this.wk.terminate();
    this.wk = null;
    this.key = '';
    this.opts.onProgress(null);
  }

  start(file, count, key) {
    this.stop();
    this.key = key;
    this.doneKey = '';
    this.progress = 0;
    const wk = (this.wk = makeWorker(this.src));
    let done = 0, last = 0;
    wk.onmessage = async (e) => {
      const m = e.data;
      if (wk !== this.wk) return m.frame && m.frame.close();
      if (m.cmd === 'info') wk.postMessage({ cmd: 'play', job: 1, from: 0, to: count - 1 });
      else if (m.cmd === 'frame') {
        try {
          await this.gpu.call({ cmd: 'slitFrame', index: m.index, frame: m.frame }, [m.frame]);
        } catch {
          return this.stop();
        }
        if (wk !== this.wk) return;
        wk.postMessage({ cmd: 'ack' });
        done++;
        this.progress = done / count;
        this.opts.onProgress(this.progress);
        if (performance.now() - last > 150) {
          last = performance.now();
          this.opts.onRows();
        }
      } else if (m.cmd === 'done') {
        await this.gpu.call({ cmd: 'slitStatus' }); // the replies come in order: all rows are in
        if (wk !== this.wk) return;
        wk.terminate();
        this.wk = null;
        this.doneKey = key;
        this.key = '';
        this.opts.onProgress(null);
        this.opts.onRows();
        this.opts.onDone(key);
      } else if (m.cmd === 'error') this.stop();
    };
    wk.postMessage({ cmd: 'open', file });
  }
}

return { Analysis };
})();

// ---- app/ui/handles.js
const { LineHandles } = (() => {
// Direct control on the preview (plan §8.1, §12.1): the Mode 2 source line. Drag the centre point to
// move the line, drag the round handle to turn it (Shift or the Snap button: steps of 15°), touch the
// arrow to flip the scan direction.

// SVG elements, made by the HTML parser (it gives them the SVG namespace).
const mk = (tag, attrs) => {
  const box = document.createElement('div');
  box.innerHTML = tag === 'svg' ? '<svg></svg>' : `<svg><${tag}/></svg>`;
  const e = tag === 'svg' ? box.firstChild : box.firstChild.firstChild;
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};

class LineHandles {
  // app: { change(path, value), settings }
  constructor(area, canvas, app) {
    this.canvas = canvas;
    this.app = app;
    this.snap = false;
    const svg = (this.svg = mk('svg', { id: 'handles', class: 'handles' }));
    this.line = mk('line', { class: 'hLine' });
    this.arrow = mk('path', { class: 'hArrow' });
    this.arrowHit = mk('path', { class: 'hArrowHit', 'data-handle': 'flip' }); // a wider target
    this.center = mk('circle', { class: 'hPoint', r: 9, 'data-handle': 'move' });
    this.rot = mk('circle', { class: 'hRot', r: 8, 'data-handle': 'rotate' });
    svg.append(this.line, this.arrow, this.arrowHit, this.center, this.rot);
    this.snapBtn = document.createElement('button');
    this.snapBtn.type = 'button';
    this.snapBtn.className = 'snapBtn';
    this.snapBtn.textContent = 'Snap 15°';
    this.snapBtn.addEventListener('click', () => {
      this.snap = !this.snap;
      this.snapBtn.classList.toggle('on', this.snap);
    });
    area.append(svg, this.snapBtn);
    let drag = null;
    svg.addEventListener('pointerdown', (e) => {
      const h = e.target.dataset && e.target.dataset.handle;
      if (!h) return;
      e.preventDefault();
      e.stopPropagation();
      if (h === 'flip') {
        this.app.change('slitscan.flip', !this.app.settings.slitscan.flip);
        return;
      }
      drag = h;
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const { x, y, r } = this.toFrame(e.clientX, e.clientY);
      const S = this.app.settings.slitscan;
      if (this.app.edgeMode && this.app.edgeMode()) {
        // The Subject edge source: the direction from the frame centre to the pointer.
        let a = (Math.atan2((y - 0.5) * r.h, (x - 0.5) * r.w) * 180) / Math.PI;
        if (S.flip) a += 180;
        a = ((a % 360) + 360) % 360;
        if (e.shiftKey || this.snap) a = (Math.round(a / 15) * 15) % 360;
        this.app.change('slitscan.edgeAngle', Math.round(a * 10) / 10);
        return;
      }
      if (drag === 'move') {
        this.app.change('slitscan.x', Math.round(Math.min(1, Math.max(0, x)) * 1000) / 1000);
        this.app.change('slitscan.y', Math.round(Math.min(1, Math.max(0, y)) * 1000) / 1000);
      } else {
        // The angle of the line through the point, to the pointer (in pixels of the picture).
        let a = (Math.atan2((y - S.y) * r.h, (x - S.x) * r.w) * 180) / Math.PI;
        a = ((a % 360) + 360) % 360;
        if (e.shiftKey || this.snap) a = (Math.round(a / 15) * 15) % 360;
        this.app.change('slitscan.angle', Math.round(a * 10) / 10);
      }
    });
    const end = () => (drag = null);
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    new ResizeObserver(() => this.update()).observe(area);
  }

  toFrame(cx, cy) {
    const b = this.canvas.getBoundingClientRect();
    return { x: (cx - b.left) / b.width, y: (cy - b.top) / b.height, r: { w: b.width, h: b.height } };
  }

  update() {
    const S = this.app.settings;
    const show = S.mode === 'slitscan' && S.view !== 'original' && S.view !== 'mask' && !this.canvas.hidden && !(this.app.tools && this.app.tools.tool);
    this.svg.style.display = show ? '' : 'none';
    this.snapBtn.style.display = show ? '' : 'none';
    if (!show) return;
    // The overlay covers the canvas only (the line is clipped to the picture).
    const b = this.canvas.getBoundingClientRect();
    const a = this.svg.parentElement.getBoundingClientRect();
    this.svg.style.left = `${b.left - a.left}px`;
    this.svg.style.top = `${b.top - a.top}px`;
    const ox = 0, oy = 0;
    const sl = S.slitscan;
    const edge = this.app.edgeMode && this.app.edgeMode();
    // Line: the line through the point. Subject edge: only the direction, from the frame centre.
    const px = ox + (edge ? 0.5 : sl.x) * b.width, py = oy + (edge ? 0.5 : sl.y) * b.height;
    const t = (sl.angle * Math.PI) / 180;
    let e = [Math.cos(t), Math.sin(t)];
    let d = [Math.sin(t), -Math.cos(t)];
    if (edge) {
      const te = (sl.edgeAngle * Math.PI) / 180;
      d = [Math.cos(te), Math.sin(te)];
      e = d; // the round handle is on the direction
    }
    if (sl.flip) d = [-d[0], -d[1]];
    this.line.style.display = edge ? 'none' : '';
    this.center.style.display = edge ? 'none' : '';
    if (edge) e = d;
    const L = Math.hypot(b.width, b.height);
    this.svg.setAttribute('width', b.width);
    this.svg.setAttribute('height', b.height);
    this.line.setAttribute('x1', px - e[0] * L);
    this.line.setAttribute('y1', py - e[1] * L);
    this.line.setAttribute('x2', px + e[0] * L);
    this.line.setAttribute('y2', py + e[1] * L);
    this.center.setAttribute('cx', px);
    this.center.setAttribute('cy', py);
    const rd = Math.min(70, 0.3 * Math.min(b.width, b.height));
    this.rot.setAttribute('cx', px + e[0] * rd);
    this.rot.setAttribute('cy', py + e[1] * rd);
    // The arrow: from the point, in the scan direction.
    const ax = px + d[0] * 34, ay = py + d[1] * 34, bx = px + d[0] * 14, by = py + d[1] * 14;
    const n = [-d[1] * 7, d[0] * 7];
    const path = `M${bx},${by} L${ax},${ay} M${ax - d[0] * 10 + n[0]},${ay - d[1] * 10 + n[1]} L${ax},${ay} L${ax - d[0] * 10 - n[0]},${ay - d[1] * 10 - n[1]}`;
    this.arrow.setAttribute('d', path);
    this.arrowHit.setAttribute('d', path);
  }
}

return { LineHandles };
})();

// ---- app/ui/tools.js
const { PreviewTools } = (() => {
// Preview tools (plan §9.1, §12.1): the eyedropper (chroma key colour) and the garbage matte brush
// (Always subject / Never subject / Erase). One finger or the mouse: the active tool.

class PreviewTools {
  // app: { pick(u, v), stroke(points, mode), brush: { size, hardness }, onTool(tool) }
  constructor(area, canvas, app) {
    this.area = area;
    this.canvas = canvas;
    this.app = app;
    this.tool = null; // null | 'pick' | 'always' | 'never' | 'erase'
    this.cursor = document.createElement('div');
    this.cursor.className = 'brushCursor';
    this.cursor.hidden = true;
    area.append(this.cursor);
    this.bind(canvas);
  }

  // The listeners on the preview canvas (again when the canvas is new: a GPU restart).
  bind(canvas) {
    this.canvas = canvas;
    let pts = null, sent = 0, raf = 0;
    const uv = (e) => {
      const b = canvas.getBoundingClientRect();
      return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height];
    };
    // Send the new points of the stroke (with the last sent point, so the stroke is continuous).
    const flush = () => {
      raf = 0;
      if (!pts || pts.length <= sent) return;
      const part = pts.slice(Math.max(0, sent - 1));
      sent = pts.length;
      this.app.stroke(part, this.tool);
    };
    canvas.addEventListener('pointerdown', (e) => {
      if (!this.tool || e.button > 0) return;
      e.preventDefault();
      if (this.tool === 'pick') {
        this.app.pick(...uv(e));
        return;
      }
      canvas.setPointerCapture(e.pointerId);
      pts = [uv(e)];
      sent = 0;
      flush();
    });
    canvas.addEventListener('pointermove', (e) => {
      this.moveCursor(e);
      if (!pts) return;
      pts.push(uv(e));
      if (!raf) raf = requestAnimationFrame(flush);
    });
    const end = () => {
      if (pts) flush();
      pts = null;
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('pointerleave', () => (this.cursor.hidden = true));
    canvas.style.cursor = this.tool === 'pick' ? 'crosshair' : this.tool ? 'none' : '';
  }

  setTool(tool) {
    this.tool = this.tool === tool ? null : tool;
    this.canvas.style.cursor = this.tool === 'pick' ? 'crosshair' : this.tool ? 'none' : '';
    this.cursor.hidden = true;
    this.app.onTool(this.tool);
  }

  moveCursor(e) {
    const brush = this.tool && this.tool !== 'pick';
    this.cursor.hidden = !brush;
    if (!brush) return;
    const b = this.canvas.getBoundingClientRect(), a = this.area.getBoundingClientRect();
    const d = (this.app.brush.size * b.width) / this.canvas.width;
    Object.assign(this.cursor.style, { width: `${d}px`, height: `${d}px`, left: `${e.clientX - a.left - d / 2}px`, top: `${e.clientY - a.top - d / 2}px` });
  }
}

return { PreviewTools };
})();

// ---- app/export.js
const { probeEncoder, saveParts, Exporter } = (() => {
// Export (plan §11.2): probe the encoder, make the engine at the export size (and the Mode 2 analysis
// pass), decode from the warm-up start, render each frame, encode it (VideoEncoder in the encode
// worker, encodeQueueSize <= 8), copy the audio packets of the range, mux (video + audio), and save
// (a Blob, or a file in the Origin Private File System when it is large). Frame times are the source
// times (the source timescale), so VFR and the audio sync stay.






const MAX_ENCODE_QUEUE = 8;
const OPFS_LIMIT = 1024 * 1048576; // larger files go to the Origin Private File System

// The first supported encoder configuration for a size (plan §3, §11.2), or null.
async function probeEncoder(w, h, fps, opts = {}) {
  if (typeof VideoEncoder === 'undefined') return null;
  const prefs = opts.hardware === 'software' ? ['prefer-software', 'no-preference'] : ['prefer-hardware', 'no-preference'];
  const bitrate = bitrateFor(w, h, fps, opts.quality ?? 'high', opts.mbps);
  for (const codec of codecCandidates(w, h, fps)) {
    for (const hardwareAcceleration of prefs) {
      const config = { codec, width: w, height: h, bitrate, framerate: fps, hardwareAcceleration, bitrateMode: 'variable', latencyMode: 'quality', avc: { format: 'avc' } };
      try {
        if ((await VideoEncoder.isConfigSupported(config)).supported) return config;
      } catch { /* the next one */ }
    }
  }
  return null;
}

// Save the parts of the file: a Blob, or (large, or opts.opfs) a file in the OPFS.
async function saveParts(parts, size, name, opts = {}) {
  const low = typeof navigator !== 'undefined' && navigator.deviceMemory && navigator.deviceMemory <= 4 && size > 256 * 1048576;
  if ((opts.opfs || size > OPFS_LIMIT || low) && navigator.storage && navigator.storage.getDirectory) {
    try {
      const dir = await navigator.storage.getDirectory();
      const fh = await dir.getFileHandle('neofx-export.mp4', { create: true });
      const w = await fh.createWritable();
      for (const p of parts) await w.write(p);
      await w.close();
      const file = await fh.getFile();
      return { blob: new File([file], name, { type: 'video/mp4' }), opfs: true };
    } catch {
      if (opts.opfs) throw new Error('The browser storage (OPFS) cannot hold the file.');
    }
  }
  return { blob: new File(parts, name, { type: 'video/mp4' }), opfs: false };
}

class Exporter {
  // app: { gpu, decodeSrc, encodeSrc, file(), info(), settings, configure(w, h) -> reply,
  //        analyse() -> Promise (Mode 2 at the export size), depth() (history frames), restore() }
  constructor(app) {
    this.app = app;
    this.cancelled = false;
    this.workers = [];
  }

  cancel() {
    this.cancelled = true;
    for (const w of this.workers) w.terminate();
    if (this.wake) this.wake();
    if (this.abortDecode) this.abortDecode(); // the decode worker sends nothing more
  }

  check() {
    if (this.cancelled) throw new Error('Export cancelled');
  }

  // opts: { width, height, quality, mbps, keyint (s), range: [a, b], audio (bool), hardware, name, opfs }
  // onProgress({ done, total, fps, eta (s), phase }). Returns { blob, name, size, opfs, config, width, height }.
  async run(opts, onProgress) {
    const A = this.app;
    const info = A.info();
    const file = A.file();
    const [a, b] = opts.range;
    const total = b - a + 1;
    onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'prepare' });
    // 1. The encoder (a lower size when the size is not supported).
    let { width, height } = opts;
    let config = await probeEncoder(width, height, info.fps, opts);
    if (!config) {
      for (const s of exportSizes(info.width, info.height)) {
        if (s.width * s.height >= width * height) continue;
        config = await probeEncoder(s.width, s.height, info.fps, opts);
        if (config) {
          ({ width, height } = s);
          break;
        }
      }
    }
    if (!config) throw new Error('This browser has no H.264 encoder for this video.');
    this.check();
    // The exact frame times (source timescale) and the audio packets.
    const d = await demuxMp4(file);
    const ts = d.timescale;
    const ptsOf = d.samples.map((s) => s.dts + s.cto - d.mediaTime);
    const frameSample = info.frameSamples; // frame index -> sample index
    const pts = (t) => ptsOf[frameSample[t]];
    // 2. The engine at the export size; Mode 2: the analysis pass at that size.
    await A.gpu.call({ cmd: 'exporting', on: true });
    try {
      const conf = await A.configure(width, height);
      // Perfect loop (Time Map): the history of the first frames is the end of the range. Store
      // indices: the end frames of the range (the pass before) at their frame index, the range at
      // frame index + L. The delay is at most L − 1.
      const wrapL = A.wrap && A.wrap() ? total : 0;
      const depth = wrapL ? Math.min(A.depth(), wrapL - 1) : A.depth();
      await A.gpu.call({ cmd: 'wrap', cap: wrapL ? wrapL - 1 : null, forget: true });
      if (depth > conf.n - 1) throw new Error(`The Max delay (${depth} frames) is more than the buffer at ${Math.min(width, height)}p (${conf.n} frames). Choose a lower resolution.`);
      if (A.settings.mode === 'slitscan') {
        onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'analysis' });
        await A.analyse((f) => onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'analysis', analysis: f }));
      }
      this.check();
      // 3. The encoder worker.
      const enc = makeWorker(A.encodeSrc);
      this.workers.push(enc);
      const chunks = [];
      const packer = new DataPacker(32 * 1048576);
      let description = null, queue = 0, failure = null;
      const frames = new FrameMatcher(); // chunk timestamp -> frame index (nearest, not exact)
      // Tests: change the chunk timestamps as Safari does (opts.skewChunks: µs -> µs).
      const skew = typeof opts.skewChunks === 'function' ? opts.skewChunks : null;
      const poke = () => {
        if (this.wake) {
          const f = this.wake;
          this.wake = null;
          f();
        }
      };
      enc.onmessage = (e) => {
        const m = e.data;
        if (m.cmd === 'chunk') {
          if (m.description && !description) description = m.description;
          packer.add(m.data);
          const t = frames.match(skew ? skew(m.timestamp) : m.timestamp);
          if (t < 0) failure = new Error(`The encoder gave a frame with an unknown time (${m.timestamp} µs).`);
          else chunks.push({ pts: pts(t) - pts(a), size: m.data.length, key: m.key });
        } else if (m.cmd === 'queue') queue = m.size;
        else if (m.cmd === 'error') failure = new Error(m.message);
        else if (m.cmd === 'flushed') this.flushed = true;
        poke();
      };
      const waitFor = async (cond) => {
        while (!cond()) {
          if (failure) throw failure;
          this.check();
          await new Promise((r) => (this.wake = r));
        }
      };
      enc.postMessage({ cmd: 'configure', config });
      // 4. Decode from the warm-up start (the history of frame a), render, encode.
      const dec = makeWorker(A.decodeSrc);
      this.workers.push(dec);
      const from = wrapL ? a : Math.max(0, a - depth);
      // Decode jobs: 1 = the end of the range (perfect loop history), 2 = from .. b.
      const firstJob = wrapL && depth > 0 ? 1 : 2;
      let done = 0, lastKey = -Infinity;
      const t0 = performance.now();
      await new Promise((resolve, reject) => {
        const fail = (err) => reject(err);
        this.abortDecode = () => reject(new Error('Export cancelled'));
        // One message at a time (the frames go to the GPU and the encoder in order).
        let chain = Promise.resolve();
        dec.onmessage = (e) => {
          chain = chain.then(() => handle(e.data));
        };
        const handle = async (m) => {
          try {
            if (m.cmd === 'info') {
              if (firstJob === 1) dec.postMessage({ cmd: 'play', job: 1, from: b - depth + 1, to: b });
              else dec.postMessage({ cmd: 'play', job: 2, from, to: b });
            } else if (m.cmd === 'error') fail(new Error(m.message));
            else if (m.cmd === 'done') {
              if (m.job === 1) dec.postMessage({ cmd: 'play', job: 2, from, to: b });
              else resolve();
            } else if (m.cmd === 'frame') {
              const t = m.index;
              if (this.cancelled) {
                m.frame.close();
                return;
              }
              const history = m.job === 1;
              const show = !history && t >= a;
              const index = history ? t : t + wrapL;
              const us = Math.round(((pts(t) - pts(a)) * 1e6) / ts);
              const durUs = Math.round(((t + 1 < info.times.length ? pts(t + 1) - pts(t) : d.samples[frameSample[t]].duration) * 1e6) / ts);
              const r = await A.gpu.call({ cmd: 'upload', index, frame: m.frame, show, grab: show ? { timestamp: us, duration: durUs } : undefined }, [m.frame]);
              if (show) {
                frames.add(us, t);
                const key = us - lastKey >= opts.keyint * 1e6;
                if (key) lastKey = us;
                await waitFor(() => queue <= MAX_ENCODE_QUEUE);
                queue++;
                enc.postMessage({ cmd: 'frame', frame: r.frame, key }, [r.frame]);
                done++;
                const sec = (performance.now() - t0) / 1000;
                const fps = done / Math.max(sec, 1e-3);
                onProgress({ done, total, fps, eta: (total - done) / Math.max(fps, 1e-3), phase: 'encode' });
              } else if (t % 4 === 0) onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'warmup', warm: history ? (t - (b - depth)) / Math.max(1, depth) : (t - from + 1) / Math.max(1, a - from) });
              dec.postMessage({ cmd: 'ack' });
            }
          } catch (err) {
            fail(err);
          }
        };
        dec.postMessage({ cmd: 'open', file });
      });
      this.check();
      this.flushed = false;
      enc.postMessage({ cmd: 'flush' });
      await waitFor(() => this.flushed);
      if (chunks.length !== total) throw new Error(`The encoder gave ${chunks.length} of ${total} frames.`);
      // 5. Mux: video (the source timescale) + the audio packets of the range (copied, D16).
      const lastDur = d.samples[frameSample[b]].duration;
      const { samples, mediaTime } = chunkSamples(chunks, lastDur);
      // Never write a file with broken frame times (it would play too fast, or not at all).
      const bad = checkSamples(samples);
      if (bad) throw new Error(`The export stopped: ${bad}. Please report this with the name of the browser.`);
      const video = { width, height, timescale: ts, avcc: description, samples, mediaTime, dataParts: packer.done() };
      let audio = null;
      const au = d.audio;
      if (opts.audio && au) {
        const usA = info.times[a], usB = info.times[b] + (info.times[b + 1] !== undefined ? info.times[b + 1] - info.times[b] : (lastDur * 1e6) / ts);
        // Whole packets of the range; from frame 0, also the priming packets before time 0 (with the
        // source edit list).
        const list = au.samples.filter((s) => (a === 0 || s.us >= usA - 1) && s.us < usB - 1);
        if (list.length) {
          // Read the packets into memory now (a few large reads). Slices of the source file in the
          // result would be read again, one small read for each packet, when the browser saves it
          // (on Android, through the content provider of the picked file: very slow).
          onProgress({ done, total, fps: 0, eta: 0, phase: 'audio' });
          const data = await readPackets(file, list);
          this.check();
          audio = {
            ...au,
            mediaTime: a === 0 ? au.mediaTime : 0,
            samples: list.map((s) => ({ size: s.size, duration: s.duration })),
            dataParts: [data],
          };
        }
      }
      onProgress({ done, total, fps: 0, eta: 0, phase: 'mux' });
      const r = muxMp4(video, { audio });
      const name = opts.name;
      const saved = await saveParts(r.parts, r.size, name, { opfs: opts.opfs });
      return { ...saved, name, size: r.size, config, width, height, frames: chunks.length, audio: !!audio };
    } finally {
      for (const w of this.workers) w.terminate();
      this.workers = [];
      await A.gpu.call({ cmd: 'exporting', on: false });
    }
  }
}

return { probeEncoder, saveParts, Exporter };
})();

// ---- app/ui/exportdialog.js
const { ExportDialog } = (() => {
// The export dialog (plan §11.1, §11.2): settings, progress, cancel, then Download (or Share).



const el = (tag, attrs = {}, text) => {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  if (text !== undefined) e.textContent = text;
  return e;
};

class ExportDialog {
  // app: { info(), file(), range() -> [a, b] | null, hasAudio(), check(width, height) -> warning text or '',
  //        run(opts, onProgress) -> result, cancel() }
  constructor(dialog, app) {
    this.d = dialog;
    this.app = app;
    this.result = null;
    this.url = null;
    // The exported file stays in memory only while the dialog is open: then its URL is given back.
    dialog.addEventListener('close', () => this.release());
  }

  release() {
    if (this.url) URL.revokeObjectURL(this.url);
    // A large export was written to the browser storage (OPFS): remove that file too.
    if (this.result && this.result.opfs && navigator.storage && navigator.storage.getDirectory) {
      navigator.storage.getDirectory().then((d) => d.removeEntry('neofx-export.mp4')).catch(() => {});
    }

    this.result = null;
  }

  open() {
    const info = this.app.info();
    if (!info) return;
    const d = this.d;
    d.textContent = '';
    this.release();
    const form = el('form', { method: 'dialog', className: 'exportForm' });
    form.append(el('h2', {}, 'Export'));
    const row = (label, input) => {
      const r = el('label', { className: 'exportRow' });

      form.append(r);
      return input;
    };
    const sel = (name, options, value) => {
      const s = el('select', { name });
      for (const [v, t] of options) s.append(el('option', { value: v }, t));
      s.value = value;
      return s;
    };
    const sizes = exportSizes(info.width, info.height);
    const res = row('Resolution', sel('resolution', sizes.map((s) => [s.id, s.label]), 'source'));
    const quality = row('Quality', sel('quality', [...Object.keys(QUALITY).map((k) => [k, { low: 'Low', medium: 'Medium', high: 'High', veryhigh: 'Very high' }[k]]), ['custom', 'Bitrate (Mbit/s)']], 'high'));
    const mbps = row('Bitrate', el('input', { type: 'number', name: 'mbps', min: 0.5, max: 200, step: 0.5, value: 8 }));
    mbps.parentElement.hidden = true;
    quality.addEventListener('change', () => (mbps.parentElement.hidden = quality.value !== 'custom'));
    const keyint = row('Keyframe interval (s)', el('input', { type: 'number', name: 'keyint', min: 1, max: 10, step: 1, value: 2 }));
    const range = this.app.range();
    const rangeSel = row('Range', sel('range', [['full', 'Full'], ...(range ? [['inout', `In – Out (frames ${range[0]} – ${range[1]})`]] : [])], 'full'));
    const audio = row('Audio', sel('audio', this.app.hasAudio() ? [['copy', 'Copy original'], ['none', 'None']] : [['none', 'None (the file has no audio)']], this.app.hasAudio() ? 'copy' : 'none'));
    const hw = row('Encoder', sel('hardware', [['hardware', 'Prefer hardware'], ['software', 'Prefer software']], 'hardware'));
    const name = row('File name', el('input', { type: 'text', name: 'name', value: exportName(this.app.file().name) }));
    const warn = el('p', { className: 'exportWarn' });
    form.append(warn);
    const size = () => sizes.find((s) => s.id === res.value);
    const check = () => {
      const s = size();
      warn.textContent = this.app.check(s.width, s.height);
      go.disabled = !!warn.textContent;
    };
    const prog = el('div', { className: 'exportProgress', hidden: true });
    const bar = el('div', { className: 'bar' });
    const text = el('p', { className: 'exportText' });
    prog.append(el('div', { className: 'track' }), text);
    prog.firstChild.append(bar);
    form.append(prog);
    const buttons = el('div', { className: 'exportButtons' });
    const go = el('button', { type: 'button', className: 'primary', id: 'exportGo' }, 'Export');
    const cancel = el('button', { type: 'button', id: 'exportCancel' }, 'Cancel');
    buttons.append(cancel, go);
    form.append(buttons);
    d.append(form);
    res.addEventListener('change', check);
    check();
    let running = false;
    cancel.addEventListener('click', () => {
      if (running) this.app.cancel();
      else d.close();
    });
    go.addEventListener('click', async () => {
      running = true;
      go.disabled = true;
      for (const i of form.querySelectorAll('select, input')) i.disabled = true;
      prog.hidden = false;
      // Until the first frame: a moving bar (the encoder probe, the file index, the warm-up frames).
      prog.classList.add('busy');
      text.textContent = 'Preparing…';
      const s = size();
      const opts = {
        width: s.width, height: s.height, quality: quality.value, mbps: Number(mbps.value), keyint: Number(keyint.value),
        range: rangeSel.value === 'inout' && range ? range : [0, info.times.length - 1],
        audio: audio.value === 'copy', hardware: hw.value, name: name.value || exportName(this.app.file().name),
      };
      try {
        const r = await this.app.run(opts, (p) => {
          prog.classList.toggle('busy', ['prepare', 'warmup', 'audio', 'mux'].includes(p.phase));
          if (p.phase === 'prepare') text.textContent = 'Preparing…';
          else if (p.phase === 'warmup') text.textContent = `Preparing the first frames… ${Math.round((p.warm || 0) * 100)} %`;
          else if (p.phase === 'analysis') {
            bar.style.width = `${Math.round((p.analysis || 0) * 100)}%`;
            text.textContent = `Analysis ${Math.round((p.analysis || 0) * 100)} %`;
          } else if (p.phase === 'audio') text.textContent = 'Copying the audio…';
          else if (p.phase === 'mux') text.textContent = 'Writing the file…';
          else {
            bar.style.width = `${Math.round((100 * p.done) / p.total)}%`;
            text.textContent = `${p.done} / ${p.total} frames · ${p.fps.toFixed(1)} fps · ${Math.ceil(p.eta)} s left`;
          }
        });
        this.result = r;
        prog.classList.remove('busy');
        bar.style.width = '100%';
        text.textContent = `Done: ${r.width}×${r.height}, ${r.frames} frames, ${(r.size / 1048576).toFixed(1)} MB${r.audio ? ', with audio' : ''}.`;
        this.showResult(buttons, r);
      } catch (e) {
        prog.classList.remove('busy');
        text.textContent = e.message;
        cancel.textContent = 'Close';
      } finally {
        running = false;
      }
    });
    d.showModal();
  }

  showResult(buttons, r) {
    buttons.textContent = '';
    const url = (this.url = URL.createObjectURL(r.blob));
    const dl = el('a', { href: url, download: r.name, className: 'button primary', id: 'exportDownload' }, 'Download');
    buttons.append(dl);
    // Share (iOS-like environments, plan §11.2 step 7).
    if (navigator.canShare && navigator.canShare({ files: [r.blob] })) {
      const sh = el('button', { type: 'button', id: 'exportShare' }, 'Share');
      sh.addEventListener('click', () => navigator.share({ files: [r.blob], title: r.name }).catch(() => {}));
      buttons.prepend(sh);
    }
    const close = el('button', { type: 'button' }, 'Close');
    close.addEventListener('click', () => this.d.close());
    buttons.prepend(close);
  }
}

return { ExportDialog };
})();

// ---- app/history.js
const { History } = (() => {
// Undo / redo (plan §12.5): a list of settings snapshots. Each setting change is one step; the
// changes of one path that come fast (a slider drag) join into one step.

const JOIN_MS = 600;

class History {
  constructor(limit = 200) {
    this.limit = limit;
    this.past = []; // snapshots (JSON) before each step
    this.future = [];
    this.last = null; // { path, time } of the last step
  }

  // Call before a change. path: the setting path (or a name like 'preset', 'randomize').
  record(snapshot, path, now = Date.now()) {
    const join = this.last && path && this.last.path === path && now - this.last.time < JOIN_MS;
    this.last = { path, time: now };
    if (join) return false;
    this.past.push(snapshot);
    if (this.past.length > this.limit) this.past.shift();
    this.future = [];
    return true;
  }

  // The end of a drag: the next change is a new step.
  cut() {
    this.last = null;
  }

  get canUndo() {
    return this.past.length > 0;
  }

  get canRedo() {
    return this.future.length > 0;
  }

  // current: the snapshot now. Returns the snapshot to restore, or null.
  undo(current) {
    if (!this.past.length) return null;
    this.future.push(current);
    this.last = null;
    return this.past.pop();
  }

  redo(current) {
    if (!this.future.length) return null;
    this.past.push(current);
    this.last = null;
    return this.future.pop();
  }
}

return { History };
})();

const { merge, PRESETS, applyPreset, presetFile, parsePresetFile, dataUrlBlob } = (() => {
// Presets (plan §12.5): built-in looks (both modes and the cutout modes), and preset files.
// File: { app: 'neofx', version, settings, assets: { mapImage, matte } } (PNG data URLs). A video
// map is stored by its file name only: at load, the app asks for the file.



// Deep merge of plain objects (arrays are values).
function merge(base, over) {
  const out = clone(base);
  const walk = (o, v) => {
    for (const [k, x] of Object.entries(v || {})) {
      if (x && typeof x === 'object' && !Array.isArray(x) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) walk(o[k], x);
      else o[k] = clone(x);
    }
  };
  walk(out, over);
  return out;
}

// The settings of a preset: on the defaults, keeping the cutout method settings, the custom maps,
// and the view of the user (a preset is a look, not the footage setup).
function applyPreset(current, preset) {
  const s = merge(DEFAULTS, preset.s);
  s.view = current.view;
  s.timemap.perfectLoop = !!(current.timemap && current.timemap.perfectLoop); // an output choice, not a look
  const keep = clone(current.cutout);
  s.cutout = { ...keep, mode: (preset.s.cutout && preset.s.cutout.mode) || 'off' };
  if (s.cutout.mode === 'scan' && s.mode !== 'slitscan') s.cutout.mode = 'overlay';
  s.map.image = clone(current.map.image);
  s.map.video = clone(current.map.video);
  return s;
}

function presetFile(settings, version, assets = {}) {
  return { app: 'neofx', version, settings: clone(settings), assets };
}

// Read a preset file (text). Returns { settings, assets } on the defaults (older or partial files
// get the default of each missing setting), or throws.
function parsePresetFile(text) {
  let o;
  try {
    o = JSON.parse(text);
  } catch {
    throw new Error('This is not a neofx preset file.');
  }
  if (!o || o.app !== 'neofx' || !o.settings || typeof o.settings !== 'object') throw new Error('This is not a neofx preset file.');
  return { settings: merge(DEFAULTS, o.settings), assets: o.assets || {}, version: o.version };
}

// 'data:image/png;base64,...' -> Blob (no network: decode the base64 here).
function dataUrlBlob(url) {
  const m = /^data:([^;,]+)(;base64)?,(.*)$/.exec(url || '');
  if (!m) throw new Error('Not a data URL.');
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: m[1] });
}

return { merge, PRESETS, applyPreset, presetFile, parsePresetFile, dataUrlBlob };
})();

const store = {
  get(k) {

    } catch {
      return null;
    }
  },
  set(k, v) {

      localStorage.setItem(k, v);
    } catch { /* no storage */ }

function dragger(el, onMove, onEnd) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
    const move = (ev) => onMove(ev);
    const up = () => {

      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      if (onEnd) onEnd();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });

// ---- app/ui/startscreen.js
const { startDemos } = (() => {
// The start screen (plan §12.9): two small example animations, made by the app from a generated test
// pattern (no files to load): a Time Map (a radial delay) and a Slit Scan (a vertical line, Time On).

const W = 160, H = 90, HIST = 48;

// The test pattern of frame t: colour bars that move, and a disc that turns.
function pattern(t, out) {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const band = Math.floor(((x + t * 1.5) / 20) % 6);
      const c = [[230, 60, 60], [240, 200, 40], [60, 200, 90], [40, 180, 230], [90, 80, 230], [220, 70, 200]][(band + 6) % 6];
      const cx = W / 2 + 34 * Math.cos(t / 9), cy = H / 2 + 22 * Math.sin(t / 9);
      const inDisc = (x - cx) ** 2 + (y - cy) ** 2 < 120;
      out[i] = inDisc ? 255 : c[0] * 0.8;
      out[i + 1] = inDisc ? 255 : c[1] * 0.8;
      out[i + 2] = inDisc ? 255 : c[2] * 0.8;
      out[i + 3] = 255;
    }
  }
}

function startDemos(timeCanvas, slitCanvas) {
  if (!timeCanvas || !slitCanvas) return () => {};
  const ring = Array.from({ length: HIST }, () => new Uint8ClampedArray(W * H * 4));
  const cols = Array.from({ length: HIST }, () => new Uint8ClampedArray(H * 4));
  const tc = timeCanvas.getContext('2d'), sc = slitCanvas.getContext('2d');
  const ti = tc.createImageData(W, H), si = sc.createImageData(W, H);
  let t = 0, raf = 0, last = 0;
  const step = (now) => {
    raf = requestAnimationFrame(step);
    if (now - last < 40 || document.body.dataset.state !== 'start') return; // 25 fps, on the start screen only
    last = now;
    const cur = ring[t % HIST];
    pattern(t, cur);
    // The source column (x = 50) of this frame.
    const col = cols[t % HIST];
    for (let y = 0; y < H; y++) col.set(cur.subarray((y * W + 50) * 4, (y * W + 50) * 4 + 4), y * 4);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        // Time Map: the delay grows with the distance from the centre (black before frame 0).
        const d = Math.min(HIST - 1, Math.floor((Math.hypot(x - W / 2, (y - H / 2) * 1.6) / 92) * (HIST - 1)));
        const k = t - d;
        if (k < 0) ti.data.set([0, 0, 0, 255], i);
        else ti.data.set(ring[k % HIST].subarray(i, i + 4), i);
        // Slit Scan: right of the line, column x shows the line of frame t − (x − 50).
        const a = x - 50;
        if (a < 0 || a >= HIST) si.data.set(cur.subarray(i, i + 4), i);
        else if (t - a < 0) si.data.set([0, 0, 0, 255], i);
        else si.data.set(cols[(t - a) % HIST].subarray(y * 4, y * 4 + 4), i);
      }
    }
    tc.putImageData(ti, 0, 0);
    sc.putImageData(si, 0, 0);
    t++;
  };
  raf = requestAnimationFrame(step);
  return () => cancelAnimationFrame(raf);
}

return { startDemos };

const { runBench } = (() => {
// The performance test (plan §13.4, phase 12): on the open video, the preview fps at 540p for each
// mode, the export fps at 1080p, and the frame buffer limit. The result is text to copy into the
// README (device results table). Nothing leaves the device.

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// Play from frame 0 for `seconds` (or to the end). Returns { fps, shown, dropped }.
async function measurePlay(player, seconds) {
  await player.seek(0);
  player.play();
  const t0 = performance.now();
  while (player.playing && performance.now() - t0 < seconds * 1000) await wait(50);
  const s = player.stats;
  const out = { fps: s.fps, shown: s.shown, dropped: s.dropped };
  player.pause();
  return out;
}

// app: { player, info(), store, settings(), look(patch) -> Promise (no undo step), restore(saved),

//        onStep(text) }

  const seconds = opts.seconds ?? 4;

    const modes = [
      ['Time Map (Linear, Max delay 30)', { mode: 'timemap', timemap: { maxDelay: 30, blend: true, steps: 0 } }],
      ['Slit Scan (line, Time On)', { mode: 'slitscan', slitscan: { source: 'line', time: true } }],
    ];
    for (const [name, patch] of modes) {
      app.onStep(`Preview at 540p: ${name}…`);
      await app.look(patch);
      res.preview[name] = await measurePlay(P, seconds);
    }
    // Export at 1080p (the short side; or the source size when it is smaller), without audio.
    await app.restore(saved);

    res.buffer[1080] = { n: app.bufferAt(w, h), width: w, height: h };

    const t0 = performance.now();
    let first = 0;
    const r = await app.exportVideo({ width: w, height: h, quality: 'high', keyint: 2, range: [0, frames - 1], audio: false, hardware: 'hardware', name: 'bench.mp4' }, (p) => {
      if (p.phase === 'encode' && p.done === 1) first = performance.now();
    });
    const sec = (performance.now() - (first || t0)) / 1000;
    res.export = { width: r.width, height: r.height, frames: r.frames, fps: (r.frames - 1) / Math.max(sec, 1e-3), codec: r.config.codec, hardware: r.config.hardwareAcceleration };

  lines.push(`Browser: ${nav.userAgent || '?'}`);
  lines.push(`GPU: ${app.gpuName || '?'} (engine: ${app.gpuMode})`);
  if (nav.hardwareConcurrency) lines.push(`CPU threads: ${nav.hardwareConcurrency}${nav.deviceMemory ? `, memory: ${nav.deviceMemory} GB` : ''}`);
  lines.push(`Video: ${info.width}×${info.height}, ${info.fps.toFixed(2)} fps, ${info.times.length} frames (${info.codec})`);
  for (const [name, p] of Object.entries(res.preview)) lines.push(`Preview 540p, ${name}: ${p.fps.toFixed(1)} fps (${p.dropped} of ${p.shown + p.dropped} frames dropped)`);
  if (res.export) lines.push(`Export ${res.export.width}×${res.export.height}: ${res.export.fps.toFixed(1)} fps (${res.export.frames} frames, ${res.export.codec}, ${res.export.hardware})`);
  for (const [s, b] of Object.entries(res.buffer)) lines.push(`Buffer at ${s}p (${b.width}×${b.height}): ${b.n} frames`);
  return { ...res, text: lines.join('\n') };
}

return { runBench };
})();

ith(cb, cs, a, u_blendMode, u_linear);\\n}\\n\";\nconst AGE_GLSL = \"// Alpha and age (plan §10.3). Age: frames (Mode 1: the delay d).\\nuniform float u_opacity;\\nuniform int u_decay;            // 0 full, 1 linear, 2 exponential (half-life), 3 curve\\nuniform float u_decayLen;       // frames\\nuniform highp sampler2D u_decayCurve; // 256 x 1: alpha = 1 − curve(age / length)\\nuniform float u_maxAge;         // the age at \\\"max age\\\" (tint and brightness)\\nuniform bool u_tintOn;\\nuniform vec3 u_tint[4];         // new -> old\\nuniform int u_tintN;            // 2..4\\nuniform float u_tintAmount;\\nuniform float u_ageBright;      // the brightness multiplier at max age\\n\\nfloat decayAlpha(float age) {\\n  float u = age / max(u_decayLen, 1e-3);\\n  if (u_decay == 1) return clamp(1.0 - u, 0.0, 1.0);\\n  if (u_decay == 2) return exp2(-u);\\n  if (u_decay == 3) {\\n    float x = clamp(u, 0.0, 1.0) * 255.0;\\n    float i = floor(min(x, 254.0));\\n    return 1.0 - mix(texelFetch(u_decayCurve, ivec2(int(i), 0), 0).r, texelFetch(u_decayCurve, ivec2(int(i) + 1, 0), 0).r, x - i);\\n  }\\n  return 1.0;\\n}\\n\\n// Age tint (a ramp of 2 to 4 colours, multiplied, by amount) and age brightness.\\nvec3 ageLook(vec3 c, float age) {\\n  float u = clamp(age / max(u_maxAge, 1e-3), 0.0, 1.0);\\n  if (u_tintOn) {\\n    float x = u * float(u_tintN - 1);\\n    int i = min(int(floor(x)), u_tintN - 2);\\n    vec3 t = mix(u_tint[i], u_tint[i + 1], x - float(i));\\n    c = mix(c, c * t, u_tintAmount);\\n  }\\n  return clamp(c * mix(1.0, u_ageBright, u), 0.0, 1.0);\\n}\\n\";\nconst ROW_FRAG = \"// Slit history (plan §8.3): one row = the pixels of the source line of one frame. The frame is read\\n// from a YUV array layer (the store, or the staging layer of the analysis pass). Slit width: the\\n// average of u_width pixels across the line.\\nprecision highp float;\\nuniform highp sampler2DArray u_Y;\\nuniform highp sampler2DArray u_C;\\nuniform float u_layer;\\nuniform vec2 u_res;   // , u_eK;\\nuniform float u_eD;\\nuniform vec2 u_ed, u_ee;\\nin vec2 v_uv;\\nout vec4 o;\\n\\nfloat S(int i) { return texelFetch(u_S, ivec2(i % 1024, i / 1024), 0).r; }\\n\\n// A(s): the largest i with S(i) <= s, then linear to the next entry.\\nfloat ageOf(float s) {\\n  int lo = 0, hi = u_M;\\n  for (int k = 0; k < 14; k++) {\\n    if (lo >= hi) break;\\n    int m = (lo + hi + 1) / 2;\\n    if (S(m) <= s) lo = m; else hi = m - 1;\\n  }\\n  if (lo >= u_M) return float(u_M);\\n  return float(lo) + (s - S(lo)) / (S(lo + 1) - S(lo));\\n}\\n\\n// The history of frame k at column x (texture units); a = 0 when the row is not there.\\nvec4 row(int k, float x) {\\n  if (k < 0) return vec4(0.0);\\n  int r = k % u_H;\\n  if (texelFetch(u_rows, ivec2(r, 0), 0).r != k) return vec4(0.0);\\n  return vec4(texture(u_hist, vec2(x, (float(r) + 0.5) / float(u_H))).rgb, 1.0);\\n}\\n\\nvec3 heat(float u) { // dark blue -> red -> yellow\\n  return clamp(vec3(1.5 * u, 1.5 * u - 0.5, 0.6 - 1.2 * abs(u - 0.25) + max(0.0, 2.0 * u - 1.6)), 0.0, 1.0);\\n}\\n\\n// The edge effect at pixel p (working px): rgb, a = 1 when there is a trail; age in .w of the out.\\nvec4 edgeEffect(vec2 p, out float age) {\\n  age = 0.0;\\n  vec2 q = p - u_res * 0.5;\\n  float xp = dot(q, u_ed), yp = dot(q, u_ee);\\n  int r = int(floor(yp + 0.5 * u_eD));\\n  if (r < 0 || float(r) >= u_eD) return vec4(0.0);\\n  if (u_timeOn) {\\n    vec4 t = texelFetch(u_trail, ivec2(int(floor(xp + 0.5 * u_eD)), r), 0);\\n    if (t.a <= 0.0) return vec4(0.0);\\n    age = (t.a - 0.02) / 0.98 * float(u_M);\\n    return vec4(t.rgb, 1.0);\\n  }\\n  // Time Off: the colour of the nearest emitter of frame t before x' repeats to the next one.\\n  int slot = u_t % u_eH;\\n  if (texelFetch(u_eframes, ivec2(slot, 0), 0).r != u_t) return vec4(0.0);\\n  float best = -1e9;\\n  vec4 c = vec4(0.0);\\n  for (int k = 0; k < 4; k++) {\\n    if (k >= u_eK) break;\\n    float x = texelFetch(u_epos, ivec2(r, slot * u_eK + k), 0).r;\\n    if (x > -1e5 && x e.reverse();\n    }\n    gl.bindFramebuffer(gl.FRAMEBUFFER, null);\n    this.version++;\n  }\n\n  // The clean plate (plan §9.2). It goes through the same YUV 4:2:0 conversion as the frames of the\n  // store, so that the background difference compares like with like. upload(): put the picture\n  // (already turned) into the bound TEXTURE_2D.\n  setPlate(upload) {\n    const gl = this.gl;\n    const e = this.e;\n    gl.activeTexture(gl.TEXTURE0);\n    gl.bindTexture(gl.TEXTURE_2D, e.src2);\n    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);\n    upload();\n    gl.generateMipmap(gl.TEXTURE_2D);\n    texParams(gl, gl.TEXTURE_2D, gl.LINEAR, gl.LINEAR_MIPMAP_LINEAR);\n    gl.useProgram(e.upload.prog);\n    gl.uniform1i(e.upload.u.u_src, 0);\n    gl.uniform1i(e.upload.u.u_rot, 0);\n    gl.uniform1i(e.upload.u.u_mode, 0);\n    e.target(this.plateY, 0, e.w, e.h);\n    drawQuad(gl);\n    gl.uniform1i(e.upload.u.u_mode, 1);\n    e.target(this.plateC, 0, e.w / 2, e.h / 2);\n    drawQuad(gl);\n    gl.bindFramebuffer(gl.FRAMEBUFFER, null);\n    this.hasPlate = true;\n    this.version++;\n    return true;\n  }\n\n  // A frame converted as the store does it (into a staging layer), read back: { Y, C } bytes.\n  grabYuv(frame) {\n    const gl = this.gl;\n    const e = this.e;\n    const st = e.slit;\n    e.putYuv(frame, st.stY, st.stC, 0);\n    const read = (tex, w, h, ch) => {\n      e.target(tex, 0, w, h);\n      const px = new Uint8Array(w * h * 4);\n      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);\n      const out = new Uint8Array(w * h * ch);\n      for (let i = 0; i < w * h; i++) for (let c = 0; c < ch; c++) out[i * ch + c] = px[i * 4 + c];\n      return out;\n    };\n    const Y = read(st.stY, e.w, e.h, 1), C = read(st.stC, e.w / 2, e.h / 2, 2);\n    gl.bindFramebuffer(gl.FRAMEBUFFER, null);\n    return { cmd: 'yuv', Y, C };\n  }\n\n  // The clean plate from Y and CbCr bytes (the median of grabYuv frames).\n  setPlateYuv(Y, C) {\n    const gl = this.gl;\n    c index in each store layer\\nuniform int u_n;\\n\\nvec3 storeRgb(vec2 uv, float layer) {\\n  float y = texture(u_storeY, vec3(uv, layer)).r;\\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\\n}\\n\\n// The layer of frame k, or -1 when frame k is not in the store (or k < 0).\\nint layerOf(int k) {\\n  if (k < 0 || u_n < 1) return -1;\\n  int l = k % u_n;\\n  return texelFetch(u_layers, ivec2(l, 0), 0).r == k ? l : -1;\\n}\\n\\n// The colour of frame k at uv, and a = 1 when frame k is in the store (else black, a = 0).\\nvec4 frameAt(int k, vec2 uv) {\\n  int l = layerOf(k);\\n  return l < 0 ? vec4(0.0) : vec4(storeRgb(uv, float(l)), 1.0);\\n}\\n\\n// The luma of frame k at uv (0 when not in the store).\\nfloat lumaAt(int k, vec2 uv) {\\n  int l = layerOf(k);\\n  return l < 0 ? 0.0 : texture(u_storeY, vec3(uv, float(l))).r;\\n}\\n\";\nconst SHOW_FRAG = \"// Preview of one stored frame (Original view; the debug delay view of phase 3). u_layer < 0: black\\n// (the frame is not in the store, or it is before frame 0: \\\"not online\\\", D8).\\nuniform float u_layer;\\nuniform bool u_noFlip; // into a texture (first row at the top), not the canvas\\nin vec2 v_uv;\\nout vec4 o;\\n\\nvoid main() {\\n  vec2 uv = u_noFlip ? v_uv : vec2(v_uv.x, 1.0 - v_uv.y); // the canvas has its first row at the bottom\\n  o = u_layer < 0.0 ? vec4(0.0, 0.0, 0.0, 1.0) : vec4(storeRgb(uv, u_layer), 1.0);\\n}\\n\";\nconst TIMEMAP_FRAG = \"// Mode 1, Time Map (plan §7.1). For each pixel: d = map value × Max delay (frames, after the delay\\n// steps), src = t − d. src < 0: black (not online, D8). Frame blend: mix the two frames around src;\\n// else the frame t − round(d). Each frame comes from the store at the same pixel. A frame that is not\\n// in the store is black. u_view: 0 = result, 1 = original (frame t), 2 = the map.\\nuniform highp sampler2D u_map;\\nuniform int u_t;\\nuniform float u_max;\\nuniform int u_steps;\\nuniform bool u_blend;\\nuniform int u_view;\\nuniform int u_comp;     // effect composite: 0 replace, 1 blend\\nuniform vec2 u_shift;   // spatial offset at v = 1 (uv units)\\nin vec2 v_uv;\\nout vec4 o;\\n\\nvoid main() {\\n  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y); // the canvas has its first row at the bottom\\n  vec3 base = frameAt(u_t, uv).rgb;\\n  if (u_view == 1) { o = vec4(base, 1.0); return; }\\n  float v = texture(u_map, uv).r;\\n  if (u_view == 2) { o = vec4(v, v, v, 1.0); return; }\\n  if (u_steps > 1) v = min(floor(v * float(u_steps)), float(u_steps - 1)) / float(u_steps - 1);\\n  float d = v * u_max;\\n  float src = float(u_t) - d;\\n  // Not online (D8): black with Replace; transparent (the base shows) with Blend (§10.1).\\n  if (src < -1e-3) { o = vec4(subjectOver(u_comp == 0 ? vec3(0.0) : base, base, uv), 1.0); return; } // the epsilon: float error of v × Max\\n  src = max(src, 0.0);\\n  vec2 suv = uv + v * u_shift; // spatial offset: the delayed pixel also moves\\n  vec3 c;\\n  if (u_blend) {\\n    float k0 = floor(src);\\n    float f = src - k0;\\n    c = frameAt(int(k0), suv).rgb;\\n    if (f > 0.0) c = mix(c, frameAt(int(k0) + 1, suv).rgb, f);\\n  } else {\\n    c = frameAt(u_t - int(floor(d + 0.5)), suv).rgb;\\n  }\\n  c = ageLook(c, d);\\n  o = vec4(subjectOver(u_comp == 0 ? c : composite(base, c, u_opacity * decayAlpha(d)), base, uv), 1.0);\\n}\\n\";\nconst COMPOSITE_GLSL = \"// Compositor (plan §10). The effect layer goes on the base with a blend mode (W3C Compositing and\\n// Blending Level 1 formulas; Add, Subtract, Divide as in common editors) and an alpha:\\n//   result = (1 − αs) · Cb + αs · B(Cb, Cs)      (the base is opaque)\\n// Linear blend: the colours go to linear light (sRGB curve) for the blend and back.\\nuniform int u_blendMode;\\nuniform bool u_linear;\\n\\nvec3 toLinear(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }\\nvec3 toSrgb(vec3 c) { return mix(c * 12.92, 1.055 * pow(max(c, 0.0), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }\\n\\nfloat bDodge(float b, float s) { return b == 0.0 ? 0.0 : s >= 1.0 ? 1.0 : min(1.0, b / (1.0 - s)); }\\nfloat bBurn(float b, float s) { return b >= 1.0 ? 1.0 : s == 0.0 ? 0.0 : 1.0 - min(1.0, (1.0 - b) / s); }\\nfloat bHard(float b, float s) { return s <= 0.5 ? b * 2.0 * s : b + (2.0 * s - 1.0) - b * (2.0 * s - 1.0); }\\nfloat bSoft(float b, float s) {\\n  if (s <= 0.5) return b - (1.0 - 2.0 * s) * b * (1.0 - b);\\n  float d = b <= 0.25 ? ((16.0 * b - 12.0) * b + 4.0) * b : sqrt(b);\\n  return b + (2.0 * s - 1.0) * (d - b);\\n}\\nfloat bDivide(float b, float s) { return s == 0.0 ? (b == 0.0 ? 0.0 : 1.0) : min(1.0, b / s); }\\n\\nfloat lum(vec3 c) { return dot(c, vec3(0.3, 0.59, 0.11)); }\\nvec3 clipColor(vec3 c) {\\n  float l = lum(c), n = min(min(c.r, c.g), c.b), x = max(max(c.r, c.g), c.b);\\n  if (n < 0.0) c = l + (c - l) * l / (l - n);\\n  if (x > 1.0) c = l + (c - l) * (1.0 - l) / (x - l);\\n  return c;\\n}\\nvec3 setLum(vec3 c, float l) { return clipColor(c + (l - lum(c))); }\\nfloat sat(vec3 c) { return max(max(c.r, c.g), c.b) - min(min(c.r, c.g), c.b); }\\nvec3 setSat(vec3 c, float s) {\\n  float mx = max(max(c.r, c.g), c.b), mn = min(min(c.r, c.g), c.b);\\n  if (mx <= mn) return vec3(0.0);\\n  return (c - mn) * s / (mx - mn); // max -> s, min -> 0, mid scaled (the W3C SetSat)\\n}\\n\\nvec3 blendColor(vec3 b, vec3 s, int m) {\\n  if (m == 0) return s;\\n  if (m == 1) return min(b + s, 1.0);\\n  if (m == 2) return b + s - b * s;\\n  if (m == 3) return max(b, s);\\n  if (m == 4) return vec3(bDodge(b.r, s.r), bDodge(b.g, s.g), bDodge(b.b, s.b));\\n  if (m == 5) return vec3(bHard(s.r, b.r), bHard(s.g, b.g), bHard(s.b, b.b)); // overlay = hard light, swapped\\n  if (m == 6) return vec3(bSoft(b.r, s.r), bSoft(b.g, s.g), bSoft(b.b, s.b));\\n  if (m == 7) return vec3(bHard(b.r, s.r), bHard(b.g, s.g), bHard(b.b, s.b));\\n  if (m == 8) return b * s;\\n  if (m == 9) return min (u_decayCurve, ivec2(int(i), 0), 0).r, texelFetch(u_decayCurve, ivec2(int(i) + 1, 0), 0).r, x - i);\\n  }\\n  return 1.0;\\n}\\n\\n// Age tint (a ramp of 2 to 4 colours, multiplied, by amount) and age brightness.\\nvec3 ageLook(vec3 c, float age) {\\n  float u = clamp(age / max(u_maxAge, 1e-3), 0.0, 1.0);\\n  if (u_tintOn) {\\n    float x = u * float(u_tintN - 1);\\n    int i = min(int(floor(x)), u_tintN - 2);\\n    vec3 t = mix(u_tint[i], u_tint[i + 1], x - float(i));\\n    c = mix(c, c * t, u_tintAmount);\\n  }\\n  return clamp(c * mix(1.0, u_ageBright, u), 0.0, 1.0);\\n}\\n\";\nconst COMPTEST_FRAG = \"// Tests (plan §13.2): the compositor on given colours. u_b: base, u_s: effect (alpha in .a).\\nuniform highp sampler2D u_b;\\nuniform highp sampler2D u_s;\\nin vec2 v_uv;\\nout vec4 o;\\n\\nvoid main() {\\n  ivec2 p = ivec2(gl_FragCoord.xy);\\n  vec4 s = texelFetch(u_s, p, 0);\\n  o = vec4(composite(texelFetch(u_b, p, 0).rgb, s.rgb, s.a), 1.0);\\n}\\n\";\nconst SUBJECT_GLSL = \"// The subject layer (plan §9.4, §10.4): the current frame × the subject mask, on top of the result,\\n// with its own blend mode and opacity, an optional outline, and spill suppression (chroma key).\\nuniform bool u_subOn;\\nuniform highp sampler2D u_subMask;\\nuniform highp sampler2D u_outline;  // the subject mask, dilated by the outline width\\nuniform bool u_outlineOn;\\nuniform vec3 u_outlineColor;\\nuniform float u_subOpacity;\\nuniform int u_subBlend;\\nuniform float u_spill;\\nuniform vec3 u_keyRgb;\\n\\nvec3 despill(vec3 c) {\\n  vec3 k = u_keyRgb - dot(u_keyRgb, vec3(0.2126, 0.7152, 0.0722));\\n  float n = length(k);\\n  if (n < 1e-3 || u_spill <= 0.0) return c;\\n  k /= n;\\n  float a = max(0.0, dot(c - dot(c, vec3(0.2126, 0.7152, 0.0722)), k));\\n  return clamp(c - k * a * u_spill, 0.0, 1.0);\\n}\\n\\nvec3 subjectOver(vec3 result, vec3 subj, vec2 uv) {\\n  if (!u_subOn) return result;\\n  float m = texture(u_subMask, uv).r;\\n  vec3 r = compositeWith(result, despill(subj), m * u_subOpacity, u_subBlend, u_linear);\\n  if (u_outlineOn) r = mix(r, u_outlineColor, clamp(texture(u_outline, uv).r - m, 0.0, 1.0));\\n  return r;\\n}\\n\";\nconst HEAD = '#version 300 es\\nprecision highp float;\\nprecision highp int;\\n';\nconst VIEWS = { result: 0, original: 1, map: 2 };\n\nclass Engine {\n  constructor(canvas) {\n    this.canvas = canvas;\n    const gl = (this.gl = createContext(canvas));\n    this.caps = {\n      maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),\n      maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),\n      floatTargets: !!gl.getExtension('EXT_color_buffer_float'),\n    };\n    this.upload = program(gl, QUAD_VERT, UPLOAD_FRAG);\n    this.show = program(gl, QUAD_VERT, `#version 300 es\\nprecision highp float;\\n${STORE_GLSL}\\n${SHOW_FRAG}`);\n    this.timemap = program(gl, QUAD_VERT, `${HEAD}${STORE_GLSL}\\n${COMPOSITE_GLSL}\\n${SUBJECT_GLSL}\\n${AGE_GLSL}\\n${TIMEMAP_FRAG}`);\n    this.comptest = null; // made on the first test call\n    this.decayTex = gl.createTexture();\n    this.decayKey = '';\n    this.mapgen = new MapGen(this);\n    this.slit = new Slit(this);\n    this.mask = new Mask(this);\n    this.edge = new Edge(this);\n    this.mapTex = null;\n    this.mapKey = '';\n    this.layersTex = null;\n    this.settings = null;\n    this.vao = gl.createVertexArray();\n    gl.bindVertexArray(this.vao);\n    this.src = null; // the frames of the store (immutable storage, made for each frame size)\n    this.srcKey = '';\n    this.src2 = gl.createTexture(); // other pictures (clean plate, mask and map videos): any size\n    this.fb = gl.createFramebuffer();\n    this.storeY = this.storeC = null;\n    this.n = 0;\n    this.layerFrame = null; // the frame index in each layer, -1 = empty\n    this.last = { index: -1, delay: undefined };\n    this.lost = false;\n    this.depthCap = Infinity; // perfect loop: the loop length − 1\n    canvas.addEventListener('webglcontextlost', (e) => {\n      e.preventDefault();\n      this.
