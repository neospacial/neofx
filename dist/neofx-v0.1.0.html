<!-- neofx v0.1.0 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<title>neofx</title>
<style>
:root{
  --bg:#111214;
  --panel:#1a1b1e;
  --line:#2a2c30;
  --text:#e6e6e6;
  --dim:#8b8d92;
  --accent:#eee100;
  --warn:#f5a524;
  --top:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:6px;
  min-height:32px;padding:0 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#app{display:grid;grid-template-rows:var(--top) 1fr auto;grid-template-columns:minmax(0,1fr);height:100%}
#topBar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#logo{font-weight:700;letter-spacing:.02em;margin-right:8px}
.spacer{flex:1}
#status{min-width:0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#exportBtn{background:var(--accent);color:#000}
#stage{display:grid;grid-template-columns:1fr 340px;min-height:0}
#preview{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:#000}
#inspector{border-left:1px solid var(--line);background:var(--panel);overflow:auto}
#transport{min-height:48px;border-top:1px solid var(--line);background:var(--panel)}
#startScreen{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;max-width:520px;width:100%}
#dropArea{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:40px 16px;
  border:2px dashed var(--line);border-radius:12px;cursor:pointer;text-align:center}
#dropArea span{color:var(--dim)}
body.drag #dropArea{border-color:var(--accent)}
#modeInfo{display:grid;gap:8px;color:var(--dim)}
#modeInfo b{color:var(--text)}
#message{position:absolute;inset:auto 16px 16px;padding:12px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--warn)}
body:not([data-state="start"]) #startScreen{display:none}
@media (max-width:999px){
  #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(200px,1fr) auto}
  #inspector{border-left:0;border-top:1px solid var(--line);max-height:45vh}
  button{min-height:44px}
}
#view{display:block;image-rendering:auto}
#transport{display:grid;gap:6px;padding:6px 12px 10px}
#transport .controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#transport .controls button{min-width:40px}
#transport .controls button.on{background:var(--accent);color:#000}
#transport .time,#transport .frame{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
#transport .frame{min-width:64px}
#transport .res{color:var(--dim);font-size:12px}
#transport select{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:6px;min-height:32px}
#transport .strip{display:block;width:100%;height:44px;border-radius:4px;touch-action:none;cursor:pointer}
body[data-state="start"] #transport .controls,body[data-state="start"] #transport .strip{opacity:.4;pointer-events:none}
#status.warn{color:var(--warn)}
#progress{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0}
#viewBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:2;
  background:rgba(0,0,0,.55);border-radius:8px;padding:2px}
#viewBar button{min-height:28px;padding:0 10px;font-size:12px;background:transparent}
#viewBar button.on{background:var(--line);color:var(--accent)}
body[data-state="start"] #viewBar{display:none}
.section{border-bottom:1px solid var(--line)}
.section summary{padding:10px 12px;font-weight:600;cursor:pointer;user-select:none;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--dim)}
.setting{display:grid;grid-template-columns:96px 1fr 64px 14px;align-items:center;gap:8px;padding:4px 12px}
.setting label{font-size:12px;color:var(--dim);cursor:default;user-select:none}
.setting.default label{color:var(--text)}
.setting input[type=range]{width:100%;accent-color:var(--accent);
  background:linear-gradient(to right,transparent calc(var(--def,-10%) - 1px),var(--dim) 0,var(--dim) calc(var(--def,-10%) + 1px),transparent 0) no-repeat 0 100%/100% 3px}
.setting input[type=number]{width:100%;font:inherit;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 4px}
.setting .unit{font-size:11px;color:var(--dim)}
.setting.seg{grid-template-columns:96px 1fr}
.setting.seg:not(:has(label)){grid-template-columns:1fr}
.segs{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:2px}
.segs button{flex:1;min-height:28px;font-size:12px;background:transparent;padding:0 6px}
.segs button.on{background:var(--line);color:var(--accent)}
@media (max-width:999px){.setting input[type=range]{min-height:32px}.segs button{min-height:40px}}
.mapGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;padding:4px 12px 8px}
.mapTile{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px;min-height:0;background:var(--bg);border:1px solid transparent;border-radius:6px}
.mapTile canvas{width:100%;aspect-ratio:72/40;border-radius:3px;background:#000}
.mapTile span{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapTile.on{border-color:var(--accent)}
.mapTile.on span{color:var(--text)}
.mapTile:disabled{opacity:.35}
.fileRow{grid-template-columns:auto 1fr}
.fileName{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{margin:2px 12px 8px;font-size:11px;color:var(--dim)}
.setting.select,.setting.colors{grid-template-columns:96px 1fr}
.setting select{font:inherit;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;min-height:28px}
.colorList{display:flex;gap:4px;align-items:center}
.colorList input{width:32px;height:28px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.colorList button{min-width:28px;min-height:28px;padding:0}
.handles{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:hidden}
.handles .hLine{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4;filter:drop-shadow(0 0 1px #000)}
.handles .hPoint,.handles .hRot{fill:rgba(0,0,0,.5);stroke:var(--accent);stroke-width:2;pointer-events:all;cursor:grab;touch-action:none}
.handles .hRot{fill:var(--accent)}
.handles .hArrow{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 2px #000)}
.handles .hArrowHit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke;cursor:pointer}
.snapBtn{position:absolute;left:8px;top:8px;z-index:2;min-height:28px;font-size:12px;background:rgba(0,0,0,.55)}
.snapBtn.on{background:var(--accent);color:#000}
@media (pointer:coarse){.handles .hPoint{r:16}.handles .hRot{r:14}}
.brushCursor{position:absolute;z-index:3;border:1.5px solid #fff;border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #000}
.toolRow{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px}
.toolRow button{min-height:28px;font-size:12px;padding:0 8px}
.toolRow button.on{background:var(--accent);color:#000}
.subhead{padding:8px 12px 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.setting.color{grid-template-columns:96px auto 1fr}
.setting.color input[type=color]{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
#benchDialog textarea{width:100%;font:12px ui-monospace,monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px}
#benchDialog,#exportDialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;width:min(440px,calc(100vw - 32px))}
#exportDialog::backdrop{background:rgba(0,0,0,.6)}
.exportForm{display:grid;gap:8px;padding:16px}
.exportForm h2{margin:0 0 4px;font-size:16px}
.exportRow{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.exportRow select,.exportRow input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:32px;padding:0 6px;min-width:0}
.exportWarn{color:var(--warn);font-size:12px;margin:0;min-height:0}
.exportWarn:empty{display:none}
.exportProgress .track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.exportProgress .bar{height:100%;width:0;background:var(--accent)}
.exportProgress.busy .bar{width:30% !important;animation:slide 1.1s ease-in-out infinite}
.exportText{font-size:12px;color:var(--dim);margin:6px 0 0}
.exportButtons{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.exportButtons .primary,.exportButtons a.button{background:var(--accent);color:#000}
a.button{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:6px;text-decoration:none;font-size:14px}

/* ---- Phase 11: layout (plan §12.2, §12.3) ---- */
#topBar{position:relative}
#stage{grid-template-columns:minmax(0,1fr) 5px var(--inspector-w,340px)}
#sizer{cursor:col-resize;background:var(--line);touch-action:none}
#sizer:hover,#sizer.drag{background:var(--accent)}
#inspectorBox{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
#inspector{flex:1;min-height:0;overflow:auto;border:0}
#sheetHandle{display:none}
.tabBar{display:none}
.narrow{display:none}
#topBar button.wide{min-width:36px}
#menu{position:absolute;right:8px;top:calc(var(--top) - 2px);z-index:20;display:grid;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:160px}
#menu button{background:transparent;text-align:left;min-height:44px}
#menu[hidden]{display:none}
.vsep{width:1px;background:var(--line);margin:4px 2px}
#viewBar button[data-zoom].on{color:var(--accent)}
#preview{touch-action:none}
#view{position:absolute;transform-origin:0 0}
#view[hidden]{display:none}
#splitLine{position:absolute;top:0;bottom:0;width:24px;margin-left:-12px;z-index:2;cursor:ew-resize;touch-action:none}
#splitLine span{position:absolute;left:11px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 2px #000}
.secTools{float:right;display:inline-flex;gap:2px;margin-top:-4px}
.secTools button{min-height:24px;min-width:28px;padding:0 4px;background:transparent;font-size:13px;line-height:1}
.secTools button.lock.on{background:var(--line)}
.randomBar .seed{font-size:11px;color:var(--dim);align-self:center}
.setting.curve{grid-template-columns:1fr;gap:4px}
.curveCanvas{width:100%;max-width:320px;aspect-ratio:220/120;background:var(--bg);border-radius:6px;touch-action:none;cursor:crosshair}
.curvePresets button{font-size:11px}
#modeInfo{grid-template-columns:1fr 1fr;gap:12px}
#modeInfo figure{margin:0;display:grid;gap:6px}
#modeInfo canvas{width:100%;border-radius:6px;background:#000;image-rendering:pixelated}
#modeInfo figcaption{font-size:12px}
/* The Presets section: Randomize all, Reset, the looks, Save and Load. */
.presetActions{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.presetActions .primary{background:var(--accent);color:#000}
.presetGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:0 0 8px}
.presetFiles{display:flex;gap:6px;padding:0 0 4px}
.presetCard{display:grid;gap:4px;padding:6px;background:var(--bg);border:1px solid transparent;border-radius:8px;text-align:left;min-height:0}
.presetCard canvas{width:100%;aspect-ratio:16/9;border-radius:4px;background:#000}
.presetCard span{font-size:12px;line-height:1.2}
.presetCard:hover{border-color:var(--accent)}

@media (max-width:999px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(140px,1fr) auto var(--sheet-h,42vh);
    grid-template-areas:"top" "preview" "transport" "sheet"}
  #stage{display:contents}
  #topBar{grid-area:top}
  #inspector{max-height:none;border-top:0}
  #preview{grid-area:preview}
  #transport{grid-area:transport}
  #inspectorBox{grid-area:sheet;border-top:1px solid var(--line)}
  #sizer{display:none}
  .wide{display:none !important}
  .narrow{display:inline-flex}
  #status{display:none}
  #sheetHandle{display:block;flex:none;height:22px;cursor:ns-resize;touch-action:none}
  #sheetHandle span{display:block;width:44px;height:4px;border-radius:2px;background:var(--dim);margin:9px auto}
  .tabBar{display:flex;gap:4px;overflow-x:auto;padding:4px 8px 6px;position:sticky;top:0;background:var(--panel);z-index:2;scrollbar-width:none}
  .tabBar button{flex:none;min-height:44px;padding:0 14px}
  .tabBar button.on{background:var(--accent);color:#000}
  #inspector details[data-tab]{display:none}
  #inspector[data-tab="presets"] details[data-tab="presets"],#inspector[data-tab="mode"] details[data-tab="mode"],#inspector[data-tab="map"] details[data-tab="map"],
  #inspector[data-tab="time"] details[data-tab="time"],#inspector[data-tab="cutout"] details[data-tab="cutout"],
  #inspector[data-tab="mix"] details[data-tab="mix"],#inspector[data-tab="look"] details[data-tab="look"]{display:block}
  button,select,#transport .controls button{min-height:44px}
  .secTools button{min-height:36px;min-width:36px}
  .setting{grid-template-columns:88px 1fr 60px 12px}
  #modeInfo{grid-template-columns:1fr}
}
@media (max-width:999px){
  /* The start screen: all of the area (no transport, no settings before a file is open). */
  body[data-state="start"] #app{grid-template-rows:var(--top) minmax(0,1fr);grid-template-areas:"top" "preview"}
  body[data-state="start"] #transport,body[data-state="start"] #inspectorBox{display:none}
  body[data-state="start"] #preview{overflow:auto;align-items:flex-start}
}
@media (max-width:999px) and (min-width:700px) and (orientation:landscape){
  #app{grid-template-columns:minmax(0,1fr) min(360px,42vw);grid-template-rows:var(--top) minmax(0,1fr) auto;
    grid-template-areas:"top top" "preview sheet" "transport sheet"}
  #inspectorBox{border-top:0;border-left:1px solid var(--line)}
  #sheetHandle{display:none}
}

/* The loading indicator (a file opens). */
#loading{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(0,0,0,.72);color:var(--text);font-size:14px;text-align:center;padding:16px}
#loading[hidden]{display:none}
#loading p{margin:0;max-width:min(420px,90%);overflow-wrap:anywhere}
#loading button[hidden]{display:none}
#loading .spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
#loading .loadBar{width:min(240px,70%);height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#loading .loadBar span{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){#loading .spinner,#loading .loadBar span,.exportProgress.busy .bar{animation:none}}

/* The transport icons (SVG: the media symbols are emoji on iOS). */
#transport .controls button svg{width:18px;height:18px;fill:currentColor;display:block;margin:auto;pointer-events:none}
</style>
</head>
<body data-state="start">
<div id="app">
  <header id="topBar">
    <span id="logo">neofx</span>
    <button id="openBtn" type="button">Open</button>
    <button id="presetsBtn" class="wide" type="button">Presets</button>
    <button id="undoBtn" class="wide" type="button" disabled aria-label="Undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="redoBtn" class="wide" type="button" disabled aria-label="Redo" title="Redo (Shift+Ctrl+Z)">↷</button>
    <span class="spacer"></span>
    <span id="status" aria-live="polite"></span>
    <button id="menuBtn" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">⋯</button>
    <button id="exportBtn" type="button" disabled>Export</button>
    <div id="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-act="presets" class="narrow">Presets</button>
      <button type="button" role="menuitem" data-act="undo" class="narrow">Undo</button>
      <button type="button" role="menuitem" data-act="redo" class="narrow">Redo</button>
      <button type="button" role="menuitem" data-act="bench">Performance test…</button>
    </div>
  </header>

  <main id="stage">
    <section id="preview" aria-label="Preview">
      <div id="startScreen">
        <label id="dropArea" for="fileInput">
          <strong>Open a video (MP4 or MOV)</strong>
          <span>Drop a file here, or touch to select one.</span>
        </label>
        <div id="modeInfo">
          <figure><canvas id="demoTime" width="160" height="90" aria-label="Time Map example"></canvas>
            <figcaption><b>Time Map</b> — a greyscale map gives each pixel a delay in frames.</figcaption></figure>
          <figure><canvas id="demoSlit" width="160" height="90" aria-label="Slit Scan example"></canvas>
            <figcaption><b>Slit Scan</b> — a 1 px line repeats in one direction, and gets older with distance.</figcaption></figure>
        </div>
      </div>
      <div id="viewBar" role="tablist" aria-label="View">
        <button type="button" data-view="result" class="on">Result</button>
        <button type="button" data-view="original">Original</button>
        <button type="button" data-view="split">Split</button>
        <button type="button" data-view="mask">Mask</button>
        <button type="button" data-view="map">Map</button>
        <span class="vsep"></span>
        <button type="button" data-zoom="fit" class="on">Fit</button>
        <button type="button" data-zoom="100">100%</button>
      </div>
      <div id="splitLine" hidden><span></span></div>
      <canvas id="view" hidden></canvas>
      <div id="progress" hidden></div>
      <div id="loading" role="status" aria-live="polite" hidden><div class="spinner"></div><p id="loadingText"></p><div class="loadBar"><span></span></div><button type="button" id="loadingCancel" hidden>Cancel</button></div>
      <div id="message" hidden></div>
    </section>
    <div id="sizer" aria-hidden="true"></div>
    <aside id="inspectorBox"><div id="sheetHandle" aria-hidden="true"><span></span></div><div id="inspector" aria-label="Inspector"></div></aside>
  </main>

  <footer id="transport">
    <div class="controls">
      <button type="button" data-act="first" aria-label="Go to start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2.5v14H4zM13 5v14L6.5 12zM20.5 5v14L14 12z"/></svg></button>
      <button type="button" data-act="prev" aria-label="Previous frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5v14L6 12zM17 5h2.5v14H17z"/></svg></button>
      <button type="button" data-act="play" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z"/></svg></button>
      <button type="button" data-act="next" aria-label="Next frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5H7v14H4.5zM8.5 5v14L18 12z"/></svg></button>
      <button type="button" data-act="last" aria-label="Go to end"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5v14l6.5-7zM11 5v14l6.5-7zM17.5 5H20v14h-2.5z"/></svg></button>
      <span class="time">00:00.00 / 00:00.00</span>
      <span class="frame">f –</span>
      <span class="spacer"></span>
      <button type="button" data-act="loop" aria-label="Loop">Loop</button>
      <label class="res">Preview <select id="resSelect">
        <option value="360">360p</option><option value="540" selected>540p</option><option value="720">720p</option><option value="1080">1080p</option><option value="0">Source</option>
      </select></label>
    </div>
    <canvas class="strip" aria-label="Timeline"></canvas>
  </footer>
  <dialog id="exportDialog" aria-label="Export"></dialog>
  <dialog id="benchDialog" aria-label="Performance test">
    <form method="dialog" class="exportForm">
      <h2>Performance test</h2>
      <p class="note">Plays the open video for a few seconds in each mode at 540p, exports up to 150 frames at 1080p (not saved), and reads the frame buffer limit. Keep this tab in front while it runs.</p>
      <p id="benchStep" class="exportText"></p>
      <textarea id="benchOut" rows="9" readonly hidden></textarea>
      <div class="exportButtons">
        <button type="button" id="benchClose">Close</button>
        <button type="button" id="benchCopy" hidden>Copy</button>
        <button type="button" id="benchRun" class="primary">Run</button>
      </div>
    </form>
  </dialog>
  <input id="presetFileInput" type="file" accept=".json,application/json" hidden>
  <input id="mapFileInput" type="file" hidden>
  <input id="plateFileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <input id="maskFileInput" type="file" accept="video/*" multiple hidden>
  <input id="fileInput" type="file" accept="video/*" multiple hidden>
</div>
<script>
'use strict';
// ---- io/demux.js
const { demuxMp4, turnedCrop } = (() => {
// MP4 / MOV reader (plan §3, §6.1). From neomosh src/mux/demux.js, with the audio track added.
// It gives the video decoder configuration and each sample (offset, size, display time, sync flag),
// so a VideoDecoder can decode every frame of the file, and the audio track for the pass-through
// copy into the export (D16). Not fragmented. It returns null for other files.

const MAX_MOOV = 64 * 1048576;

const str4 = (b, o) => String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
const hex2 = (v) => v.toString(16).padStart(2, '0');

// The boxes in b[from..to): [{ type, head (box start), start (content), end }].
function boxes(b, from, to) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const out = [];
  let o = from;
  while (o + 8 <= to) {
    let size = dv.getUint32(o);
    const type = str4(b, o + 4);
    let head = 8;
    if (size === 1) {
      size = Number(dv.getBigUint64(o + 8));
      head = 16;
    } else if (size === 0) size = to - o;
    if (size < head || o + size > to) break;
    out.push({ type, head: o, start: o + head, end: o + size });
    o += size;
  }
  return out;
}

const child = (b, box, type) => boxes(b, box.start, box.end).find((x) => x.type === type);
const path = (b, box, ...types) => types.reduce((x, t) => (x ? child(b, x, t) : null), box);

// The top-level boxes of the file, read from their headers only.
async function topBoxes(blob) {
  const out = [];
  let o = 0;
  while (o + 8 <= blob.size) {
    const h = new Uint8Array(await blob.slice(o, Math.min(blob.size, o + 16)).arrayBuffer());
    const dv = new DataView(h.buffer);
    let size = dv.getUint32(0);
    let head = 8;
    if (size === 1 && h.length >= 16) {
      size = Number(dv.getBigUint64(8));
      head = 16;
    } else if (size === 0) size = blob.size - o;
    if (size < head) break;
    out.push({ type: str4(h, 4), start: o + head, end: Math.min(blob.size, o + size) });
    o += size;
  }
  return out;
}

// The codec string and the description for the VideoDecoder, from the sample entry.
function videoCodecOf(b, entry) {
  const t = entry.type;
  const kids = boxes(b, entry.start + 78, entry.end); // after the VisualSampleEntry fields
  const k = (type) => kids.find((x) => x.type === type);
  if (t === 'avc1' || t === 'avc3') {
    const c = k('avcC');
    if (!c) return null;
    const d = b.slice(c.start, c.end);
    return { codec: `avc1.${hex2(d[1])}${hex2(d[2])}${hex2(d[3])}`, description: d };
  }
  if (t === 'hvc1' || t === 'hev1') {
    const c = k('hvcC');
    if (!c) return null;
    const d = b.slice(c.start, c.end);
    const space = ['', 'A', 'B', 'C'][d[1] >> 6];
    const tier = (d[1] >> 5) & 1 ? 'H' : 'L';
    let compat = ((d[2] << 24) | (d[3] << 16) | (d[4] << 8) | d[5]) >>> 0;
    let rev = 0;
    for (let i = 0; i < 32; i++, compat >>>= 1) rev = ((rev << 1) | (compat & 1)) >>> 0;
    const cons = Array.from(d.subarray(6, 12));
    while (cons.length && cons[cons.length - 1] === 0) cons.pop();
    const parts = [`${t}.${space}${d[1] & 31}`, rev.toString(16), `${tier}${d[12]}`, ...cons.map((x) => x.toString(16).toUpperCase())];
    return { codec: parts.join('.'), description: d };
  }
  if (t === 'vp09') {
    const c = k('vpcC');
    if (!c) return null;
    const d = b.subarray(c.start + 4, c.end); // after version and flags
    return { codec: `vp09.${String(d[0]).padStart(2, '0')}.${String(d[1]).padStart(2, '0')}.${String(d[2] >> 4).padStart(2, '0')}`, description: null };
  }
  if (t === 'av01') {
    const c = k('av1C');
    if (!c) return null;
    const d = b.slice(c.start, c.end);
    const profile = d[1] >> 5, level = d[1] & 31, tier = d[2] >> 7 ? 'H' : 'M';
    const depth = (d[2] >> 6) & 1 ? ((d[2] >> 5) & 1 ? 12 : 10) : 8;
    return { codec: `av01.${profile}.${String(level).padStart(2, '0')}${tier}.${String(depth).padStart(2, '0')}`, description: d };
  }
  return null;
}

// MPEG-4 descriptor (ISO/IEC 14496-1): tag, size (1-4 bytes of 7 bits), content start.
function descriptor(b, o, end) {
  if (o + 2 > end) return null;
  const tag = b[o++];
  let size = 0;
  for (let i = 0; i < 4 && o < end; i++) {
    const v = b[o++];
    size = (size << 7) | (v & 127);
    if (!(v & 128)) break;
  }
  return { tag, start: o, end: Math.min(end, o + size) };
}

// esds -> { oti (objectTypeIndication), asc (AudioSpecificConfig bytes or null) }.
function parseEsds(b, esds) {
  const es = descriptor(b, esds.start + 4, esds.end); // after version and flags
  if (!es || es.tag !== 3) return null;
  const flags = b[es.start + 2];
  let o = es.start + 3;
  if (flags & 0x80) o += 2; // dependsOn_ES_ID
  if (flags & 0x40) o += 1 + b[o]; // URL
  if (flags & 0x20) o += 2; // OCR_ES_Id
  const dc = descriptor(b, o, es.end);
  if (!dc || dc.tag !== 4) return null;
  const oti = b[dc.start];
  const dsi = descriptor(b, dc.start + 13, dc.end);
  return { oti, asc: dsi && dsi.tag === 5 ? b.slice(dsi.start, dsi.end) : null };
}

// The audio sample entry: { type, codec, channels, sampleSize, sampleRate, config, description }.
// config: the raw codec box (esds or dOps, with its header), for the muxer to copy (plan §3).
function audioCodecOf(b, entry) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const t = entry.type;
  const version = dv.getUint16(entry.start + 8); // QuickTime sound description version (MOV)
  const channels = dv.getUint16(entry.start + 16);
  const sampleSize = dv.getUint16(entry.start + 18);
  let sampleRate = dv.getUint32(entry.start + 24) >>> 16;
  let kidsFrom = entry.start + 28;
  if (version === 1) kidsFrom += 16;
  else if (version === 2) {
    kidsFrom += 36;
    sampleRate = Math.round(dv.getFloat64(entry.start + 32));
  }
  let kids = boxes(b, kidsFrom, entry.end);
  const wave = kids.find((x) => x.type === 'wave'); // MOV: the codec box can be in a 'wave' box
  if (wave) kids = kids.concat(boxes(b, wave.start, wave.end));
  const k = (type) => kids.find((x) => x.type === type);
  if (t === 'mp4a') {
    const esds = k('esds');
    if (!esds) return null;
    const e = parseEsds(b, esds);
    if (!e) return null;
    let codec = `mp4a.${hex2(e.oti)}`;
    if (e.oti === 0x40 && e.asc && e.asc.length) {
      let aot = e.asc[0] >> 3;
      if (aot === 31 && e.asc.length > 1) aot = 32 + (((e.asc[0] & 7) << 3) | (e.asc[1] >> 5));
      codec += `.${aot}`;
    }
    return { type: t, codec, channels, sampleSize, sampleRate, config: b.slice(esds.head, esds.end), description: e.asc };
  }
  if (t === 'Opus') {
    const dops = k('dOps');
    if (!dops) return null;
    return { type: t, codec: 'opus', channels, sampleSize, sampleRate: 48000, config: b.slice(dops.head, dops.end), description: null };
  }
  return null;
}

// tkhd matrix -> 0, 90, 180, or 270 (clockwise, the way a player turns the picture).
function rotationOf(b, tkhd) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const m = tkhd.start + (b[tkhd.start] === 1 ? 52 : 40);
  const a = dv.getInt32(m), bb = dv.getInt32(m + 4);
  if (a === 0 && bb > 0) return 90;
  if (a < 0 && bb === 0) return 180;
  if (a === 0 && bb < 0) return 270;
  return 0;
}

// The sample table of a track: { timescale, entry, offsets, sizes, dts, cto, durations, sync, shift }
// or null. shift: the media time where the presentation starts (edit list).
function sampleTable(b, trak) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const mdhd = path(b, trak, 'mdia', 'mdhd');
  const stbl = path(b, trak, 'mdia', 'minf', 'stbl');
  if (!mdhd || !stbl) return null;
  const timescale = dv.getUint32(mdhd.start + (b[mdhd.start] === 1 ? 20 : 12));
  const stsd = child(b, stbl, 'stsd');
  const entry = stsd && boxes(b, stsd.start + 8, stsd.end)[0];
  if (!entry || !timescale) return null;

  // Sample sizes.
  const stsz = child(b, stbl, 'stsz');
  if (!stsz) return null;
  const fixed = dv.getUint32(stsz.start + 4), count = dv.getUint32(stsz.start + 8);
  const sizes = new Array(count);
  for (let i = 0; i < count; i++) sizes[i] = fixed || dv.getUint32(stsz.start + 12 + 4 * i);
  // Chunk offsets and samples per chunk -> sample offsets.
  const stco = child(b, stbl, 'stco'), co64 = child(b, stbl, 'co64'), stsc = child(b, stbl, 'stsc');
  if ((!stco && !co64) || !stsc) return null;
  const co = stco || co64;
  const nChunks = dv.getUint32(co.start + 4);
  const chunkOff = (i) => (stco ? dv.getUint32(co.start + 8 + 4 * i) : Number(dv.getBigUint64(co.start + 8 + 8 * i)));
  const scN = dv.getUint32(stsc.start + 4);
  const offsets = new Array(count);
  let s = 0;
  for (let e = 0; e < scN && s < count; e++) {
    const first = dv.getUint32(stsc.start + 8 + 12 * e) - 1;
    const per = dv.getUint32(stsc.start + 12 + 12 * e);
    const last = e + 1 < scN ? dv.getUint32(stsc.start + 8 + 12 * (e + 1)) - 1 : nChunks;
    for (let c = first; c < last && s < count; c++) {
      let o = chunkOff(c);
      for (let j = 0; j < per && s < count; j++, s++) {
        offsets[s] = o;
        o += sizes[s];
      }
    }
  }
  if (s < count) return null;
  // Decode times and durations, composition offsets, the edit list start.
  const stts = child(b, stbl, 'stts'), ctts = child(b, stbl, 'ctts'), stss = child(b, stbl, 'stss');
  if (!stts) return null;
  const dts = new Array(count);
  const durations = new Array(count);
  let t = 0, k = 0, d = 0;
  for (let e = 0, n = dv.getUint32(stts.start + 4); e < n; e++) {
    const c = dv.getUint32(stts.start + 8 + 8 * e);
    d = dv.getUint32(stts.start + 12 + 8 * e);
    for (let j = 0; j < c && k < count; j++, k++, t += d) {
      dts[k] = t;
      durations[k] = d;
    }
  }
  for (; k < count; k++, t += d) {
    dts[k] = t;
    durations[k] = d;
  }
  const cto = new Array(count).fill(0);
  if (ctts) {
    k = 0;
    for (let e = 0, n = dv.getUint32(ctts.start + 4); e < n; e++) {
      const c = dv.getUint32(ctts.start + 8 + 8 * e), o = dv.getInt32(ctts.start + 12 + 8 * e);
      for (let j = 0; j < c && k < count; j++, k++) cto[k] = o;
    }
  }
  let shift = 0;
  const elst = path(b, trak, 'edts', 'elst');
  if (elst) {
    const v1 = b[elst.start] === 1;
    const n = dv.getUint32(elst.start + 4);
    for (let e = 0; e < n; e++) {
      const o = elst.start + 8 + e * (v1 ? 20 : 12);
      const mt = v1 ? Number(dv.getBigInt64(o + 8)) : dv.getInt32(o + 4);
      if (mt >= 0) {
        shift = mt;
        break;
      }
    }
  }
  const sync = stss ? new Set(Array.from({ length: dv.getUint32(stss.start + 4) }, (_, i) => dv.getUint32(stss.start + 8 + 4 * i) - 1)) : null;
  return { timescale, entry, offsets, sizes, dts, cto, durations, sync, shift, count };
}

const handlerOf = (b, trak) => {
  const hdlr = path(b, trak, 'mdia', 'hdlr');
  return hdlr ? str4(b, hdlr.start + 8) : '';
};

// blob: the file. Returns null, or:
// { codec, description, codedWidth, codedHeight, rotation, timescale, mediaTime, samples, durationUs, audio }
// samples (decode order): [{ offset, size, us (display time, microseconds), key, dts, duration, cto }].
// dts, duration, cto: in timescale units. mediaTime: the edit list start.
// audio: null, or { type, codec, channels, sampleSize, sampleRate, config, description, timescale,
//   mediaTime (edit list start, in timescale units), samples: [{ offset, size, dts, duration, us }],
//   durationUs }. us: the presentation time (dts - mediaTime) in microseconds.
async function demuxMp4(blob) {
  let tops;
  try {
    tops = await topBoxes(blob);
  } catch {
    return null;
  }
  const moovTop = tops.find((x) => x.type === 'moov');
  if (!moovTop || moovTop.end - moovTop.start > MAX_MOOV) return null;
  if (tops.some((x) => x.type === 'moof')) return null; // fragmented: not supported
  const b = new Uint8Array(await blob.slice(moovTop.start, moovTop.end).arrayBuffer());
  const dv = new DataView(b.buffer);
  const traks = boxes(b, 0, b.length).filter((x) => x.type === 'trak');

  let video = null;
  for (const trak of traks) {
    if (handlerOf(b, trak) !== 'vide') continue;
    const tkhd = child(b, trak, 'tkhd');
    const st = tkhd && sampleTable(b, trak);
    if (!st) continue;
    const { entry, count, timescale } = st;
    const codec = videoCodecOf(b, entry);
    if (!codec) return null;
    const codedWidth = dv.getUint16(entry.start + 24), codedHeight = dv.getUint16(entry.start + 26);
    const samples = new Array(count);
    let maxUs = 0;
    for (let i = 0; i < count; i++) {
      const us = Math.round(((st.dts[i] + st.cto[i] - st.shift) * 1e6) / timescale);
      samples[i] = { offset: st.offsets[i], size: st.sizes[i], us, key: st.sync ? st.sync.has(i) : true, dts: st.dts[i], duration: st.durations[i], cto: st.cto[i] };
      maxUs = Math.max(maxUs, us);
    }
    if (!count || !samples[0].key) return null;
    video = { ...codec, codedWidth, codedHeight, rotation: rotationOf(b, tkhd), timescale, mediaTime: st.shift, samples, durationUs: maxUs };
    break;
  }
  if (!video) return null;

  let audio = null;
  for (const trak of traks) {
    if (handlerOf(b, trak) !== 'soun') continue;
    const st = sampleTable(b, trak);
    const a = st && st.count && audioCodecOf(b, st.entry);
    if (!a) continue;
    const ts = st.timescale;
    const samples = new Array(st.count);
    for (let i = 0; i < st.count; i++) {
      samples[i] = { offset: st.offsets[i], size: st.sizes[i], dts: st.dts[i], duration: st.durations[i], us: Math.round(((st.dts[i] - st.shift) * 1e6) / ts) };
    }
    const end = st.dts[st.count - 1] + st.durations[st.count - 1] - st.shift;
    audio = { ...a, timescale: ts, mediaTime: st.shift, samples, durationUs: Math.round((end * 1e6) / ts) };
    break;
  }
  video.audio = audio;
  return video;
}

// The source rectangle (frame coordinates) and the drawing transform for a crop in display
// coordinates of a frame that is shown turned by 'rotation' degrees (clockwise). fw, fh: the frame
// size (not turned). c: { sx, sy, sw, sh } in display coordinates. w, h: the output size.
// Returns { sx, sy, sw, sh, m: [a, b, c, d, e, f], dw, dh } for setTransform(...m) and drawImage(frame,
// sx, sy, sw, sh, 0, 0, dw, dh).
function turnedCrop(rotation, fw, fh, c, w, h) {
  switch (rotation) {
    case 90:
      return { sx: c.sy, sy: fh - c.sx - c.sw, sw: c.sh, sh: c.sw, m: [0, 1, -1, 0, w, 0], dw: h, dh: w };
    case 180:
      return { sx: fw - c.sx - c.sw, sy: fh - c.sy - c.sh, sw: c.sw, sh: c.sh, m: [-1, 0, 0, -1, w, h], dw: w, dh: h };
    case 270:
      return { sx: fw - c.sy - c.sh, sy: c.sx, sw: c.sh, sh: c.sw, m: [0, -1, 1, 0, 0, h], dw: h, dh: w };
    default:
      return { sx: c.sx, sy: c.sy, sw: c.sw, sh: c.sh, m: [1, 0, 0, 1, 0, 0], dw: w, dh: h };
  }
}

return { demuxMp4, turnedCrop };
})();

// ---- io/mp4.js
const { avcC, DataPacker, muxMp4, readPackets } = (() => {
// MP4 muxer (plan §3, §11.2). From neomosh src/mux/mp4.js, with an audio track added.
// Layout: ftyp, moov, mdat. The moov comes first, so all sample sizes must be known first.
// The file is returned as a list of parts (for a Blob). There is no one large buffer.
// co64 when a chunk offset is 4 GB or more, else stco. stss lists only the video sync samples.
// With audio, the video and audio chunks are interleaved by time (default 1 s chunks).

const MOVIE_TIMESCALE = 1000;

// Big-endian byte builder.
class Bytes {
  constructor() {
    this.a = [];
  }
  u8(v) { this.a.push(v & 255); return this; }
  u16(v) { this.a.push((v >>> 8) & 255, v & 255); return this; }
  u24(v) { this.a.push((v >>> 16) & 255, (v >>> 8) & 255, v & 255); return this; }
  u32(v) { this.a.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255); return this; }
  u64(v) { return this.u32(Math.floor(v / 4294967296)).u32(v >>> 0); }
  str(s) { for (let i = 0; i < s.length; i++) this.a.push(s.charCodeAt(i) & 255); return this; }
  bytes(b) { for (let i = 0; i < b.length; i++) this.a.push(b[i]); return this; }
  zeros(n) { for (let i = 0; i < n; i++) this.a.push(0); return this; }
  get length() { return this.a.length; }
}

// A box: size, type, then the content (Bytes or Uint8Array of child boxes).
function box(type, ...content) {
  let len = 8;
  for (const c of content) len += c.length;
  const out = new Uint8Array(len);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, len);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  let o = 8;
  for (const c of content) {
    out.set(c instanceof Bytes ? c.a : c, o);
    o += c.length;
  }
  return out;
}

function fullBox(type, version, flags, ...content) {
  return box(type, new Bytes().u8(version).u24(flags), ...content);
}

const MATRIX = [0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000];

function ftyp() {
  return box('ftyp', new Bytes().str('isom').u32(512).str('isom').str('iso2').str('avc1').str('mp41'));
}

function mvhd(duration, nextTrackId) {
  const b = new Bytes().u32(0).u32(0).u32(MOVIE_TIMESCALE).u32(duration)
    .u32(0x00010000).u16(0x0100).zeros(10);
  for (const m of MATRIX) b.u32(m);
  return fullBox('mvhd', 0, 0, b.zeros(24).u32(nextTrackId));
}

function tkhd(trackId, duration, width, height, isAudio) {
  const b = new Bytes().u32(0).u32(0).u32(trackId).u32(0).u32(duration).zeros(8)
    .u16(0).u16(isAudio ? 1 : 0).u16(isAudio ? 0x0100 : 0).u16(0);
  for (const m of MATRIX) b.u32(m);
  return fullBox('tkhd', 0, 3, b.u32(width * 65536).u32(height * 65536));
}

function mdhd(timescale, duration) {
  return fullBox('mdhd', 0, 0, new Bytes().u32(0).u32(0).u32(timescale).u32(duration).u16(0x55c4).u16(0));
}

function hdlr(type, name) {
  return fullBox('hdlr', 0, 0, new Bytes().u32(0).str(type).zeros(12).str(name).u8(0));
}

function dinf() {
  return box('dinf', fullBox('dref', 0, 0, new Bytes().u32(1), fullBox('url ', 0, 1)));
}

// avcC (ISO/IEC 14496-15 5.3.3.1) from one SPS and one PPS NAL unit (without start codes).
function avcC(sps, pps) {
  return box('avcC', new Bytes().u8(1).u8(sps[1]).u8(sps[2]).u8(sps[3]).u8(0xff).u8(0xe1)
    .u16(sps.length).bytes(sps).u8(1).u16(pps.length).bytes(pps));
}

function avc1(v) {
  const b = new Bytes().zeros(6).u16(1).zeros(16).u16(v.width).u16(v.height)
    .u32(0x00480000).u32(0x00480000).u32(0).u16(1).zeros(32).u16(0x0018).u16(0xffff);
  // colr nclx: BT.709 primaries, transfer, and matrix; limited range (plan §3, §11.3).
  const colr = box('colr', new Bytes().str('nclx').u16(1).u16(1).u16(1).u8(0));
  const pasp = box('pasp', new Bytes().u32(1).u32(1));
  // v.avcc: an existing avcC record (for example from a VideoEncoder), else made from the SPS and PPS.
  const c = v.avcc ? box('avcC', v.avcc) : avcC(v.sps, v.pps);
  return box('avc1', b, c, colr, pasp);
}

// AudioSampleEntry (ISO/IEC 14496-12 12.2.3, version 0) with the codec box copied from the source
// (esds for AAC, dOps for Opus). a = { type: 'mp4a' | 'Opus', channels, sampleSize, sampleRate, config }.
function audioEntry(a) {
  const b = new Bytes().zeros(6).u16(1).zeros(8).u16(a.channels || 2).u16(a.sampleSize || 16)
    .u16(0).u16(0).u32(((a.sampleRate & 0xffff) << 16) >>> 0);
  return box(a.type, b, a.config);
}

// Runs of equal values: [[count, value], ...].
function runs(values) {
  const out = [];
  for (const v of values) {
    const last = out[out.length - 1];
    if (last && last[1] === v) last[0]++;
    else out.push([1, v]);
  }
  return out;
}

function stts(durations) {
  const r = runs(durations);
  const b = new Bytes().u32(r.length);
  for (const [n, d] of r) b.u32(n).u32(d);
  return fullBox('stts', 0, 0, b);
}

// Composition offsets (ctts version 0): display time - decode time of each sample, for an encoder
// with B-frames (frames in decode order, not display order).
function ctts(offsets) {
  const r = runs(offsets);
  const b = new Bytes().u32(r.length);
  for (const [n, o] of r) b.u32(n).u32(o);
  return fullBox('ctts', 0, 0, b);
}

// Edit list: the presentation starts at mediaTime (the delay that the composition offsets add, or
// the audio priming of the source), so the first picture or sound plays at time 0.
function edts(segmentDur, mediaTime) {
  return box('edts', fullBox('elst', 0, 0, new Bytes().u32(1).u32(segmentDur).u32(mediaTime).u16(1).u16(0)));
}

function stss(keys) {
  const b = new Bytes().u32(keys.length);
  for (const k of keys) b.u32(k);
  return fullBox('stss', 0, 0, b);
}

function stsc(chunkSizes) {
  const r = [];
  chunkSizes.forEach((n, i) => {
    if (!r.length || r[r.length - 1][1] !== n) r.push([i + 1, n]);
  });
  const b = new Bytes().u32(r.length);
  for (const [first, n] of r) b.u32(first).u32(n).u32(1);
  return fullBox('stsc', 0, 0, b);
}

function stsz(sizes) {
  const b = new Bytes().u32(0).u32(sizes.length);
  for (const s of sizes) b.u32(s);
  return fullBox('stsz', 0, 0, b);
}

function chunkOffsets(offsets, use64) {
  const b = new Bytes().u32(offsets.length);
  for (const o of offsets) (use64 ? b.u64(o) : b.u32(o));
  return fullBox(use64 ? 'co64' : 'stco', 0, 0, b);
}

// The sample data of an export, packed into Blobs of about chunkBytes as it comes. A Blob can be kept
// by the browser out of the JavaScript memory (on disk when it is large), so a long export does not
// hold all its data in RAM. chunkBytes 0: no packing (the arrays, for tests).
class DataPacker {
  constructor(chunkBytes = 0) {
    this.chunk = chunkBytes;
    this.parts = [];
    this.pending = [];
    this.pendingBytes = 0;
  }

  add(data) {
    if (!this.chunk) {
      this.parts.push(data);
      return;
    }
    this.pending.push(data);
    this.pendingBytes += data.length;
    if (this.pendingBytes >= this.chunk) this.flush();
  }

  flush() {
    if (!this.pending.length) return;
    this.parts.push(new Blob(this.pending));
    this.pending = [];
    this.pendingBytes = 0;
  }

  // The parts in file order (Blobs and arrays).
  done() {
    this.flush();
    return this.parts;
  }
}

// Split the samples of a track into chunks of about chunkDur (timescale units).
// Returns [{ first, n, bytes, byteStart, t (start time in seconds) }].
function makeChunks(samples, ts, chunkDur) {
  const out = [];
  let first = 0, n = 0, dur = 0, bytes = 0, byteStart = 0, t = 0;
  for (let i = 0; i < samples.length; i++) {
    const s = samples[i];
    n++;
    dur += s.duration;
    bytes += s.size;
    if (dur >= chunkDur || i === samples.length - 1) {
      out.push({ first, n, bytes, byteStart, t: t / ts });
      t += dur;
      byteStart += bytes;
      first = i + 1;
      n = dur = bytes = 0;
    }
  }
  return out;
}

// The data of one chunk, as parts. With dataParts (the track data in sample order), a slice of them.
function chunkData(track, c, whole) {
  if (whole) return [whole.slice(c.byteStart, c.byteStart + c.bytes)];
  const out = [];
  for (let i = c.first; i < c.first + c.n; i++) out.push(track.samples[i].data);
  return out;
}

// Make the MP4 file.
// video = { width, height, timescale, sps, pps | avcc, samples: [{ data: Uint8Array | Blob, size, duration, key, cto }] }
// The samples are in decode order. duration: the decode time to the next sample. cto (optional): the
// composition offset (display time - decode time, >= 0). video.mediaTime: the edit list start (the
// largest delay), when the samples have composition offsets. video.dataParts (optional): the sample
// data in file order (from a DataPacker); then the samples need only their sizes.
// opts.audio (optional): { type: 'mp4a' | 'Opus', channels, sampleSize, sampleRate, config (the codec
//   box from demuxMp4), timescale, mediaTime, samples: [{ data, size, duration }], dataParts }.
// opts.chunkDuration: video chunk length in video timescale units (default 1 s). Audio chunks have
// the same length in seconds.
// opts.forceCo64, opts.forceLargeMdat: for tests only.
// Returns { parts, size }. parts: Uint8Array headers and the sample data, in file order.
function muxMp4(video, opts = {}) {
  const samples = video.samples;
  if (!samples.length) throw new Error('No samples');
  const ts = video.timescale;
  const chunkDur = opts.chunkDuration ?? ts;
  const audio = opts.audio && opts.audio.samples.length ? opts.audio : null;

  const vChunks = makeChunks(samples, ts, chunkDur);
  const aChunks = audio ? makeChunks(audio.samples, audio.timescale, (chunkDur / ts) * audio.timescale) : [];
  // File order of the chunks: by start time; video first at the same time.
  const order = [...vChunks.map((c, i) => ({ c, i, a: false })), ...aChunks.map((c, i) => ({ c, i, a: true }))]
    .sort((x, y) => x.c.t - y.c.t || x.a - y.a);

  let mdatPayload = 0;
  for (const { c } of order) mdatPayload += c.bytes;
  const largeMdat = opts.forceLargeMdat || mdatPayload + 8 > 0xffffffff;
  const mdatHeader = largeMdat
    ? new Uint8Array([0, 0, 0, 1, 0x6d, 0x64, 0x61, 0x74, ...new Bytes().u64(mdatPayload + 16).a])
    : new Uint8Array([...new Bytes().u32(mdatPayload + 8).a, 0x6d, 0x64, 0x61, 0x74]);

  const durations = samples.map((s) => s.duration);
  const totalDur = durations.reduce((a, b) => a + b, 0);
  const movieDur = Math.round((totalDur * MOVIE_TIMESCALE) / ts);
  const reordered = samples.some((s) => s.cto);
  const keys = [];
  samples.forEach((s, i) => s.key && keys.push(i + 1));
  if (keys[0] !== 1) throw new Error('The first sample must be a sync sample');

  let aTotal = 0, aMovieDur = 0;
  if (audio) {
    for (const s of audio.samples) aTotal += s.duration;
    aMovieDur = Math.round(((aTotal - (audio.mediaTime || 0)) * MOVIE_TIMESCALE) / audio.timescale);
  }

  const head = ftyp();
  const build = (use64) => {
    // The chunk offsets depend on the moov size. The moov size depends only on use64.
    const vOff = vChunks.map(() => 0), aOff = aChunks.map(() => 0);
    const make = () => {
      const vStbl = box('stbl',
        fullBox('stsd', 0, 0, new Bytes().u32(1), avc1(video)),
        stts(durations), ...(reordered ? [ctts(samples.map((s) => s.cto || 0))] : []),
        stss(keys), stsc(vChunks.map((c) => c.n)), stsz(samples.map((s) => s.size)),
        chunkOffsets(vOff, use64));
      const vMinf = box('minf', fullBox('vmhd', 0, 1, new Bytes().zeros(8)), dinf(), vStbl);
      const vMdia = box('mdia', mdhd(ts, totalDur), hdlr('vide', 'neofx video'), vMinf);
      const traks = [box('trak', tkhd(1, movieDur, video.width, video.height, false),
        ...(reordered ? [edts(movieDur, video.mediaTime || 0)] : []), vMdia)];
      if (audio) {
        const aStbl = box('stbl',
          fullBox('stsd', 0, 0, new Bytes().u32(1), audioEntry(audio)),
          stts(audio.samples.map((s) => s.duration)), stsc(aChunks.map((c) => c.n)),
          stsz(audio.samples.map((s) => s.size)), chunkOffsets(aOff, use64));
        const aMinf = box('minf', fullBox('smhd', 0, 0, new Bytes().u16(0).u16(0)), dinf(), aStbl);
        const aMdia = box('mdia', mdhd(audio.timescale, aTotal), hdlr('soun', 'neofx audio'), aMinf);
        traks.push(box('trak', tkhd(2, aMovieDur, 0, 0, true),
          ...(audio.mediaTime ? [edts(aMovieDur, audio.mediaTime)] : []), aMdia));
      }
      return box('moov', mvhd(Math.max(movieDur, aMovieDur), traks.length + 1), ...traks);
    };
    let moov = make();
    let o = head.length + moov.length + mdatHeader.length;
    let last = 0;
    for (const x of order) {
      (x.a ? aOff : vOff)[x.i] = o;
      last = o;
      o += x.c.bytes;
    }
    moov = make();
    return { moov, lastOffset: last };
  };
  let r = build(!!opts.forceCo64);
  if (!opts.forceCo64 && r.lastOffset > 0xffffffff) r = build(true);

  const parts = [head, r.moov, mdatHeader];
  if (!audio) {
    // One track: the data is already in file order.
    if (video.dataParts) parts.push(...video.dataParts);
    else for (const s of samples) parts.push(s.data);
  } else {
    const vWhole = video.dataParts ? new Blob(video.dataParts) : null;
    const aWhole = audio.dataParts ? new Blob(audio.dataParts) : null;
    for (const x of order) parts.push(...chunkData(x.a ? audio : video, x.c, x.a ? aWhole : vWhole));
  }
  return { parts, size: head.length + r.moov.length + mdatHeader.length + mdatPayload };
}

// The data of packets ({ offset, size }, in file order) as one array. Packets that are near each
// other (the audio of an interleaved chunk) are read with one read.
async function readPackets(file, list, gap = 262144, maxRun = 8 * 1048576) {
  const total = list.reduce((n, s) => n + s.size, 0);
  const out = new Uint8Array(total);
  let i = 0, o = 0;
  while (i < list.length) {
    const start = list[i].offset;
    let j = i, end = start + list[i].size;
    while (j + 1 < list.length && list[j + 1].offset >= end && list[j + 1].offset - end <= gap && list[j + 1].offset + list[j + 1].size - start <= maxRun) {
      j++;
      end = list[j].offset + list[j].size;
    }
    const buf = new Uint8Array(await file.slice(start, end).arrayBuffer());
    for (let k = i; k <= j; k++) {
      out.set(buf.subarray(list[k].offset - start, list[k].offset - start + list[k].size), o);
      o += list[k].size;
    }
    i = j + 1;
  }
  return out;
}

return { avcC, DataPacker, muxMp4, readPackets };
})();

// ---- io/encoder-config.js
const { h264Level, codecCandidates, QUALITY, bitrateFor, exportSizes, exportName, chunkSamples, FrameMatcher, checkSamples } = (() => {
// Export settings and the H.264 encoder configuration (plan §3, §11). No browser APIs.

// H.264 levels (ITU-T H.264 Table A-1): [level_idc, max macroblocks for each frame, max macroblocks/s].
const LEVELS = [
  [30, 1620, 40500], [31, 3600, 108000], [32, 5120, 216000], [40, 8192, 245760], [41, 8192, 245760],
  [42, 8704, 522240], [50, 22080, 589824], [51, 36864, 983040], [52, 36864, 2073600], [60, 139264, 4177920],
];

// The smallest level for a size and a frame rate (level_idc, for example 40 = 4.0), or null.
function h264Level(w, h, fps) {
  const mbs = Math.ceil(w / 16) * Math.ceil(h / 16);
  const rate = mbs * Math.max(1, fps);
  for (const [idc, fs, mbps] of LEVELS) if (mbs <= fs && rate <= mbps) return idc;
  return null;
}

const hex2 = (v) => v.toString(16).padStart(2, '0').toUpperCase();

// The codec strings to probe, in order (plan §3): High, then Main, then Baseline, at the level for the
// size and frame rate.
function codecCandidates(w, h, fps) {
  const lvl = h264Level(w, h, fps);
  if (!lvl) return [];
  return [`avc1.6400${hex2(lvl)}`, `avc1.4D00${hex2(lvl)}`, `avc1.42E0${hex2(lvl)}`];
}

// Quality presets: bits for each pixel for each frame (plan §11.1: High ≈ 0.12).
const QUALITY = { low: 0.05, medium: 0.08, high: 0.12, veryhigh: 0.2 };

function bitrateFor(w, h, fps, quality, mbps) {
  if (quality === 'custom') return Math.round(Math.max(0.1, mbps) * 1e6);
  return Math.round(w * h * Math.max(1, fps) * (QUALITY[quality] ?? QUALITY.high));
}

// The export sizes (plan §11.1): Source, then 2160, 1440, 1080, 720, 540 on the short side, never
// above the source. Even numbers. Returns [{ id, label, width, height }].
function exportSizes(w, h) {
  const out = [{ id: 'source', label: `Source (${w}×${h})`, width: w - (w % 2), height: h - (h % 2) }];
  const short = Math.min(w, h);
  for (const s of [2160, 1440, 1080, 720, 540]) {
    if (s >= short) continue;
    const k = s / short;
    const ww = Math.round((w * k) / 2) * 2, hh = Math.round((h * k) / 2) * 2;
    out.push({ id: String(s), label: `${s}p (${ww}×${hh})`, width: ww, height: hh });
  }
  return out;
}

// The default file name (plan §11.1).
const exportName = (source) => `${(source || 'video').replace(/\.[^.]+$/, '')}-neofx.mp4`;

// The encoded chunks (decode order) -> MP4 samples. chunks: [{ pts (timescale units), size, key }].
// The decode times are the sorted display times, moved back by the largest reorder delay, so that
// each composition offset is >= 0 (B-frames); mediaTime (the edit list) is that delay.
// lastDuration: the duration of the last frame (display order). Returns { samples, mediaTime }.
function chunkSamples(chunks, lastDuration) {
  const sorted = chunks.map((c) => c.pts).sort((a, b) => a - b);
  let delay = 0;
  chunks.forEach((c, i) => (delay = Math.max(delay, sorted[i] - c.pts)));
  const dts = sorted.map((p) => p - delay);
  const samples = chunks.map((c, i) => ({
    size: c.size, data: c.data, key: c.key, cto: c.pts - dts[i],
    duration: i + 1 < chunks.length ? dts[i + 1] - dts[i] : lastDuration,
  }));
  return { samples, mediaTime: delay };
}

// Encoded chunks -> source frames (plan §11.2). An encoder can give the chunk timestamps a little
// different from the timestamps of the frames (Safari: VideoToolbox keeps its own time scale, and
// rounds), and in a different order (B-frames). So a chunk is not found by an exact key: it is the
// frame with the nearest timestamp that has no chunk yet, within half of the frame interval.
class FrameMatcher {
  constructor() {
    this.us = []; // the timestamps of the frames given to the encoder (increasing)
    this.t = []; // their frame indices
    this.used = [];
  }

  add(us, t) {
    this.us.push(us);
    this.t.push(t);
    this.used.push(false);
  }

  // The frame index of a chunk timestamp, or -1.
  match(ts) {
    const U = this.us;
    if (!U.length) return -1;
    let lo = 0, hi = U.length - 1;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (U[m] < ts) lo = m + 1;
      else hi = m;
    }
    let best = -1, bd = Infinity;
    for (let i = Math.max(0, lo - 2); i <= Math.min(U.length - 1, lo + 2); i++) {
      if (this.used[i]) continue;
      const d = Math.abs(U[i] - ts);
      if (d < bd) [best, bd] = [i, d];
    }
    if (best < 0) return -1;
    const gap = Math.min(best > 0 ? U[best] - U[best - 1] : Infinity, best + 1 < U.length ? U[best + 1] - U[best] : Infinity);
    if (bd > Math.max(1000, (Number.isFinite(gap) ? gap : 1e6) / 2)) return -1;
    this.used[best] = true;
    return this.t[best];
  }
}

// A sample list that the muxer can write: whole, positive durations and offsets. Else the reason.
function checkSamples(samples) {
  for (let i = 0; i < samples.length; i++) {
    const s = samples[i];
    if (!Number.isInteger(s.duration) || s.duration <= 0) return `frame ${i} has the duration ${s.duration}`;
    if (!Number.isInteger(s.cto ?? 0) || (s.cto ?? 0) < 0) return `frame ${i} has the time offset ${s.cto}`;
  }
  return '';
}

return { h264Level, codecCandidates, QUALITY, bitrateFor, exportSizes, exportName, chunkSamples, FrameMatcher, checkSamples };
})();

// ---- maps/builtin.js
const { MAPS, MAP_INDEX, defaultParams, paramArray, usesMask, isDynamic, videoMapFrame } = (() => {
// The built-in maps (plan §7.3): ids, names, and parameters. The order of MAPS is the u_type of
// gpu/glsl/maps.glsl; the order of the params of each map is its u_k[] order.
// A param: [key, label, min, max, step, default, unit].

const C = [['x', 'Center x', 0, 1, 0.01, 0.5], ['y', 'Center y', 0, 1, 0.01, 0.5]];
const SEED = ['seed', 'Seed', 0, 999, 1, 1];

const MAPS = [
  { id: 'linear', name: 'Linear', params: [['angle', 'Angle', 0, 360, 1, 90, '°'], ['x', 'Position x', 0, 1, 0.01, 0.5], ['y', 'Position y', 0, 1, 0.01, 0.5], ['width', 'Width', 0.05, 4, 0.01, 1]] },
  { id: 'mirrored', name: 'Mirrored', params: [['angle', 'Angle', 0, 360, 1, 90, '°'], ['x', 'Center x', 0, 1, 0.01, 0.5], ['y', 'Center y', 0, 1, 0.01, 0.5], ['width', 'Width', 0.05, 4, 0.01, 1]] },
  { id: 'radial', name: 'Radial', params: [...C, ['radius', 'Radius', 0.05, 2, 0.01, 0.7], ['aspect', 'Aspect', 0.25, 4, 0.01, 1]] },
  { id: 'angular', name: 'Angular', params: [...C, ['start', 'Start angle', 0, 360, 1, 0, '°'], ['turns', 'Turns', 1, 16, 1, 1]] },
  { id: 'spiral', name: 'Spiral', params: [...C, ['arms', 'Arms', 1, 12, 1, 2], ['tightness', 'Tightness', 0, 20, 0.1, 4]] },
  { id: 'box', name: 'Diamond / Box', params: [...C, ['size', 'Size', 0.05, 2, 0.01, 0.5], ['roundness', 'Roundness', 0, 1, 0.01, 0, '']] },
  { id: 'corners', name: 'Four corners', params: [['tl', 'Top left', 0, 1, 0.01, 0], ['tr', 'Top right', 0, 1, 0.01, 0.33], ['bl', 'Bottom left', 0, 1, 0.01, 0.66], ['br', 'Bottom right', 0, 1, 0.01, 1]] },
  { id: 'stripes', name: 'Stripes', params: [['count', 'Count', 1, 64, 1, 8], ['angle', 'Angle', 0, 360, 1, 0, '°'], ['softness', 'Softness', 0, 1, 0.01, 0], ['duty', 'Duty', 0, 1, 0.01, 0.5]] },
  { id: 'sine', name: 'Sine waves', params: [['fx', 'Frequency x', 0, 32, 0.1, 4], ['fy', 'Frequency y', 0, 32, 0.1, 0], ['angle', 'Angle', 0, 360, 1, 0, '°'], ['phase', 'Phase', 0, 1, 0.01, 0]] },
  { id: 'rings', name: 'Rings', params: [...C, ['count', 'Count', 1, 64, 1, 8], ['softness', 'Softness', 0, 1, 0.01, 0]] },
  { id: 'checker', name: 'Checkerboard', params: [['cells', 'Cells', 1, 64, 1, 8], ['softness', 'Softness', 0, 1, 0.01, 0]] },
  { id: 'fbm', name: 'Value noise', params: [['scale', 'Scale', 0.5, 64, 0.1, 4], ['octaves', 'Octaves', 1, 8, 1, 4], ['roughness', 'Roughness', 0, 1, 0.01, 0.5], SEED] },
  { id: 'ridged', name: 'Ridged noise', params: [['scale', 'Scale', 0.5, 64, 0.1, 3], ['octaves', 'Octaves', 1, 8, 1, 4], SEED] },
  { id: 'worley', name: 'Cellular', params: [['scale', 'Scale', 1, 64, 0.1, 6], SEED, ['metric', 'Metric', 0, 2, 1, 0]] },
  { id: 'voronoi', name: 'Voronoi cells', params: [['scale', 'Scale', 1, 64, 0.1, 6], SEED] },
  { id: 'blocks', name: 'Random blocks', params: [['bw', 'Block width', 1, 256, 1, 32, 'px'], ['bh', 'Block height', 1, 256, 1, 32, 'px'], SEED] },
  { id: 'rows', name: 'Random rows', params: [['size', 'Size', 1, 256, 1, 16, 'px'], ['direction', 'Columns', 0, 1, 1, 0], SEED] },
  { id: 'bayer', name: 'Bayer dither', params: [['matrix', 'Matrix (2^n)', 1, 3, 1, 2], ['base', 'Base value', 0, 1, 0.01, 0.5]] },
  { id: 'self', name: 'Video luminance', params: [] },
  { id: 'motion', name: 'Motion', params: [['gain', 'Gain', 0.5, 20, 0.1, 4], ['frames', 'Smooth (frames)', 1, 8, 1, 2]] },
  { id: 'subject', name: 'Subject mask', params: [['subject', 'Subject value', 0, 1, 0.01, 1], ['background', 'Background value', 0, 1, 0.01, 0]], usesMask: true },
  { id: 'subjectdist', name: 'Subject distance', params: [['falloff', 'Falloff', 1, 1000, 1, 120, 'px']], usesMask: true },
];

const MAP_INDEX = Object.fromEntries(MAPS.map((m, i) => [m.id, i]));

// The default params of each map: { linear: { angle: 90, ... }, ... }.
function defaultParams() {
  return Object.fromEntries(MAPS.map((m) => [m.id, Object.fromEntries(m.params.map((p) => [p[0], p[5]]))]));
}

// The u_k[] values of a map.
function paramArray(id, params) {
  const m = MAPS[MAP_INDEX[id]];
  return m.params.map((p) => Number((params && params[p[0]]) ?? p[5]));
}

// A built-in map that needs the subject mask (plan §9).
const usesMask = (map) => map.source === 'builtin' && (map.type === 'subject' || map.type === 'subjectdist');

// The map needs a new render for each frame (it changes with t).
function isDynamic(map) {
  const a = map.anim;
  return map.source === 'video' || (map.source === 'builtin' && ['self', 'motion', 'subject', 'subjectdist'].includes(map.type))
    || (map.source === 'builtin' && !!(a.phaseSpeed || a.rotSpeed || a.pulseAmount || a.seedEvery));
}

// Video map (plan §7.4): the map frame for source frame t. end: 'loop' | 'hold' | 'pingpong'.
function videoMapFrame(t, count, speed, offset, end) {
  if (count <= 1) return 0;
  const m = Math.round(t * speed + offset);
  if (end === 'hold') return Math.max(0, Math.min(count - 1, m));
  if (end === 'pingpong') {
    const p = 2 * (count - 1);
    const r = ((m % p) + p) % p;
    return r < count ? r : p - r;
  }
  return ((m % count) + count) % count;
}

return { MAPS, MAP_INDEX, defaultParams, paramArray, usesMask, isDynamic, videoMapFrame };
})();

// ---- maps/curve.js
const { CURVE_PRESETS, monotoneCurve, curveTable } = (() => {
// Curves (plan §7.5, §12.6): points [[x, y], ...] with x from 0 to 1 -> monotone cubic interpolation
// (Fritsch–Carlson). The GPU gets a lookup table.

const CURVE_PRESETS = {
  linear: [[0, 0], [1, 1]],
  easeIn: [[0, 0], [0.5, 0.2], [1, 1]],
  easeOut: [[0, 0], [0.5, 0.8], [1, 1]],
  sCurve: [[0, 0], [0.25, 0.1], [0.75, 0.9], [1, 1]],
  step: [[0, 0], [0.49, 0], [0.51, 1], [1, 1]],
};

// A function x -> y through the points (sorted by x), monotone between them.
function monotoneCurve(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0]);
  const n = p.length;
  if (n < 2) return () => (n ? p[0][1] : 0);
  const dx = [], m = [];
  for (let i = 0; i < n - 1; i++) {
    dx.push(p[i + 1][0] - p[i][0]);
    m.push(dx[i] > 0 ? (p[i + 1][1] - p[i][1]) / dx[i] : 0);
  }
  const t = new Array(n);
  t[0] = m[0];
  t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) {
      t[i] = t[i + 1] = 0;
      continue;
    }
    const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
    if (h > 9) {
      const s = 3 / Math.sqrt(h);
      t[i] = s * a * m[i];
      t[i + 1] = s * b * m[i];
    }
  }
  return (x) => {
    if (x <= p[0][0]) return p[0][1];
    if (x >= p[n - 1][0]) return p[n - 1][1];
    let i = 0;
    while (i < n - 2 && x > p[i + 1][0]) i++;
    const h = dx[i], u = (x - p[i][0]) / h;
    const u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * p[i][1] + (u3 - 2 * u2 + u) * h * t[i] + (-2 * u3 + 3 * u2) * p[i + 1][1] + (u3 - u2) * h * t[i + 1];
  };
}

// 256 values of the curve, clamped to 0..1.
function curveTable(points, size = 256) {
  const f = monotoneCurve(points);
  const out = new Float32Array(size);
  for (let i = 0; i < size; i++) out[i] = Math.max(0, Math.min(1, f(i / (size - 1))));
  return out;
}

return { CURVE_PRESETS, monotoneCurve, curveTable };
})();

// ---- modes/slit.js
const { RATE_TYPES, MAX_HISTORY, rateAt, distanceTable, ageAt, lineGeometry, historyRows } = (() => {
// Mode 2, Slit Scan, line source (plan §8.1 – §8.3, §8.5): geometry and age. No browser APIs.



const RATE_TYPES = [['constant', 'Constant'], ['accelerate', 'Accelerate'], ['decelerate', 'Decelerate'], ['exponential', 'Exponential'], ['curve', 'Curve']];
const MAX_HISTORY = 4096;

// The rate r (px/frame) at age a (frames), u = a / M (plan §8.5).
function rateAt(sl, a) {
  const M = Math.max(1, sl.maxAge);
  const u = Math.min(1, Math.max(0, a / M));
  const r0 = sl.rate, r1 = sl.rateEnd;
  switch (sl.rateType) {
    case 'accelerate': return r0 + (r1 - r0) * u * u;
    case 'decelerate': return r0 + (r1 - r0) * (1 - (1 - u) * (1 - u));
    case 'exponential': return r0 * (r1 / r0) ** u;
    case 'curve': {
      const pts = Array.isArray(sl.curve) ? sl.curve : CURVE_PRESETS[sl.curve] || CURVE_PRESETS.linear;
      return r0 + (r1 - r0) * monotoneCurve(pts)(u);
    }
    default: return r0;
  }
}

// S(a): the distance (px) that a pixel moves by the age a, for a = 0 .. M (the rate at the middle of
// each frame of age). Float32Array of M + 1.
function distanceTable(sl) {
  const M = Math.max(1, Math.round(sl.maxAge));
  const S = new Float32Array(M + 1);
  for (let a = 1; a <= M; a++) S[a] = S[a - 1] + Math.max(1e-4, rateAt(sl, a - 0.5));
  return S;
}

// A(s): the age (frames, a float) at the distance s, or Infinity beyond S(M). The inverse of S
// (binary search, then linear between the entries), as the shader does it.
function ageAt(S, s) {
  const M = S.length - 1;
  if (s > S[M]) return Infinity;
  let lo = 0, hi = M;
  while (lo < hi) {
    const m = (lo + hi + 1) >> 1;
    if (S[m] <= s) lo = m;
    else hi = m - 1;
  }
  if (lo >= M) return M;
  return lo + (s - S[lo]) / (S[lo + 1] - S[lo]);
}

// The line in working pixels (plan §8.1). angle: the direction of the line (90° = vertical). d: the
// scan direction (perpendicular, 90° clockwise from the line; Flip turns it 180°). The point is
// snapped to a pixel centre, so lines at 0°, 90°, 180°, 270° read exact pixels.
// Returns { L, d, e, len, c }: the history row has len samples; sample i is at L + (i − c) e.
function lineGeometry(sl, w, h, maxTexture = 8192) {
  const a = (sl.angle * Math.PI) / 180;
  const snap = (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : v);
  const e = [snap(Math.cos(a)), snap(Math.sin(a))];
  let d = [snap(Math.sin(a)), snap(-Math.cos(a))]; // 90° -> (1, 0): to the right
  if (sl.flip) d = [-d[0], -d[1]];
  const L = [Math.min(w - 1, Math.floor(sl.x * w)) + 0.5, Math.min(h - 1, Math.floor(sl.y * h)) + 0.5];
  const len = Math.min(maxTexture, 2 * Math.ceil(Math.hypot(w, h)) + 4);
  return { L, d, e, len, c: len >> 1 };
}

// The history rows: one for each frame, at most MAX_HISTORY and the texture limit.
const historyRows = (frames, maxTexture = 8192) => Math.max(1, Math.min(frames, MAX_HISTORY, maxTexture));

return { RATE_TYPES, MAX_HISTORY, rateAt, distanceTable, ageAt, lineGeometry, historyRows };
})();

// ---- analysis/regions.js
const { cleanRegions } = (() => {
// Mask clean-up on a small copy (plan §9.1 step 4): Fill holes and Keep largest region.
// b: Uint8Array of 0/1 (w x h). Returns { fill, remove }: Uint8Array of 0/1 (the pixels to set to
// subject, and to background). 4-connected regions.

function regions(b, w, h, value) {
  const label = new Int32Array(w * h).fill(-1);
  const sizes = [], border = [];
  const stack = new Int32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    if (b[i] !== value || label[i] >= 0) continue;
    const id = sizes.length;
    let n = 0, top = 0, edge = false;
    stack[top++] = i;
    label[i] = id;
    while (top) {
      const p = stack[--top];
      n++;
      const x = p % w, y = (p - x) / w;
      if (x === 0 || y === 0 || x === w - 1 || y === h - 1) edge = true;
      if (x > 0 && b[p - 1] === value && label[p - 1] < 0) { label[p - 1] = id; stack[top++] = p - 1; }
      if (x < w - 1 && b[p + 1] === value && label[p + 1] < 0) { label[p + 1] = id; stack[top++] = p + 1; }
      if (y > 0 && b[p - w] === value && label[p - w] < 0) { label[p - w] = id; stack[top++] = p - w; }
      if (y < h - 1 && b[p + w] === value && label[p + w] < 0) { label[p + w] = id; stack[top++] = p + w; }
    }
    sizes.push(n);
    border.push(edge);
  }
  return { label, sizes, border };
}

// fillPercent: fill the background regions that do not touch the border and are smaller than this
// part of the frame (0 = off). keepLargest: remove all subject regions but the largest.
function cleanRegions(b, w, h, fillPercent, keepLargest) {
  const fill = new Uint8Array(w * h), remove = new Uint8Array(w * h);
  if (fillPercent > 0) {
    const r = regions(b, w, h, 0);
    const max = (fillPercent / 100) * w * h;
    for (let i = 0; i < w * h; i++) {
      const id = r.label[i];
      if (id >= 0 && !r.border[id] && r.sizes[id] < max) fill[i] = 1;
    }
  }
  if (keepLargest) {
    const c = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) c[i] = b[i] || fill[i] ? 1 : 0;
    const r = regions(c, w, h, 1);
    let best = -1;
    r.sizes.forEach((n, id) => {
      if (best < 0 || n > r.sizes[best]) best = id;
    });
    for (let i = 0; i < w * h; i++) if (r.label[i] >= 0 && r.label[i] !== best) remove[i] = 1;
  }
  return { fill, remove };
}

return { cleanRegions };
})();

// ---- analysis/cleanplate.js
const { PLATE_FRAMES, plateIndices, medianBytes } = (() => {
// Clean plate (plan §9.2): the median of each pixel and channel over frames that are evenly spaced
// over the video. A moving subject is in each pixel for less than half of the frames, so the median
// is the empty scene. The app gives the planes of the frames as the store keeps them (Y, CbCr), so
// that the background difference compares like with like.

const PLATE_FRAMES = 31;

// The frame indices for a video of n frames.
function plateIndices(n, count = PLATE_FRAMES) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = Math.min(n - 1, Math.round(((i + 0.5) * n) / count - 0.5));
    if (!out.length || out[out.length - 1] !== t) out.push(t);
  }
  return out;
}

// arrays: Uint8Arrays of the same length (one for each frame). The median of each element.
function medianBytes(arrays) {
  const n = arrays.length;
  const len = arrays[0].length;
  const out = new Uint8Array(len);
  const v = new Uint8Array(n);
  const mid = n >> 1;
  for (let i = 0; i < len; i++) {
    for (let k = 0; k < n; k++) v[k] = arrays[k][i];
    // Insertion sort (n is small).
    for (let a = 1; a < n; a++) {
      const x = v[a];
      let b = a - 1;
      while (b >= 0 && v[b] > x) {
        v[b + 1] = v[b];
        b--;
      }
      v[b + 1] = x;
    }
    out[i] = n % 2 ? v[mid] : (v[mid - 1] + v[mid] + 1) >> 1;
  }
  return out;
}

return { PLATE_FRAMES, plateIndices, medianBytes };
})();

// ---- gpu/store.js
const { MAX_STORE_LAYERS, BUDGET_DESKTOP, BUDGET_ANDROID, BUDGET_IOS, workingSize, frameBytes, isIOS, defaultBudget, layerCount, bufferText } = (() => {
// Frame store sizes (plan §6.3, §6.4). No browser APIs, so Node tests can use it.

const MAX_STORE_LAYERS = 1000;
const BUDGET_DESKTOP = 1024 * 1048576;
const BUDGET_ANDROID = 384 * 1048576;
// iPhone / iPad: the GPU memory counts in the memory limit of the Safari tab (WebKit, also Opera
// and Chrome on iOS); above it, the tab is reset (the page flashes, the GPU context is lost).
const BUDGET_IOS = 256 * 1048576;

// The working size for a display size and a short side (0 = source). Never above the source. Even.
function workingSize(w, h, short) {
  const s = short ? Math.min(1, short / Math.min(w, h)) : 1;
  return { width: Math.max(2, Math.round((w * s) / 2) * 2), height: Math.max(2, Math.round((h * s) / 2) * 2) };
}

// YUV 4:2:0 in the store: Y (R8, full size) + CbCr (RG8, half size) = 1.5 bytes for each pixel.
const frameBytes = (w, h) => w * h + 2 * (w / 2) * (h / 2);

// iPadOS gives a Mac user agent: a Mac with touch points is an iPad.
const isIOS = (userAgent = '', touchPoints = 0) => /iPhone|iPad|iPod/i.test(userAgent) || (/Macintosh/i.test(userAgent) && touchPoints > 1);

const defaultBudget = (userAgent = '', touchPoints = 0) => {
  if (isIOS(userAgent, touchPoints)) return BUDGET_IOS;
  return /Android/i.test(userAgent) ? BUDGET_ANDROID : BUDGET_DESKTOP;
};

// N = min(MAX_ARRAY_TEXTURE_LAYERS, floor(budget / bytesPerFrame), 1000), at least 1.
function layerCount(budget, maxLayers, w, h) {
  return Math.max(1, Math.min(maxLayers, Math.floor(budget / frameBytes(w, h)), MAX_STORE_LAYERS));
}

// "Buffer: 240 frames at 540p (≈ 330 MB)".
function bufferText(n, w, h) {
  return `Buffer: ${n} frames at ${Math.min(w, h)}p (≈ ${Math.round((n * frameBytes(w, h)) / 1048576)} MB)`;
}

return { MAX_STORE_LAYERS, BUDGET_DESKTOP, BUDGET_ANDROID, BUDGET_IOS, workingSize, frameBytes, isIOS, defaultBudget, layerCount, bufferText };
})();

// ---- gpu/gl.js
const { createContext, program, texParams, drawQuad } = (() => {
// WebGL2 helpers (plan §5.3): context, programs, textures.

function createContext(canvas) {
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('This browser has no WebGL2.');
  return gl;
}

function shader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
    const log = gl.getShaderInfoLog(s);
    throw new Error(`Shader: ${log}`);
  }
  return s;
}

// A program with its uniform locations: { prog, u: { name: location } }.
function program(gl, vert, frag) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl, gl.VERTEX_SHADER, vert));
  gl.attachShader(p, shader(gl, gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error(`Program: ${gl.getProgramInfoLog(p)}`);
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) || 0;
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { prog: p, u };
}

function texParams(gl, target, filter = gl.LINEAR, minFilter = filter) {
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, minFilter);
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(target, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// Draw the one-triangle quad (quad.vert) into the bound target.
function drawQuad(gl) {
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

return { createContext, program, texParams, drawQuad };
})();
