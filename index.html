  setSession(m) {
    this.session = { w: m.w, h: m.h, fps: m.fps, frames: m.frames, durationUs: m.durationUs, bytes: m.bytes, cuts: m.cuts, points: m.points, canBloom: m.canBloom };
    for (const t of this.thumbs.splice(m.points.length)) if (t && t.close) t.close();

  onMessage(m) {

      this.setSession(m);
      if (m.thumb) this.thumbs[m.points.length - 1] = m.thumb;
      if (m.picture) this.draw(m.picture);
      else if (!m.frames) this.hasPicture = false;

      this.draw(m.picture);

      this.app.changed();

    if (list) {

  // cut, Mosh (the hidden I-frame is not in the file) or Clean (it shows: a normal cut).
  async openExport() {
    const d = this.app.dialog;
    if (!this.frames || this.busy) {
      this.app.message(this.busy ? 'Pause the recording first.' : 'Datamosh: record a clip first (the red button), then export.');
      return;
    }
    const s = this.session;
    const up = await this.canUpscale();
    d.textContent = '';
    if (this.url) URL.revokeObjectURL(this.url);
    this.url = null;
    const form = el('form', { method: 'dialog', className: 'exportForm' });
    form.append(el('h2', {}, 'Export (Datamosh)'));
    const row = (label, input) => {
      const r = el('label', { className: 'exportRow' });
      r.append(el('span', {}, label), input);
      form.append(r);
      return input;
    };
    const sel = (options, value) => {
      const x = el('select');
      for (const [v, t] of options) x.append(el('option', { value: v }, t));
      x.value = value;
      return x;
    };
    const modes = [['original', `Original (${s.w}×${s.h}, the recorded frames)`]];
    if (up && up.ok) modes.push(['sharp', `Upscale ${up.width}×${up.height}, Sharp (the blocks stay)`], ['smooth', `Upscale ${up.width}×${up.height}, Smooth`]);
    const mode = row('Mode', sel(modes, 'original'));
    mode.id = 'moshMode';
    // The cuts: a pause point with frames after it.
    const cutSel = [];
    const cutTimes = s.points.slice(0, s.cuts).map((p) => p.tsUs);
    if (s.cuts > 1) {
      const all = row('All cuts', sel([['', '—'], ['mosh', 'Mosh'], ['clean', 'Clean']], ''));
      all.addEventListener('change', () => {
        if (all.value) for (const c of cutSel) c.value = all.value;
      });
    }
    const box = el('div', { className: 'moshCuts' });
    for (let i = 0; i < s.cuts; i++) {
      const r = el('label', { className: 'exportRow' });
      const c = sel([['mosh', 'Mosh'], ['clean', 'Clean']], 'mosh');
      c.dataset.cut = String(i);
      cutSel.push(c);
      r.append(el('span', {}, `Cut ${i + 1} (${clock(cutTimes[i] ?? 0)})`), c);
      box.append(r);
    }
    form.append(box);
    if (!s.cuts) form.append(el('p', { className: 'note' }, 'One clip: no cut. Record again from another place (or another video) for a mosh.'));
    const base = this.app.file() ? this.app.file().name.replace(/\.[^.]+$/, '') : 'neofx';
    const name = row('File name', el('input', { type: 'text', value: `${base}-mosh.mp4` }));
    const prog = el('div', { className: 'exportProgress', hidden: true });
    const bar = el('div', { className: 'bar' });
    const text = el('p', { className: 'exportText' });
    prog.append(el('div', { className: 'track' }), text);
    prog.firstChild.append(bar);
    form.append(prog);
    form.append(el('p', { className: 'note' }, 'No audio (the clips come from different places). Original is a true datamosh stream: each player shows the same pictures.'));
    const buttons = el('div', { className: 'exportButtons' });
    const cancel = el('button', { type: 'button', id: 'moshCancel' }, 'Cancel');
    const go = el('button', { type: 'button', className: 'primary', id: 'moshGo' }, 'Export');
    buttons.append(cancel, go);
    form.append(buttons);
    d.append(form);
    cancel.addEventListener('click', () => {
      if (this.exporting) this.cancelExport();
      else d.close();
    });
    d.oncancel = (e) => {
      if (!this.exporting) return;
      e.preventDefault();
      this.cancelExport();
    };
    d.onclose = () => {
      if (this.exporting) this.cancelExport();
      if (this.url) URL.revokeObjectURL(this.url);
      this.url = null;
    };
    go.addEventListener('click', async () => {
      if (this.exporting) return;
      go.disabled = true;
      for (const i of form.querySelectorAll('select, input')) i.disabled = true;
      prog.hidden = false;
      text.textContent = 'Preparing…';
      try {
        const r = await this.export({ mode: mode.value === 'original' ? 'original' : 'upscale', smooth: mode.value === 'smooth', cuts: cutSel.map((c) => c.value) }, (p) => {
          bar.style.width = `${Math.round((100 * p.done) / p.total)}%`;
          text.textContent = `${p.done} / ${p.total} frames`;
        });
        if (!d.open || !form.isConnected) return;
        bar.style.width = '100%';
        text.textContent = `Done: ${r.width}×${r.height}, ${r.frames} frames, ${(r.size / 1048576).toFixed(1)} MB.`;
        const file = new File([r.blob], name.value || `${base}-mosh.mp4`, { type: 'video/mp4' });
        this.url = URL.createObjectURL(file);
        buttons.textContent = '';
        const close = el('button', { type: 'button' }, 'Close');
        close.addEventListener('click', () => d.close());
        buttons.append(close);
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          const sh = el('button', { type: 'button', id: 'moshShare' }, 'Share');
          sh.addEventListener('click', () => navigator.share({ files: [file], title: file.name }).catch(() => {}));
          buttons.append(sh);
        }
        buttons.append(el('a', { href: this.url, download: file.name, className: 'button primary', id: 'moshDownload' }, 'Download'));
      } catch (e) {
        text.textContent = e.message;
        cancel.textContent = 'Close';
      }
    });
    d.showModal();
  }
}

return { MOSH_SIZES, MOSH_RATES, MOSH_LOOK, MOSH_DEFAULTS, moshSize, Mosh };
})();

    maxAgeEdge: 120, // frames (Subject edge source)

    offsetAngle: 0,
  },
};

const clone = (o) => JSON.parse(JSON.stringify(o));

// Read and write a value by a path such as 'timemap.maxDelay'.
function getPath(o, path) {
  return path.split('.').reduce((x, k) => x[k], o);
}

function setPath(o, path, v) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((x, k) => x[k], o)[last] = v;
}

// The delay steps setting: 0 or 2..64 (1 is not a valid value).
const fixSteps = (v, prev = 0) => (v === 1 ? (prev > 1 ? 0 : 2) : Math.max(0, Math.min(64, Math.round(v))));

return { DEFAULTS, clone, getPath, setPath, fixSteps };
})();

// ---- app/platform.js
const { checkPlatform } = (() => {
// Platform checks at startup (plan §4). Each check gives { ok, fatal, message }.

async function checkPlatform() {
  const out = { ok: true, fatal: null, notes: [], gl: null };
  let gl = null;
  try {
    gl = document.createElement('canvas').getContext('webgl2');
  } catch {
    gl = null;
  }
  if (!gl) {
    out.ok = false;
    out.fatal = 'This browser has no WebGL2.';
    return out;
  }
  const floatTargets = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
  if (!floatTargets) out.notes.push('No float render targets: some modes lose precision.');
  let renderer = '';
  try {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  } catch { /* not given */ }
  out.gl = {
    renderer,
    floatTargets,
    maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
    maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  };
  const lose = gl.getExtension('WEBGL_lose_context');
  if (lose) lose.loseContext();
  if (typeof VideoDecoder === 'undefined') {
    out.ok = false;
    out.fatal = 'This browser cannot decode video (no WebCodecs VideoDecoder).';
    return out;
  }
  out.encoder = typeof VideoEncoder !== 'undefined';
  if (!out.encoder) out.notes.push('No H.264 encoder: export is disabled.');
  out.offscreen = typeof OffscreenCanvas !== 'undefined' && (() => {
    try {
      const g = new OffscreenCanvas(1, 1).getContext('webgl2');
      const ext = g && g.getExtension('WEBGL_lose_context');
      if (ext) ext.loseContext(); // give the test context back (iOS has few contexts)
      return !!g;
    } catch {
      return false;
    }
  })();
  return out;
}

return { checkPlatform };
})();

// ---- app/player.js
const { makeWorker, Player } = (() => {
// The player (plan §6.2, §12.8): one decode worker for the preview, one for the timeline thumbnails.
// Each decoded frame goes into the frame store of the GPU engine (also the warm-up frames and the
// frames that playback drops), so the store always holds the frames before the playhead. A seek
// decodes only the frames of max(0, t - depth) .. t that are not in the store.

function makeWorker(src) {
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const wk = new Worker(url);
  URL.revokeObjectURL(url);
  return wk;
}

// opts: {
//   consume(index, frame, show) -> Promise: put the frame into the store (show: also render it).
//     It must send the frame on at once (the order of the calls is the store order).
//   render(index) -> Promise: render a frame that is in the store.
//   onState(player), onThumb(i, index, bitmap), onError(message), onProgress(fraction | null) }
class Player {
  constructor(workerSrc, opts) {
    this.src = workerSrc;
    this.opts = opts;
    this.wk = null;
    this.thumbWk = null;
    this.info = null;
    this.job = 0;
    this.current = -1; // the frame index on the preview
    this.playing = false;
    this.loop = false;
    this.inPoint = null;
    this.outPoint = null;
    this.depth = 0; // frames of history that the effect needs (Mode 1: Max delay)
    this.n = 0; // store layers
    this.have = new Int32Array(0); // the frame index in each store layer (mirror of the engine)
    this.busy = false; // a seek runs
    this.pendingSeek = null;
    this.queue = []; // playback: decoded frames, in display order
    this.raf = 0;
    this.clock = null; // { wall, us }
    this.stats = { shown: 0, dropped: 0, t0: 0, fps: 0, decodeJobs: 0 };
    this.log = []; // the presented frame indices of the last playback (for tests)
    // Perfect loop (Time Map): the store indices are virtual: real + pass × L (the loop [a, a + L − 1]),
    // so the history of the first frames of the loop is the end of the loop (the pass before).
    // Without it, the store index is the frame index.
    this.wrap = null; // null, or { a, L }
    this.pass = 0;
    this.vcur = -1; // the store index of the frame on the preview
    this.jobPass = () => this.pass; // real frame -> its pass, for the frames of the decode job
  }

  // Perfect loop on (the loop range) or off. The store is forgotten (the indices change meaning).
  setWrap(on) {
    const [a, b] = this.range();
    const w = on && this.info ? { a, L: b - a + 1 } : null;
    if (JSON.stringify(w) === JSON.stringify(this.wrap)) return false;
    this.pause();
    this.wrap = w;
    this.pass = w ? 1 : 0;
    this.have.fill(-1);
    this.vcur = -1;
    return true;
  }

  // The store index of real frame t in a pass.
  virt(t, pass = this.pass) {
    return this.wrap ? t + pass * this.wrap.L : t;
  }

  get frameCount() {
    return this.info ? this.info.times.length : 0;
  }

  // Open a file. Resolves with the info, or rejects with the message for the user.
  open(file) {
    this.close();
    this.wk = makeWorker(this.src);
    return new Promise((resolve, reject) => {
      this.wk.onmessage = (e) => {
        const m = e.data;
        if (m.cmd === 'info') {
          this.info = m;
          this.wk.onmessage = (ev) => this.onMessage(ev.data);
          this.startThumbs(file);
          resolve(m);
        } else if (m.cmd === 'error') {
          this.close();
          reject(new Error(m.message));
        }
      };
      this.wk.onerror = (e) => {
        this.close();
        reject(new Error(e.message || 'Decode worker failed.'));
      };
      this.wk.postMessage({ cmd: 'open', file });
    });
  }

  close() {
    this.pause();
    for (const w of [this.wk, this.thumbWk]) if (w) w.terminate();
    this.wk = this.thumbWk = null;
    this.info = null;
    this.current = -1;
    this.vcur = -1;
    this.wrap = null;
    this.pass = 0;
    this.busy = false;
    this.pendingSeek = null;
    this.inPoint = this.outPoint = null;
  }

  // A new (empty) store of n layers: after the engine configure.
  setStore(n) {
    this.n = n;
    this.have = new Int32Array(n).fill(-1);
  }

  inStore(t) {
    return t >= 0 && this.n > 0 && this.have[t % this.n] === t;
  }

  startThumbs(file) {
    const wk = (this.thumbWk = makeWorker(this.src));
    wk.onmessage = (e) => {
      const m = e.data;
      if (wk !== this.thumbWk) return m.bitmap && m.bitmap.close(); // an old file
      if (m.cmd === 'info') wk.postMessage({ cmd: 'thumbs', job: 1, count: 50, width: 160 });
      else if (m.cmd === 'thumb') {
        if (this.opts.onThumb) this.opts.onThumb(m.i, m.index, m.bitmap);
        else m.bitmap.close();
      } else if (m.cmd === 'done' || m.cmd === 'error') {
        wk.terminate();
        this.thumbWk = null;
      }
    };
    // The clean sync samples are known from the first worker: no second scan of the file.
    wk.postMessage({ cmd: 'open', file, keys: this.info.cleanKeys });
  }

  range() {
    const n = this.frameCount;
    const a = this.inPoint ?? 0, b = this.outPoint ?? n - 1;
    return [Math.min(a, b), Math.max(a, b)];
  }

  state() {
    if (this.opts.onState) this.opts.onState(this);
  }

  progress(f) {
    if (this.opts.onProgress) this.opts.onProgress(f);
  }

  // The history depth that the store can hold.
  get usableDepth() {
    return Math.max(0, Math.min(this.depth, this.n - 1, this.wrap ? this.wrap.L - 1 : Infinity));
  }

  // The first frame of from..t that is not in the store, or t + 1.
  firstMissing(from, t) {
    let m = from;
    while (m <= t && this.inStore(m)) m++;
    return m;
  }

  // Show frame t (frame-exact). Seeks that come while one runs are joined: only the last one runs.
  seek(t) {
    if (!this.info) return Promise.resolve();
    t = Math.max(0, Math.min(this.frameCount - 1, Math.round(t)));
    if (this.wrap) t = Math.max(this.wrap.a, Math.min(this.wrap.a + this.wrap.L - 1, t)); // the loop
    if (this.playing) this.pause();
    return new Promise((resolve) => {
      if (this.pendingSeek) this.pendingSeek.resolve();
      this.pendingSeek = { t, resolve };
      if (!this.busy) this.nextSeek();
    });
  }

  nextSeek() {
    const p = this.pendingSeek;
    if (!p) return;
    this.pendingSeek = null;
    this.busy = true;
    this.seekDone = p.resolve;
    this.target = p.t;
    const pass = this.pass;
    const v = this.virt(p.t);
    const from = this.firstMissing(Math.max(0, v - this.usableDepth), v);
    if (from > v) {
      // All in the store: no decode.
      const job = ++this.job;
      this.opts.render(v).then(() => {
        if (job !== this.job) return;
        this.current = p.t;
        this.vcur = v;
        this.finishSeek();
      }, (e) => this.seekFailed(job, e));
      return;
    }
    this.warm = { from, total: v - from + 1, done: 0 };
    this.stats.decodeJobs++;
    const W = this.wrap;
    if (W && from < this.virt(W.a)) {
      // The history starts in the pass before: the end of the loop, then its start up to t. All go
      // into the store first; then frame t is rendered (renderAfter).
      const realFrom = from - (pass - 1) * W.L;
      this.jobPass = (r) => (r > p.t ? pass - 1 : pass);
      this.renderAfter = { t: p.t, v };
      this.wk.postMessage({ cmd: 'seek', job: ++this.job, t: p.t, ranges: [[W.a, p.t], [realFrom, W.a + W.L - 1]], allWarm: true });
      return;
    }
    this.jobPass = () => pass;
    this.renderAfter = null;
    this.wk.postMessage({ cmd: 'seek', job: ++this.job, t: p.t, from: from - (W ? pass * W.L : 0) });
  }

  // The render of a seek failed (the GPU was reset): the seek ends, so the next one can run (a
  // seek that stays busy would block every later seek, also the one that restores the preview).
  seekFailed(job, e) {
    this.fail(e.message);
    if (job === this.job) this.finishSeek();
  }

  finishSeek() {
    this.busy = false;
    this.progress(null);
    if (this.seekDone) this.seekDone();
    this.seekDone = null;
    this.nextSeek();
    this.state();
  }

  step(n) {
    const base = this.pendingSeek ? this.pendingSeek.t : this.busy ? this.target : this.current;
    return this.seek(Math.max(0, base) + n);
  }

  toggle() {
    if (this.playing) this.pause();
    else this.play();
  }

  play() {
    if (!this.info || this.playing) return;
    const [a, b] = this.range();
    let from = this.current + 1;
    if (from > b || from < a) from = a;
    const W = this.wrap;
    const v = this.virt(from);
    // Perfect loop: a history in the pass before that is not in the store: a seek loads it first.
    if (W && !this.seekingForPlay && this.firstMissing(Math.max(0, v - this.usableDepth), v - 1) < this.virt(W.a)) {
      this.seekingForPlay = true;
      this.seek(from).then(() => {
        this.seekingForPlay = false;
        if (this.current === from) this.play();
      });
      return;
    }
    // The decode starts at the first frame of the history of 'from' that is not in the store.
    const start = this.firstMissing(Math.max(W ? this.virt(W.a) : 0, v - this.usableDepth), v) - (W ? this.pass * W.L : 0);
    const pass = this.pass;
    this.jobPass = () => pass;
    this.renderAfter = null;
    this.playing = true;
    this.pendingSeek = null;
    this.busy = false;
    this.queue = [];
    this.clock = null;
    this.log = [];
    this.showFrom = from;
    this.decodeDone = false;
    this.stats = { ...this.stats, shown: 0, dropped: 0, t0: performance.now(), fps: 0 };
    this.playTo = b;
    this.stats.decodeJobs++;
    this.wk.postMessage({ cmd: 'play', job: ++this.job, from: Math.min(start, from), to: b });
    this.raf = requestAnimationFrame((now) => this.tick(now));
    this.state();
  }

  pause() {
    if (!this.playing) return;
    this.playing = false;
    cancelAnimationFrame(this.raf);
    if (this.wk) this.wk.postMessage({ cmd: 'stop' });
    this.job++;
    // The decoded frames after the playhead do not go into the store: in a small ring they would
    // take the place of the history of the frame on the preview.
    for (const q of this.queue) this.drop(q.frame);
    this.queue = [];
    this.state();
  }

  // A frame of a job that was cancelled.
  drop(frame) {
    frame.close();
    if (this.wk) this.wk.postMessage({ cmd: 'ack' });
  }

  // Into the store (and on the preview when show). The decode worker gets its ack after the upload.
  deliver(t, frame, show) {
    const index = this.virt(t, this.jobPass(t));
    if (this.n) this.have[index % this.n] = index;
    if (show) {
      this.current = t;
      this.vcur = index;
    }
    const wk = this.wk;
    return this.opts.consume(index, frame, show).catch((e) => this.fail(e.message)).finally(() => {
      if (wk) wk.postMessage({ cmd: 'ack' });
    });
  }

  fail(message) {
    if (this.opts.onError) this.opts.onError(message);
  }

  onMessage(m) {
    if (m.cmd === 'frame') {
      if (m.job !== this.job) return this.drop(m.frame);
      if (this.playing) {
        if (m.index < this.showFrom) this.deliver(m.index, m.frame, false); // warm-up: no clock
        else this.queue.push({ index: m.index, frame: m.frame });
        return;
      }
      if (m.warm) {
        this.deliver(m.index, m.frame, false);
        this.warm.done++;
        if (this.warm.total > 1) this.progress(this.warm.done / this.warm.total);
        return;
      }
      this.deliver(m.index, m.frame, true);
      this.state();
    } else if (m.cmd === 'done') {
      if (m.job !== this.job) return;
      // Playback: the decoder gave all that it has. The tick ends the playback when the queue is
      // empty, also when the last frames did not come (a damaged end of the file).
      if (this.playing) return void (this.decodeDone = true);
      const ra = this.renderAfter;
      if (ra) {
        // A perfect-loop seek: all the frames are in the store; now frame t.
        this.renderAfter = null;
        const job = this.job;
        this.opts.render(ra.v).then(() => {
          if (job !== this.job) return;
          this.current = ra.t;
          this.vcur = ra.v;
          this.finishSeek();

        return;
      }
      this.finishSeek();
    } else if (m.cmd === 'error') {
      if (m.job !== undefined && m.job !== this.job) return;
      this.fail(m.message);
      if (this.playing) return this.pause();
      this.finishSeek();
    }
  }

  // Playback clock: the file time moves with the wall clock from the first shown frame. The newest
  // frame that is due is shown; older due frames go into the store without a render (dropped).
  // The frames before showFrom are the warm-up (history): into the store at once.
  tick(now) {
    if (!this.playing) return;
    const T = this.info.times;
    while (this.queue.length && this.queue[0].index < this.showFrom) {
      const q = this.queue.shift();
      this.deliver(q.index, q.frame, false);
    }
    if (this.queue.length) {
      const head = this.queue[0];
      if (!this.clock) this.clock = { wall: now, us: T[head.index] };
      const fileUs = this.clock.us + (now - this.clock.wall) * 1000;
      let k = -1;
      for (let i = 0; i < this.queue.length && T[this.queue[i].index] <= fileUs + 4000; i++) k = i;
      if (k >= 0) {
        for (let i = 0; i < k; i++) {
          this.stats.dropped++;
          this.deliver(this.queue[i].index, this.queue[i].frame, false);
        }
        const q = this.queue[k];
        this.queue.splice(0, k + 1);
        this.deliver(q.index, q.frame, true);
        this.log.push(q.index);
        this.stats.shown++;
        const sec = (now - this.stats.t0) / 1000;
        if (sec > 0.5) this.stats.fps = this.stats.shown / sec;
        this.state();
      }
    }
    if ((this.current >= this.playTo || this.decodeDone) && !this.queue.length) {
      if (this.loop) {
        this.playing = false;
        this.current = -1;
        if (this.wrap) this.pass++; // the next pass: its history is the end of this one
        this.play();
        return;
      }
      this.pause();
      return;
    }
    this.raf = requestAnimationFrame((n) => this.tick(n));
  }
}

return { makeWorker, Player };
})();

// ---- maps/mapsource.js
const { loadImageMap, videoMapSize, maskVideoSize, loadVideoMap } = (() => {
// Custom maps (plan §7.4): an image file (PNG / JPEG / WebP) or a video file (MP4 / MOV). The GPU
// engine keeps them as luma (BT.709) in an R8 texture array. A video map is decoded fully once, at
// load (with progress), so that each frame of the source has its map frame at once.



const VIDEO_MAP_BUDGET = 256 * 1048576;

async function loadImageMap(file, gpu) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    throw new Error('This image file cannot be read (PNG, JPEG, or WebP).');
  }
  return gpu.call({ cmd: 'mapImage', bitmap }, [bitmap]);
}

// The size and frame count for a video map of w x h with n frames: the short side at most `short`,
// all frames in the budget and in the texture layer limit.
function videoMapSize(w, h, n, short, maxLayers, budget = VIDEO_MAP_BUDGET) {
  const s = Math.min(1, short / Math.min(w, h));
  let width = Math.max(2, Math.round(w * s)), height = Math.max(2, Math.round(h * s));
  const count = Math.max(1, Math.min(n, maxLayers, Math.floor(budget / (width * height)) || 1));
  return { width, height, count };
}

// The size and frame count for an imported mask video of n frames at the working size w x h: all
// the frames (up to the texture layer limit) in the budget. A long video gets a smaller mask (a
// mask is soft; the GPU scales it), not fewer frames.
function maskVideoSize(w, h, n, maxLayers, budget = VIDEO_MAP_BUDGET) {
  const count = Math.max(1, Math.min(n, maxLayers));
  const s = Math.min(1, Math.sqrt(budget / (w * h * count)));
  return { width: Math.max(2, Math.round(w * s)), height: Math.max(2, Math.round(h * s)), count };
}

// opts: { workerSrc, short, maxLayers, onProgress(fraction) }. Resolves with { count, width, height, frames }.
function loadVideoMap(file, gpu, opts) {
  const wk = makeWorker(opts.workerSrc);
  return new Promise((resolve, reject) => {
    let size = null;
    let done = 0;
    const fail = (msg) => {
      wk.terminate();
      reject(new Error(msg));
    };
    wk.onerror = (e) => fail(e.message || 'Decode worker failed.');
    wk.onmessage = async (e) => {
      const m = e.data;
      if (m.cmd === 'error') return fail(m.message);
      if (m.cmd === 'info') {
        size = videoMapSize(m.width, m.height, m.times.length, opts.short, opts.maxLayers);
        size.frames = m.times.length;
        size.rotation = m.rotation;
        try {
          await gpu.call({ cmd: 'mapVideoBegin', width: size.width, height: size.height, count: size.count });
        } catch (err) {
          return fail(err.message);
        }
        wk.postMessage({ cmd: 'play', job: 1, from: 0, to: size.count - 1 });
      } else if (m.cmd === 'frame') {
        try {
          await gpu.call({ cmd: 'mapVideoFrame', i: m.index, frame: m.frame, rotation: size.rotation }, [m.frame]);
        } catch (err) {
          return fail(err.message);
        }
        wk.postMessage({ cmd: 'ack' });
        done++;
        if (opts.onProgress) opts.onProgress(done / size.count);
      } else if (m.cmd === 'done') {
        wk.terminate();
        try {
          await gpu.call({ cmd: 'caps' }); // the replies come in order: all frames are in
        } catch (err) {
          return reject(err);
        }
        resolve(size);
      }
    };
    wk.postMessage({ cmd: 'open', file });
  });
}

return { loadImageMap, videoMapSize, maskVideoSize, loadVideoMap };
})();

// ---- app/gpu-client.js
const { GpuClient } = (() => {
// The page side of the GPU engine: the GPU worker when the browser has OffscreenCanvas with WebGL2,
// else the engine on the main thread (plan §4 fallback). call(msg) -> Promise of the reply. The
// replies come in the order of the calls.




class GpuClient {
  constructor(canvas, workerSrc, useWorker) {
    this.mode = useWorker ? 'worker' : 'main';
    this.lost = false;
    this.onLost = null; // the GPU context was lost (the browser reset the GPU, often: out of memory)
    this.next = 1;
    this.waiting = new Map();
    this.settingsBusy = 0; // the count of 'settings' messages at the worker
    this.settingsNext = null; // the newest settings that wait: { settings, promise, resolve, reject }
    if (useWorker) {
      this.wk = makeWorker(workerSrc);
      // The worker script failed: the calls that wait (also 'init') fail, not hang.
      this.wk.onerror = (e) => {
        const err = new Error(e.message || 'The GPU worker failed.');
        for (const w of this.waiting.values()) w.reject(err);
        this.waiting.clear();
      };
      this.wk.onmessage = (e) => {
        if (e.data.event === 'lost') return this.lostNow();
        const { id, reply, error } = e.data;
        const w = this.waiting.get(id);
        this.waiting.delete(id);
        if (!w) return;
        if (error) w.reject(new Error(error));
        else w.resolve(reply);
      };
      const off = canvas.transferControlToOffscreen();
      this.ready = this.call({ cmd: 'init', canvas: off }, [off]);
    } else {
      this.engine = new Engine(canvas);
      this.engine.onLost = () => this.lostNow();
      this.ready = Promise.resolve({ cmd: 'caps', ...this.engine.caps });
    }
  }

  // Stop this engine (a GPU restart makes a new one on a new canvas): the calls that wait fail, and
  // the context is given back (its memory) when it still lives.
  dispose() {
    this.disposed = true;
    if (this.wk) this.wk.terminate();
    for (const w of this.waiting.values()) w.reject(new Error('The GPU was restarted.'));
    this.waiting.clear();
    if (this.settingsNext) this.settingsNext.reject(new Error('The GPU was restarted.'));
    this.settingsNext = null;
    if (this.engine) {
      try {
        const ext = this.engine.gl.getExtension('WEBGL_lose_context');
        if (ext && !this.engine.gl.isContextLost()) ext.loseContext();
      } catch { /* lost */ }
    }
  }

  lostNow() {
    if (this.lost || this.disposed) return;
    this.lost = true;
    if (this.onLost) this.onLost();
  }

  // Send the effect settings. The engine renders the frame again for each 'settings' message, and
  // a slider drag gives many of them: while one is at the worker, only the newest one waits (the
  // ones between are dropped), so the preview does not fall behind the slider on a slow GPU. The
  // order with the other calls stays: a waiting one is sent before the next call. The promise
  // resolves when the engine has these settings (or newer ones).
  setSettings(settings) {
    if (this.engine || this.disposed || !this.settingsBusy) return this.sendSettings(settings);
    const n = this.settingsNext;
    if (n) {
      n.settings = settings;
      return n.promise;
    }
    const next = (this.settingsNext = { settings });
    next.promise = new Promise((resolve, reject) => Object.assign(next, { resolve, reject }));
    return next.promise;
  }

  sendSettings(settings) {
    this.settingsBusy++;
    const p = this.rawCall({ cmd: 'settings', settings });
    const done = () => {
      if (--this.settingsBusy === 0) this.flushSettings();
    };
    p.then(done, done);
    return p;
  }

  flushSettings() {
    const n = this.settingsNext;
    if (!n) return;
    this.settingsNext = null;
    this.sendSettings(n.settings).then(n.resolve, n.reject);
  }

  call(msg, transfer = []) {
    this.flushSettings(); // the order of the calls
    return this.rawCall(msg, transfer);
  }

  rawCall(msg, transfer = []) {
    if (this.disposed) {
      if (msg.frame) try { msg.frame.close(); } catch { /* closed */ }
      return Promise.reject(new Error('The GPU was restarted.'));
    }
    if (this.engine) {
      try {
        return Promise.resolve(this.engine.handle(msg));
      } catch (e) {
        if (msg.frame) try { msg.frame.close(); } catch { /* closed */ }
        return Promise.reject(e);
      }
    }
    const id = this.next++;
    return new Promise((resolve, reject) => {
      this.waiting.set(id, { resolve, reject });
      this.wk.postMessage({ id, msg }, transfer);
    });
  }
}

return { GpuClient };
})();

// ---- app/preview.js
const { WORKING_SIZES, Preview } = (() => {
// The preview canvas (plan §12.1, §12.2, D19). The GPU engine draws into it (from the GPU worker
// through an OffscreenCanvas, or on the main thread). Here: its CSS size and place. Zoom: Fit (the
// default: as large as the area), 100 % (one working pixel = one CSS pixel), the mouse wheel (about
// the pointer), pan with the middle button or Space + drag, and two fingers (pinch and pan) on touch.
// One finger stays for the tools (line, brush, eyedropper).

const WORKING_SIZES = [360, 540, 720, 1080, 0]; // short side; 0 = source

class Preview {
  constructor(canvas, area) {
    this.canvas = canvas;
    this.area = area;
    this.w = 0;
    this.h = 0;
    this.zoom = null; // null = Fit; else the scale (CSS px for each working px)
    this.pan = [0, 0]; // the offset of the canvas centre from the area centre (CSS px)
    this.onChange = null;
    this.space = false;
    new ResizeObserver(() => this.fit()).observe(area);
    // Space held: drag to pan. spacePanned: a pan happened while Space was down (then Space does
    // not toggle playback when it comes up).
    this.spacePanned = false;
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' && !e.repeat && !e.target.closest('input, select, textarea')) {
        this.space = true;
        this.spacePanned = false;
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === ' ') this.space = false;
    });
    area.addEventListener('wheel', (e) => {
      if (!this.w) return;
      e.preventDefault();
      this.zoomAt(this.scale() * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    }, { passive: false });
    // Pan (middle button, or Space + left button) and pinch (two touch pointers).
    const touches = new Map();
    let pan = null, pinch = null;
    area.addEventListener('pointerdown', (e) => {
      if (!this.w) return;
      if (e.pointerType === 'touch') {
        touches.set(e.pointerId, [e.clientX, e.clientY]);
        if (touches.size === 2) {
          const [a, b] = [...touches.values()];
          pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: this.scale(), mid: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], pan: this.pan.slice() };
          e.stopPropagation();
        }
        return;
      }
      if (e.button === 1 || (e.button === 0 && this.space)) {
        e.preventDefault();
        e.stopPropagation();
        area.setPointerCapture(e.pointerId);
        pan = { x: e.clientX, y: e.clientY, pan: this.pan.slice() };
      }
    }, true);
    area.addEventListener('pointermove', (e) => {
      if (pan) {
        this.setPan([pan.pan[0] + e.clientX - pan.x, pan.pan[1] + e.clientY - pan.y]);
        if (this.space) this.spacePanned = true;
        return;
      }
      if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
        touches.set(e.pointerId, [e.clientX, e.clientY]);
        if (pinch && touches.size === 2) {
          const [a, b] = [...touches.values()];
          const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
          const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          this.pan = [pinch.pan[0] + mid[0] - pinch.mid[0], pinch.pan[1] + mid[1] - pinch.mid[1]];
          this.zoomAt(pinch.s * (d / Math.max(1, pinch.d)), mid[0], mid[1], true);
          e.stopPropagation();
        }
      }
    }, true);
    const up = (e) => {
      pan = null;
      touches.delete(e.pointerId);
      if (touches.size < 2) pinch = null;
    };
    area.addEventListener('pointerup', up, true);
    area.addEventListener('pointercancel', up, true);
  }

  setSize(w, h) {
    this.w = w;
    this.h = h;
    this.fit();
  }

  fitScale() {
    const r = this.area.getBoundingClientRect();
    return Math.min(r.width / this.w, r.height / this.h);
  }

  scale() {
    return this.zoom ?? this.fitScale();
  }

  // 'fit' or a scale (1 = 100 %).
  setZoom(z) {
    this.zoom = z === 'fit' ? null : z;
    if (z === 'fit') this.pan = [0, 0];
    this.fit();
  }

  setPan(p) {
    this.pan = p;
    this.fit();
  }

  // Zoom to scale s; the picture point under (cx, cy) stays there.
  zoomAt(s, cx, cy, keepPan = false) {
    const fit = this.fitScale();
    s = Math.min(16, Math.max(fit * 0.25, s));
    const r = this.area.getBoundingClientRect();
    if (!keepPan) {
      const old = this.scale();
      const ox = cx - (r.left + r.width / 2 + this.pan[0]), oy = cy - (r.top + r.height / 2 + this.pan[1]);
      this.pan = [this.pan[0] + ox - (ox * s) / old, this.pan[1] + oy - (oy * s) / old];
    }
    this.zoom = Math.abs(s - fit) < 1e-3 ? null : s;
    this.fit();
  }

  fit() {
    if (!this.w) return;
    const r = this.area.getBoundingClientRect();
    const s = this.scale();
    if (!(s > 0)) return;
    const cw = this.w * s, ch = this.h * s;
    const st = this.canvas.style;
    st.position = 'absolute';
    st.width = `${Math.round(cw)}px`;
    st.height = `${Math.round(ch)}px`;
    st.left = `${Math.round((r.width - cw) / 2 + this.pan[0])}px`;
    st.top = `${Math.round((r.height - ch) / 2 + this.pan[1])}px`;
    if (this.onChange) this.onChange();
  }
}

return { WORKING_SIZES, Preview };
})();

// ---- app/ui/timeline.js
const { formatTime, Timeline } = (() => {
// Transport and timeline (plan §12.2, §12.3, §12.7): buttons, time, frame number, Loop, the
// thumbnail strip with the playhead and the In / Out markers. Drag on the strip to scrub.

// The play / pause icons (SVG: the media symbols are emoji on iOS).
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>';

function formatTime(us) {
  const cs = Math.max(0, Math.floor(us / 10000));
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
}

class Timeline {
  constructor(root, player) {
    this.root = root;
    this.player = player;
    this.thumbs = [];
    this.$ = (sel) => root.querySelector(sel);
    this.strip = this.$('.strip');
    this.ctx = this.strip.getContext('2d');
    const P = player;
    const on = (sel, fn) => this.$(sel).addEventListener('click', fn);
    on('[data-act=first]', () => P.seek(P.range()[0] === P.current ? 0 : P.range()[0]));
    on('[data-act=prev]', () => P.step(-1));
    on('[data-act=play]', () => P.toggle());
    on('[data-act=next]', () => P.step(1));
    on('[data-act=last]', () => P.seek(P.range()[1] === P.current ? P.frameCount - 1 : P.range()[1]));
    on('[data-act=loop]', () => {
      P.loop = !P.loop;
      this.update();
    });

      const r = this.strip.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      P.seek(Math.round(x * (P.frameCount - 1)));

      drag = true;
      this.strip.setPointerCapture(e.pointerId);

    // (the time text changes just before).

      this.size = [r.width, r.height];

  setIn() {
    const P = this.player;
    P.inPoint = P.inPoint === P.current ? null : P.current;
    this.update();
  }

  setOut() {
    const P = this.player;
    P.outPoint = P.outPoint === P.current ? null : P.current;
    this.update();
  }

  // A new file: the thumbnails of the old one are closed (an ImageBitmap holds memory, on the GPU
  // on some browsers, until it is closed).
  reset() {
    for (const th of this.thumbs) if (th && th.bitmap.close) th.bitmap.close();
    this.thumbs = [];
    this.thumbVersion = (this.thumbVersion || 0) + 1;
    this.update();
  }

  addThumb(i, index, bitmap) {
    const old = this.thumbs[i];
    if (old && old.bitmap.close) old.bitmap.close();
    this.thumbs[i] = { index, bitmap };
    this.thumbVersion = (this.thumbVersion || 0) + 1;
    this.draw();
  }

  update() {
    const P = this.player;
    const info = P.info;
    const t = Math.max(0, P.current);
    const play = this.$('[data-act=play]');

    }

    E.loop.classList.toggle('on', P.loop);
    E.time.textContent = info ? `${formatTime(info.times[t])} / ${formatTime(info.durationUs)}` : '00:00.00 / 00:00.00';
    E.frame.textContent = info ? `f ${t}` : 'f –';
