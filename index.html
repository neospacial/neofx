const TIMEMAP_FRAG = "// Mode 1, Time Map (plan §7.1). For each pixel: d = map value × Max delay (frames, after the delay\n// steps), src = t − d. src < 0: black (not online, D8). Frame blend: mix the two frames around src;\n// else the frame t − round(d). Each frame comes from the store at the same pixel. A frame that is not\n// in the store is black. u_view: 0 = result, 1 = original (frame t), 2 = the map.\nuniform highp sampler2D u_map;\nuniform int u_t;\nuniform float u_max;\nuniform int u_steps;\nuniform bool u_blend;\nuniform int u_view;\nuniform int u_comp;     // effect composite: 0 replace, 1 blend\nuniform vec2 u_shift;   // spatial offset at v = 1 (uv units)\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y); // the canvas has its first row at the bottom\n  vec3 base = frameAt(u_t, uv).rgb;\n  if (u_view == 1) { o = vec4(base, 1.0); return; }\n  float v = texture(u_map, uv).r;\n  if (u_view == 2) { o = vec4(v, v, v, 1.0); return; }\n  if (u_steps > 1) v = min(floor(v * float(u_steps)), float(u_steps - 1)) / float(u_steps - 1);\n  float d = v * u_max;\n  float src = float(u_t) - d;\n  // Not online (D8): black with Replace; transparent (the base shows) with Blend (§10.1).\n  if (src < -1e-3) { o = vec4(subjectOver(u_comp == 0 ? vec3(0.0) : base, base, uv), 1.0); return; } // the epsilon: float error of v × Max\n  src = max(src, 0.0);\n  vec2 suv = uv + v * u_shift; // spatial offset: the delayed pixel also moves\n  vec3 c;\n  if (u_blend) {\n    float k0 = floor(src);\n    float f = src - k0;\n    c = frameAt(int(k0), suv).rgb;\n    if (f > 0.0) c = mix(c, frameAt(int(k0) + 1, suv).rgb, f);\n  } else {\n    c = frameAt(u_t - int(floor(d + 0.5)), suv).rgb;\n  }\n  c = ageLook(c, d);\n  o = vec4(subjectOver(u_comp == 0 ? c : composite(base, c, u_opacity * decayAlpha(d)), base, uv), 1.0);\n}\n";
const COMPOSITE_GLSL = "// Compositor (plan §10). The effect layer goes on the base with a blend mode (W3C Compositing and\n// Blending Level 1 formulas; Add, Subtract, Divide as in common editors) and an alpha:\n//   result = (1 − αs) · Cb + αs · B(Cb, Cs)      (the base is opaque)\n// Linear blend: the colours go to linear light (sRGB curve) for the blend and back.\nuniform int u_blendMode;\nuniform bool u_linear;\n\nvec3 toLinear(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }\nvec3 toSrgb(vec3 c) { return mix(c * 12.92, 1.055 * pow(max(c, 0.0), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }\n\nfloat bDodge(float b, float s) { return b == 0.0 ? 0.0 : s >= 1.0 ? 1.0 : min(1.0, b / (1.0 - s)); }\nfloat bBurn(float b, float s) { return b >= 1.0 ? 1.0 : s == 0.0 ? 0.0 : 1.0 - min(1.0, (1.0 - b) / s); }\nfloat bHard(float b, float s) { return s <= 0.5 ? b * 2.0 * s : b + (2.0 * s - 1.0) - b * (2.0 * s - 1.0); }\nfloat bSoft(float b, float s) {\n  if (s <= 0.5) return b - (1.0 - 2.0 * s) * b * (1.0 - b);\n  float d = b <= 0.25 ? ((16.0 * b - 12.0) * b + 4.0) * b : sqrt(b);\n  return b + (2.0 * s - 1.0) * (d - b);\n}\nfloat bDivide(float b, float s) { return s == 0.0 ? (b == 0.0 ? 0.0 : 1.0) : min(1.0, b / s); }\n\nfloat lum(vec3 c) { return dot(c, vec3(0.3, 0.59, 0.11)); }\nvec3 clipColor(vec3 c) {\n  float l = lum(c), n = min(min(c.r, c.g), c.b), x = max(max(c.r, c.g), c.b);\n  if (n < 0.0) c = l + (c - l) * l / (l - n);\n  if (x > 1.0) c = l + (c - l) * (1.0 - l) / (x - l);\n  return c;\n}\nvec3 setLum(vec3 c, float l) { return clipColor(c + (l - lum(c))); }\nfloat sat(vec3 c) { return max(max(c.r, c.g), c.b) - min(min(c.r, c.g), c.b); }\nvec3 setSat(vec3 c, float s) {\n  float mx = max(max(c.r, c.g), c.b), mn = min(min(c.r, c.g), c.b);\n  if (mx <= mn) return vec3(0.0);\n  return (c - mn) * s / (mx - mn); // max -> s, min -> 0, mid scaled (the W3C SetSat)\n}\n\nvec3 blendColor(vec3 b, vec3 s, int m) {\n  if (m == 0) return s;\n  if (m == 1) return min(b + s, 1.0);\n  if (m == 2) return b + s - b * s;\n  if (m == 3) return max(b, s);\n  if (m == 4) return vec3(bDodge(b.r, s.r), bDodge(b.g, s.g), bDodge(b.b, s.b));\n  if (m == 5) return vec3(bHard(s.r, b.r), bHard(s.g, b.g), bHard(s.b, b.b)); // overlay = hard light, swapped\n  if (m == 6) return vec3(bSoft(b.r, s.r), bSoft(b.g, s.g), bSoft(b.b, s.b));\n  if (m == 7) return vec3(bHard(b.r, s.r), bHard(b.g, s.g), bHard(b.b, s.b));\n  if (m == 8) return b * s;\n  if (m == 9) return min(b, s);\n  if (m == 10) return vec3(bBurn(b.r, s.r), bBurn(b.g, s.g), bBurn(b.b, s.b));\n  if (m == 11) return max(b - s, 0.0);\n  if (m == 12) return abs(b - s);\n  if (m == 13) return b + s - 2.0 * b * s;\n  if (m == 14) return vec3(bDivide(b.r, s.r), bDivide(b.g, s.g), bDivide(b.b, s.b));\n  if (m == 15) return setLum(setSat(s, sat(b)), lum(b));\n  if (m == 16) return setLum(setSat(b, sat(s)), lum(b));\n  if (m == 17) return setLum(s, lum(b));\n  return setLum(b, lum(s)); // 18 luminosity\n}\n\n// A colour cs with alpha a over the opaque base cb, with blend mode `mode`.\nvec3 compositeWith(vec3 cb, vec3 cs, float a, int mode, bool lin) {\n  if (lin) {\n    cb = toLinear(cb);\n    cs = toLinear(cs);\n  }\n  vec3 r = clamp((1.0 - a) * cb + a * blendColor(cb, cs, mode), 0.0, 1.0);\n  return lin ? toSrgb(r) : r;\n}\n\n// The effect colour cs with alpha a over the opaque base cb (the effect blend mode).\nvec3 composite(vec3 cb, vec3 cs, float a) {\n  return compositeWith(cb, cs, a, u_blendMode, u_linear);\n}\n";
const AGE_GLSL = "// Alpha and age (plan §10.3). Age: frames (Mode 1: the delay d).\nuniform float u_opacity;\nuniform int u_decay;            // 0 full, 1 linear, 2 exponential (half-life), 3 curve\nuniform float u_decayLen;       // frames\nuniform highp sampler2D u_decayCurve; // 256 x 1: alpha = 1 − curve(age / length)\nuniform float u_maxAge;         // the age at \"max age\" (tint and brightness)\nuniform bool u_tintOn;\nuniform vec3 u_tint[4];         // new -> old\nuniform int u_tintN;            // 2..4\nuniform float u_tintAmount;\nuniform float u_ageBright;      // the brightness multiplier at max age\n\nfloat decayAlpha(float age) {\n  float u = age / max(u_decayLen, 1e-3);\n  if (u_decay == 1) return clamp(1.0 - u, 0.0, 1.0);\n  if (u_decay == 2) return exp2(-u);\n  if (u_decay == 3) {\n    float x = clamp(u, 0.0, 1.0) * 255.0;\n    float i = floor(min(x, 254.0));\n    return 1.0 - mix(texelFetch(u_decayCurve, ivec2(int(i), 0), 0).r, texelFetch(u_decayCurve, ivec2(int(i) + 1, 0), 0).r, x - i);\n  }\n  return 1.0;\n}\n\n// Age tint (a ramp of 2 to 4 colours, multiplied, by amount) and age brightness.\nvec3 ageLook(vec3 c, float age) {\n  float u = clamp(age / max(u_maxAge, 1e-3), 0.0, 1.0);\n  if (u_tintOn) {\n    float x = u * float(u_tintN - 1);\n    int i = min(int(floor(x)), u_tintN - 2);\n    vec3 t = mix(u_tint[i], u_tint[i + 1], x - float(i));\n    c = mix(c, c * t, u_tintAmount);\n  }\n  return clamp(c * mix(1.0, u_ageBright, u), 0.0, 1.0);\n}\n";
const COMPTEST_FRAG = "// Tests (plan §13.2): the compositor on given colours. u_b: base, u_s: effect (alpha in .a).\nuniform highp sampler2D u_b;\nuniform highp sampler2D u_s;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  ivec2 p = ivec2(gl_FragCoord.xy);\n  vec4 s = texelFetch(u_s, p, 0);\n  o = vec4(composite(texelFetch(u_b, p, 0).rgb, s.rgb, s.a), 1.0);\n}\n";
const SUBJECT_GLSL = "// The subject layer (plan §9.4, §10.4): the current frame × the subject mask, on top of the result,\n// with its own blend mode and opacity, an optional outline, and spill suppression (chroma key).\nuniform bool u_subOn;\nuniform highp sampler2D u_subMask;\nuniform highp sampler2D u_outline;  // the subject mask, dilated by the outline width\nuniform bool u_outlineOn;\nuniform vec3 u_outlineColor;\nuniform float u_subOpacity;\nuniform int u_subBlend;\nuniform float u_spill;\nuniform vec3 u_keyRgb;\n\nvec3 despill(vec3 c) {\n  vec3 k = u_keyRgb - dot(u_keyRgb, vec3(0.2126, 0.7152, 0.0722));\n  float n = length(k);\n  if (n < 1e-3 || u_spill <= 0.0) return c;\n  k /= n;\n  float a = max(0.0, dot(c - dot(c, vec3(0.2126, 0.7152, 0.0722)), k));\n  return clamp(c - k * a * u_spill, 0.0, 1.0);\n}\n\nvec3 subjectOver(vec3 result, vec3 subj, vec2 uv) {\n  if (!u_subOn) return result;\n  float m = texture(u_subMask, uv).r;\n  vec3 r = compositeWith(result, despill(subj), m * u_subOpacity, u_subBlend, u_linear);\n  if (u_outlineOn) r = mix(r, u_outlineColor, clamp(texture(u_outline, uv).r - m, 0.0, 1.0));\n  return r;\n}\n";
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
const VIEWS = { result: 0, original: 1, map: 2 };

class Engine {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = (this.gl = createContext(canvas));
    this.caps = {
      maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
      maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
      floatTargets: !!gl.getExtension('EXT_color_buffer_float'),
    };
    this.upload = program(gl, QUAD_VERT, UPLOAD_FRAG);
    this.show = program(gl, QUAD_VERT, `#version 300 es\nprecision highp float;\n${STORE_GLSL}\n${SHOW_FRAG}`);
    this.timemap = program(gl, QUAD_VERT, `${HEAD}${STORE_GLSL}\n${COMPOSITE_GLSL}\n${SUBJECT_GLSL}\n${AGE_GLSL}\n${TIMEMAP_FRAG}`);
    this.comptest = null; // made on the first test call
    this.decayTex = gl.createTexture();
    this.decayKey = '';
    this.mapgen = new MapGen(this);
    this.slit = new Slit(this);
    this.mask = new Mask(this);
    this.mapTex = null;
    this.mapKey = '';
    this.layersTex = null;
    this.settings = null;
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    this.src = gl.createTexture();
    this.fb = gl.createFramebuffer();
    this.storeY = this.storeC = null;
    this.n = 0;
    this.layerFrame = null; // the frame index in each layer, -1 = empty
    this.last = { index: -1, delay: undefined };
    this.lost = false;
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      this.lost = true;
    });
  }

  handle(m) {
    if (m.cmd === 'caps') return { cmd: 'caps', ...this.caps };
    if (m.cmd === 'configure') return this.configure(m);
    if (m.cmd === 'upload') {
      this.put(m.index, m.frame);
      if (m.show) this.render(m.index);
      return { cmd: 'uploaded', index: m.index };
    }
    if (m.cmd === 'render') {
      this.render(m.index, m.delay);
      return { cmd: 'rendered', index: m.index };
    }
    if (m.cmd === 'settings') {
      const old = this.settings;
      this.settings = m.settings;
      if (this.n && this.last.index >= 0) this.render(this.last.index, this.last.delay);
      return { cmd: 'rendered', index: this.last.index };
    }
    if (m.cmd === 'read') return this.read();
    if (m.cmd === 'compositeTest') return this.compositeTest(m);
    if (m.cmd === 'slitFrame') {
      this.slit.analysisFrame(m.index, m.frame);
      return { cmd: 'slit', filled: this.slit.filled(), rows: this.slit.H };
    }
    if (m.cmd === 'slitStatus') return { cmd: 'slit', filled: this.slit.filled(), rows: this.slit.H };
    if (m.cmd === 'plateGrab') return this.mask.grabYuv(m.frame);
    if (m.cmd === 'plateYuv') return this.rerender({ cmd: 'plate', ok: this.mask.setPlateYuv(m.Y, m.C) });
    if (m.cmd === 'plateImage') return this.rerender({ cmd: 'plate', ok: this.mask.setPlateImage(m.bitmap) !== false });
    if (m.cmd === 'plateFrame') return this.rerender({ cmd: 'plate', ok: this.mask.setPlateFrame(m.index) });
    if (m.cmd === 'matteStroke') return this.rerender((this.mask.stroke(m.points, m.size, m.hardness, m.mode), { cmd: 'matte' }));
    if (m.cmd === 'matteClear') return this.rerender((this.mask.clearMatte(), { cmd: 'matte' }));
    if (m.cmd === 'maskImportBegin') return (this.mask.beginImport(m.width, m.height, m.count), { cmd: 'import' });
    if (m.cmd === 'maskImportFrame') {
      try {
        this.mask.importFrame(m.i, m.frame, m.rotation);
      } finally {
        m.frame.close();
      }
      return { cmd: 'import' };
    }
    if (m.cmd === 'maskImportClear') return this.rerender((this.mask.clearImport(), { cmd: 'import' }));
    if (m.cmd === 'pick') return this.pick(m);
    if (m.cmd === 'readMask') return this.readMask(m.index);
    if (m.cmd === 'mapImage') {
      const b = m.bitmap;
      const s = Math.min(1, 2048 / Math.max(b.width, b.height));
      const c = this.mapgen.beginCustom(Math.max(1, Math.round(b.width * s)), Math.max(1, Math.round(b.height * s)), 1);
      this.mapgen.putCustom(0, b, 0);
      b.close();
      return this.mapChanged(c);
    }
    if (m.cmd === 'mapVideoBegin') return this.mapChanged(this.mapgen.beginCustom(m.width, m.height, m.count));
    if (m.cmd === 'mapVideoFrame') {
      try {
        this.mapgen.putCustom(m.i, m.frame, m.rotation);
      } finally {
        m.frame.close();
      }
      return this.mapChanged(this.mapgen.custom);
    }
    if (m.cmd === 'mapClear') {
      this.mapgen.clearCustom();
      return this.mapChanged(null);
    }
    if (m.cmd === 'thumbs') return { cmd: 'thumbs', images: this.mapgen.thumbs(m.maps, m.t, m.width, m.height) };
    return null;
  }

  // Make the store for the working size. The budget halves until the allocation works (plan §6.4).
  configure(m) {
    const gl = this.gl;
    const { width: w, height: h } = m;
    this.w = w;
    this.h = h;
    this.rot = m.rotation || 0;
    this.canvas.width = w;
    this.canvas.height = h;
    let budget = m.budget;
    let fails = m.failAlloc || 0; // tests: act as if the first allocations ran out of memory
    for (;;) {
      this.free();
      const n = layerCount(budget, this.caps.maxLayers, w, h);
      while (gl.getError() !== gl.NO_ERROR) { /* clear old errors */ }
      this.storeY = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, n);
      texParams(gl, gl.TEXTURE_2D_ARRAY);
      this.storeC = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, n);
      texParams(gl, gl.TEXTURE_2D_ARRAY);
      // Touch the last layer, so that the driver must commit the memory now.
      this.n = n;
      this.clearLayer(n - 1);
      const err = gl.getError();
      const failed = fails > 0 || err === gl.OUT_OF_MEMORY || gl.isContextLost();
      if (!failed) break;
      fails--;
      if (n === 1 || gl.isContextLost()) {
        if (gl.isContextLost()) throw new Error('The GPU context was lost.');
        break;
      }
      budget = Math.floor(budget / 2);
    }
    this.layerFrame = new Int32Array(this.n).fill(-1);
    this.last = { index: -1, delay: undefined };
    // The frame index of each layer, for the shaders (R32I, N x 1).
    if (this.layersTex) gl.deleteTexture(this.layersTex);
    this.layersTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.layersTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32I, this.n, 1, 0, gl.RED_INTEGER, gl.INT, this.layerFrame);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    // The map (R32F when float targets exist, so long delays keep their precision; else RGBA8).
    if (this.mapTex) gl.deleteTexture(this.mapTex);
    this.mapTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.mapTex);
    if (this.caps.floatTargets) gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R32F, w, h);
    else gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    this.mapKey = '';
    const slit = this.slit.configure(w, h, m.frames || 1);
    this.mask.configure(w, h);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { cmd: 'configured', n: this.n, budget, bytes: this.n * frameBytes(w, h), rows: slit.rows };
  }

  free() {
    const gl = this.gl;
    if (this.storeY) gl.deleteTexture(this.storeY);
    if (this.storeC) gl.deleteTexture(this.storeC);
    this.storeY = this.storeC = null;
  }

  target(tex, layer, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex, 0, layer);
    gl.viewport(0, 0, w, h);
  }

  clearLayer(layer) {
    const gl = this.gl;
    this.target(this.storeY, layer, this.w, this.h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    this.target(this.storeC, layer, this.w / 2, this.h / 2);
    gl.clearColor(0.5, 0.5, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // Convert a VideoFrame (turned, scaled to the working size) to YUV in layer `layer` of the arrays
  // Y and C (plan §6.3), then close it.
  putYuv(frame, Y, C, layer) {
    const gl = this.gl;
    try {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.src);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, frame);
      // A large source: mipmaps, so the scale down does not alias.
      const turned = this.rot % 180 !== 0;
      const sw = turned ? frame.displayHeight : frame.displayWidth;
      const mip = sw > 2 * this.w;
      if (mip) gl.generateMipmap(gl.TEXTURE_2D);
      texParams(gl, gl.TEXTURE_2D, gl.LINEAR, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    } finally {
      frame.close();
    }
    gl.useProgram(this.upload.prog);
    gl.uniform1i(this.upload.u.u_src, 0);
    gl.uniform1i(this.upload.u.u_rot, this.rot);
    gl.uniform1i(this.upload.u.u_mode, 0);
    this.target(Y, layer, this.w, this.h);
    drawQuad(gl);
    gl.uniform1i(this.upload.u.u_mode, 1);
    this.target(C, layer, this.w / 2, this.h / 2);
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // Upload a VideoFrame into layer index mod N of the store (and its slit history row in Mode 2).
  put(index, frame) {
    const gl = this.gl;
    const layer = index % this.n;
    this.putYuv(frame, this.storeY, this.storeC, layer);
    this.layerFrame[layer] = index;
    if (this.settings && isDynamic(this.settings.map)) this.mapKey = ''; // self / motion read the store
    gl.bindTexture(gl.TEXTURE_2D, this.layersTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, layer, 0, 1, 1, gl.RED_INTEGER, gl.INT, new Int32Array([index]));
    if (this.slit.active()) {
      this.slit.update();
      this.slit.writeRow(index, this.storeY, this.storeC, layer);
    }
  }

  // The cutout mask is needed: Cutout on, the Mask view, or a map that uses it.
  maskNeeded() {
    const s = this.settings;
    return s.cutout.mode !== 'off' || s.view === 'mask' || (s.mode === 'timemap' && usesMask(s.map));
  }

  // Render the last frame again (after a change of the cutout inputs), then give the reply.
  rerender(reply) {
    if (this.n && this.last.index >= 0) this.render(this.last.index, this.last.delay);
    return reply;
  }

  // The luma of a picture (ImageBitmap or VideoFrame), turned, into layer i (w x h) of an R8 array.
  lumaInto(tex, i, w, h, source, rotation) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.src);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.generateMipmap(gl.TEXTURE_2D);
    texParams(gl, gl.TEXTURE_2D, gl.LINEAR, gl.LINEAR_MIPMAP_LINEAR);
    gl.useProgram(this.upload.prog);
    gl.uniform1i(this.upload.u.u_src, 0);
    gl.uniform1i(this.upload.u.u_rot, rotation || 0);
    gl.uniform1i(this.upload.u.u_mode, 0);
    this.target(tex, i, w, h);
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // The colour of stored frame index at (u, v) (0..1 of the picture), for the eyedropper.
  pick(m) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.w, this.h);
    gl.useProgram(this.show.prog);
    this.bindStore(this.show);
    gl.uniform1f(this.show.u.u_layer, this.layerOf(m.index));
    drawQuad(gl);
    const x = Math.min(this.w - 1, Math.max(0, Math.floor(m.u * this.w)));
    const y = Math.min(this.h - 1, Math.max(0, Math.floor(m.v * this.h)));
    const px = new Uint8Array(4);
    gl.readPixels(x, this.h - 1 - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    this.rerender(null);
    return { cmd: 'color', rgb: [px[0], px[1], px[2]] };
  }

  // Tests: the final mask of frame index (bytes, the first row at the top).
  readMask(index) {
    const gl = this.gl;
    this.mask.update(index); // a no-op when the mask of index is there (it keeps the temporal state)
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.mask.tex.out, 0);
    const px = new Uint8Array(this.w * this.h * 4);
    gl.readPixels(0, 0, this.w, this.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const out = new Uint8Array(this.w * this.h);
    for (let i = 0; i < out.length; i++) out[i] = px[i * 4];
    return { cmd: 'mask', width: this.w, height: this.h, pixels: out };
  }

  mapChanged(c) {
    this.mapKey = '';
    return { cmd: 'map', ...(c ? { w: c.w, h: c.h, count: c.count, layers: c.layers } : { count: 0 }) };
  }

  // The map of frame t: rendered again when its settings change, and for each frame when it is
  // dynamic (animation, self, motion, video map).
  updateMap(t) {
    if (!this.settings) return;
    const map = this.settings.map;
    const key = JSON.stringify(map) + (isDynamic(map) ? `@${t}` : '') + (usesMask(map) ? this.mask.key : '');
    if (key === this.mapKey) return;
    this.mapgen.run(map, t, this.mapTex, this.w, this.h);
    this.mapKey = key;
  }

  // The layer of frame t, or -1 when it is not in the store (or t < 0).
  layerOf(t) {
    if (t < 0 || !this.n) return -1;
    const l = t % this.n;
    return this.layerFrame[l] === t ? l : -1;
  }

  bindStore(prog) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);
    gl.uniform1i(prog.u.u_storeY, 1);
    gl.uniform1i(prog.u.u_storeC, 2);
  }

  // Render frame index to the canvas. delay (tests): show the stored frame index - delay.
  render(index, delay) {
    const gl = this.gl;
    this.last = { index, delay };
    const s0 = this.settings;
    if (s0 && delay === undefined && this.maskNeeded()) this.mask.update(index);
    if (!s0 || s0.mode !== 'slitscan') this.updateMap(index);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.w, this.h);
    if (s0 && delay === undefined && s0.view === 'mask') {
      this.mask.render();
      return;
    }
    if (delay !== undefined || !this.settings) {
      gl.useProgram(this.show.prog);
      this.bindStore(this.show);
      gl.uniform1f(this.show.u.u_layer, this.layerOf(index - (delay || 0)));
      drawQuad(gl);
      return;
    }
    const s = this.settings;
    if (s.mode === 'slitscan') {
      this.slit.render(index);
      return;
    }
    const p = this.timemap;
    gl.useProgram(p.prog);
    this.bindStore(p);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, this.mapTex);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, this.layersTex);
    gl.uniform1i(p.u.u_map, 3);
    gl.uniform1i(p.u.u_layers, 4);
    gl.uniform1i(p.u.u_n, this.n);
    gl.uniform1i(p.u.u_t, index);
    gl.uniform1f(p.u.u_max, Math.min(s.timemap.maxDelay, this.n - 1));
    gl.uniform1i(p.u.u_steps, s.timemap.steps);
    gl.uniform1i(p.u.u_blend, s.timemap.blend ? 1 : 0);
    gl.uniform1i(p.u.u_view, VIEWS[s.view] ?? 0);
    this.compositeUniforms(p, s, Math.min(s.timemap.maxDelay, this.n - 1));
    const L = s.look;
    const a = (L.offsetAngle * Math.PI) / 180;
    gl.uniform2f(p.u.u_shift, (L.offset * Math.cos(a)) / this.w, (L.offset * Math.sin(a)) / this.h);
    this.mask.subjectUniforms(p, s.cutout.mode === 'overlay');
    drawQuad(gl);
  }

  // The uniforms of composite.glsl and age.glsl. maxAge: the age of "max age" (Mode 1: Max delay).
  compositeUniforms(p, s, maxAge) {
    const gl = this.gl;
    const C = s.composite, L = s.look;
    gl.uniform1i(p.u.u_comp, C.mode === 'blend' ? 1 : 0);
    gl.uniform1i(p.u.u_blendMode, BLEND_INDEX[C.blend] ?? 0);
    gl.uniform1i(p.u.u_linear, C.linear ? 1 : 0);
    gl.uniform1f(p.u.u_opacity, C.opacity);
    gl.uniform1i(p.u.u_decay, DECAY_INDEX[C.decay] ?? 0);
    gl.uniform1f(p.u.u_decayLen, C.decayLength > 0 ? C.decayLength : Math.max(1, maxAge));
    gl.uniform1f(p.u.u_maxAge, Math.max(1, maxAge));
    if (C.decay === 'curve') {
      const key = JSON.stringify(C.decayCurve);
      if (key !== this.decayKey) {
        this.decayKey = key;
        const pts = Array.isArray(C.decayCurve) ? C.decayCurve : CURVE_PRESETS[C.decayCurve] || CURVE_PRESETS.linear;
        gl.bindTexture(gl.TEXTURE_2D, this.decayTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 256, 1, 0, gl.RED, gl.UNSIGNED_BYTE, Uint8Array.from(curveTable(pts), (v) => Math.round(v * 255)));
        texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
      }
    }
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, this.decayTex);
    gl.uniform1i(p.u.u_decayCurve, 6);
    const tint = L.tintColors.slice(0, 4);
    gl.uniform1i(p.u.u_tintOn, L.tint && tint.length >= 2 ? 1 : 0);
    gl.uniform1i(p.u.u_tintN, Math.max(2, tint.length));
    const flat = new Float32Array(12);
    tint.forEach((h, i) => flat.set(hexRgb(h), i * 3));
    gl.uniform3fv(p.u['u_tint[0]'], flat);
    gl.uniform1f(p.u.u_tintAmount, L.tintAmount);
    gl.uniform1f(p.u.u_ageBright, L.ageBrightness);
  }

  // Tests (plan §13.2): composite n pixels. base, effect: RGBA bytes (effect alpha in .a).
  compositeTest(m) {
    const gl = this.gl;
    if (!this.comptest) this.comptest = program(gl, QUAD_VERT, `${HEAD}${COMPOSITE_GLSL}\n${COMPTEST_FRAG}`);
    const n = m.base.length / 4;
    const w = Math.min(n, 1024), h = Math.ceil(n / w);
    const tex = (data) => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      const full = new Uint8Array(w * h * 4);
      full.set(data);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, full);
      texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
      return t;
    };
    const tb = tex(m.base), ts = tex(m.effect);
    const out = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, out);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, out, 0);
    gl.viewport(0, 0, w, h);
    const p = this.comptest;
    gl.useProgram(p.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tb);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, ts);
    gl.uniform1i(p.u.u_b, 0);
    gl.uniform1i(p.u.u_s, 1);
    gl.uniform1i(p.u.u_blendMode, BLEND_INDEX[m.mode] ?? 0);
    gl.uniform1i(p.u.u_linear, m.linear ? 1 : 0);
    drawQuad(gl);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    for (const t of [tb, ts, out]) gl.deleteTexture(t);
    return { cmd: 'pixels', pixels: px.subarray(0, n * 4) };
  }

  read() {
    const gl = this.gl;
    this.render(this.last.index, this.last.delay);
    const pixels = new Uint8Array(this.w * this.h * 4);
    gl.readPixels(0, 0, this.w, this.h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    return { cmd: 'pixels', width: this.w, height: this.h, pixels };
  }
}

return { Engine };
})();

// ---- app/settings.js
const { DEFAULTS, clone, getPath, setPath, fixSteps } = (() => {
// The settings (plan §7.2 – §7.6). One plain object, so presets and undo (phase 11) can copy it.



const DEFAULTS = {
  mode: 'timemap', // 'timemap' | 'slitscan' (phase 7)
  view: 'result', // 'result' | 'original' | 'map' | 'mask'
  timemap: {
    maxDelay: 30, // frames (white); the store limits it to N - 1
    steps: 0, // 0 = smooth, else 2..64
    blend: true, // frame blend
  },
  map: {
    source: 'builtin', // 'builtin' | 'image' | 'video'
    type: 'linear', // a MAPS id (maps/builtin.js)
    params: defaultParams(), // the params of each built-in map
    image: { name: '', fit: 'fill', outside: 0, x: 0, y: 0, scale: 1, rotation: 0, flipX: false, flipY: false }, // image and video maps
    video: { name: '', speed: 1, offset: 0, end: 'loop' },
    adjust: { invert: false, black: 0, white: 1, gamma: 1, contrast: 0, curve: 'linear', posterize: 0, blur: 0, tileX: 1, tileY: 1, mirrorTile: false, offsetX: 0, offsetY: 0 },
    anim: { phaseSpeed: 0, rotSpeed: 0, pulseAmount: 0, pulsePeriod: 60, seedEvery: 0 },
  },
  slitscan: {
    source: 'line', // 'line' | 'edge' (phase 9)
    x: 0.5, // a point on the line (0..1 of the frame)
    y: 0.5,
    angle: 90, // the direction of the line: 90° = vertical, the scan goes to the right
    flip: false, // turn the scan direction 180°
    width: 1, // slit width (px): the average across the line
    time: true, // Time On: pixels get older with the distance
    rateType: 'constant', // modes/slit.js RATE_TYPES
    rate: 1, // px/frame (at age 0)
    rateEnd: 4, // px/frame at Max age (not Constant)
    curve: 'easeIn', // the rate curve (rateType 'curve')
    maxAge: 600, // frames
    sampling: 'sharp', // 'sharp' (nearest frame) | 'blend' (mix 2 frames)
  },
  cutout: {
    mode: 'off', // 'off' | 'overlay' | 'scan' (Mode 2, phase 9) (plan §9.4)
    bgdiff: { on: true, lightTol: 0.5, threshold: 0.12, softness: 0.06, shadow: 0 },
    chroma: { on: false, key: '#00ff00', tolerance: 0.08, softness: 0.05, spill: 0.5 },
    luma: { on: false, low: 0.7, high: 1, softness: 0.05, invert: false },
    combine: 'union', // 'union' | 'intersect'
    plate: 'auto', // the clean plate: 'auto' (median) | 'frame' | 'image'
    open: 0, // px
    close: 0, // px
    fillHoles: 0, // % of the frame (0 = off)
    keepLargest: false,
    grow: 0, // px, −32 .. 32
    smooth: 0, // temporal smooth 0 .. 0.95
    hysteresis: false,
    tLow: 0.35,
    tHigh: 0.65,
    feather: 0, // px
    import: { on: false, name: '' }, // a mask video (plan §9.3)
  },
  subject: { blend: 'normal', opacity: 1, grow: 0, feather: 0, outline: 0, outlineColor: '#ffffff' }, // §10.4
  composite: {
    mode: 'replace', // effect composite: 'replace' | 'blend' (§10.1)
    blend: 'normal', // gpu/blend.js BLEND_MODES
    opacity: 1,
    linear: false, // blend in linear light
    decay: 'full', // 'full' | 'linear' | 'exp' | 'curve'
    decayLength: 0, // frames; 0 = Max age (exp: the half-life)
    decayCurve: 'linear', // a curve preset (or points): alpha = 1 − curve(age / length)
  },
  look: {
    tint: false,
    tintColors: ['#ffffff', '#ff7a00'], // new -> old, 2..4 colours
    tintAmount: 1,
    ageBrightness: 1, // multiplier at max age
    offset: 0, // Mode 1 spatial offset at white (px)
    offsetAngle: 0,
  },
};

const clone = (o) => JSON.parse(JSON.stringify(o));

// Read and write a value by a path such as 'timemap.maxDelay'.
function getPath(o, path) {
  return path.split('.').reduce((x, k) => x[k], o);
}

function setPath(o, path, v) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((x, k) => x[k], o)[last] = v;
}

// The delay steps setting: 0 or 2..64 (1 is not a valid value).
const fixSteps = (v, prev = 0) => (v === 1 ? (prev > 1 ? 0 : 2) : Math.max(0, Math.min(64, Math.round(v))));

return { DEFAULTS, clone, getPath, setPath, fixSteps };
})();

// ---- app/platform.js
const { checkPlatform } = (() => {
// Platform checks at startup (plan §4). Each check gives { ok, fatal, message }.

async function checkPlatform() {
  const out = { ok: true, fatal: null, notes: [], gl: null };
  let gl = null;
  try {
    gl = document.createElement('canvas').getContext('webgl2');
  } catch {
    gl = null;
  }
  if (!gl) {
    out.ok = false;
    out.fatal = 'This browser has no WebGL2.';
    return out;
  }
  const floatTargets = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
  if (!floatTargets) out.notes.push('No float render targets: some modes lose precision.');
  out.gl = {
    floatTargets,
    maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
    maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  };
  const lose = gl.getExtension('WEBGL_lose_context');
  if (lose) lose.loseContext();
  if (typeof VideoDecoder === 'undefined') {
    out.ok = false;
    out.fatal = 'This browser cannot decode video (no WebCodecs VideoDecoder).';
    return out;
  }
  out.encoder = typeof VideoEncoder !== 'undefined';
  if (!out.encoder) out.notes.push('No H.264 encoder: export is disabled.');
  out.offscreen = typeof OffscreenCanvas !== 'undefined' && (() => {
    try {
      return !!new OffscreenCanvas(1, 1).getContext('webgl2');
    } catch {
      return false;
    }
  })();
  return out;
}

return { checkPlatform };
})();

// ---- app/player.js
const { makeWorker, Player } = (() => {
// The player (plan §6.2, §12.8): one decode worker for the preview, one for the timeline thumbnails.
// Each decoded frame goes into the frame store of the GPU engine (also the warm-up frames and the
// frames that playback drops), so the store always holds the frames before the playhead. A seek
// decodes only the frames of max(0, t - depth) .. t that are not in the store.

function makeWorker(src) {
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const wk = new Worker(url);
  URL.revokeObjectURL(url);
  return wk;
}

// opts: {
//   consume(index, frame, show) -> Promise: put the frame into the store (show: also render it).
//     It must send the frame on at once (the order of the calls is the store order).
//   render(index) -> Promise: render a frame that is in the store.
//   onState(player), onThumb(i, index, bitmap), onError(message), onProgress(fraction | null) }
class Player {
  constructor(workerSrc, opts) {
    this.src = workerSrc;
    this.opts = opts;
    this.wk = null;
    this.thumbWk = null;
    this.info = null;
    this.job = 0;
    this.current = -1; // the frame index on the preview
    this.playing = false;
    this.loop = false;
    this.inPoint = null;
    this.outPoint = null;
    this.depth = 0; // frames of history that the effect needs (Mode 1: Max delay)
    this.n = 0; // store layers
    this.have = new Int32Array(0); // the frame index in each store layer (mirror of the engine)
    this.busy = false; // a seek runs
    this.pendingSeek = null;
    this.queue = []; // playback: decoded frames, in display order
    this.raf = 0;
    this.clock = null; // { wall, us }
    this.stats = { shown: 0, dropped: 0, t0: 0, fps: 0, decodeJobs: 0 };
    this.log = []; // the presented frame indices of the last playback (for tests)
  }

  get frameCount() {
    return this.info ? this.info.times.length : 0;
  }

  // Open a file. Resolves with the info, or rejects with the message for the user.
  open(file) {
    this.close();
    this.wk = makeWorker(this.src);
    return new Promise((resolve, reject) => {
      this.wk.onmessage = (e) => {
        const m = e.data;
        if (m.cmd === 'info') {
          this.info = m;
          this.wk.onmessage = (ev) => this.onMessage(ev.data);
          this.startThumbs(file);
          resolve(m);
        } else if (m.cmd === 'error') {
          this.close();
          reject(new Error(m.message));
        }
      };
      this.wk.onerror = (e) => reject(new Error(e.message || 'Decode worker failed.'));
      this.wk.postMessage({ cmd: 'open', file });
    });
  }

  close() {
    this.pause();
    for (const w of [this.wk, this.thumbWk]) if (w) w.terminate();
    this.wk = this.thumbWk = null;
    this.info = null;
    this.current = -1;
    this.busy = false;
    this.pendingSeek = null;
    this.inPoint = this.outPoint = null;
  }

  // A new (empty) store of n layers: after the engine configure.
  setStore(n) {
    this.n = n;
    this.have = new Int32Array(n).fill(-1);
  }

  inStore(t) {
    return t >= 0 && this.n > 0 && this.have[t % this.n] === t;
  }

  startThumbs(file) {
    this.thumbWk = makeWorker(this.src);
    this.thumbWk.onmessage = (e) => {
      const m = e.data;
      if (m.cmd === 'info') this.thumbWk.postMessage({ cmd: 'thumbs', job: 1, count: 50, width: 160 });
      else if (m.cmd === 'thumb' && this.opts.onThumb) this.opts.onThumb(m.i, m.index, m.bitmap);
      else if (m.cmd === 'done' || m.cmd === 'error') {
        this.thumbWk.terminate();
        this.thumbWk = null;
      }
    };
    this.thumbWk.postMessage({ cmd: 'open', file });
  }

  range() {
    const n = this.frameCount;
    const a = this.inPoint ?? 0, b = this.outPoint ?? n - 1;
    return [Math.min(a, b), Math.max(a, b)];
  }

  state() {
    if (this.opts.onState) this.opts.onState(this);
  }

  progress(f) {
    if (this.opts.onProgress) this.opts.onProgress(f);
  }

  // The history depth that the store can hold.
  get usableDepth() {
    return Math.max(0, Math.min(this.depth, this.n - 1));
  }

  // The first frame of from..t that is not in the store, or t + 1.
  firstMissing(from, t) {
    let m = from;
    while (m <= t && this.inStore(m)) m++;
    return m;
  }

  // Show frame t (frame-exact). Seeks that come while one runs are joined: only the last one runs.
  seek(t) {
    if (!this.info) return Promise.resolve();
    t = Math.max(0, Math.min(this.frameCount - 1, Math.round(t)));
    if (this.playing) this.pause();
    return new Promise((resolve) => {
      if (this.pendingSeek) this.pendingSeek.resolve();
      this.pendingSeek = { t, resolve };
      if (!this.busy) this.nextSeek();
    });
  }

  nextSeek() {
    const p = this.pendingSeek;
    if (!p) return;
    this.pendingSeek = null;
    this.busy = true;
    this.seekDone = p.resolve;
    this.target = p.t;
    const from = this.firstMissing(Math.max(0, p.t - this.usableDepth), p.t);
    if (from > p.t) {
      // All in the store: no decode.
      const job = ++this.job;
      this.opts.render(p.t).then(() => {
        if (job !== this.job) return;
        this.current = p.t;
        this.finishSeek();
      }, (e) => this.fail(e.message));
      return;
    }
    this.warm = { from, total: p.t - from + 1, done: 0 };
    this.stats.decodeJobs++;
    this.wk.postMessage({ cmd: 'seek', job: ++this.job, t: p.t, from });
  }

  finishSeek() {
    this.busy = false;
    this.progress(null);
    if (this.seekDone) this.seekDone();
    this.seekDone = null;
    this.nextSeek();
    this.state();
  }

  step(n) {
    const base = this.pendingSeek ? this.pendingSeek.t : this.busy ? this.target : this.current;
    return this.seek(Math.max(0, base) + n);
  }

  toggle() {
    if (this.playing) this.pause();
    else this.play();
  }

  play() {
    if (!this.info || this.playing) return;
    const [a, b] = this.range();
    let from = this.current + 1;
    if (from > b || from < a) from = a;
    // The decode starts at the first frame of the history of 'from' that is not in the store.
    const start = this.firstMissing(Math.max(0, from - this.usableDepth), from);
    this.playing = true;
    this.pendingSeek = null;
    this.busy = false;
    this.queue = [];
    this.clock = null;
    this.log = [];
    this.showFrom = from;
    this.stats = { ...this.stats, shown: 0, dropped: 0, t0: performance.now(), fps: 0 };
    this.playTo = b;
    this.stats.decodeJobs++;
    this.wk.postMessage({ cmd: 'play', job: ++this.job, from: Math.min(start, from), to: b });
    this.raf = requestAnimationFrame((now) => this.tick(now));
    this.state();
  }

  pause() {
    if (!this.playing) return;
    this.playing = false;
    cancelAnimationFrame(this.raf);
    if (this.wk) this.wk.postMessage({ cmd: 'stop' });
    this.job++;
    // The decoded frames after the playhead do not go into the store: in a small ring they would
    // take the place of the history of the frame on the preview.
    for (const q of this.queue) this.drop(q.frame);
    this.queue = [];
    this.state();
  }

  // A frame of a job that was cancelled.
  drop(frame) {
    frame.close();
    if (this.wk) this.wk.postMessage({ cmd: 'ack' });
  }

  // Into the store (and on the preview when show). The decode worker gets its ack after the upload.
  deliver(index, frame, show) {
    if (this.n) this.have[index % this.n] = index;
    if (show) this.current = index;
    const wk = this.wk;
    return this.opts.consume(index, frame, show).catch((e) => this.fail(e.message)).finally(() => {
      if (wk) wk.postMessage({ cmd: 'ack' });
    });
  }

  fail(message) {
    if (this.opts.onError) this.opts.onError(message);
  }

  onMessage(m) {
    if (m.cmd === 'frame') {
      if (m.job !== this.job) return this.drop(m.frame);
      if (this.playing) {
        if (m.index < this.showFrom) this.deliver(m.index, m.frame, false); // warm-up: no clock
        else this.queue.push({ index: m.index, frame: m.frame });
        return;
      }
      if (m.warm) {
        this.deliver(m.index, m.frame, false);
        this.warm.done++;
        if (this.warm.total > 1) this.progress(this.warm.done / this.warm.total);
        return;
      }
      this.deliver(m.index, m.frame, true);
      this.state();
    } else if (m.cmd === 'done') {
      if (m.job !== this.job || this.playing) return;
      this.finishSeek();
    } else if (m.cmd === 'error') {
      if (m.job !== undefined && m.job !== this.job) return;
      this.fail(m.message);
      if (this.playing) return this.pause();
      this.finishSeek();
    }
  }

  // Playback clock: the file time moves with the wall clock from the first shown frame. The newest
  // frame that is due is shown; older due frames go into the store without a render (dropped).
  // The frames before showFrom are the warm-up (history): into the store at once.
  tick(now) {
    if (!this.playing) return;
    const T = this.info.times;
    while (this.queue.length && this.queue[0].index < this.showFrom) {
      const q = this.queue.shift();
      this.deliver(q.index, q.frame, false);
    }
    if (this.queue.length) {
      const head = this.queue[0];
      if (!this.clock) this.clock = { wall: now, us: T[head.index] };
      const fileUs = this.clock.us + (now - this.clock.wall) * 1000;
      let k = -1;
      for (let i = 0; i < this.queue.length && T[this.queue[i].index] <= fileUs + 4000; i++) k = i;
      if (k >= 0) {
        for (let i = 0; i < k; i++) {
          this.stats.dropped++;
          this.deliver(this.queue[i].index, this.queue[i].frame, false);
        }
        const q = this.queue[k];
        this.queue.splice(0, k + 1);
        this.deliver(q.index, q.frame, true);
        this.log.push(q.index);
        this.stats.shown++;
        const sec = (now - this.stats.t0) / 1000;
        if (sec > 0.5) this.stats.fps = this.stats.shown / sec;
        this.state();
      }
    }
    if (this.current >= this.playTo && !this.queue.length) {
      if (this.loop) {
        this.playing = false;
        this.current = -1;
        this.play();
        return;
      }
      this.pause();
      return;
    }
    this.raf = requestAnimationFrame((n) => this.tick(n));
  }
}

return { makeWorker, Player };
})();

// ---- maps/mapsource.js
const { loadImageMap, videoMapSize, loadVideoMap } = (() => {
// Custom maps (plan §7.4): an image file (PNG / JPEG / WebP) or a video file (MP4 / MOV). The GPU
// engine keeps them as luma (BT.709) in an R8 texture array. A video map is decoded fully once, at
// load (with progress), so that each frame of the source has its map frame at once.



const VIDEO_MAP_BUDGET = 256 * 1048576;

async function loadImageMap(file, gpu) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    throw new Error('This image file cannot be read (PNG, JPEG, or WebP).');
  }
  return gpu.call({ cmd: 'mapImage', bitmap }, [bitmap]);
}

// The size and frame count for a video map of w x h with n frames: the short side at most `short`,
// all frames in the budget and in the texture layer limit.
function videoMapSize(w, h, n, short, maxLayers, budget = VIDEO_MAP_BUDGET) {
  const s = Math.min(1, short / Math.min(w, h));
  let width = Math.max(2, Math.round(w * s)), height = Math.max(2, Math.round(h * s));
  const count = Math.max(1, Math.min(n, maxLayers, Math.floor(budget / (width * height)) || 1));
  return { width, height, count };
}

// opts: { workerSrc, short, maxLayers, onProgress(fraction) }. Resolves with { count, width, height, frames }.
function loadVideoMap(file, gpu, opts) {
  const wk = makeWorker(opts.workerSrc);
  return new Promise((resolve, reject) => {
    let size = null;
    let done = 0;
    const fail = (msg) => {
      wk.terminate();
      reject(new Error(msg));
    };
    wk.onerror = (e) => fail(e.message || 'Decode worker failed.');
    wk.onmessage = async (e) => {
      const m = e.data;
      if (m.cmd === 'error') return fail(m.message);
      if (m.cmd === 'info') {
        size = videoMapSize(m.width, m.height, m.times.length, opts.short, opts.maxLayers);
        size.frames = m.times.length;
        size.rotation = m.rotation;
        await gpu.call({ cmd: 'mapVideoBegin', width: size.width, height: size.height, count: size.count });
        wk.postMessage({ cmd: 'play', job: 1, from: 0, to: size.count - 1 });
      } else if (m.cmd === 'frame') {
        try {
          await gpu.call({ cmd: 'mapVideoFrame', i: m.index, frame: m.frame, rotation: size.rotation }, [m.frame]);
        } catch (err) {
          return fail(err.message);
        }
        wk.postMessage({ cmd: 'ack' });
        done++;
        if (opts.onProgress) opts.onProgress(done / size.count);
      } else if (m.cmd === 'done') {
        wk.terminate();
        await gpu.call({ cmd: 'caps' }); // the replies come in order: all frames are in
        resolve(size);
      }
    };
    wk.postMessage({ cmd: 'open', file });
  });
}

return { loadImageMap, videoMapSize, loadVideoMap };
})();

// ---- app/gpu-client.js
const { GpuClient } = (() => {
// The page side of the GPU engine: the GPU worker when the browser has OffscreenCanvas with WebGL2,
// else the engine on the main thread (plan §4 fallback). call(msg) -> Promise of the reply. The
// replies come in the order of the calls.




class GpuClient {
  constructor(canvas, workerSrc, useWorker) {
    this.mode = useWorker ? 'worker' : 'main';
    this.next = 1;
    this.waiting = new Map();
    if (useWorker) {
      this.wk = makeWorker(workerSrc);
      this.wk.onmessage = (e) => {
        const { id, reply, error } = e.data;
        const w = this.waiting.get(id);
        this.waiting.delete(id);
        if (!w) return;
        if (error) w.reject(new Error(error));
        else w.resolve(reply);
      };
      const off = canvas.transferControlToOffscreen();
      this.ready = this.call({ cmd: 'init', canvas: off }, [off]);
    } else {
      this.engine = new Engine(canvas);
      this.ready = Promise.resolve({ cmd: 'caps', ...this.engine.caps });
    }
  }

  call(msg, transfer = []) {
    if (this.engine) {
      try {
        return Promise.resolve(this.engine.handle(msg));
      } catch (e) {
        if (msg.frame) try { msg.frame.close(); } catch { /* closed */ }
        return Promise.reject(e);
      }
    }
    const id = this.next++;
    return new Promise((resolve, reject) => {
      this.waiting.set(id, { resolve, reject });
      this.wk.postMessage({ id, msg }, transfer);
    });
  }
}

return { GpuClient };
})();

// ---- app/preview.js
const { WORKING_SIZES, Preview } = (() => {
// The preview canvas (plan §12.1, D19). The GPU engine draws into it (from the GPU worker through an
// OffscreenCanvas, or on the main thread). Here: only its CSS size, as large as the area, with the
// aspect of the working size.

const WORKING_SIZES = [360, 540, 720, 1080, 0]; // short side; 0 = source

class Preview {
  constructor(canvas, area) {
    this.canvas = canvas;
    this.area = area;
    this.w = 0;
    this.h = 0;
    new ResizeObserver(() => this.fit()).observe(area);
  }

  setSize(w, h) {
    this.w = w;
    this.h = h;
    this.fit();
  }

  fit() {
    if (!this.w) return;
    const r = this.area.getBoundingClientRect();
    const s = Math.min(r.width / this.w, r.height / this.h);
    if (!(s > 0)) return;
    this.canvas.style.width = `${Math.floor(this.w * s)}px`;
    this.canvas.style.height = `${Math.floor(this.h * s)}px`;
  }
}

return { WORKING_SIZES, Preview };
})();

// ---- app/ui/timeline.js
const { formatTime, Timeline } = (() => {
// Transport and timeline (plan §12.2, §12.3, §12.7): buttons, time, frame number, Loop, the
// thumbnail strip with the playhead and the In / Out markers. Drag on the strip to scrub.

function formatTime(us) {
  const cs = Math.max(0, Math.floor(us / 10000));
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
}

class Timeline {
  constructor(root, player) {
    this.root = root;
    this.player = player;
    this.thumbs = [];
    this.$ = (sel) => root.querySelector(sel);
    this.strip = this.$('.strip');
    this.ctx = this.strip.getContext('2d');
    const P = player;
    const on = (sel, fn) => this.$(sel).addEventListener('click', fn);
    on('[data-act=first]', () => P.seek(P.range()[0] === P.current ? 0 : P.range()[0]));
    on('[data-act=prev]', () => P.step(-1));
    on('[data-act=play]', () => P.toggle());
    on('[data-act=next]', () => P.step(1));
    on('[data-act=last]', () => P.seek(P.range()[1] === P.current ? P.frameCount - 1 : P.range()[1]));
    on('[data-act=loop]', () => {
      P.loop = !P.loop;
      this.update();
    });
    on('[data-act=in]', () => this.setIn());
    on('[data-act=out]', () => this.setOut());
    // Scrub: pointer down and move on the strip.
    let drag = false;
    const scrub = (e) => {
      const r = this.strip.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      P.seek(Math.round(x * (P.frameCount - 1)));
    };
    this.strip.addEventListener('pointerdown', (e) => {
      if (!P.info) return;
      drag = true;
      this.strip.setPointerCapture(e.pointerId);
      scrub(e);
    });
    this.strip.addEventListener('pointermove', (e) => drag && scrub(e));
    const end = () => (drag = false);
    this.strip.addEventListener('pointerup', end);
    this.strip.addEventListener('pointercancel', end);
    new ResizeObserver(() => this.draw()).observe(this.strip);
  }

  setIn() {
    const P = this.player;
    P.inPoint = P.inPoint === P.current ? null : P.current;
    this.update();
  }

  setOut() {
    const P = this.player;
    P.outPoint = P.outPoint === P.current ? null : P.current;
    this.update();
  }

  reset() {
    this.thumbs = [];
    this.update();
  }

  addThumb(i, index, bitmap) {
    this.thumbs[i] = { index, bitmap };
    this.draw();
  }

  update() {
    const P = this.player;
    const info = P.info;
    const t = Math.max(0, P.current);
    this.$('[data-act=play]').textContent = P.playing ? '❚❚' : '▶';
    this.$('[data-act=play]').setAttribute('aria-label', P.playing ? 'Pause' : 'Play');
    this.$('[data-act=loop]').classList.toggle('on', P.loop);
    this.$('[data-act=in]').classList.toggle('on', P.inPoint !== null);
    this.$('[data-act=out]').classList.toggle('on', P.outPoint !== null);
    this.$('.time').textContent = info ? `${formatTime(info.times[t])} / ${formatTime(info.durationUs)}` : '00:00.00 / 00:00.00';
    this.$('.frame').textContent = info ? `f ${t}` : 'f –';
    this.draw();
  }

  draw() {
    const c = this.strip;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(c.clientWidth * dpr)), h = Math.max(1, Math.round(c.clientHeight * dpr));
    if (c.width !== w || c.height !== h) {
      c.width = w;
      c.height = h;
    }
    const ctx = this.ctx;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    const P = this.player;
    const n = P.frameCount;
    if (!n) return;
    const count = this.thumbs.length ? Math.max(this.thumbs.length, 50) : 50;
    const tw = w / count;
    for (let i = 0; i < this.thumbs.length; i++) {
      const th = this.thumbs[i];
      if (!th) continue;
      const b = th.bitmap;
      // Cover the cell, centered.
      const s = Math.max(tw / b.width, h / b.height);
      const sw = tw / s, sh = h / s;
      ctx.drawImage(b, (b.width - sw) / 2, (b.height - sh) / 2, sw, sh, i * tw, 0, Math.ceil(tw), h);
    }
    const x = (t) => (n > 1 ? (t / (n - 1)) * (w - 2 * dpr) + dpr : w / 2);
    const [a, b] = P.range();
    if (P.inPoint !== null || P.outPoint !== null) {
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, x(a), h);
      ctx.fillRect(x(b), 0, w - x(b), h);
      ctx.fillStyle = '#f5a524';
      ctx.fillRect(x(a) - dpr, 0, 2 * dpr, h);
      ctx.fillRect(x(b) - dpr, 0, 2 * dpr, h);
    }
    ctx.fillStyle = '#4fd1c5';
    ctx.fillRect(x(Math.max(0, P.current)) - dpr, 0, 2 * dpr, h);
  }
}

return { formatTime, Timeline };
})();

// ---- app/ui/widgets.js
const { slider, segmented, toggle, section, select, colors } = (() => {
// Setting widgets (plan §12.1): a label, a slider, a number field, and a reset (double-click or
// double-tap on the label). The default value is marked on the track.

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

// opts: { label, min, max, step, value, def, unit, onChange(v), key }
function slider(opts) {
  const row = el('div', 'setting slider');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  label.title = 'Double-click to reset';
  const range = el('input');
  range.type = 'range';
  const num = el('input');
  num.type = 'number';
  for (const i of [range, num]) {
    i.min = opts.min;
    i.max = opts.max;
    i.step = opts.step ?? 1;
    i.value = opts.value;
  }
  num.setAttribute('aria-label', opts.label);
  range.setAttribute('aria-label', opts.label);
  const unit = el('span', 'unit', opts.unit || '');
  const set = (v, fire) => {
    v = Math.max(Number(opts.min), Math.min(Number(opts.max), Number(v)));
    if (!Number.isFinite(v)) return;
    range.value = v;
    num.value = v;
    row.classList.toggle('default', v === opts.def);
    if (fire) opts.onChange(v);
  };
  range.addEventListener('input', () => set(range.value, true));
  num.addEventListener('change', () => set(num.value, true));
  label.addEventListener('dblclick', () => set(opts.def, true));
  // Mark the default on the track.
  if (opts.def !== undefined && opts.max > opts.min) row.style.setProperty('--def', `${((opts.def - opts.min) / (opts.max - opts.min)) * 100}%`);
  row.append(label, range, num, unit);
  set(opts.value, false);
  row.setValue = (v) => set(v, false);
  return row;
}

// opts: { label, options: [[value, text, disabled?]], value, onChange(v), key }
function segmented(opts) {
  const row = el('div', 'setting seg');
  row.dataset.key = opts.key || '';
  if (opts.label) row.append(el('label', null, opts.label));
  const box = el('div', 'segs');
  box.setAttribute('role', 'radiogroup');
  const buttons = opts.options.map(([v, text, disabled]) => {
    const b = el('button', null, text);
    b.type = 'button';
    b.dataset.value = v;
    b.disabled = !!disabled;
    if (disabled) b.title = 'Coming in a later version';
    b.addEventListener('click', () => {
      row.setValue(v);
      opts.onChange(v);
    });
    box.append(b);
    return b;
  });
  row.setValue = (v) => buttons.forEach((b) => b.classList.toggle('on', b.dataset.value === String(v)));
  row.setValue(opts.value);
  row.append(box);
  return row;
}

// opts: { label, value, onChange(v), key }
function toggle(opts) {
  return segmented({ ...opts, options: [['true', 'On'], ['false', 'Off']], value: String(opts.value), onChange: (v) => opts.onChange(v === 'true') });
}

// A collapsible section.
function section(title, open = true) {
  const d = el('details', 'section');
  d.open = open;
  d.append(el('summary', null, title));
  return d;
}

// opts: { label, options: [[value, text]], value, onChange(v), key }
function select(opts) {
  const row = el('div', 'setting select');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  const s = el('select');
  s.setAttribute('aria-label', opts.label);
  for (const [v, text] of opts.options) {
    const o = el('option', null, text);
    o.value = v;
    s.append(o);
  }
  s.value = opts.value;
  s.addEventListener('change', () => opts.onChange(s.value));
  row.setValue = (v) => (s.value = v);
  row.append(label, s);
  return row;
}

// A ramp of 2 to 4 colours. opts: { label, value: ['#rrggbb', ...], onChange(list), key }
function colors(opts) {
  const row = el('div', 'setting colors');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  const box = el('div', 'colorList');
  let list = opts.value.slice();
  const draw = () => {
    box.textContent = '';
    list.forEach((c, i) => {
      const inp = el('input');
      inp.type = 'color';
      inp.value = c;
      inp.setAttribute('aria-label', `${opts.label} ${i + 1}`);
      inp.addEventListener('input', () => {
        list[i] = inp.value;
        opts.onChange(list.slice());
      });
      box.append(inp);
    });
    const more = el('button', null, '+');
    more.type = 'button';
    more.disabled = list.length >= 4;
    more.setAttribute('aria-label', 'Add a colour');
    more.addEventListener('click', () => {
      list.push(list[list.length - 1]);
      draw();
      opts.onChange(list.slice());
    });
    const less = el('button', null, '−');
    less.type = 'button';
    less.disabled = list.length <= 2;
    less.setAttribute('aria-label', 'Remove a colour');
    less.addEventListener('click', () => {
      list.pop();
      draw();
      opts.onChange(list.slice());
    });
    box.append(less, more);
  };
  row.setValue = (v) => {
    list = v.slice();
    draw();
  };
  draw();
  row.append(label, box);
  return row;
}

return { slider, segmented, toggle, section, select, colors };
})();

// ---- app/ui/inspector.js
const { THUMB_W, THUMB_H, Inspector } = (() => {
// The inspector (plan §12.4): Mode, Map (source, map grid with thumbnails, params, fit and transform,
// adjustments, animation), Time. Settings that do not apply are hidden (§12.1).








const THUMB_W = 72;

class Inspector {

  build(settings, limits) {

  // Draw map thumbnails: images = { id: Uint8Array luma (THUMB_W x THUMB_H) }.
  drawThumbs(images) {
    Object.assign(this.thumbCache, images);
    for (const [id, y] of Object.entries(images)) {
      const c = this.tiles[id];
      if (!c) continue;
      const img = new ImageData(THUMB_W, THUMB_H);
      for (let i = 0; i < y.length; i++) {
        img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = y[i];
        img.data[i * 4 + 3] = 255;
      }
      c.getContext('2d').putImageData(img, 0, 0);
    }
  }

  // Show the values of the settings (after a change from outside).
  refresh(settings) {
    for (const [key, row] of Object.entries(this.rows)) {

      row.setValue(typeof v === 'boolean' ? String(v) : v);

// ---- app/analysis.js
const { Analysis } = (() => {
// The analysis pass of Mode 2 (plan §8.3): when the line changes, decode the full video (a second
// decode worker, not in real time) and give each frame to the engine, which writes its row of the
// slit history. A new pass cancels the one that runs.



class Analysis {
  // opts: { onProgress(fraction | null), onRows() (some rows are new), onDone(key) }
  constructor(workerSrc, gpu, opts) {
    this.src = workerSrc;
    this.gpu = gpu;
    this.opts = opts;
    this.wk = null;
    this.key = ''; // the key of the pass that runs
    this.doneKey = ''; // the key of the last pass that ended
    this.progress = 0;
  }

  get running() {
    return !!this.wk;
  }

  stop() {
    if (this.wk) this.wk.terminate();
    this.wk = null;
    this.key = '';
    this.opts.onProgress(null);
  }

  start(file, count, key) {
    this.stop();
    this.key = key;
    this.doneKey = '';
    this.progress = 0;
    const wk = (this.wk = makeWorker(this.src));
    let done = 0, last = 0;
    wk.onmessage = async (e) => {
      const m = e.data;
      if (wk !== this.wk) return m.frame && m.frame.close();
      if (m.cmd === 'info') wk.postMessage({ cmd: 'play', job: 1, from: 0, to: count - 1 });
      else if (m.cmd === 'frame') {
        try {
          await this.gpu.call({ cmd: 'slitFrame', index: m.index, frame: m.frame }, [m.frame]);
        } catch {
          return this.stop();
        }
        if (wk !== this.wk) return;
        wk.postMessage({ cmd: 'ack' });
        done++;
        this.progress = done / count;
        this.opts.onProgress(this.progress);
        if (performance.now() - last > 150) {
          last = performance.now();
          this.opts.onRows();
        }
      } else if (m.cmd === 'done') {
        await this.gpu.call({ cmd: 'slitStatus' }); // the replies come in order: all rows are in
        if (wk !== this.wk) return;
        wk.terminate();
        this.wk = null;
        this.doneKey = key;
        this.key = '';
        this.opts.onProgress(null);
        this.opts.onRows();
        this.opts.onDone(key);
      } else if (m.cmd === 'error') this.stop();
    };
    wk.postMessage({ cmd: 'open', file });
  }
}

return { Analysis };
})();

// ---- app/ui/handles.js
const { LineHandles } = (() => {
// Direct control on the preview (plan §8.1, §12.1): the Mode 2 source line. Drag the centre point to
// move the line, drag the round handle to turn it (Shift or the Snap button: steps of 15°), touch the
// arrow to flip the scan direction.

// SVG elements, made by the HTML parser (it gives them the SVG namespace).
const mk = (tag, attrs) => {
  const box = document.createElement('div');
  box.innerHTML = tag === 'svg' ? '<svg></svg>' : `<svg><${tag}/></svg>`;
  const e = tag === 'svg' ? box.firstChild : box.firstChild.firstChild;
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};

class LineHandles {
  // app: { change(path, value), settings }
  constructor(area, canvas, app) {
    this.canvas = canvas;
    this.app = app;
    this.snap = false;
    const svg = (this.svg = mk('svg', { id: 'handles', class: 'handles' }));
    this.line = mk('line', { class: 'hLine' });
    this.arrow = mk('path', { class: 'hArrow' });
    this.arrowHit = mk('path', { class: 'hArrowHit', 'data-handle': 'flip' }); // a wider target
    this.center = mk('circle', { class: 'hPoint', r: 9, 'data-handle': 'move' });
    this.rot = mk('circle', { class: 'hRot', r: 8, 'data-handle': 'rotate' });
    svg.append(this.line, this.arrow, this.arrowHit, this.center, this.rot);
    this.snapBtn = document.createElement('button');
    this.snapBtn.type = 'button';
    this.snapBtn.className = 'snapBtn';
    this.snapBtn.textContent = 'Snap 15°';
    this.snapBtn.addEventListener('click', () => {
      this.snap = !this.snap;
      this.snapBtn.classList.toggle('on', this.snap);
    });
    area.append(svg, this.snapBtn);
    let drag = null;
    svg.addEventListener('pointerdown', (e) => {
      const h = e.target.dataset && e.target.dataset.handle;
      if (!h) return;
      e.preventDefault();
      e.stopPropagation();
      if (h === 'flip') {
        this.app.change('slitscan.flip', !this.app.settings.slitscan.flip);
        return;
      }
      drag = h;
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const { x, y, r } = this.toFrame(e.clientX, e.clientY);
      const S = this.app.settings.slitscan;
      if (drag === 'move') {
        this.app.change('slitscan.x', Math.round(Math.min(1, Math.max(0, x)) * 1000) / 1000);
        this.app.change('slitscan.y', Math.round(Math.min(1, Math.max(0, y)) * 1000) / 1000);
      } else {
        // The angle of the line through the point, to the pointer (in pixels of the picture).
        let a = (Math.atan2((y - S.y) * r.h, (x - S.x) * r.w) * 180) / Math.PI;
        a = ((a % 360) + 360) % 360;
        if (e.shiftKey || this.snap) a = (Math.round(a / 15) * 15) % 360;
        this.app.change('slitscan.angle', Math.round(a * 10) / 10);
      }
    });
    const end = () => (drag = null);
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    new ResizeObserver(() => this.update()).observe(area);
  }

  toFrame(cx, cy) {
    const b = this.canvas.getBoundingClientRect();
    return { x: (cx - b.left) / b.width, y: (cy - b.top) / b.height, r: { w: b.width, h: b.height } };
  }

  update() {
    const S = this.app.settings;
    const show = S.mode === 'slitscan' && S.view !== 'original' && S.view !== 'mask' && !this.canvas.hidden && !(this.app.tools && this.app.tools.tool);
    this.svg.style.display = show ? '' : 'none';
    this.snapBtn.style.display = show ? '' : 'none';
    if (!show) return;
    // The overlay covers the canvas only (the line is clipped to the picture).
    const b = this.canvas.getBoundingClientRect();
    const a = this.svg.parentElement.getBoundingClientRect();
    this.svg.style.left = `${b.left - a.left}px`;
    this.svg.style.top = `${b.top - a.top}px`;

αs · B(Cb, Cs)      (the base is opaque)\\n// Linear blend: the colours go to linear light (sRGB curve) for the blend and back.\\nuniform int u_blendMode;\\nuniform bool u_linear;\\n\\nvec3 toLinear(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }\\nvec3 toSrgb(vec3 c) { return mix(c * 12.92, 1.055 * pow(max(c, 0.0), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }\\n\\nfloat bDodge(float b, float s) { return b == 0.0 ? 0.0 : s >= 1.0 ? 1.0 : min(1.0, b / (1.0 - s)); }\\nfloat bBurn(float b, float s) { return b >= 1.0 ? 1.0 : s == 0.0 ? 0.0 : 1.0 - min(1.0, (1.0 - b) / s); }\\nfloat bHard(float b, float s) { return s <= 0.5 ? b * 2.0 * s : b + (2.0 * s - 1.0) - b * (2.0 * s - 1.0); }\\nfloat bSoft(float b, float s) {\\n  if (s <= 0.5) return b - (1.0 - 2.0 * s) * b * (1.0 - b);\\n  float d = b <= 0.25 ? ((16.0 * b - 12.0) * b + 4.0) * b : sqrt(b);\\n  return b + (2.0 * s - 1.0) * (d - b);\\n}\\nfloat bDivide(float b, float s) { return s == 0.0 ? (b == 0.0 ? 0.0 : 1.0) : min(1.0, b / s); }\\n\\nfloat lum(vec3 c) { return dot(c, vec3(0.3, 0.59, 0.11)); }\\nvec3 clipColor(vec3 c) {\\n  float l = lum(c), n = min(min(c.r, c.g), c.b), x = max(max(c.r, c.g), c.b);\\n  if (n < 0.0) c = l + (c - l) * l / (l - n);\\n  if (x > 1.0) c = l + (c - l) * (1.0 - l) / (x - l);\\n  return c;\\n}\\nvec3 setLum(vec3 c, float l) { return clipColor(c + (l - lum(c))); }\\nfloat sat(vec3 c) { return max(max(c.r, c.g), c.b) - min(min(c.r, c.g), c.b); }\\nvec3 setSat(vec3 c, float s) {\\n  float mx = max(max(c.r, c.g), c.b), mn = min(min(c.r, c.g), c.b);\\n  if (mx <= mn) return vec3(0.0);\\n  return (c - mn) * s / (mx - mn); // max -> s, min -> 0, mid scaled (the W3C SetSat)\\n}\\n\\nvec3 blendColor(vec3 b, vec3 s, int m) {\\n  if (m == 0) return s;\\n  if (m == 1) return min(b + s, 1.0);\\n  if (m == 2) return b + s - b * s;\\n  if (m == 3) return max(b, s);\\n  if (m == 4) return vec3(bDodge(b.r, s.r), bDodge(b.g, s.g), bDodge(b.b, s.b));\\n  if (m e map).\n\n\n\n\n\nconst QUAD_VERT = \"#version 300 es\\n// One triangle that covers the target. v_uv: 0..1, v = 0 at the first row (image top, in texture space).\\nout vec2 v_uv;\\nvoid main() {\\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\\n  v_uv = p;\\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\\n}\\n\";\nconst STORE_GLSL = \"// Read the frame store (plan §6.3): Y and CbCr layers -> RGB (BT.709 full range).\\nuniform highp sampler2DArray u_storeY;\\nuniform highp sampler2DArray u_storeC;\\nuniform highp isampler2D u_layers; // N x 1: the frame index in each store layer\\nuniform int u_n;\\n\\nvec3 storeRgb(vec2 uv, float layer) {\\n  float y = texture(u_storeY, vec3(uv, layer)).r;\\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\\n}\\n\\n// The layer of frame k, or -1 when frame k is not in the store (or k < 0).\\nint layerOf(int k) {\\n  if (k < 0 || u_n < 1) return -1;\\n  int l = k % u_n;\\n  return texelFetch(u_layers, ivec2(l, 0), 0).r == k ? l : -1;\\n}\\n\\n// The colour of frame k at uv, and a = 1 when frame k is in the store (else black, a = 0).\\nvec4 frameAt(int k, vec2 uv) {\\n  int l = layerOf(k);\\n  return l < 0 ? vec4(0.0) : vec4(storeRgb(uv, float(l)), 1.0);\\n}\\n\\n// The luma of frame k at uv (0 when not in the store).\\nfloat lumaAt(int k, vec2 uv) {\\n  int l = layerOf(k);\\n  return l < 0 ? 0.0 : texture(u_storeY, vec3(uv, float(l))).r;\\n}\\n\";\nconst METHODS_FRAG = \"// Mask pipeline steps 1–3 (plan §9.1): the methods (background difference, chroma key, luma key;\\n// each a soft mask), combined (union or intersect), or an imported mask; then the garbage matte.\\nuniform int u_t;\\nuniform highp sampler2DArray u_plateY; // the clean plate, YUV as the store (layer 0)\\nuniform highp sampler2DArray u_plateC;\\nuniform bool u_bgOn;\\nuniform float u_lightTol, u_thr, u_soft, u_shadow;\\nuniform
