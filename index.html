<!-- neofx v0.1.0 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<title>neofx</title>
<style>
:root{
  --bg:#111214;
  --panel:#1a1b1e;
  --line:#2a2c30;
  --text:#e6e6e6;
  --dim:#8b8d92;
  --accent:#4fd1c5;
  --warn:#f5a524;
  --top:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:6px;
  min-height:32px;padding:0 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#app{display:grid;grid-template-rows:var(--top) 1fr auto;grid-template-columns:minmax(0,1fr);height:100%}
#topBar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#logo{font-weight:700;letter-spacing:.02em;margin-right:8px}
.spacer{flex:1}
#status{min-width:0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#exportBtn{background:var(--accent);color:#000}
#stage{display:grid;grid-template-columns:1fr 340px;min-height:0}
#preview{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:#000}
#inspector{border-left:1px solid var(--line);background:var(--panel);overflow:auto}
#transport{min-height:48px;border-top:1px solid var(--line);background:var(--panel)}
#startScreen{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;max-width:520px;width:100%}
#dropArea{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:40px 16px;
  border:2px dashed var(--line);border-radius:12px;cursor:pointer;text-align:center}
#dropArea span{color:var(--dim)}
body.drag #dropArea{border-color:var(--accent)}
#modeInfo{display:grid;gap:8px;color:var(--dim)}
#modeInfo b{color:var(--text)}
#message{position:absolute;inset:auto 16px 16px;padding:12px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--warn)}
body:not([data-state="start"]) #startScreen{display:none}
@media (max-width:999px){
  #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(200px,1fr) auto}
  #inspector{border-left:0;border-top:1px solid var(--line);max-height:45vh}
  button{min-height:44px}
}
#view{display:block;image-rendering:auto}
#transport{display:grid;gap:6px;padding:6px 12px 10px}
#transport .controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#transport .controls button{min-width:40px}
#transport .controls button.on{background:var(--accent);color:#000}
#transport .time,#transport .frame{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
#transport .frame{min-width:64px}
#transport .res{color:var(--dim);font-size:12px}
#transport select{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:6px;min-height:32px}
#transport .strip{display:block;width:100%;height:44px;border-radius:4px;touch-action:none;cursor:pointer}
body[data-state="start"] #transport .controls,body[data-state="start"] #transport .strip{opacity:.4;pointer-events:none}
#status.warn{color:var(--warn)}
#progress{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0}
#viewBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:2;
  background:rgba(0,0,0,.55);border-radius:8px;padding:2px}
#viewBar button{min-height:28px;padding:0 10px;font-size:12px;background:transparent}
#viewBar button.on{background:var(--line);color:var(--accent)}
body[data-state="start"] #viewBar{display:none}
.section{border-bottom:1px solid var(--line)}
.section summary{padding:10px 12px;font-weight:600;cursor:pointer;user-select:none;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--dim)}
.setting{display:grid;grid-template-columns:96px 1fr 64px 14px;align-items:center;gap:8px;padding:4px 12px}
.setting label{font-size:12px;color:var(--dim);cursor:default;user-select:none}
.setting.default label{color:var(--text)}
.setting input[type=range]{width:100%;accent-color:var(--accent);
  background:linear-gradient(to right,transparent calc(var(--def,-10%) - 1px),var(--dim) 0,var(--dim) calc(var(--def,-10%) + 1px),transparent 0) no-repeat 0 100%/100% 3px}
.setting input[type=number]{width:100%;font:inherit;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 4px}
.setting .unit{font-size:11px;color:var(--dim)}
.setting.seg{grid-template-columns:96px 1fr}
.setting.seg:not(:has(label)){grid-template-columns:1fr}
.segs{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:2px}
.segs button{flex:1;min-height:28px;font-size:12px;background:transparent;padding:0 6px}
.segs button.on{background:var(--line);color:var(--accent)}
@media (max-width:999px){.setting input[type=range]{min-height:32px}.segs button{min-height:40px}}
.mapGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;padding:4px 12px 8px}
.mapTile{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px;min-height:0;background:var(--bg);border:1px solid transparent;border-radius:6px}
.mapTile canvas{width:100%;aspect-ratio:72/40;border-radius:3px;background:#000}
.mapTile span{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapTile.on{border-color:var(--accent)}
.mapTile.on span{color:var(--text)}
.mapTile:disabled{opacity:.35}
.fileRow{grid-template-columns:auto 1fr}
.fileName{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{margin:2px 12px 8px;font-size:11px;color:var(--dim)}
.setting.select,.setting.colors{grid-template-columns:96px 1fr}
.setting select{font:inherit;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;min-height:28px}
.colorList{display:flex;gap:4px;align-items:center}
.colorList input{width:32px;height:28px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.colorList button{min-width:28px;min-height:28px;padding:0}
.handles{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:hidden}
.handles .hLine{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4;filter:drop-shadow(0 0 1px #000)}
.handles .hPoint,.handles .hRot{fill:rgba(0,0,0,.5);stroke:var(--accent);stroke-width:2;pointer-events:all;cursor:grab;touch-action:none}
.handles .hRot{fill:var(--accent)}
.handles .hArrow{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 2px #000)}
.handles .hArrowHit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke;cursor:pointer}
.snapBtn{position:absolute;left:8px;top:8px;z-index:2;min-height:28px;font-size:12px;background:rgba(0,0,0,.55)}
.snapBtn.on{background:var(--accent);color:#000}
@media (pointer:coarse){.handles .hPoint{r:16}.handles .hRot{r:14}}
.brushCursor{position:absolute;z-index:3;border:1.5px solid #fff;border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #000}
.toolRow{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px}
.toolRow button{min-height:28px;font-size:12px;padding:0 8px}
.toolRow button.on{background:var(--accent);color:#000}
.subhead{padding:8px 12px 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.setting.color{grid-template-columns:96px auto 1fr}
.setting.color input[type=color]{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
</style>
</head>
<body data-state="start">
<div id="app">
  <header id="topBar">
    <span id="logo">neofx</span>
    <button id="openBtn" type="button">Open</button>
    <span class="spacer"></span>
    <span id="status" aria-live="polite"></span>
    <button id="exportBtn" type="button" disabled>Export</button>
  </header>

  <main id="stage">
    <section id="preview" aria-label="Preview">
      <div id="startScreen">
        <label id="dropArea" for="fileInput">
          <strong>Open a video (MP4 or MOV)</strong>
          <span>Drop a file here, or touch to select one.</span>
        </label>
        <div id="modeInfo">
          <div><b>Time Map</b> — a greyscale map gives each pixel a delay in frames.</div>
          <div><b>Slit Scan</b> — a 1 px line repeats in one direction, and gets older with distance.</div>
        </div>
      </div>
      <div id="viewBar" role="tablist" aria-label="View">
        <button type="button" data-view="result" class="on">Result</button>
        <button type="button" data-view="original">Original</button>
        <button type="button" data-view="map">Map</button>
        <button type="button" data-view="mask">Mask</button>
      </div>
      <canvas id="view" hidden></canvas>
      <div id="progress" hidden></div>
      <div id="message" hidden></div>
    </section>
    <aside id="inspector" aria-label="Inspector"></aside>
  </main>

  <footer id="transport">
    <div class="controls">
      <button type="button" data-act="first" aria-label="Go to start">⏮</button>
      <button type="button" data-act="prev" aria-label="Previous frame">◀|</button>
      <button type="button" data-act="play" aria-label="Play">▶</button>
      <button type="button" data-act="next" aria-label="Next frame">|▶</button>
      <button type="button" data-act="last" aria-label="Go to end">⏭</button>
      <span class="time">00:00.00 / 00:00.00</span>
      <span class="frame">f –</span>
      <span class="spacer"></span>
      <button type="button" data-act="in" aria-label="Set In point">In</button>
      <button type="button" data-act="out" aria-label="Set Out point">Out</button>
      <button type="button" data-act="loop" aria-label="Loop">Loop</button>
      <label class="res">Preview <select id="resSelect">
        <option value="360">360p</option><option value="540" selected>540p</option><option value="720">720p</option><option value="1080">1080p</option><option value="0">Source</option>
      </select></label>
    </div>
    <canvas class="strip" aria-label="Timeline"></canvas>
  </footer>
  <input id="mapFileInput" type="file" hidden>
  <input id="plateFileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <input id="maskFileInput" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" hidden>
  <input id="fileInput" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" hidden>
</div>
<script>
'use strict';
// ---- maps/builtin.js
const { MAPS, MAP_INDEX, defaultParams, paramArray, usesMask, isDynamic, videoMapFrame } = (() => {
// The built-in maps (plan §7.3): ids, names, and parameters. The order of MAPS is the u_type of
// gpu/glsl/maps.glsl; the order of the params of each map is its u_k[] order.
// A param: [key, label, min, max, step, default, unit].

const C = [['x', 'Center x', 0, 1, 0.01, 0.5], ['y', 'Center y', 0, 1, 0.01, 0.5]];
const SEED = ['seed', 'Seed', 0, 999, 1, 1];

const MAPS = [
  { id: 'linear', name: 'Linear', params: [['angle', 'Angle', 0, 360, 1, 90, '°'], ['x', 'Position x', 0, 1, 0.01, 0.5], ['y', 'Position y', 0, 1, 0.01, 0.5], ['width', 'Width', 0.05, 4, 0.01, 1]] },
  { id: 'mirrored', name: 'Mirrored', params: [['angle', 'Angle', 0, 360, 1, 90, '°'], ['x', 'Center x', 0, 1, 0.01, 0.5], ['y', 'Center y', 0, 1, 0.01, 0.5], ['width', 'Width', 0.05, 4, 0.01, 1]] },
  { id: 'radial', name: 'Radial', params: [...C, ['radius', 'Radius', 0.05, 2, 0.01, 0.7], ['aspect', 'Aspect', 0.25, 4, 0.01, 1]] },
  { id: 'angular', name: 'Angular', params: [...C, ['start', 'Start angle', 0, 360, 1, 0, '°'], ['turns', 'Turns', 1, 16, 1, 1]] },
  { id: 'spiral', name: 'Spiral', params: [...C, ['arms', 'Arms', 1, 12, 1, 2], ['tightness', 'Tightness', 0, 20, 0.1, 4]] },
  { id: 'box', name: 'Diamond / Box', params: [...C, ['size', 'Size', 0.05, 2, 0.01, 0.5], ['roundness', 'Roundness', 0, 1, 0.01, 0, '']] },
  { id: 'corners', name: 'Four corners', params: [['tl', 'Top left', 0, 1, 0.01, 0], ['tr', 'Top right', 0, 1, 0.01, 0.33], ['bl', 'Bottom left', 0, 1, 0.01, 0.66], ['br', 'Bottom right', 0, 1, 0.01, 1]] },
  { id: 'stripes', name: 'Stripes', params: [['count', 'Count', 1, 64, 1, 8], ['angle', 'Angle', 0, 360, 1, 0, '°'], ['softness', 'Softness', 0, 1, 0.01, 0], ['duty', 'Duty', 0, 1, 0.01, 0.5]] },
  { id: 'sine', name: 'Sine waves', params: [['fx', 'Frequency x', 0, 32, 0.1, 4], ['fy', 'Frequency y', 0, 32, 0.1, 0], ['angle', 'Angle', 0, 360, 1, 0, '°'], ['phase', 'Phase', 0, 1, 0.01, 0]] },
  { id: 'rings', name: 'Rings', params: [...C, ['count', 'Count', 1, 64, 1, 8], ['softness', 'Softness', 0, 1, 0.01, 0]] },
  { id: 'checker', name: 'Checkerboard', params: [['cells', 'Cells', 1, 64, 1, 8], ['softness', 'Softness', 0, 1, 0.01, 0]] },
  { id: 'fbm', name: 'Value noise', params: [['scale', 'Scale', 0.5, 64, 0.1, 4], ['octaves', 'Octaves', 1, 8, 1, 4], ['roughness', 'Roughness', 0, 1, 0.01, 0.5], SEED] },
  { id: 'ridged', name: 'Ridged noise', params: [['scale', 'Scale', 0.5, 64, 0.1, 3], ['octaves', 'Octaves', 1, 8, 1, 4], SEED] },
  { id: 'worley', name: 'Cellular', params: [['scale', 'Scale', 1, 64, 0.1, 6], SEED, ['metric', 'Metric', 0, 2, 1, 0]] },
  { id: 'voronoi', name: 'Voronoi cells', params: [['scale', 'Scale', 1, 64, 0.1, 6], SEED] },
  { id: 'blocks', name: 'Random blocks', params: [['bw', 'Block width', 1, 256, 1, 32, 'px'], ['bh', 'Block height', 1, 256, 1, 32, 'px'], SEED] },
  { id: 'rows', name: 'Random rows', params: [['size', 'Size', 1, 256, 1, 16, 'px'], ['direction', 'Columns', 0, 1, 1, 0], SEED] },
  { id: 'bayer', name: 'Bayer dither', params: [['matrix', 'Matrix (2^n)', 1, 3, 1, 2], ['base', 'Base value', 0, 1, 0.01, 0.5]] },
  { id: 'self', name: 'Video luminance', params: [] },
  { id: 'motion', name: 'Motion', params: [['gain', 'Gain', 0.5, 20, 0.1, 4], ['frames', 'Smooth (frames)', 1, 8, 1, 2]] },
  { id: 'subject', name: 'Subject mask', params: [['subject', 'Subject value', 0, 1, 0.01, 1], ['background', 'Background value', 0, 1, 0.01, 0]], usesMask: true },
  { id: 'subjectdist', name: 'Subject distance', params: [['falloff', 'Falloff', 1, 1000, 1, 120, 'px']], usesMask: true },
];

const MAP_INDEX = Object.fromEntries(MAPS.map((m, i) => [m.id, i]));

// The default params of each map: { linear: { angle: 90, ... }, ... }.
function defaultParams() {
  return Object.fromEntries(MAPS.map((m) => [m.id, Object.fromEntries(m.params.map((p) => [p[0], p[5]]))]));
}

// The u_k[] values of a map.
function paramArray(id, params) {
  const m = MAPS[MAP_INDEX[id]];
  return m.params.map((p) => Number((params && params[p[0]]) ?? p[5]));
}

// A built-in map that needs the subject mask (plan §9).
const usesMask = (map) => map.source === 'builtin' && (map.type === 'subject' || map.type === 'subjectdist');

// The map needs a new render for each frame (it changes with t).
function isDynamic(map) {
  const a = map.anim;
  return map.source === 'video' || (map.source === 'builtin' && ['self', 'motion', 'subject', 'subjectdist'].includes(map.type))
    || (map.source === 'builtin' && !!(a.phaseSpeed || a.rotSpeed || a.pulseAmount || a.seedEvery));
}

// Video map (plan §7.4): the map frame for source frame t. end: 'loop' | 'hold' | 'pingpong'.
function videoMapFrame(t, count, speed, offset, end) {
  if (count <= 1) return 0;
  const m = Math.round(t * speed + offset);
  if (end === 'hold') return Math.max(0, Math.min(count - 1, m));
  if (end === 'pingpong') {
    const p = 2 * (count - 1);
    const r = ((m % p) + p) % p;
    return r < count ? r : p - r;
  }
  return ((m % count) + count) % count;
}

return { MAPS, MAP_INDEX, defaultParams, paramArray, usesMask, isDynamic, videoMapFrame };
})();

// ---- maps/curve.js
const { CURVE_PRESETS, monotoneCurve, curveTable } = (() => {
// Curves (plan §7.5, §12.6): points [[x, y], ...] with x from 0 to 1 -> monotone cubic interpolation
// (Fritsch–Carlson). The GPU gets a lookup table.

const CURVE_PRESETS = {
  linear: [[0, 0], [1, 1]],
  easeIn: [[0, 0], [0.5, 0.2], [1, 1]],
  easeOut: [[0, 0], [0.5, 0.8], [1, 1]],
  sCurve: [[0, 0], [0.25, 0.1], [0.75, 0.9], [1, 1]],
  step: [[0, 0], [0.49, 0], [0.51, 1], [1, 1]],
};

// A function x -> y through the points (sorted by x), monotone between them.
function monotoneCurve(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0]);
  const n = p.length;
  if (n < 2) return () => (n ? p[0][1] : 0);
  const dx = [], m = [];
  for (let i = 0; i < n - 1; i++) {
    dx.push(p[i + 1][0] - p[i][0]);
    m.push(dx[i] > 0 ? (p[i + 1][1] - p[i][1]) / dx[i] : 0);
  }
  const t = new Array(n);
  t[0] = m[0];
  t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) {
      t[i] = t[i + 1] = 0;
      continue;
    }
    const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
    if (h > 9) {
      const s = 3 / Math.sqrt(h);
      t[i] = s * a * m[i];
      t[i + 1] = s * b * m[i];
    }
  }
  return (x) => {
    if (x <= p[0][0]) return p[0][1];
    if (x >= p[n - 1][0]) return p[n - 1][1];
    let i = 0;
    while (i < n - 2 && x > p[i + 1][0]) i++;
    const h = dx[i], u = (x - p[i][0]) / h;
    const u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * p[i][1] + (u3 - 2 * u2 + u) * h * t[i] + (-2 * u3 + 3 * u2) * p[i + 1][1] + (u3 - u2) * h * t[i + 1];
  };
}

// 256 values of the curve, clamped to 0..1.
function curveTable(points, size = 256) {
  const f = monotoneCurve(points);
  const out = new Float32Array(size);
  for (let i = 0; i < size; i++) out[i] = Math.max(0, Math.min(1, f(i / (size - 1))));
  return out;
}

return { CURVE_PRESETS, monotoneCurve, curveTable };
})();

// ---- modes/slit.js
const { RATE_TYPES, MAX_HISTORY, rateAt, distanceTable, ageAt, lineGeometry, historyRows } = (() => {
// Mode 2, Slit Scan, line source (plan §8.1 – §8.3, §8.5): geometry and age. No browser APIs.



const RATE_TYPES = [['constant', 'Constant'], ['accelerate', 'Accelerate'], ['decelerate', 'Decelerate'], ['exponential', 'Exponential'], ['curve', 'Curve']];
const MAX_HISTORY = 4096;

// The rate r (px/frame) at age a (frames), u = a / M (plan §8.5).
function rateAt(sl, a) {
  const M = Math.max(1, sl.maxAge);
  const u = Math.min(1, Math.max(0, a / M));
  const r0 = sl.rate, r1 = sl.rateEnd;
  switch (sl.rateType) {
    case 'accelerate': return r0 + (r1 - r0) * u * u;
    case 'decelerate': return r0 + (r1 - r0) * (1 - (1 - u) * (1 - u));
    case 'exponential': return r0 * (r1 / r0) ** u;
    case 'curve': {
      const pts = Array.isArray(sl.curve) ? sl.curve : CURVE_PRESETS[sl.curve] || CURVE_PRESETS.linear;
      return r0 + (r1 - r0) * monotoneCurve(pts)(u);
    }
    default: return r0;
  }
}

// S(a): the distance (px) that a pixel moves by the age a, for a = 0 .. M (the rate at the middle of
// each frame of age). Float32Array of M + 1.
function distanceTable(sl) {
  const M = Math.max(1, Math.round(sl.maxAge));
  const S = new Float32Array(M + 1);
  for (let a = 1; a <= M; a++) S[a] = S[a - 1] + Math.max(1e-4, rateAt(sl, a - 0.5));
  return S;
}

// A(s): the age (frames, a float) at the distance s, or Infinity beyond S(M). The inverse of S
// (binary search, then linear between the entries), as the shader does it.
function ageAt(S, s) {
  const M = S.length - 1;
  if (s > S[M]) return Infinity;
  let lo = 0, hi = M;
  while (lo < hi) {
    const m = (lo + hi + 1) >> 1;
    if (S[m] <= s) lo = m;
    else hi = m - 1;
  }
  if (lo >= M) return M;
  return lo + (s - S[lo]) / (S[lo + 1] - S[lo]);
}

// The line in working pixels (plan §8.1). angle: the direction of the line (90° = vertical). d: the
// scan direction (perpendicular, 90° clockwise from the line; Flip turns it 180°). The point is
// snapped to a pixel centre, so lines at 0°, 90°, 180°, 270° read exact pixels.
// Returns { L, d, e, len, c }: the history row has len samples; sample i is at L + (i − c) e.
function lineGeometry(sl, w, h, maxTexture = 8192) {
  const a = (sl.angle * Math.PI) / 180;
  const snap = (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : v);
  const e = [snap(Math.cos(a)), snap(Math.sin(a))];
  let d = [snap(Math.sin(a)), snap(-Math.cos(a))]; // 90° -> (1, 0): to the right
  if (sl.flip) d = [-d[0], -d[1]];
  const L = [Math.min(w - 1, Math.floor(sl.x * w)) + 0.5, Math.min(h - 1, Math.floor(sl.y * h)) + 0.5];
  const len = Math.min(maxTexture, 2 * Math.ceil(Math.hypot(w, h)) + 4);
  return { L, d, e, len, c: len >> 1 };
}

// The history rows: one for each frame, at most MAX_HISTORY and the texture limit.
const historyRows = (frames, maxTexture = 8192) => Math.max(1, Math.min(frames, MAX_HISTORY, maxTexture));

return { RATE_TYPES, MAX_HISTORY, rateAt, distanceTable, ageAt, lineGeometry, historyRows };
})();

// ---- analysis/regions.js
const { cleanRegions } = (() => {
// Mask clean-up on a small copy (plan §9.1 step 4): Fill holes and Keep largest region.
// b: Uint8Array of 0/1 (w x h). Returns { fill, remove }: Uint8Array of 0/1 (the pixels to set to
// subject, and to background). 4-connected regions.

function regions(b, w, h, value) {
  const label = new Int32Array(w * h).fill(-1);
  const sizes = [], border = [];
  const stack = new Int32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    if (b[i] !== value || label[i] >= 0) continue;
    const id = sizes.length;
    let n = 0, top = 0, edge = false;
    stack[top++] = i;
    label[i] = id;
    while (top) {
      const p = stack[--top];
      n++;
      const x = p % w, y = (p - x) / w;
      if (x === 0 || y === 0 || x === w - 1 || y === h - 1) edge = true;
      if (x > 0 && b[p - 1] === value && label[p - 1] < 0) { label[p - 1] = id; stack[top++] = p - 1; }
      if (x < w - 1 && b[p + 1] === value && label[p + 1] < 0) { label[p + 1] = id; stack[top++] = p + 1; }
      if (y > 0 && b[p - w] === value && label[p - w] < 0) { label[p - w] = id; stack[top++] = p - w; }
      if (y < h - 1 && b[p + w] === value && label[p + w] < 0) { label[p + w] = id; stack[top++] = p + w; }
    }
    sizes.push(n);
    border.push(edge);
  }
  return { label, sizes, border };
}

// fillPercent: fill the background regions that do not touch the border and are smaller than this
// part of the frame (0 = off). keepLargest: remove all subject regions but the largest.
function cleanRegions(b, w, h, fillPercent, keepLargest) {
  const fill = new Uint8Array(w * h), remove = new Uint8Array(w * h);
  if (fillPercent > 0) {
    const r = regions(b, w, h, 0);
    const max = (fillPercent / 100) * w * h;
    for (let i = 0; i < w * h; i++) {
      const id = r.label[i];
      if (id >= 0 && !r.border[id] && r.sizes[id] < max) fill[i] = 1;
    }
  }
  if (keepLargest) {
    const c = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) c[i] = b[i] || fill[i] ? 1 : 0;
    const r = regions(c, w, h, 1);
    let best = -1;
    r.sizes.forEach((n, id) => {
      if (best < 0 || n > r.sizes[best]) best = id;
    });
    for (let i = 0; i < w * h; i++) if (r.label[i] >= 0 && r.label[i] !== best) remove[i] = 1;
  }
  return { fill, remove };
}

return { cleanRegions };
})();

// ---- analysis/cleanplate.js
const { PLATE_FRAMES, plateIndices, medianBytes } = (() => {
// Clean plate (plan §9.2): the median of each pixel and channel over frames that are evenly spaced
// over the video. A moving subject is in each pixel for less than half of the frames, so the median
// is the empty scene. The app gives the planes of the frames as the store keeps them (Y, CbCr), so
// that the background difference compares like with like.

const PLATE_FRAMES = 31;

// The frame indices for a video of n frames.
function plateIndices(n, count = PLATE_FRAMES) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = Math.min(n - 1, Math.round(((i + 0.5) * n) / count - 0.5));
    if (!out.length || out[out.length - 1] !== t) out.push(t);
  }
  return out;
}

// arrays: Uint8Arrays of the same length (one for each frame). The median of each element.
function medianBytes(arrays) {
  const n = arrays.length;
  const len = arrays[0].length;
  const out = new Uint8Array(len);
  const v = new Uint8Array(n);
  const mid = n >> 1;
  for (let i = 0; i < len; i++) {
    for (let k = 0; k < n; k++) v[k] = arrays[k][i];
    // Insertion sort (n is small).
    for (let a = 1; a < n; a++) {
      const x = v[a];
      let b = a - 1;
      while (b >= 0 && v[b] > x) {
        v[b + 1] = v[b];
        b--;
      }
      v[b + 1] = x;
    }
    out[i] = n % 2 ? v[mid] : (v[mid - 1] + v[mid] + 1) >> 1;
  }
  return out;
}

return { PLATE_FRAMES, plateIndices, medianBytes };
})();

// ---- gpu/store.js
const { MAX_STORE_LAYERS, BUDGET_DESKTOP, BUDGET_ANDROID, workingSize, frameBytes, defaultBudget, layerCount, bufferText } = (() => {
// Frame store sizes (plan §6.3, §6.4). No browser APIs, so Node tests can use it.

const MAX_STORE_LAYERS = 1000;
const BUDGET_DESKTOP = 1024 * 1048576;
const BUDGET_ANDROID = 384 * 1048576;

// The working size for a display size and a short side (0 = source). Never above the source. Even.
function workingSize(w, h, short) {
  const s = short ? Math.min(1, short / Math.min(w, h)) : 1;
  return { width: Math.max(2, Math.round((w * s) / 2) * 2), height: Math.max(2, Math.round((h * s) / 2) * 2) };
}

// YUV 4:2:0 in the store: Y (R8, full size) + CbCr (RG8, half size) = 1.5 bytes for each pixel.
const frameBytes = (w, h) => w * h + 2 * (w / 2) * (h / 2);

const defaultBudget = (userAgent = '') => (/Android/i.test(userAgent) ? BUDGET_ANDROID : BUDGET_DESKTOP);

// N = min(MAX_ARRAY_TEXTURE_LAYERS, floor(budget / bytesPerFrame), 1000), at least 1.
function layerCount(budget, maxLayers, w, h) {
  return Math.max(1, Math.min(maxLayers, Math.floor(budget / frameBytes(w, h)), MAX_STORE_LAYERS));
}

// "Buffer: 240 frames at 540p (≈ 330 MB)".
function bufferText(n, w, h) {
  return `Buffer: ${n} frames at ${Math.min(w, h)}p (≈ ${Math.round((n * frameBytes(w, h)) / 1048576)} MB)`;
}

return { MAX_STORE_LAYERS, BUDGET_DESKTOP, BUDGET_ANDROID, workingSize, frameBytes, defaultBudget, layerCount, bufferText };
})();

// ---- gpu/gl.js
const { createContext, program, texParams, drawQuad } = (() => {
// WebGL2 helpers (plan §5.3): context, programs, textures.

function createContext(canvas) {
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('This browser has no WebGL2.');
  return gl;
}

function shader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
    const log = gl.getShaderInfoLog(s);
    throw new Error(`Shader: ${log}`);
  }
  return s;
}

// A program with its uniform locations: { prog, u: { name: location } }.
function program(gl, vert, frag) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl, gl.VERTEX_SHADER, vert));
  gl.attachShader(p, shader(gl, gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error(`Program: ${gl.getProgramInfoLog(p)}`);
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) || 0;
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { prog: p, u };
}

function texParams(gl, target, filter = gl.LINEAR, minFilter = filter) {
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, minFilter);
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(target, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// Draw the one-triangle quad (quad.vert) into the bound target.
function drawQuad(gl) {
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

return { createContext, program, texParams, drawQuad };
})();

// ---- gpu/blend.js

// ---- gpu/mapgen.js
const { MapGen } = (() => {
// The map pipeline of the engine (plan §7.3 – §7.6): generate -> blur (2 passes) -> adjust, into a
// map texture. The custom map (image or video frames) is an R8 texture array.





const QUAD_VERT = "#version 300 es\n// One triangle that covers the target. v_uv: 0..1, v = 0 at the first row (image top, in texture space).\nout vec2 v_uv;\nvoid main() {\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n  v_uv = p;\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}\n";
const STORE_GLSL = "// Read the frame store (plan §6.3): Y and CbCr layers -> RGB (BT.709 full range).\nuniform highp sampler2DArray u_storeY;\nuniform highp sampler2DArray u_storeC;\nuniform highp isampler2D u_layers; // N x 1: the frame index in each store layer\nuniform int u_n;\n\nvec3 storeRgb(vec2 uv, float layer) {\n  float y = texture(u_storeY, vec3(uv, layer)).r;\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n\n// The layer of frame k, or -1 when frame k is not in the store (or k < 0).\nint layerOf(int k) {\n  if (k < 0 || u_n < 1) return -1;\n  int l = k % u_n;\n  return texelFetch(u_layers, ivec2(l, 0), 0).r == k ? l : -1;\n}\n\n// The colour of frame k at uv, and a = 1 when frame k is in the store (else black, a = 0).\nvec4 frameAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? vec4(0.0) : vec4(storeRgb(uv, float(l)), 1.0);\n}\n\n// The luma of frame k at uv (0 when not in the store).\nfloat lumaAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? 0.0 : texture(u_storeY, vec3(uv, float(l))).r;\n}\n";
const GEN_FRAG = "// Map generator (plan §7.3, §7.4, §7.6). Into the raw map texture (one value for each pixel).\n// The coordinates: offset -> tile (repeat or mirror) -> animation (rotate, pulse, about the frame\n// centre) -> the source: a built-in map (u_type), the custom image / video map, the luma of frame t\n// (self), or the motion of frames t-K .. t.\n#define PI 3.14159265359\nuniform vec2 u_res;\nuniform int u_src;      // 0 built-in, 1 custom (image or video)\nuniform int u_type;     // MAPS index\nuniform float u_k[12];  // the params of the map\nuniform float u_phase;  // phase speed × t (cycles)\nuniform float u_rot;    // rotation speed × t (degrees)\nuniform float u_pulse;  // the pulse scale at t\nuniform float u_seed;   // the seed change: floor(t / every)\nuniform vec2 u_offset;  // 0..1 of the frame\nuniform vec2 u_tile;\nuniform bool u_mirror;\nuniform int u_t;\nuniform highp sampler2D u_mask;  // the subject mask (Subject mask map)\nuniform highp sampler2D u_dist;  // the nearest subject pixel (Subject distance map)\nuniform vec2 u_workRes;\n// Custom map (R8 array: an image = 1 layer, a video = its frames).\nuniform highp sampler2DArray u_custom;\nuniform float u_layer;\nuniform vec2 u_csize;   // its size in pixels\nuniform int u_fit;      // 0 fill, 1 fit, 2 stretch\nuniform float u_outside;\nuniform vec2 u_pos;     // 0..1 of the frame\nuniform float u_scale;\nuniform float u_crot;   // degrees\nuniform vec2 u_flip;    // -1 or 1\nin vec2 v_uv;\nout vec4 o;\n\nuint hash3(uvec3 v) {\n  v = v * 1664525u + 1013904223u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  v ^= v >> 16u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  return v.x ^ v.y ^ v.z;\n}\n// 0..1 for an integer cell and a seed.\nfloat rnd(vec2 cell, float seed) {\n  return float(hash3(uvec3(ivec3(int(floor(cell.x)) + 32768, int(floor(cell.y)) + 32768, int(seed)))) & 0xffffffu) / 16777216.0;\n}\nfloat vnoise(vec2 p, float seed) {\n  vec2 i = floor(p), f = fract(p);\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(rnd(i, seed), rnd(i + vec2(1, 0), seed), u.x), mix(rnd(i + vec2(0, 1), seed), rnd(i + vec2(1, 1), seed), u.x), u.y);\n}\nvec2 rnd2(vec2 cell, float seed) {\n  return vec2(rnd(cell, seed), rnd(cell, seed + 7919.0));\n}\n// Phase: a clamped ramp (phase 0), or a repeated ramp that moves (phase != 0).\nfloat ramp(float s) {\n  return u_phase == 0.0 ? clamp(s, 0.0, 1.0) : fract(s - u_phase);\n}\nvec2 dir(float deg) {\n  float a = radians(deg);\n  return vec2(cos(a), sin(a));\n}\n\nfloat builtin(vec2 P) {\n  vec2 R = u_res;\n  float seed = u_k[3] + u_seed; // where the seed is param 3 (fbm); others set their own below\n  if (u_type == 0) { // linear: angle, x, y, width\n    vec2 d = dir(u_k[0]);\n    float span = abs(R.x * d.x) + abs(R.y * d.y);\n    return ramp(dot(P - vec2(u_k[1], u_k[2]) * R, d) / max(u_k[3] * span, 1e-3) + 0.5);\n  }\n  if (u_type == 1) { // mirrored: angle, x, y, width\n    vec2 d = dir(u_k[0]);\n    float span = abs(R.x * d.x) + abs(R.y * d.y);\n    return ramp(abs(dot(P - vec2(u_k[1], u_k[2]) * R, d)) / max(0.5 * u_k[3] * span, 1e-3));\n  }\n  vec2 q = (P - vec2(u_k[0], u_k[1]) * R) / R.y; // from the centre, in frame heights\n  if (u_type == 2) { // radial: x, y, radius, aspect\n    q.x /= u_k[3];\n    return ramp(length(q) / u_k[2]);\n  }\n  if (u_type == 3) { // angular: x, y, start, turns\n    float a = atan(q.y, q.x) - radians(u_k[2]);\n    return fract(a / (2.0 * PI) * u_k[3] - u_phase);\n  }\n  if (u_type == 4) { // spiral: x, y, arms, tightness\n    float a = atan(q.y, q.x);\n    return fract(a / (2.0 * PI) * u_k[2] + length(q) * u_k[3] - u_phase);\n  }\n  if (u_type == 5) { // box: x, y, size, roundness (0 box, 0.5 circle, 1 diamond)\n    float r = u_k[3];\n    float n = r < 0.5 ? exp2(4.0 - 6.0 * r) : 2.0 - 2.0 * (r - 0.5);\n    vec2 a = abs(q) / u_k[2];\n    float m = max(a.x, a.y);\n    float norm = m <= 0.0 ? 0.0 : m * pow(pow(a.x / m, n) + pow(a.y / m, n), 1.0 / n);\n const QUAD_VERT = "#version 300 es\n// One triangle that covers the target. v_uv: 0..1, v = 0 at the first row (image top, in texture space).\nout vec2 v_uv;\nvoid main() {\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n  v_uv = p;\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}\n";
const STORE_GLSL = "// Read the frame store (plan §6.3): Y and CbCr layers -> RGB (BT.709 full range).\nuniform highp sampler2DArray u_storeY;\nuniform highp sampler2DArray u_storeC;\nuniform highp isampler2D u_layers; // N x 1: the frame index in each store layer\nuniform int u_n;\n\nvec3 storeRgb(vec2 uv, float layer) {\n  float y = texture(u_storeY, vec3(uv, layer)).r;\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n\n// The layer of frame k, or -1 when frame k is not in the store (or k < 0).\nint layerOf(int k) {\n  if (k < 0 || u_n < 1) return -1;\n  int l = k % u_n;\n  return texelFetch(u_layers, ivec2(l, 0), 0).r == k ? l : -1;\n}\n\n// The colour of frame k at uv, and a = 1 when frame k is in the store (else black, a = 0).\nvec4 frameAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? vec4(0.0) : vec4(storeRgb(uv, float(l)), 1.0);\n}\n\n// The luma of frame k at uv (0 when not in the store).\nfloat lumaAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? 0.0 : texture(u_storeY, vec3(uv, float(l))).r;\n}\n";
const COMPOSITE_GLSL = "// Compositor (plan §10). The effect layer goes on the base with a blend mode (W3C Compositing and\n// Blending Level 1 formulas; Add, Subtract, Divide as in common editors) and an alpha:\n//   result = (1 − αs) · Cb + αs · B(Cb, Cs)      (the base is opaque)\n// Linear blend: the colours go to linear light (sRGB curve) for the blend and back.\nuniform int u_blendMode;\nuniform bool u_linear;\n\nvec3 toLinear(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }\nvec3 toSrgb(vec3 c) { return mix(c * 12.92, 1.055 * pow(max(c, 0.0), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }\n\nfloat bDodge(float b, float s) { return b == 0.0 ? 0.0 : s >= 1.0 ? 1.0 : min(1.0, b / (1.0 - s)); }\nfloat bBurn(float b, float s) { return b >= 1.0 ? 1.0 : s == 0.0 ? 0.0 : 1.0 - min(1.0, (1.0 - b) / s); }\nfloat bHard(float b, float s) { return s <= 0.5 ? b * 2.0 * s : b + (2.0 * s - 1.0) - b * (2.0 * s - 1.0); }\nfloat bSoft(float b, float s) {\n  if (s <= 0.5) return b - (1.0 - 2.0 * s) * b * (1.0 - b);\n  float d = b <= 0.25 ? ((16.0 * b - 12.0) * b + 4.0) * b : sqrt(b);\n  return b + (2.0 * s - 1.0) * (d - b);\n}\nfloat bDivide(float b, float s) { return s == 0.0 ? (b == 0.0 ? 0.0 : 1.0) : min(1.0, b / s); }\n\nfloat lum(vec3 c) { return dot(c, vec3(0.3, 0.59, 0.11)); }\nvec3 clipColor(vec3 c) {\n  float l = lum(c), n = min(min(c.r, c.g), c.b), x = max(max(c.r, c.g), c.b);\n  if (n < 0.0) c = l + (c - l) * l / (l - n);\n  if (x > 1.0) c = l + (c - l) * (1.0 - l) / (x - l);\n  return c;\n}\nvec3 setLum(vec3 c, float l) { return clipColor(c + (l - lum(c))); }\nfloat sat(vec3 c) { return max(max(c.r, c.g), c.b) - min(min(c.r, c.g), c.b); }\nvec3 setSat(vec3 c, float s) {\n  float mx = max(max(c.r, c.g), c.b), mn = min(min(c.r, c.g), c.b);\n  if (mx <= mn) return vec3(0.0);\n  return (c - mn) * s / (mx - mn); // max -> s, min -> 0, mid scaled (the W3C SetSat)\n}\n\nvec3 blendColor(vec3 b, vec3 s, int m) {\n  if (m == 0) return s;\n  if (m == 1) return min(b + s, 1.0);\n  if (m == 2) return b + s - b * s;\n  if (m == 3) return max(b, s);\n  if (m == 4) return vec3(bDodge(b.r, s.r), bDodge(b.g, s.g), bDodge(b.b, s.b));\n  if (m == 5) return vec3(bHard(s.r, b.r), bHard(s.g, b.g), bHard(s.b, b.b)); // overlay = hard light, swapped\n  if (m == 6) return vec3(bSoft(b.r, s.r), bSoft(b.g, s.g), bSoft(b.b, s.b));\n  if (m == 7) return vec3(bHard(b.r, s.r), bHard(b.g, s.g), bHard(b.b, s.b));\n  if (m == 8) return b * s;\n  if (m == 9) return min(b, s);\n  if (m == 10) return vec3(bBurn(b.r, s.r), bBurn(b.g, s.g), bBurn(b.b, s.b));\n  if (m == 11) return max(b - s, 0.0);\n  if (m == 12) return abs(b - s);\n  if (m == 13) return b + s - 2.0 * b * s;\n  if (m == 14) return vec3(bDivide(b.r, s.r), bDivide(b.g, s.g), bDivide(b.b, s.b));\n  if (m == 15) return setLum(setSat(s, sat(b)), lum(b));\n  if (m == 16) return setLum(setSat(b, sat(s)), lum(b));\n  if (m == 17) return setLum(s, lum(b));\n  return setLum(b, lum(s)); // 18 luminosity\n}\n\n// A colour cs with alpha a over the opaque base cb, with blend mode `mode`.\nvec3 compositeWith(vec3 cb, vec3 cs, float a, int mode, bool lin) {\n  if (lin) {\n    cb = toLinear(cb);\n    cs = toLinear(cs);\n  }\n  vec3 r = clamp((1.0 - a) * cb + a * blendColor(cb, cs, mode), 0.0, 1.0);\n  return lin ? toSrgb(r) : r;\n}\n\n// The effect colour cs with alpha a over the opaque base cb (the effect blend mode).\nvec3 composite(vec3 cb, vec3 cs, float a) {\n  return compositeWith(cb, cs, a, u_blendMode, u_linear);\n}\n";
const AGE_GLSL = "// Alpha and age (plan §10.3). Age: frames (Mode 1: the delay d).\nuniform float u_opacity;\nuniform int u_decay;            // 0 full, 1 linear, 2 exponential (half-life), 3 curve\nuniform float u_decayLen;       // frames\nuniform highp sampler2D u_decayCurve; // 256 x 1: alpha = 1 − curve(age / length)\nuniform float u_maxAge;         // the age at \"max age\" (tint and brightness)\nuniform bool u_tintOn;\nuniform vec3 u_tint[4];         // new -> old\nuniform int u_tintN;            // 2..4\nuniform float u_tintAmount;\nuniform float u_ageBright;      // the brightness multiplier at max age\n\nfloat decayAlpha(float age) {\n  float u = age / max(u_decayLen, 1e-3);\n  if (u_decay == 1) return clamp(1.0 - u, 0.0, 1.0);\n  if (u_decay == 2) return exp2(-u);\n  if (u_decay == 3) {\n    float x = clamp(u, 0.0, 1.0) * 255.0;\n    float i = floor(min(x, 254.0));\n    return 1.0 - mix(texelFetch(u_decayCurve, ivec2(int(i), 0), 0).r, texelFetch(u_decayCurve, ivec2(int(i) + 1, 0), 0).r, x - i);\n  }\n  return 1.0;\n}\n\n// Age tint (a ramp of 2 to 4 colours, multiplied, by amount) and age brightness.\nvec3 ageLook(vec3 c, float age) {\n  float u = clamp(age / max(u_maxAge, 1e-3), 0.0, 1.0);\n  if (u_tintOn) {\n    float x = u * float(u_tintN - 1);\n    int i = min(int(floor(x)), u_tintN - 2);\n    vec3 t = mix(u_tint[i], u_tint[i + 1], x - float(i));\n    c = mix(c, c * t, u_tintAmount);\n  }\n  return clamp(c * mix(1.0, u_ageBright, u), 0.0, 1.0);\n}\n";
const ROW_FRAG = "// Slit history (plan §8.3): one row = the pixels of the source line of one frame. The frame is read\n// from a YUV array layer (the store, or the staging layer of the analysis pass). Slit width: the\n// average of u_width pixels across the line.\nprecision highp float;\nuniform highp sampler2DArray u_Y;\nuniform highp sampler2DArray u_C;\nuniform float u_layer;\nuniform vec2 u_res;   // working size\nuniform vec2 u_L, u_d, u_e;\nuniform float u_c;\nuniform int u_width;\nout vec4 o;\n\nvec3 yuvAt(vec2 p) {\n  vec2 uv = p / u_res;\n  float y = texture(u_Y, vec3(uv, u_layer)).r;\n  vec2 c = texture(u_C, vec3(uv, u_layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n\nvoid main() {\n  float i = floor(gl_FragCoord.x);\n  vec2 q = u_L + (i - u_c) * u_e;\n  vec3 sum = vec3(0.0);\n  for (int j = 0; j < 16; j++) {\n    if (j >= u_width) break;\n    sum += yuvAt(q + u_d * (float(j) - 0.5 * float(u_width - 1)));\n  }\n  o = vec4(sum / float(u_width), 1.0);\n}\n";
const SCAN_FRAG = "// Mode 2, Slit Scan, line source (plan §8.2, §8.3). For each pixel: s = distance from the line along\n// the scan direction, y' = position along the line. s < 0: the original (not the effect side).\n// Time Off: the line of frame t. Time On: age a = A(s) (inverse of the distance table S); a > Max age:\n// the original; src = t − a < 0: black (Replace) or the original (Blend) (D8); else the history row\n// of frame round(src) (Sharp) or a mix of 2 rows (Blend). u_view: 0 result, 1 original, 2 age (heat).\nuniform vec2 u_res;\nuniform int u_t;\nuniform vec2 u_L, u_d, u_e;\nuniform float u_c;\nuniform float u_len;\nuniform highp sampler2D u_hist;          // len x H (RGBA8)\nuniform highp isampler2D u_rows;         // H x 1: the frame index of each row\nuniform int u_H;\nuniform highp sampler2D u_S;             // the distance table, 1024 wide\nuniform int u_M;                         // Max age\nuniform bool u_timeOn;\nuniform bool u_sharp;\nuniform int u_view;\nuniform int u_comp;\nin vec2 v_uv;\nout vec4 o;\n\nfloat S(int i) { return texelFetch(u_S, ivec2(i % 1024, i / 1024), 0).r; }\n\n// A(s): the largest i with S(i) <= s, then linear to the next entry.\nfloat ageOf(float s) {\n  int lo = 0, hi = u_M;\n  for (int k = 0; k < 14; k++) {\n    if (lo >= hi) break;\n    int m = (lo + hi + 1) / 2;\n    if (S(m) <= s) lo = m; else hi = m - 1;\n  }\n  if (lo >= u_M) return float(u_M);\n  return float(lo) + (s - S(lo)) / (S(lo + 1) - S(lo));\n}\n\n// The history of frame k at column x (texture units); a = 0 when the row is not there.\nvec4 row(int k, float x) {\n  if (k < 0) return vec4(0.0);\n  int r = k % u_H;\n  if (texelFetch(u_rows, ivec2(r, 0), 0).r != k) return vec4(0.0);\n  return vec4(texture(u_hist, vec2(x, (float(r) + 0.5) / float(u_H))).rgb, 1.0);\n}\n\nvec3 heat(float u) { // dark blue -> red -> yellow\n  return clamp(vec3(1.5 * u, 1.5 * u - 0.5, 0.6 - 1.2 * abs(u - 0.25) + max(0.0, 2.0 * u - 1.6)), 0.0, 1.0);\n}\n\nvoid main() {\n  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);\n  vec3 base = frameAt(u_t, uv).rgb;\n  if (u_view == 1) { o = vec4(base, 1.0); return; }\n  vec2 p = uv * u_res - u_L;\n  float s = dot(p, u_d);\n  float x = (dot(p, u_e) + u_c + 0.5) / u_len;\n  if (s < -1e-3) { o = vec4(u_view == 2 ? base * 0.3 : subjectOver(base, base, uv), 1.0); return; }\n  s = max(s, 0.0);\n  float a = 0.0;\n  vec4 c;\n  if (!u_timeOn) {\n    c = row(u_t, x);\n  } else {\n    if (s > S(u_M)) { o = vec4(u_view == 2 ? base * 0.3 : subjectOver(base, base, uv), 1.0); return; } // older than Max age\n    a = ageOf(s);\n    float src = float(u_t) - a;\n    if (u_view == 2) { o = vec4(src < -1e-3 ? vec3(0.0) : heat(a / float(max(u_M, 1))), 1.0); return; }\n    if (src < -1e-3) { o = vec4(subjectOver(u_comp == 0 ? vec3(0.0) : base, base, uv), 1.0); return; } // not online\n    src = max(src, 0.0);\n    if (u_sharp) c = row(int(floor(src + 0.5)), x);\n    else {\n      float k0 = floor(src), f = src - k0;\n      c = row(int(k0), x);\n      if (f > 0.0) c = mix(c, row(int(k0) + 1, x), f);\n    }\n  }\n  if (u_view == 2) { o = vec4(heat(0.0), 1.0); return; }\n  if (c.a == 0.0) { o = vec4(subjectOver(u_comp == 0 ? vec3(0.0) : base, base, uv), 1.0); return; } // the row is not there yet\n  vec3 col = ageLook(c.rgb, a);\n  o = vec4(subjectOver(u_comp == 0 ? col : composite(base, col, u_opacity * decayAlpha(a)), base, uv), 1.0);\n}\n";
const SUBJECT_GLSL = "// The subject layer (plan §9.4, §10.4): the current frame × the subject mask, on top of the result,\n// with its own blend mode and opacity, an optional outline, and spill suppression (chroma key).\nuniform bool u_subOn;\nuniform highp sampler2D u_subMask;\nuniform highp sampler2D u_outline;  // the subject mask, dilated by the outline width\nuniform bool u_outlineOn;\nuniform vec3 u_outlineColor;\nuniform float u_subOpacity;\nuniform int u_subBlend;\nuniform float u_spill;\nuniform vec3 u_keyRgb;\n\nvec3 despill(vec3 c) {\n  vec3 k = u_keyRgb - dot(u_keyRgb, vec3(0.2126, 0.7152, 0.0722));\n  float n = length(k);\n  if (n < 1e-3 || u_spill <= 0.0) return c;\n  k /= n;\n  float a = max(0.0, dot(c - dot(c, vec3(0.2126, 0.7152, 0.0722)), k));\n  return clamp(c - k * a * u_spill, 0.0, 1.0);\n}\n\nvec3 subjectOver(vec3 result, vec3 subj, vec2 uv) {\n  if (!u_subOn) return result;\n  float m = texture(u_subMask, uv).r;\n  vec3 r = compositeWith(result, despill(subj), m * u_subOpacity, u_subBlend, u_linear);\n  if (u_outlineOn) r = mix(r, u_outlineColor, clamp(texture(u_outline, uv).r - m, 0.0, 1.0));\n  return r;\n}\n";
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
const VIEWS = { result: 0, original: 1, map: 2 };

class Slit {
  constructor(engine) {
    this.e = engine;
    const gl = (this.gl = engine.gl);
    this.rowProg = program(gl, QUAD_VERT, `#version 300 es\n${ROW_FRAG}`);
    this.scan = program(gl, QUAD_VERT, `${HEAD}${STORE_GLSL}\n${COMPOSITE_GLSL}\n${SUBJECT_GLSL}\n${AGE_GLSL}\n${SCAN_FRAG}`);
    this.hist = this.rowsTex = this.Stex = this.stY = this.stC = null;
    this.H = 0;
    this.rowFrame = null;
    this.key = '';
    this.sKey = '';
    this.geo = null;
    this.M = 1;
  }

  // For a working size and a frame count. The history is empty after this.
  configure(w, h, frames) {
    const gl = this.gl;
    for (const t of [this.hist, this.rowsTex, this.Stex, this.stY, this.stC]) if (t) gl.deleteTexture(t);
    const maxTex = this.e.caps.maxTexture;
    this.H = historyRows(frames, maxTex);
    this.len = lineGeometry({ x: 0.5, y: 0.5, angle: 90 }, w, h, maxTex).len;
    this.hist = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.hist);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, this.len, this.H);
    texParams(gl, gl.TEXTURE_2D);
    this.rowFrame = new Int32Array(this.H).fill(-1);
    this.rowsTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32I, this.H, 1, 0, gl.RED_INTEGER, gl.INT, this.rowFrame);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    this.Stex = gl.createTexture();
    // The staging layer (YUV, 1 layer) for the frames of the analysis pass.
    this.stY = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.stY);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, 1);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.stC = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.stC);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, 1);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.key = '';
    this.sKey = '';
    return { rows: this.H };
  }

  active() {
    return !!(this.e.settings && this.e.settings.mode === 'slitscan' && this.hist);
  }

  // A change of the line (or the slit width): the history is not valid; rebuild it from the frames
  // in the store at once (the analysis pass of the page does the rest).
  update() {
    if (!this.active()) return;
    const sl = this.e.settings.slitscan;
    const e = this.e;
    const key = JSON.stringify([sl.x, sl.y, sl.angle, sl.flip, sl.width, e.w, e.h]);
    if (key !== this.key) {
      this.key = key;
      this.geo = lineGeometry(sl, e.w, e.h, e.caps.maxTexture);
      this.rowFrame.fill(-1);
      const order = [];
      for (let l = 0; l < e.n; l++) if (e.layerFrame[l] >= 0) order.push([e.layerFrame[l], l]);
      order.sort((a, b) => a[0] - b[0]);
      for (const [t, l] of order) this.writeRow(t, e.storeY, e.storeC, l, false);
      this.uploadRows();
    }
    const sk = JSON.stringify([sl.rateType, sl.rate, sl.rateEnd, sl.curve, sl.maxAge, this.H]);
    if (sk !== this.sKey) {
      this.sKey = sk;
      const S = distanceTable({ ...sl, maxAge: Math.min(sl.maxAge, this.H) });
      this.M = S.length - 1;
      const rows = Math.ceil(S.length / 1024);
      const data = new Float32Array(rows * 1024);
      data.set(S);
      const gl = this.gl;
      gl.bindTexture(gl.TEXTURE_2D, this.Stex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, 1024, rows, 0, gl.RED, gl.FLOAT, data);
      texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    }
  }

  uploadRows() {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.H, 1, gl.RED_INTEGER, gl.INT, this.rowFrame);
  }

  // Write the history row of frame index from a YUV array layer.
  writeRow(index, Y, C, layer, upload = true) {
    const gl = this.gl;
    const e = this.e;
    const g = this.geo;
    const row = index % this.H;
    const p = this.rowProg;
    gl.bindFramebuffer(gl.FRAMEBUFFER, e.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.hist, 0);
    gl.viewport(0, row, this.len, 1);
    gl.useProgram(p.prog);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, Y);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, C);
    gl.uniform1i(p.u.u_Y, 1);
    gl.uniform1i(p.u.u_C, 2);
    gl.uniform1f(p.u.u_layer, layer);
    gl.uniform2f(p.u.u_res, e.w, e.h);
    gl.uniform2f(p.u.u_L, g.L[0], g.L[1]);
    gl.uniform2f(p.u.u_d, g.d[0], g.d[1]);
    gl.uniform2f(p.u.u_e, g.e[0], g.e[1]);
    gl.uniform1f(p.u.u_c, g.c);
    gl.uniform1i(p.u.u_width, Math.max(1, Math.min(16, Math.round(e.settings.slitscan.width))));
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.rowFrame[row] = index;
    if (upload) {
      gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, row, 0, 1, 1, gl.RED_INTEGER, gl.INT, new Int32Array([index]));
    }
  }

  // A frame of the analysis pass: into the staging layer, then its history row (not the store).
  analysisFrame(index, frame) {
    this.update();
    const e = this.e;
    e.putYuv(frame, this.stY, this.stC, 0);
    if (this.active()) this.writeRow(index, this.stY, this.stC, 0);
  }

  // The count of history rows that hold a frame (for tests and the status).
  filled() {
    let n = 0;
    for (const f of this.rowFrame || []) if (f >= 0) n++;
    return n;
  }

  render(index) {
    const gl = this.gl;
    const e = this.e;
    const s = e.settings;
    const sl = s.slitscan;
    this.update();
    const g = this.geo;
    const p = this.scan;
    gl.useProgram(p.prog);
    e.bindStore(p);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, e.layersTex);
    gl.uniform1i(p.u.u_layers, 4);
    gl.uniform1i(p.u.u_n, e.n);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, this.hist);
    gl.uniform1i(p.u.u_hist, 3);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);
    gl.uniform1i(p.u.u_rows, 5);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, this.Stex);
    gl.uniform1i(p.u.u_S, 7);
    gl.uniform2f(p.u.u_res, e.w, e.h);
    gl.uniform1i(p.u.u_t, index);
    gl.uniform2f(p.u.u_L, g.L[0], g.L[1]);
    gl.uniform2f(p.u.u_d, g.d[0], g.d[1]);
    gl.uniform2f(p.u.u_e, g.e[0], g.e[1]);
    gl.uniform1f(p.u.u_c, g.c);
    gl.uniform1f(p.u.u_len, this.len);
    gl.uniform1i(p.u.u_H, this.H);
    gl.uniform1i(p.u.u_M, this.M);
    gl.uniform1i(p.u.u_timeOn, sl.time ? 1 : 0);
    gl.uniform1i(p.u.u_sharp, sl.sampling === 'blend' ? 0 : 1);
    gl.uniform1i(p.u.u_view, VIEWS[s.view] ?? 0);
    e.compositeUniforms(p, s, this.M);
    e.mask.subjectUniforms(p, s.cutout.mode === 'overlay');
    drawQuad(gl);
  }
}

const METHODS_FRAG = "// Mask pipeline steps 1–3 (plan §9.1): the methods (background difference, chroma key, luma key;\n// each a soft mask), combined (union or intersect), or an imported mask; then the garbage matte.\nuniform int u_t;\nuniform highp sampler2DArray u_plateY; // the clean plate, YUV as the store (layer 0)\nuniform highp sampler2DArray u_plateC;\nuniform bool u_bgOn;\nuniform float u_lightTol, u_thr, u_soft, u_shadow;\nuniform bool u_ckOn;\nuniform vec2 u_keyC;                 // the key colour (CbCr)\nuniform float u_ckTol, u_ckSoft;\nuniform bool u_lkOn;\nuniform float u_low, u_high, u_lkSoft;\nuniform bool u_lkInvert;\nuniform bool u_union;\nuniform bool u_imp;                  // imported mask (replaces steps 1–3)\nuniform highp sampler2DArray u_impTex;\nuniform float u_impLayer;\nuniform highp sampler2D u_matte;     // R = always subject, G = never subject\nin vec2 v_uv;\nout vec4 o;\n\n// 0 below e0, 1 above e1, linear between (a hard step when e0 == e1).\nfloat ramp(float e0, float e1, float x) { return e1 > e0 ? clamp((x - e0) / (e1 - e0), 0.0, 1.0) : step(e0, x); }\n\nvoid main() {\n  vec2 uv = v_uv;\n  float m;\n  if (u_imp) m = texture(u_impTex, vec3(uv, u_impLayer)).r;\n  else {\n    // Frame t and the plate as the store keeps them (Y, CbCr): the same 4:2:0 path for both.\n    int l = layerOf(u_t);\n    vec3 c = l < 0 ? vec3(0.0, 0.5, 0.5) : vec3(texture(u_storeY, vec3(uv, float(l))).r, texture(u_storeC, vec3(uv, float(l))).rg);\n    float acc = u_union ? 0.0 : 1.0;\n    bool any = false;\n    if (u_bgOn) {\n      vec3 p = vec3(texture(u_plateY, vec3(uv, 0.0)).r, texture(u_plateC, vec3(uv, 0.0)).rg);\n      float dY = abs(c.x - p.x) * (1.0 - u_lightTol);\n      float dC = length(c.yz - p.yz);\n      float v = ramp(u_thr - 0.5 * u_soft, u_thr + 0.5 * u_soft, length(vec2(dY, 2.0 * dC)));\n      if (u_shadow > 0.0 && c.x < p.x && p.x - c.x < u_shadow * p.x && dC < 0.03) v = 0.0; // a shadow\n      acc = u_union ? max(acc, v) : min(acc, v);\n const JFA_FRAG = "// Jump flooding (Subject distance map, plan §7.3): the nearest subject pixel of each pixel.\n// u_init: the seeds (mask >= 0.5) -> own position; else (-1, -1). Then steps of u_k pixels.\nprecision highp float;\nuniform highp sampler2D u_in;  // init: the mask; else RG = the nearest seed (pixels), -1 = none\nuniform bool u_init;\nuniform int u_k;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  ivec2 size = textureSize(u_in, 0);\n  ivec2 p = ivec2(floor(v_uv * vec2(size)));\n  vec2 pc = vec2(p) + 0.5;\n  if (u_init) {\n    o = texelFetch(u_in, p, 0).r >= 0.5 ? vec4(pc, 0.0, 1.0) : vec4(-1.0, -1.0, 0.0, 1.0);\n    return;\n  }\n  vec2 best = vec2(-1.0);\n  float bd = 1e20;\n  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {\n    ivec2 q = p + ivec2(x, y) * u_k;\n    if (any(lessThan(q, ivec2(0))) || any(greaterThanEqual(q, size))) continue;\n    vec2 s = texelFetch(u_in, q, 0).rg;\n    if (s.x < 0.0) continue;\n    float d = dot(s - pc, s - pc);\n    if (d < bd) { bd = d; best = s; }\n  }\n  o = vec4(best, 0.0, 1.0);\n}\n";

class Mask {

  setPlateFrame(t) {

    this.clearImport();
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, count);

  render() {
    const gl = this.gl;
    gl.useProgram(this.show.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.out);
    gl.uniform1i(this.show.u.u_in, 0);

  }
