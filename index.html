// ---- app/analysis.js
const { Analysis } = (() => {
// The analysis pass of Mode 2 (plan §8.3): when the line changes, decode the full video (a second
// decode worker, not in real time) and give each frame to the engine, which writes its row of the
// slit history. A new pass cancels the one that runs.



class Analysis {
  // opts: { onProgress(fraction | null), onRows() (some rows are new), onDone(key),
  //         onError(message) (optional: the pass stopped) }
  constructor(workerSrc, gpu, opts) {
    this.src = workerSrc;
    this.gpu = gpu;
    this.opts = opts;
    this.wk = null;
    this.key = ''; // the key of the pass that runs
    this.doneKey = ''; // the key of the last pass that ended
    this.progress = 0;
  }

  get running() {
    return !!this.wk;
  }

  stop() {
    if (this.wk) this.wk.terminate();
    this.wk = null;
    this.key = '';
    this.opts.onProgress(null);
  }

  // keys (optional): the clean sync samples of the file (the 'info' of the player's worker).
  start(file, count, key, keys) {
    this.stop();
    this.key = key;
    this.doneKey = '';
    this.progress = 0;
    const wk = (this.wk = makeWorker(this.src));
    let done = 0, last = 0;
    // The pass failed: stop it (only when it is still the pass that runs).
    const fail = (message) => {
      if (wk !== this.wk) return;
      this.stop();
      if (this.opts.onError) this.opts.onError(message);
    };
    wk.onerror = (e) => fail(e.message || 'Decode worker failed.');
    wk.onmessage = async (e) => {
      const m = e.data;
      if (wk !== this.wk) return m.frame && m.frame.close();
      if (m.cmd === 'info') wk.postMessage({ cmd: 'play', job: 1, from: 0, to: count - 1 });
      else if (m.cmd === 'frame') {
        try {
          await this.gpu.call({ cmd: 'slitFrame', index: m.index, frame: m.frame }, [m.frame]);
        } catch (err) {
          return fail(err.message);
        }
        if (wk !== this.wk) return;
        wk.postMessage({ cmd: 'ack' });
        done++;
        this.progress = done / count;
        this.opts.onProgress(this.progress);
        if (performance.now() - last > 150) {
          last = performance.now();
          this.opts.onRows();
        }
      } else if (m.cmd === 'done') {
        try {
          await this.gpu.call({ cmd: 'slitStatus' }); // the replies come in order: all rows are in
        } catch (err) {
          return fail(err.message);
        }
        if (wk !== this.wk) return;
        wk.terminate();
        this.wk = null;
        this.doneKey = key;
        this.key = '';
        this.opts.onProgress(null);
        this.opts.onRows();
        this.opts.onDone(key);
      } else if (m.cmd === 'error') fail(m.message);
    };
    wk.postMessage({ cmd: 'open', file, keys });
  }
}

return { Analysis };
})();

// ---- app/ui/handles.js
const { LineHandles } = (() => {
// Direct control on the preview (plan §8.1, §12.1): the Mode 2 source line. Drag the centre point to
// move the line, drag the round handle to turn it (Shift or the Snap button: steps of 15°), touch the
// arrow to flip the scan direction.

// SVG elements, made by the HTML parser (it gives them the SVG namespace).
const mk = (tag, attrs) => {
  const box = document.createElement('div');
  box.innerHTML = tag === 'svg' ? '<svg></svg>' : `<svg><${tag}/></svg>`;
  const e = tag === 'svg' ? box.firstChild : box.firstChild.firstChild;
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};

class LineHandles {
  // app: { change(path, value), settings }
  constructor(area, canvas, app) {
    this.canvas = canvas;
    this.app = app;
    this.snap = false;
    const svg = (this.svg = mk('svg', { id: 'handles', class: 'handles' }));
    this.line = mk('line', { class: 'hLine' });
    this.arrow = mk('path', { class: 'hArrow' });
    this.arrowHit = mk('path', { class: 'hArrowHit', 'data-handle': 'flip' }); // a wider target
    this.center = mk('circle', { class: 'hPoint', r: 9, 'data-handle': 'move' });
    this.rot = mk('circle', { class: 'hRot', r: 8, 'data-handle': 'rotate' });
    svg.append(this.line, this.arrow, this.arrowHit, this.center, this.rot);
    this.snapBtn = document.createElement('button');
    this.snapBtn.type = 'button';
    this.snapBtn.className = 'snapBtn';
    this.snapBtn.textContent = 'Snap 15°';
    this.snapBtn.addEventListener('click', () => {
      this.snap = !this.snap;
      this.snapBtn.classList.toggle('on', this.snap);
    });
    area.append(svg, this.snapBtn);
    let drag = null;
    svg.addEventListener('pointerdown', (e) => {
      const h = e.target.dataset && e.target.dataset.handle;
      if (!h) return;
      e.preventDefault();
      e.stopPropagation();
      if (h === 'flip') {
        this.app.change('slitscan.flip', !this.app.settings.slitscan.flip);
        return;
      }
      drag = h;
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const { x, y, r } = this.toFrame(e.clientX, e.clientY);
      const S = this.app.settings.slitscan;
      if (this.app.edgeMode && this.app.edgeMode()) {
        // The Subject edge source: the direction from the frame centre to the pointer.
        let a = (Math.atan2((y - 0.5) * r.h, (x - 0.5) * r.w) * 180) / Math.PI;
        if (S.flip) a += 180;
        a = ((a % 360) + 360) % 360;
        if (e.shiftKey || this.snap) a = (Math.round(a / 15) * 15) % 360;
        this.app.change('slitscan.edgeAngle', Math.round(a * 10) / 10);
        return;
      }
      if (drag === 'move') {
        this.app.change('slitscan.x', Math.round(Math.min(1, Math.max(0, x)) * 1000) / 1000);
        this.app.change('slitscan.y', Math.round(Math.min(1, Math.max(0, y)) * 1000) / 1000);
      } else {
        // The angle of the line through the point, to the pointer (in pixels of the picture).
        let a = (Math.atan2((y - S.y) * r.h, (x - S.x) * r.w) * 180) / Math.PI;
        a = ((a % 360) + 360) % 360;
        if (e.shiftKey || this.snap) a = (Math.round(a / 15) * 15) % 360;
        this.app.change('slitscan.angle', Math.round(a * 10) / 10);
      }
    });
    const end = () => (drag = null);
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    new ResizeObserver(() => this.update()).observe(area);
  }

  toFrame(cx, cy) {
    const b = this.canvas.getBoundingClientRect();
    return { x: (cx - b.left) / b.width, y: (cy - b.top) / b.height, r: { w: b.width, h: b.height } };
  }

  update() {
    const S = this.app.settings;
    const show = S.mode === 'slitscan' && S.view !== 'original' && S.view !== 'mask' && !this.canvas.hidden && !(this.app.tools && this.app.tools.tool);
    this.svg.style.display = show ? '' : 'none';
    this.snapBtn.style.display = show ? '' : 'none';
    if (!show) return;
    // The overlay covers the canvas only (the line is clipped to the picture).
    const b = this.canvas.getBoundingClientRect();
    const a = this.svg.parentElement.getBoundingClientRect();
    this.svg.style.left = `${b.left - a.left}px`;
    this.svg.style.top = `${b.top - a.top}px`;
    const ox = 0, oy = 0;
    const sl = S.slitscan;
    const edge = this.app.edgeMode && this.app.edgeMode();
    // Line: the line through the point. Subject edge: only the direction, from the frame centre.
    const px = ox + (edge ? 0.5 : sl.x) * b.width, py = oy + (edge ? 0.5 : sl.y) * b.height;
    const t = (sl.angle * Math.PI) / 180;
    let e = [Math.cos(t), Math.sin(t)];
    let d = [Math.sin(t), -Math.cos(t)];
    if (edge) {
      const te = (sl.edgeAngle * Math.PI) / 180;
      d = [Math.cos(te), Math.sin(te)];
      e = d; // the round handle is on the direction
    }
    if (sl.flip) d = [-d[0], -d[1]];
    this.line.style.display = edge ? 'none' : '';
    this.center.style.display = edge ? 'none' : '';
    if (edge) e = d;
    const L = Math.hypot(b.width, b.height);
    this.svg.setAttribute('width', b.width);
    this.svg.setAttribute('height', b.height);
    this.line.setAttribute('x1', px - e[0] * L);
    this.line.setAttribute('y1', py - e[1] * L);
    this.line.setAttribute('x2', px + e[0] * L);
    this.line.setAttribute('y2', py + e[1] * L);
    this.center.setAttribute('cx', px);
    this.center.setAttribute('cy', py);
    const rd = Math.min(70, 0.3 * Math.min(b.width, b.height));
    this.rot.setAttribute('cx', px + e[0] * rd);
    this.rot.setAttribute('cy', py + e[1] * rd);
    // The arrow: from the point, in the scan direction.
    const ax = px + d[0] * 34, ay = py + d[1] * 34, bx = px + d[0] * 14, by = py + d[1] * 14;
    const n = [-d[1] * 7, d[0] * 7];
    const path = `M${bx},${by} L${ax},${ay} M${ax - d[0] * 10 + n[0]},${ay - d[1] * 10 + n[1]} L${ax},${ay} L${ax - d[0] * 10 - n[0]},${ay - d[1] * 10 - n[1]}`;
    this.arrow.setAttribute('d', path);
    this.arrowHit.setAttribute('d', path);
  }
}

return { LineHandles };
})();

// ---- app/ui/tools.js
const { PreviewTools } = (() => {
// Preview tools (plan §9.1, §12.1): the eyedropper (chroma key colour) and the garbage matte brush
// (Always subject / Never subject / Erase). One finger or the mouse: the active tool.

class PreviewTools {
  // app: { pick(u, v), strokeStart() (before the first points of a stroke), stroke(points, mode),
  //        brush: { size, hardness }, onTool(tool) }
  constructor(area, canvas, app) {
    this.area = area;
    this.canvas = canvas;
    this.app = app;
    this.tool = null; // null | 'pick' | 'always' | 'never' | 'erase'
    this.cursor = document.createElement('div');
    this.cursor.className = 'brushCursor';
    this.cursor.hidden = true;
    area.append(this.cursor);
    this.bind(canvas);
  }

  // The listeners on the preview canvas (again when the canvas is new: a GPU restart).
  bind(canvas) {
    this.canvas = canvas;
    let pts = null, sent = 0, raf = 0;
    const uv = (e) => {
      const b = canvas.getBoundingClientRect();
      return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height];
    };
    // Send the new points of the stroke (with the last sent point, so the stroke is continuous).
    const flush = () => {
      raf = 0;
      if (!pts || pts.length <= sent) return;
      const part = pts.slice(Math.max(0, sent - 1));
      sent = pts.length;
      this.app.stroke(part, this.tool);
    };
    canvas.addEventListener('pointerdown', (e) => {
      if (!this.tool || e.button > 0) return;
      e.preventDefault();
      if (this.tool === 'pick') {
        this.app.pick(...uv(e));
        return;
      }
      canvas.setPointerCapture(e.pointerId);
      if (this.app.strokeStart) this.app.strokeStart();
      pts = [uv(e)];
      sent = 0;
      flush();
    });
    canvas.addEventListener('pointermove', (e) => {
      this.moveCursor(e);
      if (!pts) return;
      pts.push(uv(e));
      if (!raf) raf = requestAnimationFrame(flush);
    });
    const end = () => {
      if (pts) flush();
      pts = null;
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('pointerleave', () => (this.cursor.hidden = true));
    canvas.style.cursor = this.tool === 'pick' ? 'crosshair' : this.tool ? 'none' : '';
  }

  setTool(tool) {
    this.tool = this.tool === tool ? null : tool;
    this.canvas.style.cursor = this.tool === 'pick' ? 'crosshair' : this.tool ? 'none' : '';
    this.cursor.hidden = true;
    this.app.onTool(this.tool);
  }

  moveCursor(e) {
    const brush = this.tool && this.tool !== 'pick';
    this.cursor.hidden = !brush;
    if (!brush) return;
    const b = this.canvas.getBoundingClientRect(), a = this.area.getBoundingClientRect();
    const d = (this.app.brush.size * b.width) / this.canvas.width;
    Object.assign(this.cursor.style, { width: `${d}px`, height: `${d}px`, left: `${e.clientX - a.left - d / 2}px`, top: `${e.clientY - a.top - d / 2}px` });
  }
}

return { PreviewTools };
})();

// ---- app/export.js
const { probeEncoder, cleanExportStorage, saveParts, Exporter } = (() => {
// Export (plan §11.2): probe the encoder, make the engine at the export size (and the Mode 2 analysis
// pass), decode from the warm-up start, render each frame, encode it (VideoEncoder in the encode
// worker, encodeQueueSize <= 8), copy the audio packets of the range, mux (video + audio), and save
// (a Blob, or a file in the Origin Private File System when it is large). Frame times are the source
// times (the source timescale), so VFR and the audio sync stay.






const MAX_ENCODE_QUEUE = 8;
const OPFS_LIMIT = 1024 * 1048576; // larger files go to the Origin Private File System

// The first supported encoder configuration for a size (plan §3, §11.2), or null.
async function probeEncoder(w, h, fps, opts = {}) {
  if (typeof VideoEncoder === 'undefined') return null;
  const prefs = opts.hardware === 'software' ? ['prefer-software', 'no-preference'] : ['prefer-hardware', 'no-preference'];
  const bitrate = bitrateFor(w, h, fps, opts.quality ?? 'high', opts.mbps);
  for (const codec of codecCandidates(w, h, fps)) {
    for (const hardwareAcceleration of prefs) {
      const config = { codec, width: w, height: h, bitrate, framerate: fps, hardwareAcceleration, bitrateMode: 'variable', latencyMode: 'quality', avc: { format: 'avc' } };
      try {
        if ((await VideoEncoder.isConfigSupported(config)).supported) return config;
      } catch { /* the next one */ }
    }
  }
  return null;
}

const OPFS_PREFIX = 'neofx-export';
const OPFS_FILE = /^neofx-export.*\.mp4$/;

// Each export file in the OPFS has its own name, and a lock of that name while it is in use (Web
// Locks; a lock ends with its page), so two tabs do not write the same file and a file that is
// still open is not removed. Returns { name, unlock }.
async function exportFileName() {
  if (typeof navigator === 'undefined' || !navigator.locks) return { name: `${OPFS_PREFIX}.mp4`, unlock() {} };
  const name = `${OPFS_PREFIX}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}.mp4`;
  const unlock = await new Promise((resolve) => {
    navigator.locks.request(name, () => new Promise((release) => resolve(release))).catch(() => resolve(() => {}));
  });
  return { name, unlock };
}

// Remove the export files that an earlier visit left in the OPFS (the page was closed with the
// finished export open: up to some GB would stay in the browser storage). A file that another tab
// still uses (it holds the lock) stays.
async function cleanExportStorage() {
  try {
    if (typeof navigator === 'undefined' || !navigator.storage || !navigator.storage.getDirectory) return;
    const dir = await navigator.storage.getDirectory();
    const names = [];
    for await (const name of dir.keys()) if (OPFS_FILE.test(name)) names.push(name);
    for (const name of names) {
      const remove = () => dir.removeEntry(name).catch(() => {});
      if (navigator.locks) await navigator.locks.request(name, { ifAvailable: true }, (lock) => (lock ? remove() : null));
      else await remove();
    }
  } catch { /* no storage */ }
}

// Save the parts of the file: a Blob, or (large, or opts.opfs) a file in the OPFS. release() (OPFS
// only): remove that file, when the result is not needed any more.
async function saveParts(parts, size, name, opts = {}) {
  const low = typeof navigator !== 'undefined' && navigator.deviceMemory && navigator.deviceMemory <= 4 && size > 256 * 1048576;
  if ((opts.opfs || size > OPFS_LIMIT || low) && navigator.storage && navigator.storage.getDirectory) {
    const f = await exportFileName();
    let dir = null;
    try {
      dir = await navigator.storage.getDirectory();
      const fh = await dir.getFileHandle(f.name, { create: true });
      const w = await fh.createWritable();
      try {
        for (const p of parts) await w.write(p);
        await w.close();
      } catch (e) {
        await w.abort().catch(() => {});
        throw e;
      }
      const file = await fh.getFile();
      let released = false;
      const release = () => {
        if (released) return;
        released = true;
        dir.removeEntry(f.name).catch(() => {}).then(f.unlock);
      };
      return { blob: new File([file], name, { type: 'video/mp4' }), opfs: true, release };
    } catch {
      // (Also a part of a file that did not fit.)
      if (dir) await dir.removeEntry(f.name).catch(() => {});
      f.unlock();
      if (opts.opfs) throw new Error('The browser storage (OPFS) cannot hold the file.');
    }
  }
  return { blob: new File(parts, name, { type: 'video/mp4' }), opfs: false };
}

class Exporter {
  // app: { gpu, decodeSrc, encodeSrc, file(), info(), settings, configure(w, h) -> reply,
  //        analyse() -> Promise (Mode 2 at the export size), depth() (history frames), restore() }
  constructor(app) {
    this.app = app;
    this.cancelled = false;
    this.workers = [];
  }

  cancel() {
    this.cancelled = true;
    for (const w of this.workers) w.terminate();
    if (this.wake) this.wake();
    if (this.abortDecode) this.abortDecode(); // the decode worker sends nothing more
  }

  check() {
    if (this.cancelled) throw new Error('Export cancelled');
  }

  // opts: { width, height, quality, mbps, keyint (s), range: [a, b], audio (bool), hardware, name, opfs }
  // onProgress({ done, total, fps, eta (s), phase }). Returns { blob, name, size, opfs, config, width, height }.
  async run(opts, onProgress) {
    const A = this.app;
    const info = A.info();
    const file = A.file();
    const [a, b] = opts.range;
    const total = b - a + 1;
    onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'prepare' });
    // 1. The encoder (a lower size when the size is not supported).
    let { width, height } = opts;
    let config = await probeEncoder(width, height, info.fps, opts);
    if (!config) {
      for (const s of exportSizes(info.width, info.height)) {
        if (s.width * s.height >= width * height) continue;
        config = await probeEncoder(s.width, s.height, info.fps, opts);
        if (config) {
          ({ width, height } = s);
          break;
        }
      }
    }
    if (!config) throw new Error('This browser has no H.264 encoder for this video.');
    this.check();
    // The exact frame times (source timescale) and the audio packets.
    const d = await demuxMp4(file);
    const ts = d.timescale;
    const ptsOf = d.samples.map((s) => s.dts + s.cto - d.mediaTime);
    const frameSample = info.frameSamples; // frame index -> sample index
    const pts = (t) => ptsOf[frameSample[t]];
    // 2. The engine at the export size; Mode 2: the analysis pass at that size.
    await A.gpu.call({ cmd: 'exporting', on: true });
    try {
      const conf = await A.configure(width, height);
      // Perfect loop (Time Map): the history of the first frames is the end of the range. Store
      // indices: the end frames of the range (the pass before) at their frame index, the range at
      // frame index + L. The delay is at most L − 1.
      const wrapL = A.wrap && A.wrap() ? total : 0;
      const depth = wrapL ? Math.min(A.depth(), wrapL - 1) : A.depth();
      await A.gpu.call({ cmd: 'wrap', cap: wrapL ? wrapL - 1 : null, forget: true });
      if (depth > conf.n - 1) throw new Error(`The Max delay (${depth} frames) is more than the buffer at ${Math.min(width, height)}p (${conf.n} frames). Choose a lower resolution.`);
      if (A.settings.mode === 'slitscan') {
        onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'analysis' });
        await A.analyse((f) => onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'analysis', analysis: f }));
      }
      this.check();
      // 3. The encoder worker.
      const enc = makeWorker(A.encodeSrc);
      this.workers.push(enc);
      const chunks = [];
      const packer = new DataPacker(32 * 1048576);
      let description = null, queue = 0, failure = null;
      const frames = new FrameMatcher(); // chunk timestamp -> frame index (nearest, not exact)
      // Tests: change the chunk timestamps as Safari does (opts.skewChunks: µs -> µs).
      const skew = typeof opts.skewChunks === 'function' ? opts.skewChunks : null;
      const poke = () => {
        if (this.wake) {
          const f = this.wake;
          this.wake = null;
          f();
        }
      };
      enc.onmessage = (e) => {
        const m = e.data;
        if (m.cmd === 'chunk') {
          if (m.description && !description) description = m.description;
          packer.add(m.data);
          const t = frames.match(skew ? skew(m.timestamp) : m.timestamp);
          if (t < 0) failure = new Error(`The encoder gave a frame with an unknown time (${m.timestamp} µs).`);
          else chunks.push({ pts: pts(t) - pts(a), size: m.data.length, key: m.key });
        } else if (m.cmd === 'queue') queue = m.size;
        else if (m.cmd === 'error') failure = new Error(m.message);
        else if (m.cmd === 'flushed') this.flushed = true;
        poke();
      };
      const waitFor = async (cond) => {
        while (!cond()) {
          if (failure) throw failure;
          this.check();
          await new Promise((r) => (this.wake = r));
        }
      };
      enc.postMessage({ cmd: 'configure', config });
      // 4. Decode from the warm-up start (the history of frame a), render, encode.
      const dec = makeWorker(A.decodeSrc);
      this.workers.push(dec);
      const from = wrapL ? a : Math.max(0, a - depth);
      // Decode jobs: 1 = the end of the range (perfect loop history), 2 = from .. b.
      const firstJob = wrapL && depth > 0 ? 1 : 2;
      let done = 0, lastKey = -Infinity;
      const t0 = performance.now();
      await new Promise((resolve, reject) => {
        const fail = (err) => reject(err);
        this.abortDecode = () => reject(new Error('Export cancelled'));
        // One message at a time (the frames go to the GPU and the encoder in order).
        let chain = Promise.resolve();
        dec.onmessage = (e) => {
          chain = chain.then(() => handle(e.data));
        };
        const handle = async (m) => {
          try {
            if (m.cmd === 'info') {
              if (firstJob === 1) dec.postMessage({ cmd: 'play', job: 1, from: b - depth + 1, to: b });
              else dec.postMessage({ cmd: 'play', job: 2, from, to: b });
            } else if (m.cmd === 'error') fail(new Error(m.message));
            else if (m.cmd === 'done') {
              if (m.job === 1) dec.postMessage({ cmd: 'play', job: 2, from, to: b });
              else resolve();
            } else if (m.cmd === 'frame') {
              const t = m.index;
              if (this.cancelled) {
                m.frame.close();
                return;
              }
              const history = m.job === 1;
              const show = !history && t >= a;
              const index = history ? t : t + wrapL;
              const us = Math.round(((pts(t) - pts(a)) * 1e6) / ts);
              const durUs = Math.round(((t + 1 < info.times.length ? pts(t + 1) - pts(t) : d.samples[frameSample[t]].duration) * 1e6) / ts);
              const r = await A.gpu.call({ cmd: 'upload', index, frame: m.frame, show, grab: show ? { timestamp: us, duration: durUs } : undefined }, [m.frame]);
              if (show) {
                frames.add(us, t);
                const key = us - lastKey >= opts.keyint * 1e6;
                if (key) lastKey = us;
                // The rendered frame is closed here when it does not get to the encoder (a cancel,
                // an encoder error): a VideoFrame holds its memory until it is closed.
                try {
                  await waitFor(() => queue <= MAX_ENCODE_QUEUE);
                  queue++;
                  enc.postMessage({ cmd: 'frame', frame: r.frame, key }, [r.frame]);
                } catch (err) {
                  try { r.frame.close(); } catch { /* closed */ }
                  throw err;
                }
                done++;
                const sec = (performance.now() - t0) / 1000;
                const fps = done / Math.max(sec, 1e-3);
                onProgress({ done, total, fps, eta: (total - done) / Math.max(fps, 1e-3), phase: 'encode' });
              } else if (t % 4 === 0) onProgress({ done: 0, total, fps: 0, eta: 0, phase: 'warmup', warm: history ? (t - (b - depth)) / Math.max(1, depth) : (t - from + 1) / Math.max(1, a - from) });
              dec.postMessage({ cmd: 'ack' });
            }
          } catch (err) {
            fail(err);
          }
        };
        dec.onerror = (e) => fail(new Error(e.message || 'Decode worker failed.'));
        enc.onerror = (e) => fail(new Error(e.message || 'Encode worker failed.'));
        dec.postMessage({ cmd: 'open', file, keys: A.keys ? A.keys() : undefined });
      });
      this.check();
      this.flushed = false;
      enc.postMessage({ cmd: 'flush' });
      await waitFor(() => this.flushed);
      if (chunks.length !== total) throw new Error(`The encoder gave ${chunks.length} of ${total} frames.`);
      // 5. Mux: video (the source timescale) + the audio packets of the range (copied, D16).
      const lastDur = d.samples[frameSample[b]].duration;
      const { samples, mediaTime } = chunkSamples(chunks, lastDur);
      // Never write a file with broken frame times (it would play too fast, or not at all).
      const bad = checkSamples(samples);
      if (bad) throw new Error(`The export stopped: ${bad}. Please report this with the name of the browser.`);
      const video = { width, height, timescale: ts, avcc: description, samples, mediaTime, dataParts: packer.done() };
      let audio = null;
      const au = d.audio;
      if (opts.audio && au) {
        const usA = info.times[a], usB = info.times[b] + (info.times[b + 1] !== undefined ? info.times[b + 1] - info.times[b] : (lastDur * 1e6) / ts);
        // Whole packets of the range; from frame 0, also the priming packets before time 0 (with the
        // source edit list).
        const list = au.samples.filter((s) => (a === 0 || s.us >= usA - 1) && s.us < usB - 1);
        if (list.length) {
          // Read the packets into memory now (a few large reads). Slices of the source file in the
          // result would be read again, one small read for each packet, when the browser saves it
          // (on Android, through the content provider of the picked file: very slow).
          onProgress({ done, total, fps: 0, eta: 0, phase: 'audio' });
          const data = await readPackets(file, list);
          this.check();
          audio = {
            ...au,
            mediaTime: a === 0 ? au.mediaTime : 0,
            samples: list.map((s) => ({ size: s.size, duration: s.duration })),
            dataParts: [data],
          };
        }
      }
      onProgress({ done, total, fps: 0, eta: 0, phase: 'mux' });
      const r = muxMp4(video, { audio });
      const name = opts.name;
      const saved = await saveParts(r.parts, r.size, name, { opfs: opts.opfs });
      return { ...saved, name, size: r.size, config, width, height, frames: chunks.length, audio: !!audio };
    } finally {
      for (const w of this.workers) w.terminate();
      this.workers = [];
      await A.gpu.call({ cmd: 'exporting', on: false });
    }
  }
}

return { probeEncoder, cleanExportStorage, saveParts, Exporter };
})();

// ---- app/ui/exportdialog.js
const { ExportDialog } = (() => {
// The export dialog (plan §11.1, §11.2): settings, progress, cancel, then Download (or Share).



const el = (tag, attrs = {}, text) => {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  if (text !== undefined) e.textContent = text;
  return e;
};

class ExportDialog {
  // app: { info(), file(), range() -> [a, b] | null, hasAudio(), check(width, height) -> warning text or '',
  //        run(opts, onProgress) -> result, cancel() }
  constructor(dialog, app) {
    this.d = dialog;
    this.app = app;
    this.result = null;
    this.url = null;
    // The exported file stays in memory only while the dialog is open: then its URL is given back.
    this.running = false;
    dialog.addEventListener('close', () => {
      // Closed while the export runs (it must not go on behind the page): stop it.
      if (this.running) this.app.cancel();
      this.release();
    });
    // Esc while the export runs: Cancel (the dialog stays, with the result of the cancel).
    dialog.addEventListener('cancel', (e) => {
      if (!this.running) return;
      e.preventDefault();
      this.app.cancel();
    });
  }

  release() {
    if (this.url) URL.revokeObjectURL(this.url);
    // A large export was written to the browser storage (OPFS): remove that file too.
    if (this.result && this.result.release) this.result.release();
    this.url = null;
    this.result = null;
  }

  open() {
    const info = this.app.info();
    if (!info) return;
    const d = this.d;
    d.textContent = '';
    this.release();
    const form = el('form', { method: 'dialog', className: 'exportForm' });
    form.append(el('h2', {}, 'Export'));
    const row = (label, input) => {
      const r = el('label', { className: 'exportRow' });
      r.append(el('span', {}, label), input);
      form.append(r);
      return input;
    };
    const sel = (name, options, value) => {
      const s = el('select', { name });
      for (const [v, t] of options) s.append(el('option', { value: v }, t));
      s.value = value;
      return s;
    };
    const sizes = exportSizes(info.width, info.height);
    const res = row('Resolution', sel('resolution', sizes.map((s) => [s.id, s.label]), 'source'));
    const quality = row('Quality', sel('quality', [...Object.keys(QUALITY).map((k) => [k, { low: 'Low', medium: 'Medium', high: 'High', veryhigh: 'Very high' }[k]]), ['custom', 'Bitrate (Mbit/s)']], 'high'));
    const mbps = row('Bitrate', el('input', { type: 'number', name: 'mbps', min: 0.5, max: 200, step: 0.5, value: 8 }));
    mbps.parentElement.hidden = true;
    quality.addEventListener('change', () => (mbps.parentElement.hidden = quality.value !== 'custom'));
    const keyint = row('Keyframe interval (s)', el('input', { type: 'number', name: 'keyint', min: 1, max: 10, step: 1, value: 2 }));
    const range = this.app.range();
    const rangeSel = row('Range', sel('range', [['full', 'Full'], ...(range ? [['inout', `In – Out (frames ${range[0]} – ${range[1]})`]] : [])], 'full'));
    const audio = row('Audio', sel('audio', this.app.hasAudio() ? [['copy', 'Copy original'], ['none', 'None']] : [['none', 'None (the file has no audio)']], this.app.hasAudio() ? 'copy' : 'none'));
    const hw = row('Encoder', sel('hardware', [['hardware', 'Prefer hardware'], ['software', 'Prefer software']], 'hardware'));
    const name = row('File name', el('input', { type: 'text', name: 'name', value: exportName(this.app.file().name) }));
    const warn = el('p', { className: 'exportWarn' });
    form.append(warn);
    const size = () => sizes.find((s) => s.id === res.value);
    const check = () => {
      const s = size();
      warn.textContent = this.app.check(s.width, s.height);
      go.disabled = !!warn.textContent;
    };
    const prog = el('div', { className: 'exportProgress', hidden: true });
    const bar = el('div', { className: 'bar' });
    const text = el('p', { className: 'exportText' });
    prog.append(el('div', { className: 'track' }), text);
    prog.firstChild.append(bar);
    form.append(prog);
    const buttons = el('div', { className: 'exportButtons' });
    const go = el('button', { type: 'button', className: 'primary', id: 'exportGo' }, 'Export');
    const cancel = el('button', { type: 'button', id: 'exportCancel' }, 'Cancel');
    buttons.append(cancel, go);
    form.append(buttons);
    d.append(form);
    res.addEventListener('change', check);
    check();
    cancel.addEventListener('click', () => {
      if (this.running) this.app.cancel();
      else d.close();
    });
    go.addEventListener('click', async () => {
      if (this.running) return;
      this.running = true;
      go.disabled = true;
      for (const i of form.querySelectorAll('select, input')) i.disabled = true;
      prog.hidden = false;
      // Until the first frame: a moving bar (the encoder probe, the file index, the warm-up frames).
      prog.classList.add('busy');
      text.textContent = 'Preparing…';
      const s = size();
      const opts = {
        width: s.width, height: s.height, quality: quality.value, mbps: Number(mbps.value), keyint: Number(keyint.value),
        range: rangeSel.value === 'inout' && range ? range : [0, info.times.length - 1],
        audio: audio.value === 'copy', hardware: hw.value, name: name.value || exportName(this.app.file().name),
      };
      try {
        const r = await this.app.run(opts, (p) => {
          prog.classList.toggle('busy', ['prepare', 'warmup', 'audio', 'mux'].includes(p.phase));
          if (p.phase === 'prepare') text.textContent = 'Preparing…';
          else if (p.phase === 'warmup') text.textContent = `Preparing the first frames… ${Math.round((p.warm || 0) * 100)} %`;
          else if (p.phase === 'analysis') {
            bar.style.width = `${Math.round((p.analysis || 0) * 100)}%`;
            text.textContent = `Analysis ${Math.round((p.analysis || 0) * 100)} %`;
          } else if (p.phase === 'audio') text.textContent = 'Copying the audio…';
          else if (p.phase === 'mux') text.textContent = 'Writing the file…';
          else {
            bar.style.width = `${Math.round((100 * p.done) / p.total)}%`;
            text.textContent = `${p.done} / ${p.total} frames · ${p.fps.toFixed(1)} fps · ${Math.ceil(p.eta)} s left`;
          }
        });
        // (The dialog was closed or opened again while the export ended: the file is not needed.)
        if (!d.open || !form.isConnected) {
          if (r.release) r.release();
          return;
        }
        this.result = r;
        prog.classList.remove('busy');
        bar.style.width = '100%';
        text.textContent = `Done: ${r.width}×${r.height}, ${r.frames} frames, ${(r.size / 1048576).toFixed(1)} MB${r.audio ? ', with audio' : ''}.`;
        this.showResult(buttons, r);
      } catch (e) {
        prog.classList.remove('busy');
        text.textContent = e.message;
        cancel.textContent = 'Close';
      } finally {
        this.running = false;
      }
    });
    d.showModal();
  }

  showResult(buttons, r) {
    buttons.textContent = '';
    const url = (this.url = URL.createObjectURL(r.blob));
    const dl = el('a', { href: url, download: r.name, className: 'button primary', id: 'exportDownload' }, 'Download');
    buttons.append(dl);
    // Share (iOS-like environments, plan §11.2 step 7).
    if (navigator.canShare && navigator.canShare({ files: [r.blob] })) {
      const sh = el('button', { type: 'button', id: 'exportShare' }, 'Share');
      sh.addEventListener('click', () => navigator.share({ files: [r.blob], title: r.name }).catch(() => {}));
      buttons.prepend(sh);
    }
    const close = el('button', { type: 'button' }, 'Close');
    close.addEventListener('click', () => this.d.close());
    buttons.prepend(close);
  }
}

return { ExportDialog };
})();

// ---- app/history.js
const { History } = (() => {
// Undo / redo (plan §12.5): a list of settings snapshots. Each setting change is one step; the
// changes of one path that come fast (a slider drag) join into one step.

const JOIN_MS = 600;

class History {
  constructor(limit = 200) {
    this.limit = limit;
    this.past = []; // snapshots (JSON) before each step
    this.future = [];
    this.last = null; // { path, time } of the last step
  }

  // Call before a change. path: the setting path (or a name like 'preset', 'randomize').
  record(snapshot, path, now = Date.now()) {
    const join = this.last && path && this.last.path === path && now - this.last.time < JOIN_MS;
    this.last = { path, time: now };
    if (join) return false;
    this.past.push(snapshot);
    if (this.past.length > this.limit) this.past.shift();
    this.future = [];
    return true;
  }

  // The end of a drag: the next change is a new step.
  cut() {
    this.last = null;
  }

  get canUndo() {
    return this.past.length > 0;
  }

  get canRedo() {
    return this.future.length > 0;
  }

  // current: the snapshot now. Returns the snapshot to restore, or null.
  undo(current) {
    if (!this.past.length) return null;
    this.future.push(current);
    this.last = null;
    return this.past.pop();
  }

  redo(current) {
    if (!this.future.length) return null;
    this.past.push(current);
    this.last = null;
    return this.future.pop();
  }
}

return { History };
})();

// File: { app: 'neofx', version, settings, assets: { mapImage, matte } } (PNG data URLs). A video
// map is stored by its file name only: at load, the app asks for the file.



// Deep merge of plain objects (arrays are values).
function merge(base, over) {
  const out = clone(base);
  const walk = (o, v) => {
    for (const [k, x] of Object.entries(v || {})) {
      if (x && typeof x === 'object' && !Array.isArray(x) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) walk(o[k], x);
      else o[k] = clone(x);
    }
  };
  walk(out, over);
  return out;
}

// The settings of a preset: on the defaults, keeping the cutout method settings, the custom maps,
// and the view of the user (a preset is a look, not the footage setup).
function applyPreset(current, preset) {
  const s = merge(DEFAULTS, preset.s);
  s.view = current.view;
  s.timemap.perfectLoop = !!(current.timemap && current.timemap.perfectLoop); // an output choice, not a look
  const keep = clone(current.cutout);
  s.cutout = { ...keep, mode: (preset.s.cutout && preset.s.cutout.mode) || 'off' };
  if (s.cutout.mode === 'scan' && s.mode !== 'slitscan') s.cutout.mode = 'overlay';
  s.map.image = clone(current.map.image);
  s.map.video = clone(current.map.video);
  return s;
}

function presetFile(settings, version, assets = {}) {
  return { app: 'neofx', version, settings: clone(settings), assets };
}

// Read a preset file (text). Returns { settings, assets } on the defaults (older or partial files
// get the default of each missing setting), or throws.
function parsePresetFile(text) {
  let o;
  try {
    o = JSON.parse(text);
  } catch {
    throw new Error('This is not a neofx preset file.');
  }
  if (!o || o.app !== 'neofx' || !o.settings || typeof o.settings !== 'object') throw new Error('This is not a neofx preset file.');
  return { settings: merge(DEFAULTS, o.settings), assets: o.assets || {}, version: o.version };
}

// 'data:image/png;base64,...' -> Blob (no network: decode the base64 here).
function dataUrlBlob(url) {
  const m = /^data:([^;,]+)(;base64)?,(.*)$/.exec(url || '');
  if (!m) throw new Error('Not a data URL.');
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: m[1] });
}

return { merge, PRESETS, applyPreset, presetFile, parsePresetFile, dataUrlBlob };

const { INSPECTOR_MIN, INSPECTOR_MAX, initLayout } = (() => {
// Layout (plan §12.2, §12.3): the inspector width on desktop (280–520 px, drag the bar), the
// bottom sheet height on a phone (drag the handle up), the ⋯ menu, and the Split view divider.

const store = {
  get(k) {
    try {
      return localStorage.getItem(k);
    } catch {
      return null;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, v);
    } catch { /* no storage */ }
  },
};

function dragger(el, onMove, onEnd) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
    const move = (ev) => onMove(ev);
    const up = () => {
      el.classList.remove('drag');
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      if (onEnd) onEnd();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}

const INSPECTOR_MIN = 280;
const INSPECTOR_MAX = 520;

// app: { menu: { presets(), undo(), redo() }, split(pos), onResize() }
function initLayout(app) {
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  // Inspector width (desktop).
  const w0 = Number(store.get('neofx.inspectorWidth'));
  if (w0 >= INSPECTOR_MIN && w0 <= INSPECTOR_MAX) root.style.setProperty('--inspector-w', `${w0}px`);
  dragger($('sizer'), (e) => {
    const w = Math.round(Math.min(INSPECTOR_MAX, Math.max(INSPECTOR_MIN, window.innerWidth - e.clientX - 2)));
    root.style.setProperty('--inspector-w', `${w}px`);
    store.set('neofx.inspectorWidth', String(w));
    app.onResize();
  });
  // Sheet height (phone): drag the handle; between 20 % and 85 % of the screen.
  dragger($('sheetHandle'), (e) => {
    const h = Math.min(0.85, Math.max(0.2, (window.innerHeight - e.clientY) / window.innerHeight));
    root.style.setProperty('--sheet-h', `${Math.round(h * 100)}vh`);
    app.onResize();
  });
  // The ⋯ menu.
  const menu = $('menu'), btn = $('menuBtn');
  const close = () => {
    menu.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', String(!menu.hidden));
  });
  menu.addEventListener('click', (e) => {
    const act = e.target.dataset.act;
    close();
    if (act) app.menu[act]();
  });
  document.addEventListener('click', (e) => {
    if (!menu.hidden && !menu.contains(e.target)) close();
  });
  // The Split view divider: drag it over the picture.
  const line = $('splitLine');
  dragger(line, (e) => {
    const b = $('view').getBoundingClientRect();
    app.split(Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)));
  }, () => app.split(null));
  return {
    // Put the divider at pos (0..1 of the picture), or hide it.
    placeSplit(pos) {
      line.hidden = pos === null;
      if (pos === null) return;
      const b = $('view').getBoundingClientRect(), a = $('preview').getBoundingClientRect();
      line.style.left = `${b.left - a.left + pos * b.width}px`;
      line.style.top = `${Math.max(0, b.top - a.top)}px`;
      line.style.height = `${Math.min(a.height, b.height)}px`;
      line.style.bottom = 'auto';
    },
  };
}

return { INSPECTOR_MIN, INSPECTOR_MAX, initLayout };
})();

// ---- app/ui/startscreen.js
const { startDemos } = (() => {
// The start screen (plan §12.9): two small example animations, made by the app from a generated test
// pattern (no files to load): a Time Map (a radial delay) and a Slit Scan (a vertical line, Time On).

const W = 160, H = 90, HIST = 48;
const LINE_X = 50; // the source column of the Slit Scan example

// A colour as one 32-bit pixel of an ImageData (the byte order of the device).
const LITTLE = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
const rgb = (r, g, b) => (LITTLE ? (255 << 24) | (b << 16) | (g << 8) | r : (r << 24) | (g << 16) | (b << 8) | 255) >>> 0;
const BLACK = rgb(0, 0, 0), WHITE = rgb(255, 255, 255);
const BANDS = [[230, 60, 60], [240, 200, 40], [60, 200, 90], [40, 180, 230], [90, 80, 230], [220, 70, 200]].map((c) => rgb(Math.round(c[0] * 0.8), Math.round(c[1] * 0.8), Math.round(c[2] * 0.8)));

// The test pattern of frame t: colour bars that move, and a disc that turns. out: W × H pixels.
function pattern(t, out) {
  const cx = W / 2 + 34 * Math.cos(t / 9), cy = H / 2 + 22 * Math.sin(t / 9);
  for (let x = 0; x < W; x++) {
    const band = BANDS[(Math.floor(((x + t * 1.5) / 20) % 6) + 6) % 6];
    const dx2 = (x - cx) ** 2;
    for (let y = 0; y < H; y++) out[y * W + x] = dx2 + (y - cy) ** 2 < 120 ? WHITE : band;
  }
}

// The Time Map delay of each pixel: it grows with the distance from the centre.
const DELAY = new Uint8Array(W * H);
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) DELAY[y * W + x] = Math.min(HIST - 1, Math.floor((Math.hypot(x - W / 2, (y - H / 2) * 1.6) / 92) * (HIST - 1)));
}

// Returns { start(), stop() }: the animations run only between start and stop (the start screen).
function startDemos(timeCanvas, slitCanvas) {
  if (!timeCanvas || !slitCanvas) return { start() {}, stop() {} };
  const ring = Array.from({ length: HIST }, () => new Uint32Array(W * H));
  const cols = Array.from({ length: HIST }, () => new Uint32Array(H));
  const tc = timeCanvas.getContext('2d'), sc = slitCanvas.getContext('2d');
  const ti = tc.createImageData(W, H), si = sc.createImageData(W, H);
  const tp = new Uint32Array(ti.data.buffer), sp = new Uint32Array(si.data.buffer);
  let t = 0, raf = 0, last = 0;
  const step = (now) => {
    raf = requestAnimationFrame(step);
    if (now - last < 40) return; // 25 fps
    last = now;
    const cur = ring[t % HIST];
    pattern(t, cur);
    // The source column of this frame.
    const col = cols[t % HIST];
    for (let y = 0; y < H; y++) col[y] = cur[y * W + LINE_X];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        // Time Map: the frame t − delay (black before frame 0).
        const k = t - DELAY[i];
        tp[i] = k < 0 ? BLACK : ring[k % HIST][i];
        // Slit Scan: right of the line, column x shows the line of frame t − (x − LINE_X).
        const a = x - LINE_X;
        if (a < 0 || a >= HIST) sp[i] = cur[i];
        else sp[i] = t - a < 0 ? BLACK : cols[(t - a) % HIST][y];
      }
    }
    tc.putImageData(ti, 0, 0);
    sc.putImageData(si, 0, 0);
    t++;
  };
  const stop = () => {
    cancelAnimationFrame(raf);
    raf = 0;
  };
  const start = () => {
    if (!raf) raf = requestAnimationFrame(step);
  };
  start();
  return { start, stop };
}

return { startDemos };
})();

// ---- app/bench.js
const { runBench } = (() => {
// The performance test (plan §13.4, phase 12): on the open video, the preview fps at 540p for each
// mode, the export fps at 1080p, and the frame buffer limit. The result is text to copy into the
// README (device results table). Nothing leaves the device.

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// Play from frame 0 for `seconds` (or to the end). Returns { fps, shown, dropped }.
async function measurePlay(player, seconds) {
  await player.seek(0);
  player.play();
  const t0 = performance.now();
  while (player.playing && performance.now() - t0 < seconds * 1000) await wait(50);
  const s = player.stats;
  const out = { fps: s.fps, shown: s.shown, dropped: s.dropped };
  player.pause();
  return out;
}

// app: { player, info(), store, settings(), look(patch) -> Promise (no undo step), restore(saved),
//        setShort(short) -> Promise, exportVideo(opts, onProgress), bufferAt(w, h) -> n, version, gpuMode,
//        onStep(text) }
async function runBench(app, opts = {}) {
  const P = app.player;
  const info = app.info();
  if (!info) throw new Error('Open a video first.');
  const seconds = opts.seconds ?? 4;
  const saved = app.settings();
  const short0 = app.store.short;
  const lines = [];
  const res = { preview: {}, export: null, buffer: {} };
  try {
    await app.setShort(540);
    res.buffer[540] = { n: app.store.n, width: app.store.width, height: app.store.height };
    const modes = [
      ['Time Map (Linear, Max delay 30)', { mode: 'timemap', timemap: { maxDelay: 30, blend: true, steps: 0 } }],
      ['Slit Scan (line, Time On)', { mode: 'slitscan', slitscan: { source: 'line', time: true } }],
    ];
    for (const [name, patch] of modes) {
      app.onStep(`Preview at 540p: ${name}…`);
      await app.look(patch);
      res.preview[name] = await measurePlay(P, seconds);
    }
    // Export at 1080p (the short side; or the source size when it is smaller), without audio.
    await app.restore(saved);
    const k = Math.min(1, 1080 / Math.min(info.width, info.height));
    const w = Math.round((info.width * k) / 2) * 2, h = Math.round((info.height * k) / 2) * 2;
    res.buffer[1080] = { n: app.bufferAt(w, h), width: w, height: h };
    const frames = Math.min(info.times.length, opts.exportFrames ?? 150);
    app.onStep(`Export at ${Math.min(w, h)}p (${frames} frames)…`);
    const t0 = performance.now();
    let first = 0;
    const r = await app.exportVideo({ width: w, height: h, quality: 'high', keyint: 2, range: [0, frames - 1], audio: false, hardware: 'hardware', name: 'bench.mp4' }, (p) => {
      if (p.phase === 'encode' && p.done === 1) first = performance.now();
    });
    if (r.release) r.release(); // the file is not kept
    const sec = (performance.now() - (first || t0)) / 1000;
    res.export = { width: r.width, height: r.height, frames: r.frames, fps: (r.frames - 1) / Math.max(sec, 1e-3), codec: r.config.codec, hardware: r.config.hardwareAcceleration };
  } finally {
    await app.restore(saved);
    if (app.store.short !== short0) await app.setShort(short0);
  }
  const nav = typeof navigator !== 'undefined' ? navigator : {};
  lines.push(`neofx ${app.version} performance test`);
  lines.push(`Browser: ${nav.userAgent || '?'}`);
  lines.push(`GPU: ${app.gpuName || '?'} (engine: ${app.gpuMode})`);
  if (nav.hardwareConcurrency) lines.push(`CPU threads: ${nav.hardwareConcurrency}${nav.deviceMemory ? `, memory: ${nav.deviceMemory} GB` : ''}`);
  lines.push(`Video: ${info.width}×${info.height}, ${info.fps.toFixed(2)} fps, ${info.times.length} frames (${info.codec})`);
  for (const [name, p] of Object.entries(res.preview)) lines.push(`Preview 540p, ${name}: ${p.fps.toFixed(1)} fps (${p.dropped} of ${p.shown + p.dropped} frames dropped)`);
  if (res.export) lines.push(`Export ${res.export.width}×${res.export.height}: ${res.export.fps.toFixed(1)} fps (${res.export.frames} frames, ${res.export.codec}, ${res.export.hardware})`);
  for (const [s, b] of Object.entries(res.buffer)) lines.push(`Buffer at ${s}p (${b.width}×${b.height}): ${b.n} frames`);
  return { ...res, text: lines.join('\n') };
}

return { runBench };
})();

, u_eK;\\nuniform float u_eD;\\nuniform vec2 u_ed, u_ee;\\n// The trail shape (plan §8.6). u_warp: twist (radians at the distance of the frame diagonal), drift\\n// (px along the line for each px of distance), spread (the trail gets wider with the distance),\\n// 1 / diagonal. u_wave: amount (px), 2 pi / length, phase.\\nuniform vec4 u_warp;\\nuniform vec3 u_wave;\\nin vec2 v_uv;\\nout vec4 o;\\n\\n// Twist: the trail turns about the source point, more with the distance from it.\\nvec2 twist(vec2 q) {\\n  float th = -u_warp.x * length(q) * u_warp.w;\\n  float c = cos(th), s = sin(th);\\n  return vec2(c * q.x - s * q.y, s * q.x + c * q.y);\\n}\\n\\n// The position along the line that a pixel at u, at the distance s, shows (drift, wave, spread).\\nfloat bend(float u, float s) {\\n  u -= u_warp.y * s + u_wave.x * sin(u_wave.y * s + u_wave.z);\\n  return u / max(1.0 + u_warp.z * s * u_warp.w, 0.05);\\n}\\n\\nfloat S(int i) { return texelFetch(u_S, ivec2(i % 1024, i / 1024), 0).r; }\\n\\n// A(s): the largest i with S(i) <= s, then linear to the next entry.\\nfloat ageOf(float s) {\\n  int lo = 0, hi = u_M;\\n  for (int k = 0; k < 14; k++) {\\n    if (lo >= hi) break;\\n    int m = (lo + hi + 1) / 2;\\n    if (S(m) <= s) lo = m; else hi = m - 1;\\n  }\\n  if (lo >= u_M) return float(u_M);\\n  return float(lo) + (s - S(lo)) / (S(lo + 1) - S(lo));\\n}\\n\\n// The history of frame k at column x (texture units); a = 0 when the row is not there.\\nvec4 row(int k, float x) {\\n  if (k < 0) return vec4(0.0);\\n  int r = k % u_H;\\n  if (texelFetch(u_rows, ivec2(r, 0), 0).r != k) return vec4(0.0);\\n  return vec4(texture(u_hist, vec2(x, (float(r) + 0.5) / float(u_H))).rgb, 1.0);\\n}\\n\\nvec3 heat(float u) { // dark blue -> red -> yellow\\n  return clamp(vec3(1.5 * u, 1.5 * u - 0.5, 0.6 - 1.2 * abs(u - 0.25) + max(0.0, 2.0 * u - 1.6)), 0.0, 1.0);\\n}\\n\\n// The edge effect at pixel p (working px): rgb, a = 1 when there is a trail; age in .w of the out.\\nvec4 edgeEffect(vec2 p, out float age) {\\n  age = 0.0;\\n  vec2 q = twist(p - u_res * 0.5);\\n  float xp = dot(q, u_ed), yp = bend(dot(q, u_ee), xp);\\n  int r = int(floor(yp + 0.5 * u_eD));\\n  if (r < 0 || float(r) >= u_eD) return vec4(0.0);\\n  if (u_timeOn) {\\n    vec4 t = texelFetch(u_trail, ivec2(int(floor(xp + 0.5 * u_eD)), r), 0);\\n    if (t.a <= 0.0) return vec4(0.0);\\n    age = (t.a - 0.02) / 0.98 * float(u_M);\\n    return vec4(t.rgb, 1.0);\\n  }\\n  // Time Off: the colour of the nearest emitter of frame t before x' repeats to the next one.\\n  int slot = u_t % u_eH;\\n  if (texelFetch(u_eframes, ivec2(slot, 0), 0).r != u_t) return vec4(0.0);\\n  float best = -1e9;\\n  vec4 c = vec4(0.0);\\n  for (int k = 0; k < 4; k++) {\\n    if (k >= u_eK) break;\\n    float x = texelFetch(u_epos, ivec2(r, slot * u_eK + k), 0).r;\\n    if (x > -1e5 && x <= xp + 0.5 && x > best) {\\n      best = x;\\n      c = vec4(texelFetch(u_ecol, ivec2(r, slot * u_eK + k), 0).rgb, 1.0);\\n    }\\n  }\\n  return c;\\n}\\n\\nvoid main() {\\n  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);\\n  vec3 base = frameAt(u_t, uv).rgb;\\n  if (u_view == 1) { o = vec4(base, 1.0); return; }\\n  if (u_edge) {\\n    float age;\\n    vec4 e = edgeEffect(uv * u_res, age);\\n    if (u_view == 2) { o = vec4(e.a > 0.0 ? heat(age / float(max(u_M, 1))) : base * 0.3, 1.0); return; }\\n    // No trail: the original (an empty pixel is transparent, §10.1).\\n    vec3 col = e.a > 0.0 ? ageLook(e.rgb, age) : base;\\n    vec3 res = e.a > 0.0 ? (u_comp == 0 ? col : composite(base, col, u_opacity * decayAlpha(age))) : base;\\n    o = vec4(subjectOver(res, base, uv), 1.0);\\n    return;\\n  }\\n  vec2 p = twist(uv * u_res - u_L);\\n  float s = dot(p, u_d);\\n  float x = (bend(dot(p, u_e), max(s, 0.0)) + u_c + 0.5) / u_len;\\n  if (s < -1e-3) { o = vec4(u_view == 2 ? base * 0.3 : subjectOver(base, base, uv), 1.0); return; }\\n  s = max(s, 0.0);\\n  float a = 0.0;\\n  vec4 c;\\n  if (!u_timeOn) {\\n    c = row(u_t, x);\\n  } else {\\n    if (s > S(u_M)) { o = vec4(u_view == 2 ? base * 0.3 : subjectOver(base, base, uv), 1.0); return; } // older than Max age\\n    a = ageOf(s);\\n    float src = float(u_t) - a;\\n    if (u_view == 2) { o = vec4(src < -1e-3 ? vec3(0.0) : heat(a / float(max(u_M, 1))), 1.0); return; }\\n    if (src < -1e-3) { o = vec4(subjectOver(u_comp == 0 ? vec3(0.0) : base, base, uv), 1.0); return; } // not online\\n    src = max(src, 0.0);\\n    if (u_sharp) c = row(int(floor(src + 0.5)), x);\\n    else {\\n      float k0 = floor(src), f = src - k0;\\n      c = row(int(k0), x);\\n      if (f > 0.0) c = mix(c, row(int(k0) + 1, x), f);\\n    }\\n  }\\n  if (u_view == 2) { o = vec4(heat(0.0), 1.0); return; }\\n  if (c.a == 0.0) { o = vec4(subjectOver(u_comp == 0 ? vec3(0.0) : base, base, uv), 1.0); return; } // the row is not there yet\\n  vec3 col = ageLook(c.rgb, a);\\n  o = vec4(subjectOver(u_comp == 0 ? col : composite(base, col, u_opacity * decayAlpha(a)), base, uv), 1.0);\\n}\\n\";\nconst SUBJECT_GLSL = \"// The subject layer (plan §9.4, §10.4): the current frame × the subject mask, on top of the result,\\n// with its own blend mode and opacity, an optional outline, and spill suppression (chroma key).\\nuniform bool u_subOn;\\nuniform highp sampler2D u_subMask;\\nuniform highp sampler2D u_outline;  // the subject mask, dilated by the outline width\\nuniform bool u_outlineOn;\\nuniform vec3 u_outlineColor;\\nuniform float u_subOpacity;\\nuniform int u_subBlend;\\nuniform float u_spill;\\nuniform vec3 u_keyRgb;\\n\\nvec3 despill(vec3 c) {\\n  vec3 k = u_keyRgb - dot(u_keyRgb, vec3(0.2126, 0.7152, 0.0722));\\n  float n = length(k);\\n  if (n < 1e-3 || u_spill <= 0.0) return c;\\n  k /= n;\\n  float a = max(0.0, dot(c - dot(c, vec3(0.2126, 0.7152, 0.0722)), k));\\n  return clamp(c - k * a * u_spill, 0.0, 1.0);\\n}\\n\\nvec3 subjectOver(vec3 result, vec3 subj, vec2 uv) {\\n  if (!u_subOn) return result;\\n  float m = texture(u_subMask, uv).r;\\n  vec3 r = compositeWith(result, despill(subj), m * u_subOpacity, u_subBlend, u_linear);\\n  if (u_outlineOn) r = mix(r, u_outlineColor, clamp(texture(u_outline, uv).r - m, 0.0, 1.0));\\n  return r;\\n}\\n\";\nconst HEAD = '#version 300 es\\nprecision highp float;\\nprecision highp int;\\n';\nconst VIEWS = { result: 0, original: 1, map: 2 };\n\nclass Slit {\n  constructor(engine) {\n    this.e = engine;\n    const gl = (this.gl = engine.gl);\n    this.rowProg = program(gl, QUAD_VERT, `#version 300 es\\n${ROW_FRAG}`);\n    this.scan = program(gl, QUAD_VERT, `${HEAD}${STORE_GLSL}\\n${COMPOSITE_GLSL}\\n${SUBJECT_GLSL}\\n${AGE_GLSL}\\n${SCAN_FRAG}`);\n    this.hist = this.rowsTex = this.Stex = this.stY = this.stC = null;\n    this.H = 0;\n    this.rowFrame = null;\n    this.key = '';\n    this.sKey = '';\n    this.geo = null;\n    this.M = 1;\n  }\n\n  // For a working size and a frame count. The history is empty after this.\n  configure(w, h, frames) {\n    const gl = this.gl;\n    for (const t of [this.hist, this.rowsTex, this.Stex, this.stY, this.stC]) if (t) gl.deleteTexture(t);\n    const maxTex = this.e.caps.maxTexture;\n    this.H = historyRows(frames, maxTex);\n    this.len = lineGeometry({ x: 0.5, y: 0.5, angle: 90 }, w, h, maxTex).len;\n    this.hist = gl.createTexture();\n    gl.bindTexture(gl.TEXTURE_2D, this.hist);\n    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, this.len, this.H);\n    texParams(gl, gl.TEXTURE_2D);\n    this.rowFrame = new Int32Array(this.H).fill(-1);\n    this.rowsTex = gl.createTexture();\n    gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);\n    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32I, this.H, 1, 0, gl.RED_INTEGER, gl.INT, this.rowFrame);\n    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);\n    this.Stex = gl.createTexture();\n    // The staging layer (YUV, 1 layer) for the frames of the analysis pass.\n    this.stY = gl.createTexture();\n    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.stY);\n    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, 1);\n    texParams(gl, gl.TEXTURE_2D_ARRAY);\n    this.stC = gl.createTexture();\n    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.stC);\n    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, 1);\n    texParams(gl, gl.TEXTURE_2D_ARRAY);\n    this.key = '';\n    this.sKey = '';\n    return { rows: this.H };\n  }\n\n  active() {\n    return !!(this.e.settings && this.e.settings.mode === 'slitscan' && this.hist);\n  }\n\n  // A change of the line (or the slit width): the history is not valid; rebuild it from the frames\n  // in the store at once (the analysis pass of the page does the rest).\n  update() {\n    if (!this.active()) return;\n    const sl = this.e.settings.slitscan;\n    const e = this.e;\n    const key = JSON.stringify([sl.x, sl.y, sl.angle, sl.flip, sl.width, e.w, e.h]);\n    if (key !== this.key) {\n      this.key = key;\n      this.geo = lineGeometry(sl, e.w, e.h, e.caps.maxTexture);\n      this.rowFrame.fill(-1);\n      const order = [];\n      for (let l = 0; l < e.n; l++) if (e.layerFrame[l] >= 0) order.push([e.layerFrame[l], l]);\n      order.sort((a, b) => a[0] - b[0]);\n      for (const [t, l] of order) this.writeRow(t, e.storeY, e.storeC, l, false);\n      this.uploadRows();\n    }\n    const sk = JSON.stringify([sl.rateType, sl.rate, sl.rateEnd, sl.curve, sl.maxAge, this.H]);\n    if (sk !== this.sKey) {\n      this.sKey = sk;\n      const S = distanceTable({ ...sl, maxAge: Math.min(sl.maxAge, this.H) });\n      this.M = S.length - 1;\n      const rows = Math.ceil(S.length / 1024);\n      const data = new Float32Array(rows * 1024);\n      data.set(S);\n      const gl = this.gl;\n      gl.bindTexture(gl.TEXTURE_2D, this.Stex);\n      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, 1024, rows, 0, gl.RED, gl.FLOAT, data);\n      texParams(gl, gl.TEXTURE_2D, gl.NEAREST);\n    }\n  }\n\n  uploadRows() {\n    const gl = this.gl;\n    gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);\n    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.H, 1, gl.RED_INTEGER, gl.INT, this.rowFrame);\n  }\n\n  // Write the history row of frame index from a YUV array layer.\n  writeRow(index, Y, C, layer, upload = true) {\n    const gl = this.gl;\n    const e = this.e;\n    const g = this.geo;\n    const row = index % this.H;\n    const p = this.rowProg;\n    gl.bindFramebuffer(gl.FRAMEBUFFER, e.fb);\n    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.hist, 0);\n    gl.viewport(0, row, this.len, 1);\n    gl.useProgram(p.prog);\n    gl.activeTexture(gl.TEXTURE1);\n    gl.bindTexture(gl.TEXTURE_2D_ARRAY, Y);\n    gl.activeTexture(gl.TEXTURE2);\n    gl.bindTexture(gl.TEXTURE_2D_ARRAY, C);\n    gl.uniform1i(p.u.u_Y, 1);\n    gl.uniform1i(p.u.u_C, 2);\n    gl.uniform1f(p.u.u_layer, layer);\n    gl.uniform2f(p.u.u_res, e.w, e.h);\n    gl.uniform2f(p.u.u_L, g.L[0], g.L[1]);\n    gl.uniform2f(p.u.u_d, g.d[0], g.d[1]);\n    gl.uniform2f(p.u.u_e, g.e[0], g.e[1]);\n    gl.uniform1f(p.u.u_c, g.c);\n    gl.uniform1i(p.u.u_width, Math.max(1, Math.min(16, Math.round(e.settings.slitscan.width))));\n    drawQuad(gl);\n    gl.bindFramebuffer(gl.FRAMEBUFFER, null);\n    this.rowFrame[row] = index;\n    if (upload) {\n      gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);\n      e.one[0] = index;\n      gl.texSubImage2D(gl.TEXTURE_2D, 0, row, 0, 1, 1, gl.RED_INTEGER, gl.INT, e.one);\n    }\n  }\n\n  // A frame of the analysis pass: into the staging layer, then its history row (not the store).\n  analysisFrame(index, frame) {\n    const e = this.e;\n    e.putYuv(frame, this.stY, this.stC, 0);\n    if (e.edgeActive()) {\n      e.edge.update();\n      e.edge.addFrame(index, { Y: this.stY, C: this.stC, layer: 0 });\n      return;\n    }\n    this.update();\n    if (this.active()) this.writeRow(index, this.stY, this.stC, 0);\n  }\n\n  // The count of history rows that hold a frame (for tests and the status).\n  filled() {\n    let n = 0;\n    for (const f of this.rowFrame || []) if (f >= 0) n++;\n    return n;\n  }\n\n  render(index) {\n    const gl = this.gl;\n    const e = t p = v_uv * size;\\n  float d = 1e9;\\n  for (int i = 0; i < 64; i++) {\\n    if (i >= u_np) break;\\n    vec2 a = u_pts[i], b = u_pts[min(i + 1, u_np - 1)];\\n    vec2 ab = b - a;\\n    float h = dot(ab, ab) > 0.0 ? clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0) : 0.0;\\n    d = min(d, length(p - a - ab * h));\\n  }\\n  float inner = u_radius * u_hardness;\\n  float a = 1.0 - clamp((d - inner) / max(u_radius - inner, 1e-3), 0.0, 1.0);\\n  vec2 g = texelFetch(u_in, ivec2(floor(p)), 0).rg;\\n  if (u_mode == 0) g = vec2(max(g.r, a), g.g * (1.0 - a));\\n  else if (u_mode == 1) g = vec2(g.r * (1.0 - a), max(g.g, a));\\n  else g *= 1.0 - a;\\n  o = vec4(g, 0.0, 1.0);\\n}\\n\";\nconst JFA_FRAG = \"// Jump flooding (Subject distance map, plan §7.3): the nearest subject pixel of each pixel.\\n// u_init: the seeds (mask >= 0.5) -> own position; else (-1, -1). Then steps of u_k pixels.\\nprecision highp float;\\nuniform highp sampler2D u_in;  // init: the mask; else RG = the nearest seed (pixels), -1 = none\\nuniform bool u_init;\\nuniform int u_k;\\nin vec2 v_uv;\\nout vec4 o;\\n\\nvoid main() {\\n  ivec2 size = textureSize(u_in, 0);\\n  ivec2 p = ivec2(floor(v_uv * vec2(size)));\\n  vec2 pc = vec2(p) + 0.5;\\n  if (u_init) {\\n    o = texelFetch(u_in, p, 0).r >= 0.5 ? vec4(pc, 0.0, 1.0) : vec4(-1.0, -1.0, 0.0, 1.0);\\n    return;\\n  }\\n  vec2 best = vec2(-1.0);\\n  float bd = 1e20;\\n  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {\\n    ivec2 q = p + ivec2(x, y) * u_k;\\n    if (any(lessThan(q, ivec2(0))) || any(greaterThanEqual(q, size))) continue;\\n    vec2 s = texelFetch(u_in, q, 0).rg;\\n    if (s.x < 0.0) continue;\\n    float d = dot(s - pc, s - pc);\\n    if (d < bd) { bd = d; best = s; }\\n  }\\n  o = vec4(best, 0.0, 1.0);\\n}\\n\";\nconst SHOW_FRAG = \"// The Mask view (plan §12.2): the subject mask in white.\\nprecision highp float;\\nuniform highp sampler2D u_in;\\nin vec2 v_uv;\\nout vec4 o;\\n\\nvoid main() {\\n  float m = texture(u_in, vec2(v_ 0 - d.y, d.x);\\n  return d;\\n}\\n\\nvoid main() {\\n  vec3 c = texture(u_src, srcUv(v_uv)).rgb;\\n  float y = dot(c, vec3(0.2126, 0.7152, 0.0722));\\n  if (u_mode == 0) o = vec4(y, 0.0, 0.0, 1.0);\\n  else o = vec4((c.b - y) / 1.8556 + 0.5, (c.r - y) / 1.5748 + 0.5, 0.0, 1.0);\\n}\\n\";\nconst STORE_GLSL = \"// Read the frame store (plan §6.3): Y and CbCr layers -> RGB (BT.709 full range).\\nuniform highp sampler2DArray u_storeY;\\nuniform highp sampler2DArray u_storeC;\\nuniform highp isampler2D u_layers; // N x 1: the frame index in each store layer\\nuniform int u_n;\\n\\nvec3 storeRgb(vec2 uv, float layer) {\\n  float y = texture(u_storeY, vec3(uv, layer)).r;\\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\\n}\\n\\n// The layer of frame k, or -1 when frame k is not in the store (or k < 0).\\nint layerOf(int k) {\\n  if (k < 0 || u_n < 1) return -1;\\n  int l = k % u_n;\\n  return texelFetch(u_layers, ivec2(l, 0), 0).r == k ? l : -1;\\n}\\n\\n// The colour of frame k at uv, and a = 1 when frame k is in the store (else black, a = 0).\\nvec4 frameAt(int k, vec2 uv) {\\n  int l = layerOf(k);\\n  return l < 0 ? vec4(0.0) : vec4(storeRgb(uv, float(l)), 1.0);\\n}\\n\\n// The luma of frame k at uv (0 when not in the store).\\nfloat lumaAt(int k, vec2 uv) {\\n  int l = layerOf(k);\\n  return l < 0 ? 0.0 : texture(u_storeY, vec3(uv, float(l))).r;\\n}\\n\";\nconst SHOW_FRAG = \"// Preview of one stored frame (Original view; the debug delay view of phase 3). u_layer < 0: black\\n// (the frame is not in the store, or it is before frame 0: \\\"not online\\\", D8).\\nuniform float u_layer;\\nuniform bool u_noFlip; // into a texture (first row at the top), not the canvas\\nin vec2 v_uv;\\nout vec4 o;\\n\\nvoid main() {\\n  vec2 uv = u_noFlip ? v_uv : vec2(v_uv.x, 1.0 - v_uv.y); // the canvas has its first row at the bottom\\n  o = u_layer < 0.0 ? vec4(0.0, 0.0, return s;\\n  if (m == 1) return min(b + s, 1.0);\\n  if (m == 2) return b + s - b * s;\\n  if (m == 3) return max(b, s);\\n  if (m == 4) return vec3(bDodge(b.r, s.r), bDodge(b.g, s.g), bDodge(b.b, s.b));\\n  if (m == 5) return vec3(bHard(s.r, b.r), bHard(s.g, b.g), bHard(s.b, b.b)); // overlay = hard light, swapped\\n  if (m == 6) return vec3(bSoft(b.r, s.r), bSoft(b.g, s.g), bSoft(b.b, s.b));\\n  if (m == 7) return vec3(bHard(b.r, s.r), bHard(b.g, s.g), bHard(b.b, s.b));\\n  if (m == 8) return b * s;\\n  if (m == 9) return min(b, s);\\n  if (m == 10) return vec3(bBurn(b.r, s.r), bBurn(b.g, s.g), bBurn(b.b, s.b));\\n  if (m == 11) return max(b - s, 0.0);\\n  if (m == 12) return abs(b - s);\\n  if (m == 13) return b + s - 2.0 * b * s;\\n  if (m == 14) return vec3(bDivide(b.r, s.r), bDivide(b.g, s.g), bDivide(b.b, s.b));\\n  if (m == 15) return setLum(setSat(s, sat(b)), lum(b));\\n  if (m == 16) return setLum(setSat(b, sat(s)), lum(b));\\n  if (m == 17) return setLum(s, lum(b));\\n  return setLum(b, lum(s)); // 18 luminosity\\n}\\n\\n// A colour cs with alpha a over the opaque base cb, with blend mode `mode`.\\nvec3 compositeWith(vec3 cb, vec3 cs, float a, int mode, bool lin) {\\n  if (lin) {\\n    cb = toLinear(cb);\\n    cs = toLinear(cs);\\n  }\\n  vec3 r = clamp((1.0 - a) * cb + a * blendColor(cb, cs, mode), 0.0, 1.0);\\n  return lin ? toSrgb(r) : r;\\n}\\n\\n// The effect colour cs with alpha a over the opaque base cb (the effect blend mode).\\nvec3 composite(vec3 cb, vec3 cs, float a) {\\n  return compositeWith(cb, cs, a, u_blendMode, u_linear);\\n}\\n\";\nconst AGE_GLSL = \"// Alpha and age (plan §10.3). Age: frames (Mode 1: the delay d).\\nuniform float u_opacity;\\nuniform int u_decay;            // 0 full, 1 linear, 2 exponential (half-life), 3 curve\\nuniform float u_decayLen;       // frames\\nuniform highp sampler2D u_decayCurve; // 256 x 1: alpha = 1 − curve(age / length)\\nuniform float u_maxAge;         // the age at \\\"max age\\\" (tint and brightne
