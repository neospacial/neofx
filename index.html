    // frame in playback) copies it and draws the markers.
    const key = `${w}x${h}:${this.thumbVersion || 0}`;
    if (this.cacheKey !== key) {
      if (!this.cache) this.cache = document.createElement('canvas');
      const cc = this.cache;
      cc.width = w;
      cc.height = h;
      const g = cc.getContext('2d');
      g.fillStyle = '#000';
      g.fillRect(0, 0, w, h);
      const count = this.thumbs.length ? Math.max(this.thumbs.length, 50) : 50;
      const tw = w / count;
      for (let i = 0; i < this.thumbs.length; i++) {
        const th = this.thumbs[i];
        if (!th) continue;
        const b = th.bitmap;
        // Cover the cell, centered.
        const s = Math.max(tw / b.width, h / b.height);
        const sw = tw / s, sh = h / s;
        g.drawImage(b, (b.width - sw) / 2, (b.height - sh) / 2, sw, sh, i * tw, 0, Math.ceil(tw), h);
      }
      this.cacheKey = key;
    }
    ctx.drawImage(this.cache, 0, 0);
    const x = (t) => (n > 1 ? (t / (n - 1)) * (w - 2 * dpr) + dpr : w / 2);
    const [a, b] = P.range();
    if (P.inPoint !== null || P.outPoint !== null) {
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, x(a), h);
      ctx.fillRect(x(b), 0, w - x(b), h);
      ctx.fillStyle = '#f5a524';
      ctx.fillRect(x(a) - dpr, 0, 2 * dpr, h);
      ctx.fillRect(x(b) - dpr, 0, 2 * dpr, h);
    }
    if (!this.accent) this.accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#eee100';
    ctx.fillStyle = this.accent;
    ctx.fillRect(x(Math.max(0, P.current)) - dpr, 0, 2 * dpr, h);
  }
}

return { formatTime, Timeline };
})();

// ---- app/ui/widgets.js
const { slider, segmented, toggle, section, select, colors } = (() => {
// Setting widgets (plan §12.1): a label, a slider, a number field, and a reset (double-click or
// double-tap on the label). The default value is marked on the track.

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

// opts: { label, min, max, step, value, def, unit, onChange(v), key }
function slider(opts) {
  const row = el('div', 'setting slider');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  label.title = 'Double-click to reset';
  const range = el('input');
  range.type = 'range';
  const num = el('input');
  num.type = 'number';
  for (const i of [range, num]) {
    i.min = opts.min;
    i.max = opts.max;
    i.step = opts.step ?? 1;
    i.value = opts.value;
  }
  num.setAttribute('aria-label', opts.label);
  range.setAttribute('aria-label', opts.label);
  const unit = el('span', 'unit', opts.unit || '');
  const set = (v, fire) => {
    v = Math.max(Number(opts.min), Math.min(Number(opts.max), Number(v)));
    if (!Number.isFinite(v)) return;
    range.value = v;
    num.value = v;
    row.classList.toggle('default', v === opts.def);
    if (fire) opts.onChange(v);
  };
  // Long press, then drag: fine steps (×0.1) (plan §12.3). The value follows the pointer from the
  // place of the long press, at a tenth of the normal speed.
  let fine = null, press = 0;
  range.addEventListener('pointerdown', (e) => {
    clearTimeout(press);
    const x0 = e.clientX;
    press = setTimeout(() => {
      fine = { x: x0, v: Number(range.value), w: range.getBoundingClientRect().width || 1 };
      row.classList.add('fine');
    }, 450);
    const move = (ev) => {
      if (!fine && Math.abs(ev.clientX - x0) > 6) clearTimeout(press);
      if (fine) fine.px = ev.clientX;
    };
    const up = () => {
      clearTimeout(press);
      fine = null;
      row.classList.remove('fine');
      range.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    range.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  range.addEventListener('input', () => {
    if (fine && fine.px !== undefined) {
      const st = Number(opts.step ?? 1);
      let v = fine.v + ((fine.px - fine.x) / fine.w) * (opts.max - opts.min) * 0.1;
      v = Math.round(v / st) * st;
      set(Number(v.toFixed(6)), true);
      return;
    }
    set(range.value, true);
  });
  row.fineAt = (v0, dx) => {
    // tests: the value of a fine drag of dx px from v0
    const st = Number(opts.step ?? 1);
    const w = range.getBoundingClientRect().width || 1;
    return Math.round((v0 + (dx / w) * (opts.max - opts.min) * 0.1) / st) * st;
  };
  num.addEventListener('change', () => set(num.value, true));
  label.addEventListener('dblclick', () => set(opts.def, true));
  // Mark the default on the track.
  if (opts.def !== undefined && opts.max > opts.min) row.style.setProperty('--def', `${((opts.def - opts.min) / (opts.max - opts.min)) * 100}%`);
  row.append(label, range, num, unit);
  set(opts.value, false);
  row.setValue = (v) => set(v, false);
  return row;
}

// opts: { label, options: [[value, text, disabled?, why?]], value, onChange(v), key }
function segmented(opts) {
  const row = el('div', 'setting seg');
  row.dataset.key = opts.key || '';
  if (opts.label) row.append(el('label', null, opts.label));
  const box = el('div', 'segs');
  box.setAttribute('role', 'radiogroup');
  const buttons = opts.options.map(([v, text, disabled, why]) => {
    const b = el('button', null, text);
    b.type = 'button';
    b.dataset.value = v;
    b.disabled = !!disabled;
    if (disabled) b.title = why || 'Not available here';
    b.addEventListener('click', () => {
      row.setValue(v);
      opts.onChange(v);
    });
    box.append(b);
    return b;
  });
  row.setValue = (v) => buttons.forEach((b) => b.classList.toggle('on', b.dataset.value === String(v)));
  row.setValue(opts.value);
  row.append(box);
  return row;
}

// opts: { label, value, onChange(v), key }
function toggle(opts) {
  return segmented({ ...opts, options: [['true', 'On'], ['false', 'Off']], value: String(opts.value), onChange: (v) => opts.onChange(v === 'true') });
}

// A collapsible section.
function section(title, open = true) {
  const d = el('details', 'section');
  d.open = open;
  d.append(el('summary', null, title));
  return d;
}

// opts: { label, options: [[value, text]], value, onChange(v), key }
function select(opts) {
  const row = el('div', 'setting select');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  const s = el('select');
  s.setAttribute('aria-label', opts.label);
  for (const [v, text] of opts.options) {
    const o = el('option', null, text);
    o.value = v;
    s.append(o);
  }
  s.value = opts.value;
  s.addEventListener('change', () => opts.onChange(s.value));
  row.setValue = (v) => (s.value = v);
  row.append(label, s);
  return row;
}

// A ramp of 2 to 4 colours. opts: { label, value: ['#rrggbb', ...], onChange(list), key }
function colors(opts) {
  const row = el('div', 'setting colors');
  row.dataset.key = opts.key || '';
  const label = el('label', null, opts.label);
  const box = el('div', 'colorList');
  let list = opts.value.slice();
  const draw = () => {
    box.textContent = '';
    list.forEach((c, i) => {
      const inp = el('input');
      inp.type = 'color';
      inp.value = c;
      inp.setAttribute('aria-label', `${opts.label} ${i + 1}`);
      inp.addEventListener('input', () => {
        list[i] = inp.value;
        opts.onChange(list.slice());
      });
      box.append(inp);
    });
    const more = el('button', null, '+');
    more.type = 'button';
    more.disabled = list.length >= 4;
    more.setAttribute('aria-label', 'Add a colour');
    more.addEventListener('click', () => {
      list.push(list[list.length - 1]);
      draw();
      opts.onChange(list.slice());
    });
    const less = el('button', null, '−');
    less.type = 'button';
    less.disabled = list.length <= 2;
    less.setAttribute('aria-label', 'Remove a colour');
    less.addEventListener('click', () => {
      list.pop();
      draw();
      opts.onChange(list.slice());
    });
    box.append(less, more);
  };
  row.setValue = (v) => {
    list = v.slice();
    draw();
  };
  draw();
  row.append(label, box);
  return row;
}

return { slider, segmented, toggle, section, select, colors };
})();

// ---- app/ui/curve.js
const { curveEditor } = (() => {
// Curve editor (plan §12.6): one widget for the map curve, the rate curve, and the decay curve.
// Points with drag; add a point with a click / tap on the line; remove a point with a double-click
// or a long press. Presets: Linear, Ease in, Ease out, S-curve, Step. Monotone cubic interpolation.



const NAMES = { linear: 'Linear', easeIn: 'Ease in', easeOut: 'Ease out', sCurve: 'S-curve', step: 'Step' };
const HIT = 12; // px

const points = (v) => (Array.isArray(v) ? v.map((p) => [p[0], p[1]]) : (CURVE_PRESETS[v] || CURVE_PRESETS.linear).map((p) => [p[0], p[1]]));

// opts: { label, value (preset name or points), onChange(value, final), key }
function curveEditor(opts) {
  const row = document.createElement('div');
  row.className = 'setting curve';
  row.dataset.key = opts.key || '';
  const label = document.createElement('label');
  label.textContent = opts.label;
  const canvas = document.createElement('canvas');
  canvas.className = 'curveCanvas';
  canvas.setAttribute('aria-label', `${opts.label} curve`);
  const presets = document.createElement('div');
  presets.className = 'segs curvePresets';
  let pts = points(opts.value);
  let name = Array.isArray(opts.value) ? null : opts.value;
  const W = 220, H = 120, PAD = 8;
  const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  const toPx = ([x, y]) => [PAD + x * (W - 2 * PAD), H - PAD - y * (H - 2 * PAD)];
  const toVal = (px, py) => [Math.min(1, Math.max(0, (px - PAD) / (W - 2 * PAD))), Math.min(1, Math.max(0, (H - PAD - py) / (H - 2 * PAD)))];
  const draw = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const a = PAD + (i * (W - 2 * PAD)) / 4, b = PAD + (i * (H - 2 * PAD)) / 4;
      ctx.beginPath(); ctx.moveTo(a, PAD); ctx.lineTo(a, H - PAD); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(PAD, b); ctx.lineTo(W - PAD, b); ctx.stroke();
    }
    const f = monotoneCurve(pts);
    ctx.strokeStyle = getComputedStyle(row).getPropertyValue('--accent').trim() || '#eee100';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const [x, y] = toPx([i / 100, Math.min(1, Math.max(0, f(i / 100)))]);
      if (i) ctx.lineTo(x, y);
      else ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = '#fff';
    for (const p of pts) {
      const [x, y] = toPx(p);
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, 2 * Math.PI);
      ctx.fill();
    }
    for (const b of presets.children) b.classList.toggle('on', b.dataset.value === name);
  };
  const emit = (final) => opts.onChange(name || pts.map((p) => [+p[0].toFixed(4), +p[1].toFixed(4)]), final);
  const local = (e) => {
    const r = canvas.getBoundingClientRect();
    return [((e.clientX - r.left) * W) / r.width, ((e.clientY - r.top) * H) / r.height];
  };
  const nearest = (px, py) => {
    let best = -1, bd = HIT;
    pts.forEach((p, i) => {
      const [x, y] = toPx(p);
      const d = Math.hypot(x - px, y - py);
      if (d < bd) [best, bd] = [i, d];
    });
    return best;
  };
  const remove = (i) => {
    if (i <= 0 || i >= pts.length - 1) return; // the ends stay
    pts.splice(i, 1);
    name = null;
    draw();
    emit(true);
  };
  let drag = -1, press = 0, moved = false;
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const [px, py] = local(e);
    let i = nearest(px, py);
    if (i < 0) {
      // A click on the line adds a point there.
      const [x] = toVal(px, py);
      const [, cy] = toPx([x, monotoneCurve(pts)(x)]);
      if (Math.abs(cy - py) > HIT * 1.5) return;
      pts.push([x, toVal(px, py)[1]]);
      pts.sort((a, b) => a[0] - b[0]);
      i = pts.findIndex((p) => p[0] === x);
      name = null;
      draw();
      emit(false);
    }
    drag = i;
    moved = false;
    canvas.setPointerCapture(e.pointerId);
    clearTimeout(press);
    press = setTimeout(() => {
      if (!moved && drag >= 0) {
        const k = drag;
        drag = -1;
        remove(k); // a long press removes the point
      }
    }, 600);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (drag < 0) return;
    const [px, py] = local(e);
    let [x, y] = toVal(px, py);
    moved = true;
    clearTimeout(press);
    // The ends keep their x; the other points stay between their neighbours.
    if (drag === 0) x = 0;
    else if (drag === pts.length - 1) x = 1;
    else x = Math.min(pts[drag + 1][0] - 0.01, Math.max(pts[drag - 1][0] + 0.01, x));
    pts[drag] = [x, y];
    name = null;
    draw();
    emit(false);
  });
  const end = () => {
    clearTimeout(press);
    if (drag >= 0 && moved) emit(true);
    drag = -1;
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('dblclick', (e) => remove(nearest(...local(e))));
  for (const [k, text] of Object.entries(NAMES)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.dataset.value = k;
    b.addEventListener('click', () => {
      name = k;
      pts = points(k);
      draw();
      emit(true);
    });
    presets.append(b);
  }
  row.setValue = (v) => {
    pts = points(v);
    name = Array.isArray(v) ? null : v;
    draw();
  };
  row.points = () => pts.map((p) => p.slice());
  row.append(label, canvas, presets);
  requestAnimationFrame(draw);
  draw();
  return row;
}

return { curveEditor };
})();

// ---- app/random.js
const { rng, RANDOM_SECTIONS, randomizeSection } = (() => {
// Randomize (plan §12.5): safe random values for one section of the settings. A seed makes it
// repeatable (the same seed gives the same look).





// mulberry32: a small seeded random generator, 0 <= r() < 1.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const pick = (r, list) => list[Math.floor(r() * list.length)];
const range = (r, a, b, step = 0) => {
  const v = a + r() * (b - a);
  return step ? Math.round(v / step) * step : v;
};
const hex = (r) => `#${[0, 0, 0].map(() => Math.floor(64 + r() * 192).toString(16).padStart(2, '0')).join('')}`;

// The sections that Randomize can change (the cutout is not random: it depends on the footage).
const RANDOM_SECTIONS = ['map', 'adjust', 'anim', 'time', 'source', 'time2', 'composite', 'look'];

// Change the settings S of one section with r. limits: { maxDelay, maxAge, maxAgeEdge }.
function randomizeSection(S, section, r, limits) {
  const M = S.map;
  if (section === 'map') {
    const list = MAPS.filter((m) => !m.usesMask && m.id !== 'motion').map((m) => m.id);
    M.source = 'builtin';
    M.type = pick(r, list);
    const spec = MAPS.find((m) => m.id === M.type);
    for (const [k, , min, max, step, def] of spec.params) {
      // Near the default: half of the range around it (safe looks).
      const lo = Math.max(min, def - (max - min) / 4), hi = Math.min(max, def + (max - min) / 4);
      M.params[M.type][k] = Math.min(max, Math.max(min, range(r, lo, hi, step)));
    }
  } else if (section === 'adjust') {
    Object.assign(M.adjust, {
      invert: r() < 0.3, gamma: range(r, 0.6, 1.8, 0.01), contrast: range(r, -0.3, 0.5, 0.01),
      posterize: r() < 0.25 ? Math.floor(range(r, 3, 12)) : 0, curve: pick(r, ['linear', 'linear', 'easeIn', 'easeOut', 'sCurve']),
      blur: r() < 0.3 ? range(r, 1, 8, 0.5) : 0,
    });
  } else if (section === 'anim') {
    const on = r() < 0.5;
    Object.assign(M.anim, { phaseSpeed: on ? range(r, -0.02, 0.02, 0.001) : 0, rotSpeed: on && r() < 0.5 ? range(r, -1, 1, 0.1) : 0, pulseAmount: 0, seedEvery: 0 });
  } else if (section === 'time') {
    Object.assign(S.timemap, {
      maxDelay: Math.max(1, Math.round(range(r, 8, Math.max(9, Math.min(120, limits.maxDelay))))),
      steps: r() < 0.3 ? Math.floor(range(r, 2, 16)) : 0, blend: r() < 0.7,
    });
  } else if (section === 'source') {
    const sl = S.slitscan;
    if (sl.source === 'edge' || S.cutout.mode === 'scan') sl.edgeAngle = Math.round(range(r, 0, 360));
    else Object.assign(sl, { x: range(r, 0.25, 0.75, 0.001), y: range(r, 0.25, 0.75, 0.001), angle: Math.round(range(r, 0, 360)) });
    sl.flip = r() < 0.5;
  } else if (section === 'time2') {
    const sl = S.slitscan;
    Object.assign(sl, {
      time: r() < 0.85, rateType: pick(r, RATE_TYPES.map(([id]) => id).filter((id) => id !== 'curve')),
      rate: range(r, 0.25, 4, 0.05), rateEnd: range(r, 0.25, 6, 0.05),
      maxAge: Math.max(1, Math.round(range(r, 30, Math.max(31, Math.min(600, limits.maxAge))))),
      maxAgeEdge: Math.max(1, Math.round(range(r, 20, Math.max(21, Math.min(240, limits.maxAgeEdge))))),
      sampling: r() < 0.5 ? 'sharp' : 'blend',
    });
  } else if (section === 'composite') {
    const blend = r() < 0.5;
    Object.assign(S.composite, {
      mode: blend ? 'blend' : 'replace', blend: pick(r, BLEND_MODES.map(([id]) => id)), opacity: range(r, 0.6, 1, 0.01),
      decay: pick(r, ['full', 'full', 'linear', 'exp']), decayLength: 0, linear: false,
    });
  } else if (section === 'look') {
    const tint = r() < 0.5;
    Object.assign(S.look, { tint, tintColors: [hex(r), hex(r)], tintAmount: range(r, 0.4, 1, 0.01), ageBrightness: range(r, 0.6, 1.4, 0.01) });
  }
  return S;
}

return { rng, RANDOM_SECTIONS, randomizeSection };
})();

// ---- app/ui/inspector.js
const { THUMB_W, THUMB_H, Inspector } = (() => {
// The inspector (plan §12.4): Mode, Map (source, map grid with thumbnails, params, fit and transform,
// adjustments, animation), Time. Settings that do not apply are hidden (§12.1).










const THUMB_W = 72;
const THUMB_H = 40;

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

class Inspector {
  // app: { change(path, value), openMap(kind), info() -> { mapName, mapFrames } }
  constructor(root, app) {
    this.root = root;
    this.app = app;
    this.rows = {};
    this.tiles = {}; // map id -> canvas
    this.thumbCache = {}; // map id -> the last thumbnail (luma), drawn again after a rebuild
  }

  // limits: { maxDelay (the store limit, N - 1), maxAge (the slit history rows), maxAgeEdge }.
  build(settings, limits) {
    const S = settings;
    const r = this.root;
    const open = {};
    for (const d of r.querySelectorAll('details[data-name]')) open[d.dataset.name] = d.open;
    r.textContent = '';
    this.rows = {};
    this.tiles = {};
    const add = (parent, row) => {
      this.rows[row.dataset.key] = row;
      parent.append(row);
      return row;
    };
    const on = (key) => (v) => this.app.change(key, v);
    // The tab of each section in the narrow layout (plan §12.3).
    const TABS = { presets: 'presets', mode: 'mode', map: 'map', adjust: 'map', anim: 'map', source: 'map', time: 'time', time2: 'time', warp: 'time', mosh: 'map', moshlook: 'time', moshhist: 'mix', cutout: 'cutout', subject: 'cutout', composite: 'mix', look: 'look' };
    const sec = (name, title, def = true) => {
      const d = section(title, open[name] ?? def);
      d.dataset.name = name;
      d.dataset.tab = TABS[name] || 'mode';
      // Randomize (plan §12.5): a lock keeps the section; the dice changes only it.
      if (RANDOM_SECTIONS.includes(name)) {
        const tools = document.createElement('span');
        tools.className = 'secTools';
        const locked = this.app.locks && this.app.locks.has(name);
        const lock = Object.assign(document.createElement('button'), { type: 'button', className: `lock${locked ? ' on' : ''}`, textContent: locked ? '🔒' : '🔓' });
        lock.title = 'Lock: Randomize keeps this section';
        lock.dataset.lock = name;
        lock.setAttribute('aria-pressed', String(!!locked));
        lock.addEventListener('click', (e) => {
          e.preventDefault();
          this.app.toggleLock(name);
        });
        const dice = Object.assign(document.createElement('button'), { type: 'button', className: 'dice', textContent: '🎲' });
        dice.title = 'Randomize this section';
        dice.dataset.dice = name;
        dice.addEventListener('click', (e) => {
          e.preventDefault();
          this.app.randomize([name]);
        });
        tools.append(dice, lock);
        d.querySelector('summary').append(tools);
      }
      r.append(d);
      return d;
    };
    const num = (parent, key, label, min, max, step, def, unit) => add(parent, slider({ key, label, min, max, step, value: getPath(S, key), def, unit, onChange: on(key) }));
    const bool = (parent, key, label) => add(parent, toggle({ key, label, value: getPath(S, key), onChange: on(key) }));

    // Presets (plan §12.5): Randomize all, Reset to defaults, the looks, Save and Load.
    if (this.app.presetPanel) this.app.presetPanel(sec('presets', 'Presets', false));

    const mode = sec('mode', 'Mode');
    add(mode, segmented({ key: 'mode', options: [['timemap', 'Time Map'], ['slitscan', 'Slit Scan'], ['datamosh', 'Datamosh']], value: S.mode, onChange: on('mode') }));

    if (S.mode === 'datamosh') {
      this.buildMosh(S, sec, add, num, bool, on);
      this.tabBar([['presets', 'Presets'], ['mode', 'Mode'], ['map', 'Mosh'], ['time', 'Look'], ['mix', 'History']]);
      return;
    }
    if (S.mode === 'timemap') {
      // Map.
      const M = S.map;
      const map = sec('map', 'Map');
      add(map, segmented({ key: 'map.source', label: 'Source', options: [['builtin', 'Built-in'], ['image', 'Image'], ['video', 'Video']], value: M.source, onChange: on('map.source') }));
      if (M.source === 'builtin') {
        const grid = el('div', 'mapGrid');
        for (const m of MAPS) {
          const b = el('button', 'mapTile');
          b.type = 'button';
          b.dataset.map = m.id;
          b.title = m.needs ? `${m.name} (needs Cutout: a later version)` : m.name;
          b.disabled = !!m.needs;
          b.classList.toggle('on', m.id === M.type);
          const c = el('canvas');
          c.width = THUMB_W;
          c.height = THUMB_H;
          this.tiles[m.id] = c;
          b.append(c, el('span', null, m.name));
          b.addEventListener('click', () => this.app.change('map.type', m.id));
          grid.append(b);
        }
        map.append(grid);
      this.drawThumbs({ ...this.thumbCache });
        const spec = MAPS.find((m) => m.id === M.type);
        for (const [k, label, min, max, step, def, unit] of spec.params) num(map, `map.params.${M.type}.${k}`, label, min, max, step, def, unit);
        if (M.type === 'self') map.append(el('p', 'note', 'Bright = old. Use Invert (Adjust) for bright = new.'));
      } else {
        const info = this.app.info();
        const row = el('div', 'setting fileRow');
        const btn = el('button', null, M.source === 'image' ? 'Open image…' : 'Open video…');
        btn.type = 'button';
        btn.dataset.act = `open-${M.source}`;
        btn.addEventListener('click', () => this.app.openMap(M.source));
        const name = M.source === 'image' ? M.image.name : M.video.name;
        row.append(btn, el('span', 'fileName', name ? `${name}${M.source === 'video' && info.mapFrames ? ` · ${info.mapFrames} frames` : ''}` : 'No file'));
        map.append(row);
        add(map, segmented({ key: 'map.image.fit', label: 'Fit', options: [['fill', 'Fill'], ['fit', 'Fit'], ['stretch', 'Stretch']], value: M.image.fit, onChange: on('map.image.fit') }));
        num(map, 'map.image.outside', 'Outside value', 0, 1, 0.01, 0);
        num(map, 'map.image.x', 'Position x', -1, 1, 0.01, 0);
        num(map, 'map.image.y', 'Position y', -1, 1, 0.01, 0);
        num(map, 'map.image.scale', 'Scale', 0.1, 8, 0.01, 1);
        num(map, 'map.image.rotation', 'Rotation', -180, 180, 1, 0, '°');
        bool(map, 'map.image.flipX', 'Flip horizontal');
        bool(map, 'map.image.flipY', 'Flip vertical');
        if (M.source === 'video') {
          num(map, 'map.video.speed', 'Speed', -4, 4, 0.05, 1, '×');
          num(map, 'map.video.offset', 'Offset', -1000, 1000, 1, 0, 'f');
          add(map, segmented({ key: 'map.video.end', label: 'End', options: [['loop', 'Loop'], ['hold', 'Hold last'], ['pingpong', 'Ping-pong']], value: M.video.end, onChange: on('map.video.end') }));
        }
      }

      const adj = sec('adjust', 'Map adjust', false);
      bool(adj, 'map.adjust.invert', 'Invert');
      num(adj, 'map.adjust.black', 'Black point', 0, 1, 0.01, 0);
      num(adj, 'map.adjust.white', 'White point', 0, 1, 0.01, 1);
      num(adj, 'map.adjust.gamma', 'Gamma', 0.1, 5, 0.01, 1);
      num(adj, 'map.adjust.contrast', 'Contrast', -1, 1, 0.01, 0);
      add(adj, curveEditor({ key: 'map.adjust.curve', label: 'Curve', value: M.adjust.curve, onChange: (v, final) => this.app.change('map.adjust.curve', v, final) }));
      num(adj, 'map.adjust.posterize', 'Posterize', 0, 64, 1, 0);
      num(adj, 'map.adjust.blur', 'Blur', 0, 64, 0.5, 0, 'px');
      num(adj, 'map.adjust.tileX', 'Tile x', 1, 16, 1, 1);
      num(adj, 'map.adjust.tileY', 'Tile y', 1, 16, 1, 1);
      bool(adj, 'map.adjust.mirrorTile', 'Mirror tile');
      num(adj, 'map.adjust.offsetX', 'Offset x', -1, 1, 0.01, 0);
      num(adj, 'map.adjust.offsetY', 'Offset y', -1, 1, 0.01, 0);

      if (M.source === 'builtin') {
        const an = sec('anim', 'Map animation', false);
        num(an, 'map.anim.phaseSpeed', 'Phase speed', -0.2, 0.2, 0.001, 0, '/f');
        num(an, 'map.anim.rotSpeed', 'Rotation speed', -10, 10, 0.1, 0, '°/f');
        num(an, 'map.anim.pulseAmount', 'Pulse amount', 0, 1, 0.01, 0);
        num(an, 'map.anim.pulsePeriod', 'Pulse period', 2, 600, 1, 60, 'f');
        num(an, 'map.anim.seedEvery', 'New seed every', 0, 600, 1, 0, 'f');
      }

      const time = sec('time', 'Time');
      const T = S.timemap;
      add(time, slider({ key: 'timemap.maxDelay', label: 'Max delay', min: 0, max: limits.maxDelay, step: 1, value: Math.min(T.maxDelay, limits.maxDelay), def: Math.min(30, limits.maxDelay), unit: 'f', onChange: on('timemap.maxDelay') }));
      add(time, slider({ key: 'timemap.steps', label: 'Delay steps', min: 0, max: 64, step: 1, value: T.steps, def: 0, onChange: (v) => {
        const f = fixSteps(v, T.steps);
        this.rows['timemap.steps'].setValue(f);
        this.app.change('timemap.steps', f);
      } }));
      add(time, toggle({ key: 'timemap.blend', label: 'Frame blend', value: T.blend, onChange: on('timemap.blend') }));
      add(time, toggle({ key: 'timemap.perfectLoop', label: 'Perfect loop', value: !!T.perfectLoop, onChange: on('timemap.perfectLoop') }));
      time.append(el('p', 'note', 'Perfect loop: the delayed pixels at the start take their frames from the end of the video, so the result loops without a cut (no black start). The Max delay is at most the loop length − 1.'));
    } else {
      // Mode 2, Slit Scan (§8.5).
      const SL = S.slitscan;
      const src = sec('source', 'Source');
      const edge = SL.source === 'edge' || S.cutout.mode === 'scan';
      add(src, segmented({ key: 'slitscan.source', label: 'Source', options: [['line', 'Line', S.cutout.mode === 'scan', 'Scan object uses the subject edge'], ['edge', 'Subject edge']], value: edge ? 'edge' : 'line', onChange: on('slitscan.source') }));
      if (!edge) {
        num(src, 'slitscan.x', 'Line x', 0, 1, 0.001, 0.5);
        num(src, 'slitscan.y', 'Line y', 0, 1, 0.001, 0.5);
        num(src, 'slitscan.angle', 'Line angle', 0, 360, 0.1, 90, '°');
      } else num(src, 'slitscan.edgeAngle', 'Edge direction', 0, 360, 0.1, 0, '°');
      bool(src, 'slitscan.flip', 'Flip direction');
      if (!edge) num(src, 'slitscan.width', 'Slit width', 1, 16, 1, 1, 'px');
      else num(src, 'slitscan.joinLimit', 'Join limit', 1, 64, 1, 8, 'px');
      src.append(Object.assign(document.createElement('p'), { className: 'note', textContent: edge
        ? 'All the edge pixels of the subject (Cutout) are the source. Drag the round handle to set the direction.'
        : 'Drag the line on the preview. The round handle turns it (Shift: 15° steps). The arrow flips the direction.' }));
      const time = sec('time2', 'Time');
      bool(time, 'slitscan.time', 'Time');
      if (SL.time) {
        add(time, select({ key: 'slitscan.rateType', label: 'Rate type', options: RATE_TYPES, value: SL.rateType, onChange: on('slitscan.rateType') }));
        num(time, 'slitscan.rate', SL.rateType === 'constant' ? 'Rate' : 'Rate (start)', 0.05, 32, 0.05, 1, 'px/f');
        if (SL.rateType !== 'constant') num(time, 'slitscan.rateEnd', 'Rate at Max age', 0.05, 32, 0.05, 4, 'px/f');
        if (SL.rateType === 'curve') add(time, curveEditor({ key: 'slitscan.curve', label: 'Rate curve', value: SL.curve, onChange: (v, final) => this.app.change('slitscan.curve', v, final) }));
        if (edge) {
          num(time, 'slitscan.maxAgeEdge', 'Max age', 1, Math.max(1, limits.maxAgeEdge), 1, Math.min(120, limits.maxAgeEdge), 'f');
          const st = this.app.edgeStats ? this.app.edgeStats() : null;
          const note = Object.assign(document.createElement('p'), { className: 'note edgeLimit' });
          note.textContent = st ? `Limit: ${st.limit} frames (GPU ${st.ms.toFixed(1)} ms for ${st.maxAge} frames; target 20 ms)` : 'Limit: the history length.';
          time.append(note);
        } else {
          num(time, 'slitscan.maxAge', 'Max age', 1, limits.maxAge, 1, Math.min(600, limits.maxAge), 'f');
          add(time, segmented({ key: 'slitscan.sampling', label: 'Sampling', options: [['sharp', 'Sharp'], ['blend', 'Blend']], value: SL.sampling, onChange: on('slitscan.sampling') }));
        }
      }
      // The trail shape: move, distort and twist the trail (render only: no new analysis).
      const wp = sec('warp', 'Trail shape', false);
      num(wp, 'slitscan.warp.twist', 'Twist', -720, 720, 1, 0, '°');
      num(wp, 'slitscan.warp.drift', 'Drift', -2, 2, 0.01, 0);
      num(wp, 'slitscan.warp.spread', 'Spread', -0.9, 4, 0.01, 0);
      num(wp, 'slitscan.warp.wave', 'Wave', 0, 300, 1, 0, 'px');
      num(wp, 'slitscan.warp.waveLength', 'Wave length', 8, 2000, 1, 120, 'px');
      num(wp, 'slitscan.warp.waveSpeed', 'Wave speed', -40, 40, 0.1, 0, 'px/f');
      wp.append(Object.assign(document.createElement('p'), { className: 'note', textContent: 'Twist turns the trail about the source point, more with the distance. Drift moves it along the line. Spread makes it wider (or narrower) with the distance. Wave bends it; Wave speed moves the wave.' }));
    }

    // Cutout (§9): the subject mask, and the subject layer on top (Overlay).
    const Cu = S.cutout;
    const cut = sec('cutout', 'Cutout', false);
    add(cut, segmented({ key: 'cutout.mode', label: 'Cutout', options: [['off', 'Off'], ['overlay', 'Overlay'], ['scan', 'Scan object', S.mode !== 'slitscan', 'Slit Scan only']], value: Cu.mode, onChange: on('cutout.mode') }));
    const sub = (text) => cut.append(Object.assign(document.createElement('div'), { className: 'subhead', textContent: text }));
    const btn = (row, text, act, fn, isOn) => {
      const b = Object.assign(document.createElement('button'), { type: 'button', textContent: text });
      b.dataset.act = act;
      b.classList.toggle('on', !!isOn);
      b.addEventListener('click', fn);
      row.append(b);
      return b;
    };
    const tools = this.app.tools || {};
    sub('Background difference');
    bool(cut, 'cutout.bgdiff.on', 'Use');
    if (Cu.bgdiff.on) {
      add(cut, segmented({ key: 'cutout.plate', label: 'Clean plate', options: [['auto', 'Auto'], ['frame', 'This frame'], ['image', 'Image']], value: Cu.plate, onChange: (v) => this.app.plate(v) }));
      const pr = Object.assign(document.createElement('div'), { className: 'toolRow' });
      btn(pr, Cu.plate === 'auto' ? 'Make again' : Cu.plate === 'frame' ? 'Use this frame' : 'Open image…', 'plate', () => this.app.plate(Cu.plate));
      pr.append(Object.assign(document.createElement('span'), { className: 'fileName', textContent: tools.plateText || 'No clean plate' }));
      cut.append(pr);
      num(cut, 'cutout.bgdiff.threshold', 'Threshold', 0, 1, 0.005, 0.12);
      num(cut, 'cutout.bgdiff.softness', 'Softness', 0, 0.5, 0.005, 0.06);
      num(cut, 'cutout.bgdiff.lightTol', 'Light tolerance', 0, 1, 0.01, 0.5);
      num(cut, 'cutout.bgdiff.shadow', 'Shadow', 0, 1, 0.01, 0);
    }
    sub('Chroma key');
    bool(cut, 'cutout.chroma.on', 'Use');
    if (Cu.chroma.on) {
      const row = document.createElement('div');
      row.className = 'setting color';
      row.dataset.key = 'cutout.chroma.key';
      const lab = Object.assign(document.createElement('label'), { textContent: 'Key colour' });
      const inp = Object.assign(document.createElement('input'), { type: 'color', value: Cu.chroma.key });
      inp.addEventListener('input', () => this.app.change('cutout.chroma.key', inp.value));
      row.setValue = (v) => (inp.value = v);
      const tr = Object.assign(document.createElement('div'), { className: 'toolRow' });
      btn(tr, 'Pick', 'pick', () => this.app.setTool('pick'), tools.tool === 'pick');
      row.append(lab, inp, tr);
      add(cut, row);
      num(cut, 'cutout.chroma.tolerance', 'Tolerance', 0, 0.5, 0.005, 0.08);
      num(cut, 'cutout.chroma.softness', 'Softness', 0, 0.5, 0.005, 0.05);
      num(cut, 'cutout.chroma.spill', 'Spill', 0, 1, 0.01, 0.5);
    }
    sub('Luma key');
    bool(cut, 'cutout.luma.on', 'Use');
    if (Cu.luma.on) {
      num(cut, 'cutout.luma.low', 'Low', 0, 1, 0.005, 0.7);
      num(cut, 'cutout.luma.high', 'High', 0, 1, 0.005, 1);
      num(cut, 'cutout.luma.softness', 'Softness', 0, 0.5, 0.005, 0.05);
      bool(cut, 'cutout.luma.invert', 'Invert');
    }
    add(cut, segmented({ key: 'cutout.combine', label: 'Combine', options: [['union', 'Union'], ['intersect', 'Intersect']], value: Cu.combine, onChange: on('cutout.combine') }));
    const manual = !Cu.bgdiff.on && !Cu.chroma.on && !Cu.luma.on && !Cu.import.on;
    if (manual) cut.append(Object.assign(document.createElement('p'), { className: 'note manualNote', textContent: 'Manual: no method is on. The subject is the area that you paint with Always subject.' }));
    sub('Refine by hand (matte)');
    const mr = Object.assign(document.createElement('div'), { className: 'toolRow' });
    btn(mr, 'Always subject', 'always', () => this.app.setTool('always'), tools.tool === 'always');
    btn(mr, 'Never subject', 'never', () => this.app.setTool('never'), tools.tool === 'never');
    btn(mr, 'Erase', 'erase', () => this.app.setTool('erase'), tools.tool === 'erase');
    cut.append(mr);
    const mr2 = Object.assign(document.createElement('div'), { className: 'toolRow' });
    btn(mr2, 'Show cutout', 'overlay', () => this.app.toggleOverlay && this.app.toggleOverlay(), tools.overlay);
    btn(mr2, 'Undo stroke', 'undoStroke', () => this.app.undoStroke && this.app.undoStroke()).disabled = !tools.undoCount;
    btn(mr2, 'Clear', 'clearMatte', () => this.app.clearMatte());
    cut.append(mr2);
    cut.append(Object.assign(document.createElement('p'), { className: 'note', textContent: 'Paint on the preview: the background is dark, Always is green, Never is red. [ and ] change the brush size.' }));
    add(cut, slider({ key: 'tools.brushSize', label: 'Brush size', min: 2, max: 400, step: 1, value: tools.brush ? tools.brush.size : 40, def: 40, unit: 'px', onChange: (v) => (tools.brush.size = v) }));
    add(cut, slider({ key: 'tools.brushHardness', label: 'Hardness', min: 0, max: 1, step: 0.01, value: tools.brush ? tools.brush.hardness : 0.7, def: 0.7, onChange: (v) => (tools.brush.hardness = v) }));
    sub('Clean up');
    num(cut, 'cutout.open', 'Open', 0, 16, 1, 0, 'px');
    num(cut, 'cutout.close', 'Close', 0, 16, 1, 0, 'px');
    num(cut, 'cutout.fillHoles', 'Fill holes', 0, 20, 0.1, 0, '%');
    bool(cut, 'cutout.keepLargest', 'Keep largest');
    num(cut, 'cutout.grow', 'Grow / shrink', -32, 32, 1, 0, 'px');
    num(cut, 'cutout.smooth', 'Temporal smooth', 0, 0.95, 0.01, 0);
    bool(cut, 'cutout.hysteresis', 'Hysteresis');
    if (Cu.hysteresis) {
      num(cut, 'cutout.tLow', 'Off below', 0, 1, 0.01, 0.35);
      num(cut, 'cutout.tHigh', 'On above', 0, 1, 0.01, 0.65);
    }
    num(cut, 'cutout.refine', 'Edge refine', 0, 16, 1, 0, 'px');
    if (Cu.refine > 0) num(cut, 'cutout.refineSens', 'Edge softness', 0.01, 0.5, 0.01, 0.1);
    num(cut, 'cutout.feather', 'Feather', 0, 32, 0.5, 0, 'px');
    sub('Mask import');
    const ir = Object.assign(document.createElement('div'), { className: 'toolRow' });
    btn(ir, 'Open mask video…', 'importMask', () => this.app.importMask());
    if (Cu.import.name) btn(ir, 'Remove', 'removeMask', () => this.app.removeMask());
    ir.append(Object.assign(document.createElement('span'), { className: 'fileName', textContent: Cu.import.name || 'No mask video' }));
    cut.append(ir);
    if (Cu.mode === 'overlay' || Cu.mode === 'scan') {
      const Sb = S.subject;
      const sl = sec('subject', 'Subject layer');
      add(sl, select({ key: 'subject.blend', label: 'Blend mode', options: BLEND_MODES, value: Sb.blend, onChange: on('subject.blend') }));
      add(sl, slider({ key: 'subject.opacity', label: 'Opacity', min: 0, max: 1, step: 0.01, value: Sb.opacity, def: 1, onChange: on('subject.opacity') }));
      num(sl, 'subject.grow', 'Grow / shrink', -32, 32, 1, 0, 'px');
      num(sl, 'subject.feather', 'Feather', 0, 32, 0.5, 0, 'px');
      num(sl, 'subject.outline', 'Outline', 0, 32, 1, 0, 'px');
      if (Sb.outline > 0) {
        const row = document.createElement('div');
        row.className = 'setting color';
        row.dataset.key = 'subject.outlineColor';
        const inp = Object.assign(document.createElement('input'), { type: 'color', value: Sb.outlineColor });
        inp.addEventListener('input', () => this.app.change('subject.outlineColor', inp.value));
        row.setValue = (v) => (inp.value = v);
        row.append(Object.assign(document.createElement('label'), { textContent: 'Outline colour' }), inp);
        add(sl, row);
      }
    }

    // Composite (§10): Replace shows the effect as it is; Blend puts it on the original.
    const Cp = S.composite;
    const comp = sec('composite', 'Composite');
    add(comp, segmented({ key: 'composite.mode', label: 'Effect', options: [['replace', 'Replace'], ['blend', 'Blend']], value: Cp.mode, onChange: on('composite.mode') }));
    if (Cp.mode === 'blend') {
      add(comp, select({ key: 'composite.blend', label: 'Blend mode', options: BLEND_MODES, value: Cp.blend, onChange: on('composite.blend') }));
      add(comp, slider({ key: 'composite.opacity', label: 'Opacity', min: 0, max: 1, step: 0.01, value: Cp.opacity, def: 1, onChange: on('composite.opacity') }));
      add(comp, select({ key: 'composite.decay', label: 'Age decay', options: DECAYS, value: Cp.decay, onChange: on('composite.decay') }));
      if (Cp.decay !== 'full') {
        add(comp, slider({ key: 'composite.decayLength', label: Cp.decay === 'exp' ? 'Half-life' : 'Decay length', min: 0, max: Math.max(1, limits.maxDelay), step: 1, value: Cp.decayLength, def: 0, unit: 'f', onChange: on('composite.decayLength') }));
        comp.append(Object.assign(document.createElement('p'), { className: 'note', textContent: '0 = the Max age.' }));
      }
      if (Cp.decay === 'curve') add(comp, curveEditor({ key: 'composite.decayCurve', label: 'Decay curve', value: Cp.decayCurve, onChange: (v, final) => this.app.change('composite.decayCurve', v, final) }));
      add(comp, toggle({ key: 'composite.linear', label: 'Linear blend', value: Cp.linear, onChange: on('composite.linear') }));
    }

    // Look: age tint, age brightness, spatial offset (Mode 1).
    const L = S.look;
    const look = sec('look', 'Look', false);
    add(look, toggle({ key: 'look.tint', label: 'Age tint', value: L.tint, onChange: on('look.tint') }));
    if (L.tint) {
      add(look, colors({ key: 'look.tintColors', label: 'New → old', value: L.tintColors, onChange: on('look.tintColors') }));
      add(look, slider({ key: 'look.tintAmount', label: 'Tint amount', min: 0, max: 1, step: 0.01, value: L.tintAmount, def: 1, onChange: on('look.tintAmount') }));
    }
    add(look, slider({ key: 'look.ageBrightness', label: 'Age brightness', min: 0, max: 2, step: 0.01, value: L.ageBrightness, def: 1, unit: '×', onChange: on('look.ageBrightness') }));
    if (S.mode === 'timemap') add(look, slider({ key: 'look.offset', label: 'Spatial offset', min: 0, max: 64, step: 0.5, value: L.offset, def: 0, unit: 'px', onChange: on('look.offset') }));
    if (S.mode === 'timemap' && L.offset > 0) add(look, slider({ key: 'look.offsetAngle', label: 'Offset angle', min: 0, max: 360, step: 1, value: L.offsetAngle, def: 0, unit: '°', onChange: on('look.offsetAngle') }));

    this.tabBar([['presets', 'Presets'], ['mode', 'Mode'], ['map', S.mode === 'timemap' ? 'Map' : 'Source'], ['time', 'Time'], ['cutout', 'Cutout'], ['mix', 'Mix'], ['look', 'Look']]);
  }

  // The narrow layout: tabs for the sections (plan §12.3).
  tabBar(list) {
    const tabs = document.createElement('div');
    tabs.className = 'tabBar';
    tabs.setAttribute('role', 'tablist');
    for (const [id, text] of list) {
      const b = Object.assign(document.createElement('button'), { type: 'button', textContent: text });
      b.dataset.tab = id;
      b.setAttribute('role', 'tab');
      b.addEventListener('click', () => this.setTab(id));
      tabs.append(b);
    }
    this.root.prepend(tabs);
    // (A tab of another mode that this mode does not have: the Mode tab.)
    this.setTab(list.some(([id]) => id === this.tab) ? this.tab : 'mode');
  }

  // Mode 3, Datamosh (from neomosh): the session, the encoder look, the history.
  buildMosh(S, sec, add, num, bool, on) {
    const M = this.app.mosh ? this.app.mosh() : null;
    const ses = M && M.session && M.session.frames ? M.session : null;
    const p = (text, cls = 'note') => Object.assign(document.createElement('p'), { className: cls, textContent: text });
    const button = (text, act, fn) => {
      const b = Object.assign(document.createElement('button'), { type: 'button', textContent: text });
      b.dataset.act = act;
      b.addEventListener('click', fn);
      return b;
    };
    const main = sec('mosh', 'Datamosh');
    main.append(p('1. Move the playhead to the start of a shot. 2. Touch the red button (R) to record; touch it again to pause. 3. Move the playhead (or open another video) and record again: the new clip has no keyframe, so its motion moves the old picture. Hold BLOOM (B) while paused to repeat the last motion.'));
