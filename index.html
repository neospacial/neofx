// ---- gpu/mapgen.js
const { MapGen } = (() => {
// The map pipeline of the engine (plan §7.3 – §7.6): generate -> blur (2 passes) -> adjust, into a
// map texture. The custom map (image or video frames) is an R8 texture array.





const QUAD_VERT = "#version 300 es\n// One triangle that covers the target. v_uv: 0..1, v = 0 at the first row (image top, in texture space).\nout vec2 v_uv;\nvoid main() {\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n  v_uv = p;\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}\n";
const STORE_GLSL = "// Read the frame store (plan §6.3): Y and CbCr layers -> RGB (BT.709 full range).\nuniform highp sampler2DArray u_storeY;\nuniform highp sampler2DArray u_storeC;\nuniform highp isampler2D u_layers; // N x 1: the frame index in each store layer\nuniform int u_n;\n\nvec3 storeRgb(vec2 uv, float layer) {\n  float y = texture(u_storeY, vec3(uv, layer)).r;\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n\n// The layer of frame k, or -1 when frame k is not in the store (or k < 0).\nint layerOf(int k) {\n  if (k < 0 || u_n < 1) return -1;\n  int l = k % u_n;\n  return texelFetch(u_layers, ivec2(l, 0), 0).r == k ? l : -1;\n}\n\n// The colour of frame k at uv, and a = 1 when frame k is in the store (else black, a = 0).\nvec4 frameAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? vec4(0.0) : vec4(storeRgb(uv, float(l)), 1.0);\n}\n\n// The luma of frame k at uv (0 when not in the store).\nfloat lumaAt(int k, vec2 uv) {\n  int l = layerOf(k);\n  return l < 0 ? 0.0 : texture(u_storeY, vec3(uv, float(l))).r;\n}\n";
const GEN_FRAG = "// Map generator (plan §7.3, §7.4, §7.6). Into the raw map texture (one value for each pixel).\n// The coordinates: offset -> tile (repeat or mirror) -> animation (rotate, pulse, about the frame\n// centre) -> the source: a built-in map (u_type), the custom image / video map, the luma of frame t\n// (self), or the motion of frames t-K .. t.\n#define PI 3.14159265359\nuniform vec2 u_res;\nuniform int u_src;      // 0 built-in, 1 custom (image or video)\nuniform int u_type;     // MAPS index\nuniform float u_k[12];  // the params of the map\nuniform float u_phase;  // phase speed × t (cycles)\nuniform float u_rot;    // rotation speed × t (degrees)\nuniform float u_pulse;  // the pulse scale at t\nuniform float u_seed;   // the seed change: floor(t / every)\nuniform vec2 u_offset;  // 0..1 of the frame\nuniform vec2 u_tile;\nuniform bool u_mirror;\nuniform int u_t;\nuniform highp sampler2D u_mask;  // the subject mask (Subject mask map)\nuniform highp sampler2D u_dist;  // the nearest subject pixel (Subject distance map)\nuniform vec2 u_workRes;\n// Custom map (R8 array: an image = 1 layer, a video = its frames).\nuniform highp sampler2DArray u_custom;\nuniform float u_layer;\nuniform vec2 u_csize;   // its size in pixels\nuniform int u_fit;      // 0 fill, 1 fit, 2 stretch\nuniform float u_outside;\nuniform vec2 u_pos;     // 0..1 of the frame\nuniform float u_scale;\nuniform float u_crot;   // degrees\nuniform vec2 u_flip;    // -1 or 1\nin vec2 v_uv;\nout vec4 o;\n\nuint hash3(uvec3 v) {\n  v = v * 1664525u + 1013904223u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  v ^= v >> 16u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  return v.x ^ v.y ^ v.z;\n}\n// 0..1 for an integer cell and a seed.\nfloat rnd(vec2 cell, float seed) {\n  return float(hash3(uvec3(ivec3(int(floor(cell.x)) + 32768, int(floor(cell.y)) + 32768, int(seed)))) & 0xffffffu) / 16777216.0;\n}\nfloat vnoise(vec2 p, float seed) {\n  vec2 i = floor(p), f = fract(p);\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(rnd(i, seed), rnd(i + vec2(1, 0), seed), u.x), mix(rnd(i + vec2(0, 1), seed), rnd(i + vec2(1, 1), seed), u.x), u.y);\n}\nvec2 rnd2(vec2 cell, float seed) {\n  return vec2(rnd(cell, seed), rnd(cell, seed + 7919.0));\n}\n// Phase: a clamped ramp (phase 0), or a repeated ramp that moves (phase != 0).\nfloat ramp(float s) {\n  return u_phase == 0.0 ? clamp(s, 0.0, 1.0) : fract(s - u_phase);\n}\nvec2 dir(float deg) {\n  float a = radians(deg);\n  return vec2(cos(a), sin(a));\n}\n\nfloat builtin(vec2 P) {\n  vec2 R = u_res;\n  float seed = u_k[3] + u_seed; // where the seed is param 3 (fbm); others set their own below\n  if (u_type == 0) { // linear: angle, x, y, width\n    vec2 d = dir(u_k[0]);\n    float span = abs(R.x * d.x) + abs(R.y * d.y);\n    return ramp(dot(P - vec2(u_k[1], u_k[2]) * R, d) / max(u_k[3] * span, 1e-3) + 0.5);\n  }\n  if (u_type == 1) { // mirrored: angle, x, y, width\n    vec2 d = dir(u_k[0]);\n    float span = abs(R.x * d.x) + abs(R.y * d.y);\n    return ramp(abs(dot(P - vec2(u_k[1], u_k[2]) * R, d)) / max(0.5 * u_k[3] * span, 1e-3));\n  }\n  vec2 q = (P - vec2(u_k[0], u_k[1]) * R) / R.y; // from the centre, in frame heights\n  if (u_type == 2) { // radial: x, y, radius, aspect\n    q.x /= u_k[3];\n    return ramp(length(q) / u_k[2]);\n  }\n  if (u_type == 3) { // angular: x, y, start, turns\n    float a = atan(q.y, q.x) - radians(u_k[2]);\n    return fract(a / (2.0 * PI) * u_k[3] - u_phase);\n  }\n  if (u_type == 4) { // spiral: x, y, arms, tightness\n    float a = atan(q.y, q.x);\n    return fract(a / (2.0 * PI) * u_k[2] + length(q) * u_k[3] - u_phase);\n  }\n  if (u_type == 5) { // box: x, y, size, roundness (0 box, 0.5 circle, 1 diamond)\n    float r = u_k[3];\n    float n = r < 0.5 ? exp2(4.0 - 6.0 * r) : 2.0 - 2.0 * (r - 0.5);\n    vec2 a = abs(q) / u_k[2];\n    float m = max(a.x, a.y);\n    float norm = m <= 0.0 ? 0.0 : m * pow(pow(a.x / m, n) + pow(a.y / m, n), 1.0 / n);\n    return ramp(norm);\n  }\n  vec2 uv = P / R;\n  if (u_type == 6) { // four corners\n    float v = mix(mix(u_k[0], u_k[1], uv.x), mix(u_k[2], u_k[3], uv.x), uv.y);\n    return u_phase == 0.0 ? v : fract(v - u_phase);\n  }\n  vec2 h = P / R.y; // frame-height units from the top left\n  if (u_type == 7) { // stripes: count, angle, softness, duty\n    float f = fract(dot(h, dir(u_k[1])) * u_k[0] - u_phase);\n    float duty = u_k[3];\n    float f2 = f > 0.5 * (1.0 + duty) ? f - 1.0 : f;\n    float e = min(f2, duty - f2);\n    return clamp(e / max(u_k[2], 1e-4) + 0.5, 0.0, 1.0);\n  }\n  if (u_type == 8) { // sine: fx, fy, angle, phase\n    vec2 d = dir(u_k[2]);\n    float x = dot(h, d), y = dot(h, vec2(-d.y, d.x));\n    float ph = u_k[3] + u_phase, s = 0.0, n = 0.0;\n    if (u_k[0] > 0.0) { s += sin(2.0 * PI * (u_k[0] * x + ph)); n += 1.0; }\n    if (u_k[1] > 0.0) { s += sin(2.0 * PI * (u_k[1] * y + ph)); n += 1.0; }\n    return 0.5 + 0.5 * s / max(n, 1.0);\n  }\n  if (u_type == 9) { // rings: x, y, count, softness\n    float f = fract(length(q) * u_k[2] - u_phase);\n    return mix(f, 0.5 - 0.5 * cos(2.0 * PI * f), u_k[3]);\n  }\n  if (u_type == 10) { // checker: cells, softness\n    vec2 c = h * u_k[0] + vec2(u_phase, 0.0);\n    float s = sin(PI * c.x) * sin(PI * c.y);\n    return u_k[1] < 1e-4 ? step(0.0, s) : clamp(0.5 + s / (2.0 * u_k[1]), 0.0, 1.0);\n  }\n  if (u_type == 11) { // fbm: scale, octaves, roughness, seed\n    vec2 p = h * u_k[0] + vec2(u_phase, 0.0);\n    float sum = 0.0, amp = 1.0, total = 0.0;\n    for (int i = 0; i < 8; i++) {\n      if (float(i) >= u_k[1]) break;\n      sum += amp * vnoise(p, seed + float(i) * 101.0);\n      total += amp;\n      amp *= u_k[2];\n      p *= 2.0;\n    }\n    return sum / max(total, 1e-4);\n  }\n  if (u_type == 12) { // ridged: scale, octaves, seed\n    vec2 p = h * u_k[0] + vec2(u_phase, 0.0);\n    float sum = 0.0, amp = 1.0, total = 0.0;\n    for (int i = 0; i < 8; i++) {\n      if (float(i) >= u_k[1]) break;\n      float n = 1.0 - abs(2.0 * vnoise(p, u_k[2] + u_seed + float(i) * 101.0) - 1.0);\n      sum += amp * n * n;\n      total += amp;\n      amp *= 0.5;\n      p *= 2.0;\n    }\n    return sum / max(total, 1e-4);\n  }\n  if (u_type == 13 || u_type == 14) { // worley: scale, seed, metric; voronoi: scale, seed\n    vec2 p = h * u_k[0] + vec2(u_phase, 0.0);\n    vec2 i = floor(p);\n    float best = 1e9, val = 0.0;\n    for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {\n      vec2 c = i + vec2(x, y);\n      vec2 d = c + rnd2(c, u_k[1] + u_seed) - p;\n      float m = u_type == 13 && u_k[2] > 1.5 ? max(abs(d.x), abs(d.y)) : u_type == 13 && u_k[2] > 0.5 ? abs(d.x) + abs(d.y) : length(d);\n      if (m < best) { best = m; val = rnd(c, u_k[1] + u_seed + 31.0); }\n    }\n    return u_type == 13 ? clamp(best, 0.0, 1.0) : val;\n  }\n  if (u_type == 15) { // blocks: bw, bh, seed\n    return rnd(floor((P + vec2(u_phase * u_k[0], 0.0)) / vec2(u_k[0], u_k[1])), u_k[2] + u_seed);\n  }\n  if (u_type == 16) { // rows: size, direction (1 = columns), seed\n    float c = u_k[1] > 0.5 ? P.x : P.y;\n    return rnd(vec2(floor(c / u_k[0] + u_phase), 0.0), u_k[2] + u_seed);\n  }\n  if (u_type == 17) { // bayer: matrix (2^n), base\n    int n = int(u_k[0] + 0.5);\n    ivec2 ip = ivec2(floor(P));\n    int b = 0;\n    for (int i = 0; i < 3; i++) {\n      if (i >= n) break;\n      int sh = n - 1 - i;\n      int x = (ip.x >> i) & 1, y = (ip.y >> i) & 1;\n      b |= ((x ^ y) << (2 * sh + 1)) | (y << (2 * sh));\n    }\n    float size = float(1 << (2 * n));\n    return u_k[1] > (float(b) + 0.5) / size ? 1.0 : 0.0;\n  }\n  if (u_type == 18) return lumaAt(u_t, P / R); // self: the luma of frame t\n  if (u_type == 19) { // motion: gain, frames\n    float s = 0.0;\n    int K = int(u_k[1] + 0.5);\n    for (int k = 0; k < 8; k++) {\n      if (k >= K) break;\n      if (layerOf(u_t - k - 1) < 0) break;\n      s += abs(lumaAt(u_t - k, P / R) - lumaAt(u_t - k - 1, P / R));\n    }\n    return clamp(s / float(K) * u_k[0], 0.0, 1.0);\n  }\n  if (u_type == 20) return mix(u_k[1], u_k[0], texture(u_mask, P / R).r); // subject: subject value, background value\n  if (u_type == 21) { // subject distance: falloff (working px)\n    vec2 q = P / R * u_workRes;\n    ivec2 sz = textureSize(u_dist, 0);\n    vec2 sd = texelFetch(u_dist, clamp(ivec2(q), ivec2(0), sz - 1), 0).rg;\n    return sd.x < 0.0 ? 1.0 : clamp(length(sd - q) / max(u_k[0], 1.0), 0.0, 1.0);\n  }\n  return 0.0;\n}\n\nfloat custom(vec2 P) {\n  vec2 R = u_res;\n  vec2 p = P - R * 0.5 - u_pos * R;\n  float a = radians(-u_crot);\n  p = mat2(cos(a), sin(a), -sin(a), cos(a)) * p / max(u_scale, 1e-3);\n  p *= u_flip;\n  vec2 uv;\n  if (u_fit == 2) uv = p / R + 0.5;\n  else {\n    float s = u_fit == 0 ? max(R.x / u_csize.x, R.y / u_csize.y) : min(R.x / u_csize.x, R.y / u_csize.y);\n    uv = p / (u_csize * s) + 0.5;\n  }\n  if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return u_outside;\n  return texture(u_custom, vec3(uv, u_layer)).r;\n}\n\nvoid main() {\n  vec2 R = u_res;\n  vec2 uv = v_uv + u_offset;\n  // Tile: each tile has the full map; mirror: every second tile is flipped.\n  vec2 tu = uv * u_tile;\n  vec2 f = fract(tu);\n  if (u_mirror) f = mix(f, 1.0 - f, mod(floor(tu), 2.0));\n  vec2 P = f * R;\n  if (u_src == 1) { o = vec4(custom(P)); return; }\n  // Animation: rotate and scale about the frame centre.\n  vec2 c = R * 0.5;\n  float a = radians(-u_rot);\n  P = c + mat2(cos(a), sin(a), -sin(a), cos(a)) * (P - c) / u_pulse;\n  o = vec4(builtin(P));\n}\n";
const BLUR_FRAG = "// Map blur (plan §7.5): one direction of a separable Gaussian (sigma = radius / 2).\nprecision highp float;\nuniform highp sampler2D u_in;\nuniform vec2 u_dir; // (1, 0) or (0, 1)\nuniform float u_radius;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  ivec2 size = textureSize(u_in, 0);\n  ivec2 p = ivec2(floor(v_uv * vec2(size)));\n  float sigma = max(u_radius * 0.5, 0.5);\n  float sum = 0.0, wsum = 0.0;\n  int r = int(ceil(u_radius));\n  for (int i = -64; i <= 64; i++) {\n    if (i < -r || i > r) continue;\n    ivec2 q = clamp(p + ivec2(u_dir) * i, ivec2(0), size - 1);\n    float w = exp(-float(i * i) / (2.0 * sigma * sigma));\n    sum += w * texelFetch(u_in, q, 0).r;\n    wsum += w;\n  }\n  o = vec4(sum / wsum);\n}\n";
const ADJUST_FRAG = "// Map adjustments (plan §7.5), in the fixed order: levels -> gamma / contrast -> curve -> posterize\n// -> invert. (The transform and the tile are in mapgen.frag; the blur is mapblur.frag.)\nprecision highp float;\nuniform highp sampler2D u_in;\nuniform highp sampler2D u_curve; // 256 x 1\nuniform bool u_useCurve;\nuniform float u_black, u_white, u_gamma, u_contrast;\nuniform int u_posterize; // 0, or 2..64 levels\nuniform bool u_invert;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  float v = texelFetch(u_in, ivec2(floor(v_uv * vec2(textureSize(u_in, 0)))), 0).r;\n  v = clamp((v - u_black) / max(u_white - u_black, 1e-4), 0.0, 1.0);\n  v = pow(v, 1.0 / max(u_gamma, 1e-3));\n  float k = tan((u_contrast + 1.0) * 0.785398); // contrast -1..1 -> slope 0..inf (0 -> 1)\n  v = clamp((v - 0.5) * k + 0.5, 0.0, 1.0);\n  if (u_useCurve) {\n    float x = v * 255.0;\n    float i = floor(min(x, 254.0));\n    v = mix(texelFetch(u_curve, ivec2(int(i), 0), 0).r, texelFetch(u_curve, ivec2(int(i) + 1, 0), 0).r, x - i);\n  }\n  if (u_posterize > 1) v = min(floor(v * float(u_posterize)), float(u_posterize - 1)) / float(u_posterize - 1);\n  if (u_invert) v = 1.0 - v;\n  o = vec4(v);\n}\n";
const FITS = { fill: 0, fit: 1, stretch: 2 };

class MapGen {
  constructor(engine) {
    this.e = engine;
    const gl = (this.gl = engine.gl);
    this.float = engine.caps.floatTargets;
    this.gen = program(gl, QUAD_VERT, `#version 300 es\nprecision highp float;\nprecision highp int;\n${STORE_GLSL}\n${GEN_FRAG}`);
    this.blur = program(gl, QUAD_VERT, `#version 300 es\n${BLUR_FRAG}`);
    this.adjust = program(gl, QUAD_VERT, `#version 300 es\n${ADJUST_FRAG}`);
    this.curveTex = gl.createTexture();
    this.curveKey = '';
    this.custom = null; // { tex, w, h, layers, count, rotation }
    this.emptyCustom = this.makeArray(1, 1, 1);
    this.targets = null;
  }

  // A map texture (R32F, or RGBA8 without float targets).
  makeTarget(w, h) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, this.float ? gl.R32F : gl.RGBA8, w, h);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    return t;
  }

  makeArray(w, h, layers) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, layers);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    return t;
  }

  // The work textures for a size: { w, h, raw, a, b }.
  work(w, h) {
    const gl = this.gl;
    if (this.targets && this.targets.w === w && this.targets.h === h) return this.targets;
    if (this.targets) for (const k of ['raw', 'a', 'b']) gl.deleteTexture(this.targets[k]);
    this.targets = { w, h, raw: this.makeTarget(w, h), a: this.makeTarget(w, h), b: this.makeTarget(w, h) };
    return this.targets;
  }

  into(tex, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.e.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.viewport(0, 0, w, h);
  }

  // Custom map: allocate for count frames of w x h (an image: count 1).
  beginCustom(w, h, count, rotation = 0) {
    this.clearCustom();
    this.custom = { tex: this.makeArray(w, h, count), w, h, layers: count, count: 0, rotation };
    return this.custom;
  }

  clearCustom() {
    if (this.custom) this.gl.deleteTexture(this.custom.tex);
    this.custom = null;
  }

  // Put a picture (ImageBitmap or VideoFrame) into layer i of the custom map, as luma.
  putCustom(i, source, rotation) {
    const c = this.custom;
    this.e.lumaInto(c.tex, i, c.w, c.h, source, rotation);
    c.count = Math.max(c.count, i + 1);
  }

  empty2D() {
    if (!this.empty) this.empty = this.makeTarget(1, 1);
    return this.empty;
  }

  curve(points) {
    const gl = this.gl;
    const key = JSON.stringify(points);
    if (key === this.curveKey) return;
    this.curveKey = key;
    const table = curveTable(points);
    gl.bindTexture(gl.TEXTURE_2D, this.curveTex);
    if (this.float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, 256, 1, 0, gl.RED, gl.FLOAT, table);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 256, 1, 0, gl.RED, gl.UNSIGNED_BYTE, Uint8Array.from(table, (v) => Math.round(v * 255)));
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
  }

  // Render the map of frame t (map: the map settings) into out (w x h).
  run(map, t, out, w, h) {
    const gl = this.gl;
    const e = this.e;
    const W = this.work(w, h);
    const A = map.adjust, an = map.anim;
    const custom = (map.source === 'image' || map.source === 'video') && this.custom && this.custom.count;

    // The subject maps: the mask and the jump flood distance (plan §7.3, §9). Made first: the
    // distance pass uses its own programs (set before the uniforms of the map program).
    const mk = e.mask;
    const subj = map.source === 'builtin' && (map.type === 'subject' || map.type === 'subjectdist') && mk.tex;
    const dist = subj && map.type === 'subjectdist' ? mk.distance() : null;
    // 1. Generate.
    const g = this.gen;
    this.into(W.raw, w, h);
    gl.useProgram(g.prog);
    e.bindStore(g);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, e.layersTex);
    gl.uniform1i(g.u.u_layers, 4);
    gl.uniform1i(g.u.u_n, e.n);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, custom ? this.custom.tex : this.emptyCustom);
    gl.uniform1i(g.u.u_custom, 5);
    gl.uniform2f(g.u.u_res, w, h);
    gl.uniform1i(g.u.u_t, t);
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, subj ? mk.tex.out : this.empty2D());
    gl.uniform1i(g.u.u_mask, 6);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, dist || this.empty2D());
    gl.uniform1i(g.u.u_dist, 7);
    gl.uniform2f(g.u.u_workRes, e.w, e.h);
    this.into(W.raw, w, h);
    gl.useProgram(g.prog);
    gl.uniform1i(g.u.u_src, custom ? 1 : 0);
    gl.uniform2f(g.u.u_offset, A.offsetX, A.offsetY);
    gl.uniform2f(g.u.u_tile, Math.max(1, A.tileX), Math.max(1, A.tileY));
    gl.uniform1i(g.u.u_mirror, A.mirrorTile ? 1 : 0);
    if (custom) {
      const c = this.custom, im = map.image;
      const layer = map.source === 'video' ? videoMapFrame(t, c.count, map.video.speed, map.video.offset, map.video.end) : 0;
      gl.uniform1f(g.u.u_layer, layer);
      gl.uniform2f(g.u.u_csize, c.w, c.h);
      gl.uniform1i(g.u.u_fit, FITS[im.fit] ?? 0);
      gl.uniform1f(g.u.u_outside, im.outside);
      gl.uniform2f(g.u.u_pos, im.x, im.y);
      gl.uniform1f(g.u.u_scale, im.scale);
      gl.uniform1f(g.u.u_crot, im.rotation);
      gl.uniform2f(g.u.u_flip, im.flipX ? -1 : 1, im.flipY ? -1 : 1);
    } else {
      const type = MAP_INDEX[map.type] ?? 0;
      const k = new Float32Array(12);
      k.set(paramArray(map.type, map.params[map.type]));
      gl.uniform1i(g.u.u_type, type);
      gl.uniform1fv(g.u['u_k[0]'], k);
      gl.uniform1f(g.u.u_phase, an.phaseSpeed * t);
      gl.uniform1f(g.u.u_rot, an.rotSpeed * t);
      gl.uniform1f(g.u.u_pulse, 1 + an.pulseAmount * Math.sin((2 * Math.PI * t) / Math.max(1, an.pulsePeriod)));

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32I, this.H, 1, 0, gl.RED_INTEGER, gl.INT, this.rowFrame);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    this.Stex = gl.createTexture();
    // The staging layer (YUV, 1 layer) for the frames of the analysis pass.
    this.stY = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.stY);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, 1);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.stC = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.stC);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, 1);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.key = '';
    this.sKey = '';
    return { rows: this.H };
  }

  active() {
    return !!(this.e.settings && this.e.settings.mode === 'slitscan' && this.hist);
  }

  // A change of the line (or the slit width): the history is not valid; rebuild it from the frames
  // in the store at once (the analysis pass of the page does the rest).
  update() {
    if (!this.active()) return;
    const sl = this.e.settings.slitscan;
    const e = this.e;
    const key = JSON.stringify([sl.x, sl.y, sl.angle, sl.flip, sl.width, e.w, e.h]);
    if (key !== this.key) {
      this.key = key;
      this.geo = lineGeometry(sl, e.w, e.h, e.caps.maxTexture);
      this.rowFrame.fill(-1);
      const order = [];
      for (let l = 0; l < e.n; l++) if (e.layerFrame[l] >= 0) order.push([e.layerFrame[l], l]);
      order.sort((a, b) => a[0] - b[0]);
      for (const [t, l] of order) this.writeRow(t, e.storeY, e.storeC, l, false);
      this.uploadRows();
    }
    const sk = JSON.stringify([sl.rateType, sl.rate, sl.rateEnd, sl.curve, sl.maxAge, this.H]);
    if (sk !== this.sKey) {
      this.sKey = sk;
      const S = distanceTable({ ...sl, maxAge: Math.min(sl.maxAge, this.H) });
      this.M = S.length - 1;
      const rows = Math.ceil(S.length / 1024);
      const data = new Float32Array(rows * 1024);
      data.set(S);
      const gl = this.gl;
      gl.bindTexture(gl.TEXTURE_2D, this.Stex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, 1024, rows, 0, gl.RED, gl.FLOAT, data);

  }

  uploadRows() {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.H, 1, gl.RED_INTEGER, gl.INT, this.rowFrame);
  }

  // Write the history row of frame index from a YUV array layer.
  writeRow(index, Y, C, layer, upload = true) {
    const gl = this.gl;
    const e = this.e;
    const g = this.geo;
    const row = index % this.H;
    const p = this.rowProg;
    gl.bindFramebuffer(gl.FRAMEBUFFER, e.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.hist, 0);
    gl.viewport(0, row, this.len, 1);
    gl.useProgram(p.prog);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, Y);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, C);
    gl.uniform1i(p.u.u_Y, 1);
    gl.uniform1i(p.u.u_C, 2);
    gl.uniform1f(p.u.u_layer, layer);
    gl.uniform2f(p.u.u_res, e.w, e.h);
    gl.uniform2f(p.u.u_L, g.L[0], g.L[1]);
    gl.uniform2f(p.u.u_d, g.d[0], g.d[1]);
    gl.uniform2f(p.u.u_e, g.e[0], g.e[1]);
    gl.uniform1f(p.u.u_c, g.c);
    gl.uniform1i(p.u.u_width, Math.max(1, Math.min(16, Math.round(e.settings.slitscan.width))));

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);

      gl.texSubImage2D(gl.TEXTURE_2D, 0, row, 0, 1, 1, gl.RED_INTEGER, gl.INT, e.one);

  }

  // A frame of the analysis pass: into the staging layer, then its history row (not the store).
  analysisFrame(index, frame) {
    const e = this.e;
    e.putYuv(frame, this.stY, this.stC, 0);
    if (e.edgeActive()) {
      e.edge.update();
      e.edge.addFrame(index, { Y: this.stY, C: this.stC, layer: 0 });
      return;
    }
    this.update();
    if (this.active()) this.writeRow(index, this.stY, this.stC, 0);
  }

  // The count of history rows that hold a frame (for tests and the status).
  filled() {
    let n = 0;
    for (const f of this.rowFrame || []) if (f >= 0) n++;
    return n;
  }

  render(index) {
    const gl = this.gl;
    const e = this.e;
    const s = e.settings;
    const sl = s.slitscan;
    const edge = e.edgeActive();
    this.update();
    if (edge) {
      e.edge.update();
      e.edge.drawTrail(index);
      gl.viewport(0, 0, e.w, e.h);
    }
    const g = this.geo;
    const p = this.scan;
    gl.useProgram(p.prog);
    e.bindStore(p);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, e.layersTex);
    gl.uniform1i(p.u.u_layers, 4);
    gl.uniform1i(p.u.u_n, e.n);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, this.hist);
    gl.uniform1i(p.u.u_hist, 3);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, this.rowsTex);
    gl.uniform1i(p.u.u_rows, 5);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, this.Stex);
    gl.uniform1i(p.u.u_S, 7);
    gl.uniform2f(p.u.u_res, e.w, e.h);
    gl.uniform1i(p.u.u_t, index);
    gl.uniform2f(p.u.u_L, g.L[0], g.L[1]);
    gl.uniform2f(p.u.u_d, g.d[0], g.d[1]);
    gl.uniform2f(p.u.u_e, g.e[0], g.e[1]);
    gl.uniform1f(p.u.u_c, g.c);
    gl.uniform1f(p.u.u_len, this.len);
    gl.uniform1i(p.u.u_H, this.H);
    gl.uniform1i(p.u.u_M, edge ? e.edge.M : this.M);

      gl.uniform1i(p.u.u_trail, 10);
      gl.uniform1i(p.u.u_epos, 11);
      gl.uniform1i(p.u.u_ecol, 12);
      gl.uniform1i(p.u.u_eframes, 13);

    const wp = sl.warp || {};
    const diag = Math.hypot(e.w, e.h);
    const wl = Math.max(1, wp.waveLength || 1);
    gl.uniform4f(p.u.u_warp, ((wp.twist || 0) * Math.PI) / 180, wp.drift || 0, wp.spread || 0, 1 / diag);

    gl.uniform1i(p.u.u_sharp, sl.sampling === 'blend' ? 0 : 1);
    gl.uniform1i(p.u.u_view, VIEWS[s.view] ?? 0);

    e.mask.subjectUniforms(p, s.cutout.mode === 'overlay' || s.cutout.mode === 'scan');

  }
}

return { Slit };

const YUVCOPY_FRAG = "// Copy (and scale) layer 0 of a YUV array plane into a new size (the clean plate, plan §9.2).\nprecision highp float;\nuniform highp sampler2DArray u_in;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  o = texture(u_in, vec3(v_uv, 0.0));\n}\n";
const REFINE_FRAG = "// Edge refine, step 1 (plan §9.1, after the clean-up): the mean colour of the sure subject (or of the\n// sure background) near each pixel. One direction of a separable sum of (colour × m, m), where m is\n// the sure area (the mask made smaller, or the inverse of the mask made larger). u_first: from the\n// frame and m; else: the second direction, from the sums of the first.\nprecision highp float;\nuniform highp sampler2D u_in;\nuniform highp sampler2DArray u_Y; // the frame, as the store keeps it\nuniform highp sampler2DArray u_C;\nuniform float u_layer;\nuniform bool u_first;\nuniform bool u_invert;\nuniform vec2 u_dir; // (1, 0) or (0, 1)\nuniform int u_r;    // radius (px)\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  vec2 size = vec2(textureSize(u_in, 0));\n  vec2 px = u_dir / size;\n  float stp = max(1.0, float(u_r) / 12.0);\n  vec4 sum = vec4(0.0);\n  float wsum = 0.0;\n  for (int i = -12; i <= 12; i++) {\n    float off = float(i) * stp;\n    if (abs(off) > float(u_r)) continue;\n    vec2 q = clamp(v_uv + px * off, 0.5 / size, 1.0 - 0.5 / size);\n    float w = 1.0 - abs(off) / (float(u_r) + 1.0);\n    vec4 v;\n    if (u_first) {\n      float m = texture(u_in, q).r;\n      m = step(0.5, u_invert ? 1.0 - m : m);\n      v = vec4(vec3(texture(u_Y, vec3(q, u_layer)).r, texture(u_C, vec3(q, u_layer)).rg) * m, m);\n    } else v = texture(u_in, q);\n    sum += w * v;\n    wsum += w;\n  }\n  o = sum / wsum;\n}\n";
const REFINE2_FRAG = "// Edge refine, step 2: in the band about the mask edge (between the mask made smaller and the mask\n// made larger), a pixel is subject when its colour is nearer to the subject colours near it than to\n// the background colours near it. Where the two are the same colour, the mask stays as it is.\nprecision highp float;\nuniform highp sampler2D u_in;  // the mask\nuniform highp sampler2D u_fg;  // sums of the sure subject (colour × m, m)\nuniform highp sampler2D u_bg;  // sums of the sure background\nuniform highp sampler2D u_ero; // the mask made smaller\nuniform highp sampler2D u_dil; // the mask made larger\nuniform highp sampler2DArray u_Y;\nuniform highp sampler2DArray u_C;\nuniform float u_layer;\nuniform float u_soft; // the softness of the new edge\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  float m = texture(u_in, v_uv).r;\n  o = vec4(m);\n  if (texture(u_ero, v_uv).r > 0.5 || texture(u_dil, v_uv).r < 0.5) return; // not in the band\n  vec4 F = texture(u_fg, v_uv), B = texture(u_bg, v_uv);\n  if (F.a < 0.02 || B.a < 0.02) return; // no sure subject or background near\n  vec3 k = vec3(1.0, 2.0, 2.0); // the colour difference counts more than the brightness\n  vec3 c = vec3(texture(u_Y, vec3(v_uv, u_layer)).r, texture(u_C, vec3(v_uv, u_layer)).rg) * k;\n  vec3 f = F.rgb / F.a * k, b = B.rgb / B.a * k;\n  float dF = length(c - f), dB = length(c - b);\n  float a = smoothstep(0.5 - u_soft, 0.5 + u_soft, dB / (dF + dB + 1e-4));\n  o = vec4(mix(m, a, clamp(length(f - b) * 8.0 - 0.2, 0.0, 1.0)));\n}\n";
const OVERLAY_FRAG = "// The cutout overlay (painting the matte): the frame with the background dark and violet, the subject\n// as it is, and the matte strokes (Always subject: green, Never subject: red).\nprecision highp float;\nuniform highp sampler2D u_in;    // the mask\nuniform highp sampler2D u_matte; // R = always subject, G = never subject\nuniform highp sampler2DArray u_Y;\nuniform highp sampler2DArray u_C;\nuniform float u_layer; // < 0: the frame is not in the store\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);\n  float y = texture(u_Y, vec3(uv, u_layer)).r;\n  vec2 c = texture(u_C, vec3(uv, u_layer)).rg - 0.5;\n  vec3 rgb = u_layer < 0.0 ? vec3(0.0) : clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n  float m = texture(u_in, uv).r;\n  vec3 col = mix(rgb * 0.3 + vec3(0.22, 0.0, 0.3), rgb, m);\n  vec2 g = texture(u_matte, uv).rg;\n  col = mix(col, vec3(0.2, 1.0, 0.4), 0.3 * g.r);\n  col = mix(col, vec3(1.0, 0.15, 0.15), 0.3 * g.g);\n  o = vec4(col, 1.0);\n}\n";
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
const FIX_SIZE = 256; // the long side of the small copy for Fill holes / Keep largest
const MATTE_SIZE = 1024; // the long side of the garbage matte

const ycc = (rgb) => {
  const y = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  return [y, (rgb[2] - y) / 1.8556 + 0.5, (rgb[0] - y) / 1.5748 + 0.5];
};

class Mask {
  constructor(engine) {
    this.e = engine;
    const gl = (this.gl = engine.gl);
    this.methods = program(gl, QUAD_VERT, `${HEAD}${STORE_GLSL}\n${METHODS_FRAG}`);
    this.morph = program(gl, QUAD_VERT, `#version 300 es\n${MORPH_FRAG}`);
    this.post = program(gl, QUAD_VERT, `#version 300 es\n${POST_FRAG}`);
    this.blur = program(gl, QUAD_VERT, `#version 300 es\n${BLUR_FRAG}`);
    this.brush = program(gl, QUAD_VERT, `#version 300 es\n${BRUSH_FRAG}`);
    this.jfa = program(gl, QUAD_VERT, `#version 300 es\n${JFA_FRAG}`);
    this.show = program(gl, QUAD_VERT, `#version 300 es\n${SHOW_FRAG}`);
    this.yuvcopy = program(gl, QUAD_VERT, `#version 300 es\n${YUVCOPY_FRAG}`);
    this.refine = program(gl, QUAD_VERT, `#version 300 es\n${REFINE_FRAG}`);
    this.refine2 = program(gl, QUAD_VERT, `#version 300 es\n${REFINE2_FRAG}`);
    this.overlay = program(gl, QUAD_VERT, `#version 300 es\n${OVERLAY_FRAG}`);
    this.tex = null;
    this.key = '';
    this.version = 0; // clean plate, matte, import changes
    this.prev = { t: -2, key: '' };
    this.plateY = this.plateC = null; // the clean plate, YUV 4:2:0 as the store (1 layer)
    this.hasPlate = false;
    this.imp = null; // { tex, w, h, count }
    this.emptyArray = (() => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, 1, 1, 1);
      return t;
    })();
    this.fixTex = this.tex2(1, 1, gl.RG8);
  }

  tex2(w, h, fmt, filter) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h);
    texParams(gl, gl.TEXTURE_2D, filter ?? gl.LINEAR);
    return t;
  }

  // The work textures at the working size; the matte keeps its own size (the aspect of the picture).
  configure(w, h) {
    const gl = this.gl;
    if (this.tex) for (const t of Object.values(this.tex)) gl.deleteTexture(t);
    if (this.rtex) for (const t of Object.values(this.rtex)) gl.deleteTexture(t);
    this.rtex = null; // the Edge refine work textures: made when it is used
    const R8 = gl.R8;
    this.tex = { a: this.tex2(w, h, R8), b: this.tex2(w, h, R8), c: this.tex2(w, h, R8), out: this.tex2(w, h, R8), sub: this.tex2(w, h, R8), outline: this.tex2(w, h, R8), prev: this.tex2(w, h, R8) };
    if (this.e.caps.floatTargets) {
      this.tex.j1 = this.tex2(w, h, gl.RG32F, gl.NEAREST);
      this.tex.j2 = this.tex2(w, h, gl.RG32F, gl.NEAREST);
    }
    // The clean plate is kept: scaled into the new size (the export reconfigures the engine).
    const old = this.hasPlate ? [this.plateY, this.plateC] : null;
    if (!old) for (const t of [this.plateY, this.plateC]) if (t) gl.deleteTexture(t);
    this.plateY = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateY);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, 1);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.plateC = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateC);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, 1);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.hasPlate = false;
    if (old) {
      const p = this.yuvcopy;
      gl.useProgram(p.prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.uniform1i(p.u.u_in, 0);
      [[old[0], this.plateY, w, h], [old[1], this.plateC, w / 2, h / 2]].forEach(([src, dst, ww, hh]) => {
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, src);
        this.e.target(dst, 0, ww, hh);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      });
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      for (const t of old) gl.deleteTexture(t);
      this.hasPlate = true;
    }
    const s = MATTE_SIZE / Math.max(w, h);
    const mw = Math.round(w * s), mh = Math.round(h * s);
    if (!this.matte || this.matteSize[0] !== mw || this.matteSize[1] !== mh) {
      if (this.matte) for (const t of this.matte) gl.deleteTexture(t);
      this.matte = [this.tex2(mw, mh, gl.RGBA8), this.tex2(mw, mh, gl.RGBA8)];
      this.matteSize = [mw, mh];
      this.clearMatte();
    }
    this.key = '';
    this.prev = { t: -2, key: '' };
    this.distT = -1;
  }

  into(tex, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.e.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.viewport(0, 0, w, h);
  }

  clearMatte() {
    const gl = this.gl;
    for (const t of this.matte) {
      this.into(t, ...this.matteSize);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.version++;
  }

  // The garbage matte as RGBA bytes (R = always, G = never), the first row at the top (presets).
  matteGet() {
    const gl = this.gl;
    const [w, h] = this.matteSize;
    this.into(this.matte[0], w, h);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let any = false;
    for (let i = 0; i < px.length; i += 4) if (px[i] || px[i + 1]) { any = true; break; }
    return { cmd: 'matte', width: w, height: h, pixels: px, empty: !any };
  }

  // Set the matte from an image of the matte size (a preset).
  matteSet(bitmap) {
    const gl = this.gl;
    const [w, h] = this.matteSize;
    gl.bindTexture(gl.TEXTURE_2D, this.matte[0]);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
    bitmap.close();
    this.version++;
    return { cmd: 'matte', width: w, height: h };
  }

  // Set the matte from RGBA bytes of the matte size (the undo of a stroke).
  matteSetPixels(pixels, width, height) {
    const gl = this.gl;
    const [w, h] = this.matteSize;
    if (width !== w || height !== h || pixels.length !== w * h * 4) return { cmd: 'matte', ok: false };
    gl.bindTexture(gl.TEXTURE_2D, this.matte[0]);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    this.version++;
    return { cmd: 'matte', ok: true, width: w, height: h };
  }

  // A brush stroke (plan §9.1 step 3). points: [[u, v], ...] in 0..1 of the picture; size: the brush
  // diameter in working pixels; mode: 'always' | 'never' | 'erase'.
  stroke(points, size, hardness, mode) {
    const gl = this.gl;
    const [mw, mh] = this.matteSize;
    const scale = mw / this.e.w;
    const p = this.brush;
    for (let i = 0; i < points.length; i += 63) {
      const part = points.slice(i, i + 64);
      const flat = new Float32Array(128);
      part.forEach(([u, v], k) => flat.set([u * mw, v * mh], k * 2));
      this.into(this.matte[1], mw, mh);
      gl.useProgram(p.prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.matte[0]);
      gl.uniform1i(p.u.u_in, 0);
      gl.uniform2fv(p.u['u_pts[0]'], flat);
      gl.uniform1i(p.u.u_np, part.length);
      gl.uniform1f(p.u.u_radius, Math.max(0.5, (size * scale) / 2));
      gl.uniform1f(p.u.u_hardness, Math.min(0.99, Math.max(0, hardness)));
      gl.uniform1i(p.u.u_mode, { always: 0, never: 1, erase: 2 }[mode] ?? 2);
      drawQuad(gl);
      this.matte.reverse();
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.version++;
  }

  // The clean plate (plan §9.2). It goes through the same YUV 4:2:0 conversion as the frames of the
  // store, so that the background difference compares like with like. upload(): put the picture
  // (already turned) into the bound TEXTURE_2D.
  setPlate(upload) {
    const gl = this.gl;
    const e = this.e;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, e.src2);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    upload();
    gl.generateMipmap(gl.TEXTURE_2D);
    texParams(gl, gl.TEXTURE_2D, gl.LINEAR, gl.LINEAR_MIPMAP_LINEAR);
    gl.useProgram(e.upload.prog);
    gl.uniform1i(e.upload.u.u_src, 0);
    gl.uniform1i(e.upload.u.u_rot, 0);
    gl.uniform1i(e.upload.u.u_mode, 0);
    e.target(this.plateY, 0, e.w, e.h);
    drawQuad(gl);
    gl.uniform1i(e.upload.u.u_mode, 1);
    e.target(this.plateC, 0, e.w / 2, e.h / 2);
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.hasPlate = true;
    this.version++;
    return true;
  }

  // A frame converted as the store does it (into a staging layer), read back: { Y, C } bytes.
  grabYuv(frame) {
    const gl = this.gl;
    const e = this.e;
    const st = e.slit;
    e.putYuv(frame, st.stY, st.stC, 0);
    const read = (tex, w, h, ch) => {
      e.target(tex, 0, w, h);
      const px = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const out = new Uint8Array(w * h * ch);
      for (let i = 0; i < w * h; i++) for (let c = 0; c < ch; c++) out[i * ch + c] = px[i * 4 + c];
      return out;
    };
    const Y = read(st.stY, e.w, e.h, 1), C = read(st.stC, e.w / 2, e.h / 2, 2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { cmd: 'yuv', Y, C };
  }

  // The clean plate from Y and CbCr bytes (the median of grabYuv frames).
  setPlateYuv(Y, C) {
    const gl = this.gl;
    const e = this.e;
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateY);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, 0, e.w, e.h, 1, gl.RED, gl.UNSIGNED_BYTE, Y);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateC);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, 0, e.w / 2, e.h / 2, 1, gl.RG, gl.UNSIGNED_BYTE, C);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
    this.hasPlate = true;
    this.version++;
    return true;
  }

  setPlateImage(bitmap) {
    const gl = this.gl;
    try {
      return this.setPlate(() => gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, bitmap));
    } finally {
      bitmap.close();
    }
  }

  // The stored frame t: render it (RGB) into a texture, copy that into the source texture.
  setPlateFrame(t) {
    const gl = this.gl;
    const e = this.e;
    if (e.layerOf(t) < 0) return false;
    const tmp = this.tex2(e.w, e.h, gl.RGBA8);
    this.into(tmp, e.w, e.h);
    gl.useProgram(e.show.prog);
    e.bindStore(e.show);
    gl.uniform1f(e.show.u.u_layer, e.layerOf(t));
    gl.uniform1i(e.show.u.u_noFlip, 1);
    drawQuad(gl);
    gl.uniform1i(e.show.u.u_noFlip, 0); // the uniform stays with the program
    const ok = this.setPlate(() => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, e.fb);
      gl.copyTexImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 0, 0, e.w, e.h, 0);
    });
    gl.deleteTexture(tmp);
    return ok;
  }

  // The imported mask (plan §9.3): an R8 array, one layer for each frame of the mask video.
  beginImport(w, h, count) {
    const gl = this.gl;
    this.clearImport();
    count = Math.max(1, Math.min(count, this.e.caps.maxLayers)); // the frames after it use the last layer
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, count);
    texParams(gl, gl.TEXTURE_2D_ARRAY);
    this.imp = { tex: t, w, h, layers: count, count: 0 };
    this.version++;
  }

  importFrame(i, frame, rotation) {
    if (!this.imp || i >= this.imp.layers) return;
    this.e.lumaInto(this.imp.tex, i, this.imp.w, this.imp.h, frame, rotation);
    this.imp.count = Math.max(this.imp.count, i + 1);
    this.version++;
  }

  clearImport() {
    if (this.imp) this.gl.deleteTexture(this.imp.tex);
    this.imp = null;
    this.version++;
  }

  // One pass: prog with the input texture on unit 0, into out.
  pass(prog, input, out, set) {
    const gl = this.gl;
    const e = this.e;
    this.into(out, e.w, e.h);
    gl.useProgram(prog.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, input);
    gl.uniform1i(prog.u.u_in, 0);
    if (set) set(prog.u);
    drawQuad(gl);
  }

  // Erode (r < 0) or dilate (r > 0) src by |r| px (two passes); the result is in dst.
  morphOp(src, tmp, dst, r) {
    const gl = this.gl;
    if (!r) return src;
    const set = (dir) => (u) => {
      gl.uniform2f(u.u_dir, ...dir);
      gl.uniform1i(u.u_r, Math.min(64, Math.abs(Math.round(r))));
      gl.uniform1i(u.u_max, r > 0 ? 1 : 0);
    };
    this.pass(this.morph, src, tmp, set([1, 0]));
    this.pass(this.morph, tmp, dst, set([0, 1]));
    return dst;
  }

  blurOp(src, tmp, dst, radius) {
    const gl = this.gl;
    if (!(radius > 0)) return src;
    const set = (dir) => (u) => {
      gl.uniform2f(u.u_dir, ...dir);
      gl.uniform1f(u.u_radius, Math.min(64, radius));
    };
    this.pass(this.blur, src, tmp, set([1, 0]));
    this.pass(this.blur, tmp, dst, set([0, 1]));
    return dst;
  }

  // Edge refine: the mask edge moves to the colour edge of the picture. In the band of the radius
  // about the mask edge, each pixel goes to the subject or to the background by its colour (the mean
  // colours of the sure subject and the sure background near it). frame: { Y, C, layer }.
  refineOp(src, dst, radius, soft, frame) {
    const gl = this.gl;
    const e = this.e;
    const r = Math.min(32, Math.round(radius));
    if (!(r > 0) || frame.layer < 0) return src;
    // The work textures of this step are made when it is first used.
    if (!this.rtex) {
      this.rtex = { ero: this.tex2(e.w, e.h, gl.R8), dil: this.tex2(e.w, e.h, gl.R8), x1: this.tex2(e.w, e.h, gl.RGBA8), fg: this.tex2(e.w, e.h, gl.RGBA8), bg: this.tex2(e.w, e.h, gl.RGBA8) };
    }
    const R = this.rtex;
    const T = this.tex;
    const ero = this.morphOp(src, T.c, R.ero, -r), dil = this.morphOp(src, T.c, R.dil, r);
    const frameTex = (u) => {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, frame.Y);
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, frame.C);
      gl.uniform1i(u.u_Y, 1);
      gl.uniform1i(u.u_C, 2);
      gl.uniform1f(u.u_layer, frame.layer);
    };
    // The mean colours in a window of 2 r + 4 px.
    const sums = (sure, invert, out) => {
      const set = (first, dir) => (u) => {
        frameTex(u);
        gl.uniform1i(u.u_first, first ? 1 : 0);
        gl.uniform1i(u.u_invert, invert ? 1 : 0);
        gl.uniform2f(u.u_dir, ...dir);
        gl.uniform1i(u.u_r, 2 * r + 4);
      };
      this.pass(this.refine, sure, R.x1, set(true, [1, 0]));
      this.pass(this.refine, R.x1, out, set(false, [0, 1]));
    };
    sums(ero, false, R.fg);
    sums(dil, true, R.bg);
    this.pass(this.refine2, src, dst, (u) => {
      frameTex(u);
      [[3, R.fg, 'u_fg'], [4, R.bg, 'u_bg'], [5, ero, 'u_ero'], [6, dil, 'u_dil']].forEach(([unit, tex, name]) => {

        gl.uniform1i(u[name], unit);
      });

  }

  // Copy src into dst (a pass of the post shader without work).
  copy(src, dst) {
    const gl = this.gl;
    this.pass(this.post, src, dst, (u) => {
      gl.uniform1i(u.u_doFix, 0);
      gl.uniform1i(u.u_doTemporal, 0);
    });
  }

  // The mask of frame t (plan §9.1). Returns false when it is the same as before. src (optional):
  // { Y, C, layer } arrays to read the frame from (the analysis staging), in place of the store.
  update(t, src) {
    const s = this.e.settings;
    const C = s.cutout, Sb = s.subject;

    // change, not for each frame. (The Split view keeps the cutout and subject objects.)

    if (bm.C !== C || bm.Sb !== Sb || bm.version !== this.version || bm.w !== this.e.w || bm.h !== this.e.h) {
      Object.assign(bm, { C, Sb, version: this.version, w: this.e.w, h: this.e.h, text: JSON.stringify([C, Sb, this.version, this.e.w, this.e.h]) });

    gl.uniform1i(m.u.u_plateY, 3);

    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.plateC);
    gl.uniform1i(m.u.u_plateC, 7);

    gl.uniform1f(m.u.u_high, C.luma.high);
    gl.uniform1f(m.u.u_lkSoft, C.luma.softness);

      cur = this.morphOp(cur, T.c, other(cur), -C.open);
      cur = this.morphOp(cur, T.c, other(cur), C.open);
    }
    if (C.close > 0) {
      cur = this.morphOp(cur, T.c, other(cur), C.close);
      cur = this.morphOp(cur, T.c, other(cur), -C.close);

  fix(src, fillPercent, keepLargest) {

    for (let i = 0; i < w * h; i++) {
      rg[i * 2] = r.fill[i] * 255;
      rg[i * 2 + 1] = r.remove[i] * 255;
    }
    gl.bindTexture(gl.TEXTURE_2D, this.fixTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RG, gl.UNSIGNED_BYTE, rg);

  }

  // Jump flooding: the nearest subject pixel of each pixel (for the Subject distance map).
  distance() {
    const gl = this.gl;
    const T = this.tex;
    if (!T.j1 || this.distT === this.key) return T.j1 ? this.distTex : null;
    let a = T.j1, b = T.j2;
    this.pass(this.jfa, T.out, a, (u) => gl.uniform1i(u.u_init, 1));
    for (let k = 2 ** Math.ceil(Math.log2(Math.max(this.e.w, this.e.h))); k >= 1; k >>= 1) {
      this.pass(this.jfa, a, b, (u) => {
        gl.uniform1i(u.u_init, 0);
        gl.uniform1i(u.u_k, k);
      });
      [a, b] = [b, a];
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.distTex = a;
    this.distT = this.key;
    return a;
  }

  // The uniforms of subject.glsl for an effect program.
  subjectUniforms(p, on) {
    const gl = this.gl;
    const s = this.e.settings;
    const Sb = s.subject;
    gl.uniform1i(p.u.u_subOn, on ? 1 : 0);
    gl.activeTexture(gl.TEXTURE8);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.sub);
    gl.uniform1i(p.u.u_subMask, 8);
    gl.activeTexture(gl.TEXTURE9);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.outline);
    gl.uniform1i(p.u.u_outline, 9);
    gl.uniform1i(p.u.u_outlineOn, Sb.outline > 0 ? 1 : 0);
    gl.uniform3fv(p.u.u_outlineColor, hexRgb(Sb.outlineColor));
    gl.uniform1f(p.u.u_subOpacity, Sb.opacity);
    gl.uniform1i(p.u.u_subBlend, BLEND_INDEX[Sb.blend] ?? 0);
    gl.uniform1f(p.u.u_spill, s.cutout.chroma.on ? s.cutout.chroma.spill : 0);
    gl.uniform3fv(p.u.u_keyRgb, hexRgb(s.cutout.chroma.key));
  }

  // The Mask view. overlay (index: the frame): the cutout on the picture, with the matte strokes.
  render(overlay, index) {
    const gl = this.gl;
    if (overlay) {
      const e = this.e;
      const p = this.overlay;
      gl.useProgram(p.prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.tex.out);
      gl.uniform1i(p.u.u_in, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, e.storeY);
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, e.storeC);
      gl.uniform1i(p.u.u_Y, 1);
      gl.uniform1i(p.u.u_C, 2);

      gl.bindTexture(gl.TEXTURE_2D, this.matte[0]);
      gl.uniform1i(p.u.u_matte, 5);
      drawQuad(gl);
      return;
    }
    gl.useProgram(this.show.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.out);
    gl.uniform1i(this.show.u.u_in, 0);
    drawQuad(gl);
  }
}

return { Mask };
})();

const EMIT_FRAG = "// Edge source emitters (plan §8.4). The rotated space: a square of u_D x u_D px about the frame\n// centre; x' along the scan direction u_d, y' along u_e. Each fragment is (row r, emitter k) of one\n// frame: march the row, find the k-th place where the mask goes from inside (>= 0.5) to outside\n// along +x'. Out 0: x' of the edge (sub-pixel; −1e6 = no emitter). Out 1: the colour of the last\n// subject pixel.\nprecision highp float;\nprecision highp int;\nuniform highp sampler2D u_mask;\nuniform highp sampler2DArray u_Y;\nuniform highp sampler2DArray u_C;\nuniform float u_layer;\nuniform vec2 u_res;\nuniform vec2 u_d, u_e;\nuniform float u_D;\nuniform int u_K;\nuniform int u_slot;\nlayout(location = 0) out vec4 oPos;\nlayout(location = 1) out vec4 oCol;\n\nfloat maskAt(vec2 p) {\n  if (p.x < 0.0 || p.y < 0.0 || p.x >= u_res.x || p.y >= u_res.y) return 0.0;\n  return texture(u_mask, p / u_res).r;\n}\n\nvec3 rgbAt(vec2 p) {\n  vec2 uv = p / u_res;\n  float y = texture(u_Y, vec3(uv, u_layer)).r;\n  vec2 c = texture(u_C, vec3(uv, u_layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n\nvoid main() {\n  int r = int(gl_FragCoord.x);\n  int k = int(gl_FragCoord.y) - u_slot * u_K;\n  vec2 c = u_res * 0.5;\n  float yp = float(r) + 0.5 - 0.5 * u_D;\n  vec2 base = c + yp * u_e;\n  int n = int(u_D);\n  int found = 0;\n  float prev = maskAt(base + (0.5 - 0.5 * u_D) * u_d);\n  for (int i = 0; i < 8192; i++) {\n    if (i + 1 >= n) break;\n    float x0 = float(i) + 0.5 - 0.5 * u_D;\n    float m1 = maskAt(base + (x0 + 1.0) * u_d);\n    if (prev >= 0.5 && m1 < 0.5) {\n      if (found == k) {\n        oPos = vec4(x0 + (prev - 0.5) / max(prev - m1, 1e-4), 0.0, 0.0, 1.0);\n        oCol = vec4(rgbAt(base + x0 * u_d), 1.0);\n        return;\n      }\n      found++;\n    }\n    prev = m1;\n  }\n  oPos = vec4(-1e6, 0.0, 0.0, 1.0);\n  oCol = vec4(0.0);\n}\n";
const TRAIL_VERT = "#version 300 es\n// Edge source trail (plan §8.4): one quad for each (row r, emitter k, age a). The emitter k of frame\n// t − a is at x_e + S(a). Join it to the emitter k of frame t − a − 1 at x_e' + S(a + 1) when\n// |x_e − x_e'| < the join limit; else a point (1 px). Depth = age: the youngest pixel wins.\nprecision highp float;\nprecision highp int;\nuniform highp sampler2D u_pos;     // R x (H K): x' of each emitter\nuniform highp sampler2D u_col;\nuniform highp isampler2D u_frames; // H x 1: the frame of each slot\nuniform highp sampler2D u_S;       // the distance table, 1024 wide\nuniform int u_t, u_H, u_K, u_M;\nuniform float u_D;\nuniform float u_join;\nflat out vec4 v_col;\nflat out float v_age;\n\nfloat S(int i) { return texelFetch(u_S, ivec2(i % 1024, i / 1024), 0).r; }\n// The x' of emitter k of frame f in row r, or −1e6.\nfloat xe(int r, int f, int k) {\n  if (f < 0) return -1e6;\n  int slot = f % u_H;\n  if (texelFetch(u_frames, ivec2(slot, 0), 0).r != f) return -1e6;\n  return texelFetch(u_pos, ivec2(r, slot * u_K + k), 0).r;\n}\n\nvoid main() {\n  int id = gl_InstanceID;\n  int a = id % u_M;\n  int k = (id / u_M) % u_K;\n  int r = id / (u_M * u_K);\n  int f = u_t - a;\n  float x0 = xe(r, f, k);\n  gl_Position = vec4(2.0, 2.0, 2.0, 1.0); // outside: nothing\n  v_col = vec4(0.0);\n  v_age = float(a);\n  if (x0 < -1e5) return;\n  float X0 = x0 + S(a), X1 = X0;\n  float x1 = xe(r, f - 1, k);\n  if (x1 > -1e5 && abs(x1 - x0) < u_join) X1 = x1 + S(a + 1);\n  float lo = min(X0, X1) - 0.5 + 0.5 * u_D, hi = max(X0, X1) + 0.5 + 0.5 * u_D;\n  int v = gl_VertexID;\n  float x = (v == 0 || v == 3 || v == 5) ? lo : hi;\n  float y = (v == 0 || v == 1 || v == 3) ? float(r) : float(r + 1);\n  gl_Position = vec4(x / u_D * 2.0 - 1.0, y / u_D * 2.0 - 1.0, float(a) / float(u_M + 1) * 2.0 - 1.0, 1.0);\n  int slot = f % u_H;\n  v_col = texelFetch(u_col, ivec2(r, slot * u_K + k), 0);\n}\n";

const AGE_GLSL = "// Alpha and age (plan §10.3). Age: frames (Mode 1: the delay d).\nuniform float u_opacity;\nuniform int u_decay;            // 0 full, 1 linear, 2 exponential (half-life), 3 curve\nuniform float u_decayLen;       // frames\nuniform highp sampler2D u_decayCurve; // 256 x 1: alpha = 1 − curve(age / length)\nuniform float u_maxAge;         // the age at \"max age\" (tint and brightness)\nuniform bool u_tintOn;\nuniform vec3 u_tint[4];         // new -> old\nuniform int u_tintN;            // 2..4\nuniform float u_tintAmount;\nuniform float u_ageBright;      // the brightness multiplier at max age\n\nfloat decayAlpha(float age) {\n  float u = age / max(u_decayLen, 1e-3);\n  if (u_decay == 1) return clamp(1.0 - u, 0.0, 1.0);\n  if (u_decay == 2) return exp2(-u);\n  if (u_decay == 3) {\n    float x = clamp(u, 0.0, 1.0) * 255.0;\n    float i = floor(min(x, 254.0));\n    return 1.0 - mix(texelFetch(u_decayCurve, ivec2(int(i), 0), 0).r, texelFetch(u_decayCurve, ivec2(int(i) + 1, 0), 0).r, x - i);\n  }\n  return 1.0;\n}\n\n// Age tint (a ramp of 2 to 4 colours, multiplied, by amount) and age brightness.\nvec3 ageLook(vec3 c, float age) {\n  float u = clamp(age / max(u_maxAge, 1e-3), 0.0, 1.0);\n  if (u_tintOn) {\n    float x = u * float(u_tintN - 1);\n    int i = min(int(floor(x)), u_tintN - 2);\n    vec3 t = mix(u_tint[i], u_tint[i + 1], x - float(i));\n    c = mix(c, c * t, u_tintAmount);\n  }\n  return clamp(c * mix(1.0, u_ageBright, u), 0.0, 1.0);\n}\n";
const COMPTEST_FRAG = "// Tests (plan §13.2): the compositor on given colours. u_b: base, u_s: effect (alpha in .a).\nuniform highp sampler2D u_b;\nuniform highp sampler2D u_s;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  ivec2 p = ivec2(gl_FragCoord.xy);\n  vec4 s = texelFetch(u_s, p, 0);\n  o = vec4(composite(texelFetch(u_b, p, 0).rgb, s.rgb, s.a), 1.0);\n}\n";
const SUBJECT_GLSL = "// The subject layer (plan §9.4, §10.4): the current frame × the subject mask, on top of the result,\n// with its own blend mode and opacity, an optional outline, and spill suppression (chroma key).\nuniform bool u_subOn;\nuniform highp sampler2D u_subMask;\nuniform highp sampler2D u_outline;  // the subject mask, dilated by the outline width\nuniform bool u_outlineOn;\nuniform vec3 u_outlineColor;\nuniform float u_subOpacity;\nuniform int u_subBlend;\nuniform float u_spill;\nuniform vec3 u_keyRgb;\n\nvec3 despill(vec3 c) {\n  vec3 k = u_keyRgb - dot(u_keyRgb, vec3(0.2126, 0.7152, 0.0722));\n  float n = length(k);\n  if (n < 1e-3 || u_spill <= 0.0) return c;\n  k /= n;\n  float a = max(0.0, dot(c - dot(c, vec3(0.2126, 0.7152, 0.0722)), k));\n  return clamp(c - k * a * u_spill, 0.0, 1.0);\n}\n\nvec3 subjectOver(vec3 result, vec3 subj, vec2 uv) {\n  if (!u_subOn) return result;\n  float m = texture(u_subMask, uv).r;\n  vec3 r = compositeWith(result, despill(subj), m * u_subOpacity, u_subBlend, u_linear);\n  if (u_outlineOn) r = mix(r, u_outlineColor, clamp(texture(u_outline, uv).r - m, 0.0, 1.0));\n  return r;\n}\n";
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
const VIEWS = { result: 0, original: 1, map: 2 };

class Engine {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = (this.gl = createContext(canvas));
    this.caps = {
      maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
      maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
      floatTargets: !!gl.getExtension('EXT_color_buffer_float'),
    };
    this.upload = program(gl, QUAD_VERT, UPLOAD_FRAG);
    this.show = program(gl, QUAD_VERT, `#version 300 es\nprecision highp float;\n${STORE_GLSL}\n${SHOW_FRAG}`);
    this.timemap = program(gl, QUAD_VERT, `${HEAD}${STORE_GLSL}\n${COMPOSITE_GLSL}\n${SUBJECT_GLSL}\n${AGE_GLSL}\n${TIMEMAP_FRAG}`);
    this.comptest = null; // made on the first test call
    this.decayTex = gl.createTexture();
    this.decayKey = '';
    this.mapgen = new MapGen(this);
    this.slit = new Slit(this);
    this.mask = new Mask(this);
    this.edge = new Edge(this);
    this.mapTex = null;
    this.mapKey = '';
    this.layersTex = null;
    this.settings = null;
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    this.src = null; // the frames of the store (immutable storage, made for each frame size)
    this.srcKey = '';
    this.src2 = gl.createTexture(); // other pictures (clean plate, mask and map videos): any size
    this.fb = gl.createFramebuffer();
    this.storeY = this.storeC = null;
    this.n = 0;
    this.layerFrame = null; // the frame index in each layer, -1 = empty
    this.last = { index: -1, delay: undefined };
    this.lost = false;
    this.depthCap = Infinity; // perfect loop: the loop length − 1
    this.one = new Int32Array(1); // scratch arrays (no new array for each frame)
    this.tintFlat = new Float32Array(12);
    this.mapJson = { map: null, text: '' };
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      this.lost = true;
      if (this.onLost) this.onLost();
    });
  }

  handle(m) {
    if (m.cmd === 'caps') return { cmd: 'caps', ...this.caps };
    if (m.cmd === 'configure') return this.configure(m);
    if (m.cmd === 'upload') {
      this.put(m.index, m.frame);
      if (m.show) this.render(m.index);
      if (m.show && m.grab) {
        // The canvas as a VideoFrame for the encoder, at once (the drawing buffer is not kept).
        const frame = new VideoFrame(this.canvas, { timestamp: m.grab.timestamp, duration: m.grab.duration, alpha: 'discard' });
        return { cmd: 'uploaded', index: m.index, frame };
      }
      return { cmd: 'uploaded', index: m.index };
    }
    if (m.cmd === 'render') {
      this.render(m.index, m.delay);
      return { cmd: 'rendered', index: m.index };
    }
    if (m.cmd === 'settings') {
      this.settings = m.settings;
      if (this.n && this.last.index >= 0) this.render(this.last.index, this.last.delay);
      return { cmd: 'rendered', index: this.last.index };
    }
    if (m.cmd === 'read') return this.read();
    if (m.cmd === 'compositeTest') return this.compositeTest(m);
    if (m.cmd === 'slitFrame') {
      this.slit.analysisFrame(m.index, m.frame);
      return this.slitStatus();
    }
    if (m.cmd === 'slitStatus') return this.slitStatus();
    if (m.cmd === 'edgeTest') {
      this.edge.forceMsPerAge = m.msPerAge || 0; // tests: a slow GPU
      this.edge.stats = { ms: 0, msPerAge: 0, limit: this.edge.H || 1, renders: 0 };
      return this.slitStatus();
    }
    if (m.cmd === 'plateGrab') return this.mask.grabYuv(m.frame);
    if (m.cmd === 'plateYuv') return this.rerender({ cmd: 'plate', ok: this.mask.setPlateYuv(m.Y, m.C) });
    if (m.cmd === 'plateImage') return this.rerender({ cmd: 'plate', ok: this.mask.setPlateImage(m.bitmap) !== false });
    if (m.cmd === 'plateFrame') return this.rerender({ cmd: 'plate', ok: this.mask.setPlateFrame(m.index) });
    if (m.cmd === 'matteStroke') return this.rerender((this.mask.stroke(m.points, m.size, m.hardness, m.mode), { cmd: 'matte' }));
    if (m.cmd === 'matteClear') return this.rerender((this.mask.clearMatte(), { cmd: 'matte' }));
    if (m.cmd === 'maskImportBegin') return (this.mask.beginImport(m.width, m.height, m.count), { cmd: 'import' });
    if (m.cmd === 'maskImportFrame') {
      try {
        this.mask.importFrame(m.i, m.frame, m.rotation);
      } finally {
        m.frame.close();
      }
      return { cmd: 'import' };
    }
    if (m.cmd === 'maskImportClear') return this.rerender((this.mask.clearImport(), { cmd: 'import' }));
    if (m.cmd === 'pick') return this.pick(m);
    if (m.cmd === 'matteGet') return this.mask.matteGet();
    if (m.cmd === 'matteSet') return this.rerender(this.mask.matteSet(m.bitmap));
    if (m.cmd === 'matteSetPixels') return this.rerender(this.mask.matteSetPixels(m.pixels, m.width, m.height));
    if (m.cmd === 'refine') {
      // The cutout overlay on the preview (while the matte is painted). Not in the export.
      this.refineView = !!m.on;
      return this.rerender({ cmd: 'refine', on: this.refineView });
    }
    if (m.cmd === 'exporting') {
      this.exporting = !!m.on;
      return { cmd: 'exporting', on: this.exporting };
    }
    if (m.cmd === 'readMask') return this.readMask(m.index);
    if (m.cmd === 'wrap') {
      // Perfect loop on / off (m.cap: the largest delay, the loop length − 1). forget: the store
      // indices change meaning: the store is empty for the shaders.
      this.depthCap = m.cap ?? Infinity;
      if (m.forget && this.layerFrame) {
        this.layerFrame.fill(-1);
        const gl = this.gl;
        gl.bindTexture(gl.TEXTURE_2D, this.layersTex);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.n, 1, gl.RED_INTEGER, gl.INT, this.layerFrame);
        this.last = { index: -1, delay: undefined };
      }
      return { cmd: 'wrap' };
    }
    if (m.cmd === 'alive') return { cmd: 'alive', lost: this.lost || this.gl.isContextLost() };
    if (m.cmd === 'loseContext') {
      // Tests: a GPU reset.
      const ext = this.gl.getExtension('WEBGL_lose_context');
      if (ext) ext.loseContext();
      return { cmd: 'lost', ok: !!ext };
    }
    if (m.cmd === 'mapImage') {
      const b = m.bitmap;
      const s = Math.min(1, 2048 / Math.max(b.width, b.height));
      const c = this.mapgen.beginCustom(Math.max(1, Math.round(b.width * s)), Math.max(1, Math.round(b.height * s)), 1);
      this.mapgen.putCustom(0, b, 0);
      b.close();
      return this.mapChanged(c);
    }
    if (m.cmd === 'mapVideoBegin') return this.mapChanged(this.mapgen.beginCustom(m.width, m.height, m.count));
    if (m.cmd === 'mapVideoFrame') {
      try {
        this.mapgen.putCustom(m.i, m.frame, m.rotation);
      } finally {
        m.frame.close();
      }
      return this.mapChanged(this.mapgen.custom);
    }
    if (m.cmd === 'mapClear') {
      this.mapgen.clearCustom();
      return this.mapChanged(null);
    }
    if (m.cmd === 'thumbs') return { cmd: 'thumbs', images: this.mapgen.thumbs(m.maps, m.t, m.width, m.height) };
    return null;
  }

  // Make the store for the working size. The budget halves until the allocation works (plan §6.4).
  configure(m) {
    const gl = this.gl;
    const { width: w, height: h } = m;
    this.w = w;
    this.h = h;
    this.rot = m.rotation || 0;
    this.canvas.width = w;
    this.canvas.height = h;
    let budget = m.budget;
    let fails = m.failAlloc || 0; // tests: act as if the first allocations ran out of memory
    for (;;) {
      this.free();
      const n = layerCount(budget, this.caps.maxLayers, w, h);
      while (gl.getError() !== gl.NO_ERROR) { /* clear old errors */ }
      this.storeY = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, n);
      texParams(gl, gl.TEXTURE_2D_ARRAY);
      this.storeC = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, n);
      texParams(gl, gl.TEXTURE_2D_ARRAY);
      // Touch the last layer, so that the driver must commit the memory now.
      this.n = n;
      this.clearLayer(n - 1);
      const err = gl.getError();
      const failed = fails > 0 || err === gl.OUT_OF_MEMORY || gl.isContextLost();
      if (!failed) break;
      fails--;
      if (n === 1 || gl.isContextLost()) {
        if (gl.isContextLost()) throw new Error('The GPU context was lost.');
        break;
      }
      budget = Math.floor(budget / 2);
    }
    this.layerFrame = new Int32Array(this.n).fill(-1);
    this.last = { index: -1, delay: undefined };
    // The frame index of each layer, for the shaders (R32I, N x 1).
    if (this.layersTex) gl.deleteTexture(this.layersTex);
    this.layersTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.layersTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32I, this.n, 1, 0, gl.RED_INTEGER, gl.INT, this.layerFrame);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    // The map (R32F when float targets exist, so long delays keep their precision; else RGBA8).
    if (this.mapTex) gl.deleteTexture(this.mapTex);
    this.mapTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.mapTex);
    if (this.caps.floatTargets) gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R32F, w, h);
    else gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
    texParams(gl, gl.TEXTURE_2D, gl.NEAREST);
    this.mapKey = '';
    const slit = this.slit.configure(w, h, m.frames || 1);
    this.mask.configure(w, h);
    this.edge.configure(w, h, m.frames || 1);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { cmd: 'configured', n: this.n, budget, bytes: this.n * frameBytes(w, h), rows: slit.rows, edgeRows: this.edge.H || 0, plate: this.mask.hasPlate };
  }

  free() {
    const gl = this.gl;
    if (this.storeY) gl.deleteTexture(this.storeY);
    if (this.storeC) gl.deleteTexture(this.storeC);
    this.storeY = this.storeC = null;
  }

  target(tex, layer, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex, 0, layer);
    gl.viewport(0, 0, w, h);
  }

  clearLayer(layer) {
    const gl = this.gl;
    this.target(this.storeY, layer, this.w, this.h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    this.target(this.storeC, layer, this.w / 2, this.h / 2);
    gl.clearColor(0.5, 0.5, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // Convert a VideoFrame (turned, scaled to the working size) to YUV in layer `layer` of the arrays
  // Y and C (plan §6.3), then close it.
  putYuv(frame, Y, C, layer) {
    const gl = this.gl;
    try {
      gl.activeTexture(gl.TEXTURE0);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      // A large source: mipmaps, so the scale down does not alias.
      const turned = this.rot % 180 !== 0;
      const fw = frame.displayWidth, fh = frame.displayHeight;
      const sw = turned ? fh : fw;
      const mip = sw > 2 * this.w;
      // The source texture is made once for each frame size (immutable storage), then each frame
      // goes into it: no new texture memory for each frame (WebKit keeps the old memory for a while,
      // and a long playback ran out of memory on iPad).
      const key = `${fw}x${fh}x${mip ? 1 : 0}`;
      if (this.srcKey !== key) {
        if (this.src) gl.deleteTexture(this.src);
        this.src = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, this.src);
        gl.texStorage2D(gl.TEXTURE_2D, mip ? Math.floor(Math.log2(Math.max(fw, fh))) + 1 : 1, gl.RGBA8, fw, fh);
        this.srcKey = key;
      } else gl.bindTexture(gl.TEXTURE_2D, this.src);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, fw, fh, gl.RGBA, gl.UNSIGNED_BYTE, frame);
      if (mip) gl.generateMipmap(gl.TEXTURE_2D);
      texParams(gl, gl.TEXTURE_2D, gl.LINEAR, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    } finally {
      frame.close();
    }
    gl.useProgram(this.upload.prog);
    gl.uniform1i(this.upload.u.u_src, 0);
    gl.uniform1i(this.upload.u.u_rot, this.rot);
    gl.uniform1i(this.upload.u.u_mode, 0);
    this.target(Y, layer, this.w, this.h);
    drawQuad(gl);
    gl.uniform1i(this.upload.u.u_mode, 1);
    this.target(C, layer, this.w / 2, this.h / 2);
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // Upload a VideoFrame into layer index mod N of the store (and its slit history row in Mode 2).
  put(index, frame) {
    const gl = this.gl;
    const layer = index % this.n;
    this.putYuv(frame, this.storeY, this.storeC, layer);
    this.layerFrame[layer] = index;
    if (this.settings && isDynamic(this.settings.map)) this.mapKey = ''; // self / motion read the store
    gl.bindTexture(gl.TEXTURE_2D, this.layersTex);
    this.one[0] = index;
    gl.texSubImage2D(gl.TEXTURE_2D, 0, layer, 0, 1, 1, gl.RED_INTEGER, gl.INT, this.one);
    if (this.edgeActive()) {
      this.edge.update();
      this.edge.addFrame(index, { Y: this.storeY, C: this.storeC, layer });
    } else if (this.slit.active()) {
      this.slit.update();
      this.slit.writeRow(index, this.storeY, this.storeC, layer);
    }
  }

  // Mode 2 with the Subject edge source (or Scan object), when the GPU has float targets.
  edgeActive() {
    const s = this.settings;
    return !!(s && s.mode === 'slitscan' && (s.slitscan.source === 'edge' || s.cutout.mode === 'scan') && this.edge.tex);
  }

  slitStatus() {
    const ed = this.edge;
    return {
      cmd: 'slit', filled: this.slit.filled(), rows: this.slit.H,
      edge: ed.tex ? { filled: ed.filled(), rows: ed.H, ms: ed.stats.ms, msPerAge: ed.stats.msPerAge, limit: ed.stats.limit, maxAge: ed.M } : null,
    };
  }

  // The cutout mask is needed: Cutout on, the Mask view, or a map that uses it.
  maskNeeded() {
    const s = this.settings;
    if (s.mode === 'datamosh') return false; // the source frame only
    return s.cutout.mode !== 'off' || s.view === 'mask' || (s.mode === 'timemap' && usesMask(s.map));
  }

  // Render the last frame again (after a change of the cutout inputs), then give the reply.
  rerender(reply) {
    if (this.n && this.last.index >= 0) this.render(this.last.index, this.last.delay);
    return reply;
  }

  // The luma of a picture (ImageBitmap or VideoFrame), turned, into layer i (w x h) of an R8 array.
  lumaInto(tex, i, w, h, source, rotation) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.src2);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.generateMipmap(gl.TEXTURE_2D);
    texParams(gl, gl.TEXTURE_2D, gl.LINEAR, gl.LINEAR_MIPMAP_LINEAR);
    gl.useProgram(this.upload.prog);
    gl.uniform1i(this.upload.u.u_src, 0);
    gl.uniform1i(this.upload.u.u_rot, rotation || 0);
    gl.uniform1i(this.upload.u.u_mode, 0);
    this.target(tex, i, w, h);
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // The colour of stored frame index at (u, v) (0..1 of the picture), for the eyedropper.
  pick(m) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.w, this.h);
    gl.useProgram(this.show.prog);
    this.bindStore(this.show);
    gl.uniform1f(this.show.u.u_layer, this.layerOf(m.index));
    drawQuad(gl);
    const x = Math.min(this.w - 1, Math.max(0, Math.floor(m.u * this.w)));
    const y = Math.min(this.h - 1, Math.max(0, Math.floor(m.v * this.h)));
    const px = new Uint8Array(4);
    gl.readPixels(x, this.h - 1 - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    this.rerender(null);
    return { cmd: 'color', rgb: [px[0], px[1], px[2]] };
  }

  // Tests: the final mask of frame index (bytes, the first row at the top).
  readMask(index) {
    const gl = this.gl;
    this.mask.update(index); // a no-op when the mask of index is there (it keeps the temporal state)
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.mask.tex.out, 0);
    const px = new Uint8Array(this.w * this.h * 4);
    gl.readPixels(0, 0, this.w, this.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const out = new Uint8Array(this.w * this.h);
    for (let i = 0; i < out.length; i++) out[i] = px[i * 4];
    return { cmd: 'mask', width: this.w, height: this.h, pixels: out };
  }

  mapChanged(c) {
    this.mapKey = '';
    return { cmd: 'map', ...(c ? { w: c.w, h: c.h, count: c.count, layers: c.layers } : { count: 0 }) };
  }

  // The map of frame t: rendered again when its settings change, and for each frame when it is
  // dynamic (animation, self, motion, video map).
  updateMap(t) {
    if (!this.settings) return;
    const map = this.settings.map;
    // The text of the map settings is made once for each settings object (not for each frame).
    const mj = this.mapJson;
    if (mj.map !== map) {
      mj.map = map;
      mj.text = JSON.stringify(map);
    }
    const key = mj.text + (isDynamic(map) ? `@${t}` : '') + (usesMask(map) ? this.mask.key : '');
    if (key === this.mapKey) return;
    this.mapgen.run(map, t, this.mapTex, this.w, this.h);
    this.mapKey = key;
  }

  // The layer of frame t, or -1 when it is not in the store (or t < 0).
  layerOf(t) {
    if (t < 0 || !this.n) return -1;
    const l = t % this.n;
    return this.layerFrame[l] === t ? l : -1;
  }

  bindStore(prog) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);
    gl.uniform1i(prog.u.u_storeY, 1);
    gl.uniform1i(prog.u.u_storeC, 2);
  }

    gl.uniform1i(p.u.u_view, VIEWS[s.view] ?? 0);
    this.compositeUniforms(p, s, Math.min(s.timemap.maxDelay, this.n - 1, this.depthCap));

    const a = (L.offsetAngle * Math.PI) / 180;
    gl.uniform2f(p.u.u_shift, (L.offset * Math.cos(a)) / this.w, (L.offset * Math.sin(a)) / this.h);

  compositeUniforms(p, s, maxAge) {

    gl.bindTexture(gl.TEXTURE_2D, this.decayTex);
    gl.uniform1i(p.u.u_decayCurve, 6);

    gl.uniform1i(p.u.u_tintOn, L.tint && tint.length >= 2 ? 1 : 0);

      gl.bindTexture(gl.TEXTURE_2D, t);

      full.set(data);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, full);
      texParams(gl, gl.TEXTURE_2D, gl.NEAREST);

    const out = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, out);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, out, 0);

    gl.useProgram(p.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tb);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, ts);
    gl.uniform1i(p.u.u_b, 0);
    gl.uniform1i(p.u.u_s, 1);

    gl.uniform1i(p.u.u_linear, m.linear ? 1 : 0);

    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    for (const t of [tb, ts, out]) gl.deleteTexture(t);
    return { cmd: 'pixels', pixels: px.subarray(0, n * 4) };
  }

  read() {
    const gl = this.gl;
    this.render(this.last.index, this.last.delay);
    const pixels = new Uint8Array(this.w * this.h * 4);
    gl.readPixels(0, 0, this.w, this.h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    return { cmd: 'pixels', width: this.w, height: this.h, pixels };

// ---- app/mosh.js
const { MOSH_SIZES, MOSH_RATES, MOSH_LOOK, MOSH_DEFAULTS, moshSize, Mosh } = (() => {
// Mode 3, Datamosh (from neomosh, file source only): the page side. The codec runs in the mosh
// worker (src/mosh/mosh-worker.js), which also keeps the session. Here: the session state for the UI,
// the mosh picture on a canvas over the preview, the record / bloom controls, and the export dialog.
//
// A session is a list of clips. Each clip is recorded from the open video, from the playhead. The
// first frame of a new clip is a hidden I-frame (a cut): it is not shown, so the P-frames of the new
// clip move the last picture of the clip before. Open another video at a pause point to mosh into it.



const MOSH_SIZES = [360, 480, 720, 1080];
const MOSH_RATES = [15, 24, 30];
const MOSH_LOOK = { qp: 30, searchRange: 32, precision: 'quarter', skipBias: 50, heal: 'low', denoise: 'low' }; // neomosh DEFAULT_SETTINGS
const MOSH_DEFAULTS = { size: 480, fps: 30, ...MOSH_LOOK, guide: 0.5, preview: true };

// The picture size of a session: the shape of the source, `short` px on the short side (never above
// the source), even numbers, at most 1920 px on the long side.
function moshSize(w, h, short) {
  const s = Math.min(1, short / Math.min(w, h), 1920 / Math.max(w, h));
  const even = (v) => Math.max(16, Math.round((v * s) / 2) * 2);
  return { w: even(w), h: even(h) };
}

const lookOf = (m) => ({ qp: Math.round(m.qp), searchRange: Number(m.searchRange), precision: m.precision, skipBias: Math.round(m.skipBias), heal: m.heal, denoise: m.denoise });

const clock = (us) => {
  const ds = Math.floor(Math.max(0, us) / 100000);
  return `${Math.floor(ds / 600)}:${String(Math.floor(ds / 10) % 60).padStart(2, '0')}.${ds % 10}`;
};

const el = (tag, attrs = {}, text) => {
  const e = Object.assign(document.createElement(tag), attrs);
  if (text !== undefined) e.textContent = text;
  return e;
};

class Mosh {
  // app: { workerSrc, canvas, bar, dialog, settings (the live settings object), player, file(), info(),
  //        message(text), changed() (the session changed: build the inspector again), playhead(us)
  //        (the file time while recording), seekSource(us, ended) (after a clip) }
  constructor(app) {
    this.app = app;
    this.wk = null;
    this.state = 'idle'; // 'idle' | 'recording' | 'blooming' | 'playing'
    this.session = null; // { w, h, fps, frames, durationUs, bytes, cuts, points, canBloom }
    this.thumbs = []; // an ImageBitmap for each pause point
    this.lookUs = null; // the session time on the view (History), or null: the last picture
    this.waiters = {};
    this.ctx = app.canvas.getContext('2d');
    this.hasPicture = false;
    this.exporting = false;
    const b = app.bar;
    this.recBtn = b.querySelector('[data-act="rec"]');
    this.bloomBtn = b.querySelector('[data-act="bloom"]');
    this.infoEl = b.querySelector('.moshInfo');
    this.recBtn.addEventListener('click', () => this.toggle());
    // Bloom: while the button is held.
    const down = (e) => {
      e.preventDefault();
      this.bloom(true);
    };
    const up = () => this.bloom(false);
    this.bloomBtn.addEventListener('pointerdown', down);
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) this.bloomBtn.addEventListener(ev, up);
    this.update();
  }

  get on() {
    return this.app.settings.mode === 'datamosh';
  }

  get busy() {
    return this.state !== 'idle';
  }

  get frames() {
    return this.session ? this.session.frames : 0;
  }

  once(cmd) {
    return new Promise((resolve) => (this.waiters[cmd] = this.waiters[cmd] || []).push(resolve));

  // The worker and an empty session for the settings and the open video. With frames in the session,
  // its size and frame rate stay.
  async ensure() {

    if (!info) return false;
    const M = this.app.settings.mosh;
    const size = moshSize(info.width, info.height, Number(M.size));
    const fps = Number(M.fps);
    const s = this.session;
    if (this.wk && s && (s.frames > 0 || (s.w === size.w && s.h === size.h && s.fps === fps))) return true;
    if (!this.wk) {

      this.wk.onerror = (e) => {

  close() {

    this.wk = null;
    this.session = null;
    for (const t of this.thumbs) if (t && t.close) t.close();
    this.thumbs = [];
    this.state = 'idle';
    this.hasPicture = false;
    for (const list of Object.values(this.waiters)) for (const r of list) r(null);
    this.waiters = {};
