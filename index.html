<!-- neofx v0.1.0 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<title>neofx</title>
<style>
:root{
  --bg:#111214;
  --panel:#1a1b1e;
  --line:#2a2c30;
  --text:#e6e6e6;
  --dim:#8b8d92;
  --accent:#4fd1c5;
  --warn:#f5a524;
  --top:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:6px;
  min-height:32px;padding:0 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#app{display:grid;grid-template-rows:var(--top) 1fr auto;grid-template-columns:minmax(0,1fr);height:100%}
#topBar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#logo{font-weight:700;letter-spacing:.02em;margin-right:8px}
.spacer{flex:1}
#status{min-width:0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#exportBtn{background:var(--accent);color:#000}
#stage{display:grid;grid-template-columns:1fr 340px;min-height:0}
#preview{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:#000}
#inspector{border-left:1px solid var(--line);background:var(--panel);overflow:auto}
#transport{min-height:48px;border-top:1px solid var(--line);background:var(--panel)}
#startScreen{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;max-width:520px;width:100%}
#dropArea{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:40px 16px;
  border:2px dashed var(--line);border-radius:12px;cursor:pointer;text-align:center}
#dropArea span{color:var(--dim)}
body.drag #dropArea{border-color:var(--accent)}
#modeInfo{display:grid;gap:8px;color:var(--dim)}
#modeInfo b{color:var(--text)}
#message{position:absolute;inset:auto 16px 16px;padding:12px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--warn)}
body:not([data-state="start"]) #startScreen{display:none}
@media (max-width:999px){
  #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(200px,1fr) auto}
  #inspector{border-left:0;border-top:1px solid var(--line);max-height:45vh}
  button{min-height:44px}
}
#view{display:block;image-rendering:auto}
#transport{display:grid;gap:6px;padding:6px 12px 10px}
#transport .controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#transport .controls button{min-width:40px}
#transport .controls button.on{background:var(--accent);color:#000}
#transport .time,#transport .frame{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
#transport .frame{min-width:64px}
#transport .res{color:var(--dim);font-size:12px}
#transport select{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:6px;min-height:32px}
#transport .strip{display:block;width:100%;height:44px;border-radius:4px;touch-action:none;cursor:pointer}
body[data-state="start"] #transport .controls,body[data-state="start"] #transport .strip{opacity:.4;pointer-events:none}
#status.warn{color:var(--warn)}
#progress{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0}
</style>
</head>
<body data-state="start">
<div id="app">
  <header id="topBar">
    <span id="logo">neofx</span>
    <button id="openBtn" type="button">Open</button>
    <span class="spacer"></span>
    <span id="status" aria-live="polite"></span>
    <button id="exportBtn" type="button" disabled>Export</button>
  </header>

  <main id="stage">
    <section id="preview" aria-label="Preview">
      <div id="startScreen">
        <label id="dropArea" for="fileInput">
          <strong>Open a video (MP4 or MOV)</strong>
          <span>Drop a file here, or touch to select one.</span>
        </label>
        <div id="modeInfo">
          <div><b>Time Map</b> — a greyscale map gives each pixel a delay in frames.</div>
          <div><b>Slit Scan</b> — a 1 px line repeats in one direction, and gets older with distance.</div>
        </div>
      </div>
      <canvas id="view" hidden></canvas>
      <div id="progress" hidden></div>
      <div id="message" hidden></div>
    </section>
    <aside id="inspector" aria-label="Inspector"></aside>
  </main>

  <footer id="transport">
    <div class="controls">
      <button type="button" data-act="first" aria-label="Go to start">⏮</button>
      <button type="button" data-act="prev" aria-label="Previous frame">◀|</button>
      <button type="button" data-act="play" aria-label="Play">▶</button>
      <button type="button" data-act="next" aria-label="Next frame">|▶</button>
      <button type="button" data-act="last" aria-label="Go to end">⏭</button>
      <span class="time">00:00.00 / 00:00.00</span>
      <span class="frame">f –</span>
      <span class="spacer"></span>
      <button type="button" data-act="in" aria-label="Set In point">In</button>
      <button type="button" data-act="out" aria-label="Set Out point">Out</button>
      <button type="button" data-act="loop" aria-label="Loop">Loop</button>
      <label class="res">Preview <select id="resSelect">
        <option value="360">360p</option><option value="540" selected>540p</option><option value="720">720p</option><option value="1080">1080p</option><option value="0">Source</option>
      </select></label>
    </div>
    <canvas class="strip" aria-label="Timeline"></canvas>
  </footer>
  <input id="fileInput" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" hidden>
</div>
<script>
'use strict';
// ---- gpu/store.js
const { MAX_STORE_LAYERS, BUDGET_DESKTOP, BUDGET_ANDROID, workingSize, frameBytes, defaultBudget, layerCount, bufferText } = (() => {
// Frame store sizes (plan §6.3, §6.4). No browser APIs, so Node tests can use it.

const MAX_STORE_LAYERS = 1000;
const BUDGET_DESKTOP = 1024 * 1048576;
const BUDGET_ANDROID = 384 * 1048576;

// The working size for a display size and a short side (0 = source). Never above the source. Even.
function workingSize(w, h, short) {
  const s = short ? Math.min(1, short / Math.min(w, h)) : 1;
  return { width: Math.max(2, Math.round((w * s) / 2) * 2), height: Math.max(2, Math.round((h * s) / 2) * 2) };
}

// YUV 4:2:0 in the store: Y (R8, full size) + CbCr (RG8, half size) = 1.5 bytes for each pixel.
const frameBytes = (w, h) => w * h + 2 * (w / 2) * (h / 2);

const defaultBudget = (userAgent = '') => (/Android/i.test(userAgent) ? BUDGET_ANDROID : BUDGET_DESKTOP);

// N = min(MAX_ARRAY_TEXTURE_LAYERS, floor(budget / bytesPerFrame), 1000), at least 1.
function layerCount(budget, maxLayers, w, h) {
  return Math.max(1, Math.min(maxLayers, Math.floor(budget / frameBytes(w, h)), MAX_STORE_LAYERS));
}

// "Buffer: 240 frames at 540p (≈ 330 MB)".
function bufferText(n, w, h) {
  return `Buffer: ${n} frames at ${Math.min(w, h)}p (≈ ${Math.round((n * frameBytes(w, h)) / 1048576)} MB)`;
}

return { MAX_STORE_LAYERS, BUDGET_DESKTOP, BUDGET_ANDROID, workingSize, frameBytes, defaultBudget, layerCount, bufferText };
})();

// ---- gpu/gl.js
const { createContext, program, texParams, drawQuad } = (() => {
// WebGL2 helpers (plan §5.3): context, programs, textures.

function createContext(canvas) {
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('This browser has no WebGL2.');
  return gl;
}

function shader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
    const log = gl.getShaderInfoLog(s);
    throw new Error(`Shader: ${log}`);
  }
  return s;
}

// A program with its uniform locations: { prog, u: { name: location } }.
function program(gl, vert, frag) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl, gl.VERTEX_SHADER, vert));
  gl.attachShader(p, shader(gl, gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error(`Program: ${gl.getProgramInfoLog(p)}`);
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) || 0;
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { prog: p, u };
}

function texParams(gl, target, filter = gl.LINEAR, minFilter = filter) {
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, minFilter);
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(target, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// Draw the one-triangle quad (quad.vert) into the bound target.
function drawQuad(gl) {
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

return { createContext, program, texParams, drawQuad };
})();

// ---- gpu/engine.js
const { Engine } = (() => {
// The GPU engine (plan §5.1, §6.3, §6.4). It owns the WebGL2 context of the preview canvas and the
// frame store. It runs in the GPU worker (OffscreenCanvas), or on the main thread as the fallback.
//
// handle(msg) -> a reply object (or null). Messages:
//   { cmd: 'configure', width, height, rotation, budget, failAlloc } -> { cmd: 'configured', n, budget, bytes }
//   { cmd: 'upload', index, frame, show }  put the frame into the store; show: render it  -> { cmd: 'uploaded', index }
//   { cmd: 'render', index, delay }        render frame index - delay from the store      -> { cmd: 'rendered', index }
//   { cmd: 'read' }                        render again and read the canvas (tests)         -> { cmd: 'pixels', width, height, pixels }
//   { cmd: 'caps' }                                                                         -> { cmd: 'caps', ... }




const QUAD_VERT = "#version 300 es\n// One triangle that covers the target. v_uv: 0..1, v = 0 at the first row (image top, in texture space).\nout vec2 v_uv;\nvoid main() {\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n  v_uv = p;\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}\n";
const UPLOAD_FRAG = "#version 300 es\n// Store upload (plan §6.3): the source frame (RGB, as the browser gives it), turned to the display\n// orientation and scaled to the working size, to BT.709 full-range Y (u_mode 0) or CbCr (u_mode 1).\nprecision highp float;\nuniform sampler2D u_src;\nuniform int u_rot;   // 0, 90, 180, 270: clockwise turn of the display picture\nuniform int u_mode;\nin vec2 v_uv;\nout vec4 o;\n\nvec2 srcUv(vec2 d) {\n  if (u_rot == 90) return vec2(d.y, 1.0 - d.x);\n  if (u_rot == 180) return vec2(1.0 - d.x, 1.0 - d.y);\n  if (u_rot == 270) return vec2(1.0 - d.y, d.x);\n  return d;\n}\n\nvoid main() {\n  vec3 c = texture(u_src, srcUv(v_uv)).rgb;\n  float y = dot(c, vec3(0.2126, 0.7152, 0.0722));\n  if (u_mode == 0) o = vec4(y, 0.0, 0.0, 1.0);\n  else o = vec4((c.b - y) / 1.8556 + 0.5, (c.r - y) / 1.5748 + 0.5, 0.0, 1.0);\n}\n";
const STORE_GLSL = "// Read the frame store (plan §6.3): Y and CbCr layers -> RGB (BT.709 full range).\nuniform highp sampler2DArray u_storeY;\nuniform highp sampler2DArray u_storeC;\n\nvec3 storeRgb(vec2 uv, float layer) {\n  float y = texture(u_storeY, vec3(uv, layer)).r;\n  vec2 c = texture(u_storeC, vec3(uv, layer)).rg - 0.5;\n  return clamp(vec3(y + 1.5748 * c.y, y - 0.187324 * c.x - 0.468124 * c.y, y + 1.8556 * c.x), 0.0, 1.0);\n}\n";
const SHOW_FRAG = "// Preview of one stored frame (Original view; the debug delay view of phase 3). u_layer < 0: black\n// (the frame is not in the store, or it is before frame 0: \"not online\", D8).\nuniform float u_layer;\nin vec2 v_uv;\nout vec4 o;\n\nvoid main() {\n  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y); // the canvas has its first row at the bottom\n  o = u_layer < 0.0 ? vec4(0.0, 0.0, 0.0, 1.0) : vec4(storeRgb(uv, u_layer), 1.0);\n}\n";

class Engine {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = (this.gl = createContext(canvas));
    this.caps = {
      maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
      maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
      floatTargets: !!gl.getExtension('EXT_color_buffer_float'),
    };
    this.upload = program(gl, QUAD_VERT, UPLOAD_FRAG);
    this.show = program(gl, QUAD_VERT, `#version 300 es\nprecision highp float;\n${STORE_GLSL}\n${SHOW_FRAG}`);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    this.src = gl.createTexture();
    this.fb = gl.createFramebuffer();
    this.storeY = this.storeC = null;
    this.n = 0;
    this.layerFrame = null; // the frame index in each layer, -1 = empty
    this.last = { index: -1, delay: 0 };
    this.lost = false;
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      this.lost = true;
    });
  }

  handle(m) {
    if (m.cmd === 'caps') return { cmd: 'caps', ...this.caps };
    if (m.cmd === 'configure') return this.configure(m);
    if (m.cmd === 'upload') {
      this.put(m.index, m.frame);
      if (m.show) this.render(m.index, 0);
      return { cmd: 'uploaded', index: m.index };
    }
    if (m.cmd === 'render') {
      this.render(m.index, m.delay || 0);
      return { cmd: 'rendered', index: m.index };
    }
    if (m.cmd === 'read') return this.read();
    return null;
  }

  // Make the store for the working size. The budget halves until the allocation works (plan §6.4).
  configure(m) {
    const gl = this.gl;
    const { width: w, height: h } = m;
    this.w = w;
    this.h = h;
    this.rot = m.rotation || 0;
    this.canvas.width = w;
    this.canvas.height = h;
    let budget = m.budget;
    let fails = m.failAlloc || 0; // tests: act as if the first allocations ran out of memory
    for (;;) {
      this.free();
      const n = layerCount(budget, this.caps.maxLayers, w, h);
      while (gl.getError() !== gl.NO_ERROR) { /* clear old errors */ }
      this.storeY = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, n);
      texParams(gl, gl.TEXTURE_2D_ARRAY);
      this.storeC = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, n);
      texParams(gl, gl.TEXTURE_2D_ARRAY);
      // Touch the last layer, so that the driver must commit the memory now.
      this.n = n;
      this.clearLayer(n - 1);
      const err = gl.getError();
      const failed = fails > 0 || err === gl.OUT_OF_MEMORY || gl.isContextLost();
      if (!failed) break;
      fails--;
      if (n === 1 || gl.isContextLost()) {
        if (gl.isContextLost()) throw new Error('The GPU context was lost.');
        break;
      }
      budget = Math.floor(budget / 2);
    }
    this.layerFrame = new Int32Array(this.n).fill(-1);
    this.last = { index: -1, delay: 0 };
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { cmd: 'configured', n: this.n, budget, bytes: this.n * frameBytes(w, h) };
  }

  free() {
    const gl = this.gl;
    if (this.storeY) gl.deleteTexture(this.storeY);
    if (this.storeC) gl.deleteTexture(this.storeC);
    this.storeY = this.storeC = null;
  }

  target(tex, layer, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex, 0, layer);
    gl.viewport(0, 0, w, h);
  }

  clearLayer(layer) {
    const gl = this.gl;
    this.target(this.storeY, layer, this.w, this.h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    this.target(this.storeC, layer, this.w / 2, this.h / 2);
    gl.clearColor(0.5, 0.5, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // Upload a VideoFrame into layer index mod N (plan §6.3), then close it.
  put(index, frame) {
    const gl = this.gl;
    try {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.src);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, frame);
      // A large source: mipmaps, so the scale down does not alias.
      const turned = this.rot % 180 !== 0;
      const sw = turned ? frame.displayHeight : frame.displayWidth;
      const mip = sw > 2 * this.w;
      if (mip) gl.generateMipmap(gl.TEXTURE_2D);
      texParams(gl, gl.TEXTURE_2D, gl.LINEAR, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    } finally {
      frame.close();
    }
    const layer = index % this.n;
    gl.useProgram(this.upload.prog);
    gl.uniform1i(this.upload.u.u_src, 0);
    gl.uniform1i(this.upload.u.u_rot, this.rot);
    gl.uniform1i(this.upload.u.u_mode, 0);
    this.target(this.storeY, layer, this.w, this.h);
    drawQuad(gl);
    gl.uniform1i(this.upload.u.u_mode, 1);
    this.target(this.storeC, layer, this.w / 2, this.h / 2);
    drawQuad(gl);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.layerFrame[layer] = index;
  }

  // The layer of frame t, or -1 when it is not in the store (or t < 0).
  layerOf(t) {
    if (t < 0 || !this.n) return -1;
    const l = t % this.n;
    return this.layerFrame[l] === t ? l : -1;
  }

  render(index, delay) {
    const gl = this.gl;
    this.last = { index, delay };
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.w, this.h);
    gl.useProgram(this.show.prog);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);
    gl.uniform1i(this.show.u.u_storeY, 1);
    gl.uniform1i(this.show.u.u_storeC, 2);
    gl.uniform1f(this.show.u.u_layer, this.layerOf(index - delay));
    drawQuad(gl);
  }

  read() {
    const gl = this.gl;
    this.render(this.last.index, this.last.delay);
    const pixels = new Uint8Array(this.w * this.h * 4);
    gl.readPixels(0, 0, this.w, this.h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    return { cmd: 'pixels', width: this.w, height: this.h, pixels };
  }
}

return { Engine };
})();

// ---- app/platform.js
const { checkPlatform } = (() => {
// Platform checks at startup (plan §4). Each check gives { ok, fatal, message }.

async function checkPlatform() {
  const out = { ok: true, fatal: null, notes: [], gl: null };
  let gl = null;
  try {
    gl = document.createElement('canvas').getContext('webgl2');
  } catch {
    gl = null;
  }
  if (!gl) {
    out.ok = false;
    out.fatal = 'This browser has no WebGL2.';
    return out;
  }
  const floatTargets = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
  if (!floatTargets) out.notes.push('No float render targets: some modes lose precision.');
  out.gl = {
    floatTargets,
    maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
    maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  };
  const lose = gl.getExtension('WEBGL_lose_context');
  if (lose) lose.loseContext();
  if (typeof VideoDecoder === 'undefined') {
    out.ok = false;
    out.fatal = 'This browser cannot decode video (no WebCodecs VideoDecoder).';
    return out;
  }
  out.encoder = typeof VideoEncoder !== 'undefined';
  if (!out.encoder) out.notes.push('No H.264 encoder: export is disabled.');
  out.offscreen = typeof OffscreenCanvas !== 'undefined' && (() => {
    try {
      return !!new OffscreenCanvas(1, 1).getContext('webgl2');
    } catch {
      return false;
    }
  })();
  return out;
}

return { checkPlatform };
})();

// ---- app/player.js
const { makeWorker, Player } = (() => {
// The player (plan §6.2, §12.8): one decode worker for the preview, one for the timeline thumbnails.
// Each decoded frame goes into the frame store of the GPU engine (also the warm-up frames and the
// frames that playback drops), so the store always holds the frames before the playhead. A seek
// decodes only the frames of max(0, t - depth) .. t that are not in the store.

function makeWorker(src) {
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const wk = new Worker(url);
  URL.revokeObjectURL(url);
  return wk;
}

// opts: {
//   consume(index, frame, show) -> Promise: put the frame into the store (show: also render it).
//     It must send the frame on at once (the order of the calls is the store order).
//   render(index) -> Promise: render a frame that is in the store.
//   onState(player), onThumb(i, index, bitmap), onError(message), onProgress(fraction | null) }
class Player {
  constructor(workerSrc, opts) {
    this.src = workerSrc;
    this.opts = opts;
    this.wk = null;
    this.thumbWk = null;
    this.info = null;
    this.job = 0;
    this.current = -1; // the frame index on the preview
    this.playing = false;
    this.loop = false;
    this.inPoint = null;
    this.outPoint = null;
    this.depth = 0; // frames of history that the effect needs (Mode 1: Max delay)
    this.n = 0; // store layers
    this.have = new Int32Array(0); // the frame index in each store layer (mirror of the engine)
    this.busy = false; // a seek runs
    this.pendingSeek = null;
    this.queue = []; // playback: decoded frames, in display order

const { GpuClient } = (() => {
// The page side of the GPU engine: the GPU worker when the browser has OffscreenCanvas with WebGL2,
// else the engine on the main thread (plan §4 fallback). call(msg) -> Promise of the reply. The
// replies come in the order of the calls.

    });
  }

    this.update();
  }

  reset() {
    this.thumbs = [];
    this.update();
  }

  addThumb(i, index, bitmap) {

    this.draw();
  }

  update() {
    const P = this.player;
    const info = P.info;
    const t = Math.max(0, P.current);

    this.$('[data-act=out]').classList.toggle('on', P.outPoint !== null);
    this.$('.time').textContent = info ? `${formatTime(info.times[t])} / ${formatTime(info.durationUs)}` : '00:00.00 / 00:00.00';
    this.$('.frame').textContent = info ? `f ${t}` : 'f –';

  draw() {

    for (let i = 0; i < this.thumbs.length; i++) {

      ctx.drawImage(b, (b.width - sw) / 2, (b.height - sh) / 2, sw, sh, i * tw, 0, Math.ceil(tw), h);
    }

      ctx.fillRect(x(b), 0, w - x(b), h);

      ctx.fillRect(x(a) - dpr, 0, 2 * dpr, h);

    ctx.fillRect(x(Math.max(0, P.current)) - dpr, 0, 2 * dpr, h);
  }
}

return { formatTime, Timeline };

d === 'read') return this.read();\n    return null;\n  }\n\n  // Make the store for the working size. The budget halves until the allocation works (plan §6.4).\n  configure(m) {\n    const gl = this.gl;\n    const { width: w, height: h } = m;\n    this.w = w;\n    this.h = h;\n    this.rot = m.rotation || 0;\n    this.canvas.width = w;\n    this.canvas.height = h;\n    let budget = m.budget;\n    let fails = m.failAlloc || 0; // tests: act as if the first allocations ran out of memory\n    for (;;) {\n      this.free();\n      const n = layerCount(budget, this.caps.maxLayers, w, h);\n      while (gl.getError() !== gl.NO_ERROR) { /* clear old errors */ }\n      this.storeY = gl.createTexture();\n      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);\n      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R8, w, h, n);\n      texParams(gl, gl.TEXTURE_2D_ARRAY);\n      this.storeC = gl.createTexture();\n      gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);\n      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w / 2, h / 2, n);\n      texParams(gl, gl.TEXTURE_2D_ARRAY);\n      // Touch the last layer, so that the driver must commit the memory now.\n      this.n = n;\n      this.clearLayer(n - 1);\n      const err = gl.getError();\n      const failed = fails > 0 || err === gl.OUT_OF_MEMORY || gl.isContextLost();\n      if (!failed) break;\n      fails--;\n      if (n === 1 || gl.isContextLost()) {\n        if (gl.isContextLost()) throw new Error('The GPU context was lost.');\n        break;\n      }\n      budget = Math.floor(budget / 2);\n    }\n    this.layerFrame = new Int32Array(this.n).fill(-1);\n    this.last = { index: -1, delay: 0 };\n    gl.viewport(0, 0, w, h);\n    gl.clearColor(0, 0, 0, 1);\n    gl.clear(gl.COLOR_BUFFER_BIT);\n    return { cmd: 'configured', n: this.n, budget, bytes: this.n * frameBytes(w, h) };\n  }\n\n  free() {\n    const gl = this.gl;\n    if (this.storeY) gl.deleteTexture(this.storeY);\n    if (this.storeC) gl.deleteTexture(this.storeC);\n    this.storeY = this.storeC = null;\n  }\n\n  target(tex, layer, w, h) {\n    const gl = this.gl;\n    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);\n    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex, 0, layer);\n    gl.viewport(0, 0, w, h);\n  }\n\n  clearLayer(layer) {\n    const gl = this.gl;\n    this.target(this.storeY, layer, this.w, this.h);\n    gl.clearColor(0, 0, 0, 1);\n    gl.clear(gl.COLOR_BUFFER_BIT);\n    this.target(this.storeC, layer, this.w / 2, this.h / 2);\n    gl.clearColor(0.5, 0.5, 0, 1);\n    gl.clear(gl.COLOR_BUFFER_BIT);\n    gl.bindFramebuffer(gl.FRAMEBUFFER, null);\n  }\n\n  // Upload a VideoFrame into layer index mod N (plan §6.3), then close it.\n  put(index, frame) {\n    const gl = this.gl;\n    try {\n      gl.activeTexture(gl.TEXTURE0);\n      gl.bindTexture(gl.TEXTURE_2D, this.src);\n      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);\n      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, frame);\n      // A large source: mipmaps, so the scale down does not alias.\n      const turned = this.rot % 180 !== 0;\n      const sw = turned ? frame.displayHeight : frame.displayWidth;\n      const mip = sw > 2 * this.w;\n      if (mip) gl.generateMipmap(gl.TEXTURE_2D);\n      texParams(gl, gl.TEXTURE_2D, gl.LINEAR, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);\n    } finally {\n      frame.close();\n    }\n    const layer = index % this.n;\n    gl.useProgram(this.upload.prog);\n    gl.uniform1i(this.upload.u.u_src, 0);\n    gl.uniform1i(this.upload.u.u_rot, this.rot);\n    gl.uniform1i(this.upload.u.u_mode, 0);\n    this.target(this.storeY, layer, this.w, this.h);\n    drawQuad(gl);\n    gl.uniform1i(this.upload.u.u_mode, 1);\n    this.target(this.storeC, layer, this.w / 2, this.h / 2);\n    drawQuad(gl);\n    gl.bindFramebuffer(gl.FRAMEBUFFER, null);\n    this.layerFrame[layer] = index;\n  }\n\n  // The layer of frame t, or -1 when it is not in the store (or t < 0).\n  layerOf(t) {\n    if (t < 0 || !this.n) return -1;\n    const l = t % this.n;\n    return this.layerFrame[l] === t ? l : -1;\n  }\n\n  render(index, delay) {\n    const gl = this.gl;\n    this.last = { index, delay };\n    gl.bindFramebuffer(gl.FRAMEBUFFER, null);\n    gl.viewport(0, 0, this.w, this.h);\n    gl.useProgram(this.show.prog);\n    gl.activeTexture(gl.TEXTURE1);\n    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeY);\n    gl.activeTexture(gl.TEXTURE2);\n    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.storeC);\n    gl.uniform1i(this.show.u.u_storeY, 1);\n    gl.uniform1i(this.show.u.u_storeC, 2);\n    gl.uniform1f(this.show.u.u_layer, this.layerOf(index - delay));\n    drawQuad(gl);\n  }\n\n  read() {\n    const gl = this.gl;\n    this.render(this.last.index, this.last.delay);\n    const pixels = new Uint8Array(this.w * this.h * 4);\n    gl.readPixels(0, 0, this.w, this.h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);\n    return { cmd: 'pixels', width: this.w, height: this.h, pixels };\n  }\n}\n\nreturn { Engine };\n})();\n\n// ---- gpu/gpu-worker.js\nconst {  } = (() => {\n// GPU worker (plan §5.1): the engine on the OffscreenCanvas of the preview.\n// In: { id, msg } with msg.cmd 'init' (msg.canvas) or an engine message. Out: { id, reply } or { id, error }.\n\n\n\nlet engine = null;\n\nself.onmessage = (e) => {\n  const { id, msg } = e.data;\n  try {\n    let reply;\n    if (msg.cmd === 'init') {\n      engine = new Engine(msg.canvas);\n      reply = { cmd: 'caps', ...engine.caps };\n    } else reply = engine.handle(msg);\n    if (engine && engine.lost) self.postMessage({ id, error: 'The GPU context was lost.' });\n    else self.postMessage({ id, reply }, reply && reply.pixels ? [reply.pixels.buffer] : []);\n  } catch (err) {\n    if (msg.frame) try { msg.frame.close(); } catch { /* closed */ }\n    self.postMessage({ id, error: String(err && err.message ? err.message : err) });\n  }\n};\n\nreturn {  };\n})();\n";

let player, preview, timeline, gpu;
// The store state: { short (the preview setting), width, height, n, bytes, budget }.
const store = { short: 540, budget: 0, failAlloc: 0 };

function showMessage(text) {
  const m = $('message');
  m.textContent = text || '';
  m.hidden = !text;
}

function status() {
  const info = player.info;
  const s = $('status');
  if (!info) return;
  const fps = player.stats.fps;
  const slow = player.playing && fps > 0 && fps < info.fps * 0.9 && player.stats.shown > 10;
  s.classList.toggle('warn', slow);
  const parts = [bufferText(store.n, store.width, store.height), `${info.fps.toFixed(info.fps % 1 ? 2 : 0)} fps`];
  if (slow) parts.push(`Preview ${Math.round(fps)} fps`);
  else parts.push(`${info.width}×${info.height}`);
  s.textContent = parts.join(' · ');
}

// Make the store for the working size (plan §6.4). The store is empty after this.
async function configureStore() {
  const info = player.info;
  const { width, height } = workingSize(info.width, info.height, store.short);
  const r = await gpu.call({ cmd: 'configure', width, height, rotation: info.rotation, budget: store.budget || defaultBudget(navigator.userAgent), failAlloc: store.failAlloc });
  Object.assign(store, { width, height, n: r.n, bytes: r.bytes, usedBudget: r.budget });
  player.setStore(r.n);
  preview.setSize(width, height);
  return r;
}

function setProgress(f) {
  const p = $('progress');
  p.hidden = f === null || f === undefined;
  if (!p.hidden) p.style.width = `${Math.round(f * 100)}%`;
}

async function openFile(file) {
  if (!file) return;
  if (!/\.(mp4|mov|m4v)$/i.test(file.name) && !/^video\/(mp4|quicktime)$/.test(file.type)) {
    showMessage('Only MP4 and MOV files are supported.');
    return;
  }
  showMessage('');
  timeline.reset();
  let info;
  try {
    info = await player.open(file);
  } catch (e) {
    document.body.dataset.state = 'start';
    $('view').hidden = true;
    showMessage(e.message);
    return;
  }
  document.body.dataset.state = 'open';
  $('view').hidden = false;
  try {
    await configureStore();
  } catch (e) {
    showMessage(e.message);
    return;
  }
  await player.seek(0);
  status();
}

function keys(e) {
  if (!player.info || e.target.closest('input, select, textarea')) return;
  const P = player;
  const k = e.key;
  if (k === ' ') P.toggle();
  else if (k === 'ArrowLeft') P.step(e.shiftKey ? -10 : -1);
  else if (k === 'ArrowRight') P.step(e.shiftKey ? 10 : 1);
  else if (k === 'Home') P.seek(0);
  else if (k === 'End') P.seek(P.frameCount - 1);
  else if (k === 'i' || k === 'I') timeline.setIn();
  else if (k === 'o' || k === 'O') timeline.setOut();
  else return;
  e.preventDefault();
}

async function start() {
  document.title = `neofx ${VERSION}`;
  const p = await checkPlatform();
  window.neofx = { version: VERSION, platform: p };
  if (!p.ok) {
    document.body.dataset.state = 'unsupported';
    showMessage(p.fatal);
    return;
  }
  if (p.notes.length) showMessage(p.notes.join(' '));
  preview = new Preview($('view'), $('preview'));
  const forceMain = /[?&]gpu=main\b/.test(location.search);
  gpu = new GpuClient($('view'), GPU_WORKER, p.offscreen && !forceMain);
  try {
    await gpu.ready;
  } catch (e) {
    showMessage(e.message);
    return;
  }
  player = new Player(DECODE_WORKER, {
    consume: (index, frame, show) => gpu.call({ cmd: 'upload', index, frame, show }, [frame]),
    render: (index) => gpu.call({ cmd: 'render', index, delay: 0 }),
    onState: () => {
      timeline.update();
      status();
    },
    onThumb: (i, index, bitmap) => timeline.addThumb(i, index, bitmap),
    onError: (msg) => showMessage(msg),
    onProgress: setProgress,
  });
  timeline = new Timeline($('transport'), player);
  Object.assign(window.neofx, { player, preview, timeline, gpu, store, openFile, configureStore });
  $('resSelect').addEventListener('change', async (e) => {
    store.short = Number(e.target.value);
    if (!player.info) return;
    player.pause();
    const t = Math.max(0, player.current);
    await configureStore();
    await player.seek(t);
    status();
  });
  $('openBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', (e) => openFile(e.target.files[0]));
  document.addEventListener('keydown', keys);
  document.addEventListener('dragover', (e) => {
    e.preventDefault();
    document.body.classList.add('drag');
  });
  document.addEventListener('dragleave', () => document.body.classList.remove('drag'));
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('drag');
    openFile(e.dataTransfer.files[0]);
  });
}

start();

return {  };
})();
</script>
