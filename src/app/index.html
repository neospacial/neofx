<!-- neofx v@VERSION@ -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<title>neofx</title>
<!--@css:style.css-->
</head>
<body data-state="start">
<div id="app">
  <header id="topBar">
    <span id="logo">neofx</span>
    <button id="openBtn" type="button">Open</button>
    <button id="presetsBtn" class="wide" type="button">Presets</button>
    <button id="undoBtn" class="wide" type="button" disabled aria-label="Undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="redoBtn" class="wide" type="button" disabled aria-label="Redo" title="Redo (Shift+Ctrl+Z)">↷</button>
    <span class="spacer"></span>
    <span id="status" aria-live="polite"></span>
    <button id="menuBtn" class="narrow" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">⋯</button>
    <button id="exportBtn" type="button" disabled>Export</button>
    <div id="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-act="presets">Presets</button>
      <button type="button" role="menuitem" data-act="undo">Undo</button>
      <button type="button" role="menuitem" data-act="redo">Redo</button>
    </div>
  </header>

  <main id="stage">
    <section id="preview" aria-label="Preview">
      <div id="startScreen">
        <label id="dropArea" for="fileInput">
          <strong>Open a video (MP4 or MOV)</strong>
          <span>Drop a file here, or touch to select one.</span>
        </label>
        <div id="modeInfo">
          <figure><canvas id="demoTime" width="160" height="90" aria-label="Time Map example"></canvas>
            <figcaption><b>Time Map</b> — a greyscale map gives each pixel a delay in frames.</figcaption></figure>
          <figure><canvas id="demoSlit" width="160" height="90" aria-label="Slit Scan example"></canvas>
            <figcaption><b>Slit Scan</b> — a 1 px line repeats in one direction, and gets older with distance.</figcaption></figure>
        </div>
      </div>
      <div id="viewBar" role="tablist" aria-label="View">
        <button type="button" data-view="result" class="on">Result</button>
        <button type="button" data-view="original">Original</button>
        <button type="button" data-view="split">Split</button>
        <button type="button" data-view="mask">Mask</button>
        <button type="button" data-view="map">Map</button>
        <span class="vsep"></span>
        <button type="button" data-zoom="fit" class="on">Fit</button>
        <button type="button" data-zoom="100">100%</button>
      </div>
      <div id="splitLine" hidden><span></span></div>
      <canvas id="view" hidden></canvas>
      <div id="progress" hidden></div>
      <div id="loading" role="status" aria-live="polite" hidden><div class="spinner"></div><p id="loadingText"></p><div class="loadBar"><span></span></div></div>
      <div id="message" hidden></div>
    </section>
    <div id="sizer" aria-hidden="true"></div>
    <aside id="inspectorBox"><div id="sheetHandle" aria-hidden="true"><span></span></div><div id="inspector" aria-label="Inspector"></div></aside>
  </main>

  <footer id="transport">
    <div class="controls">
      <button type="button" data-act="first" aria-label="Go to start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2.5v14H4zM13 5v14L6.5 12zM20.5 5v14L14 12z"/></svg></button>
      <button type="button" data-act="prev" aria-label="Previous frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5v14L6 12zM17 5h2.5v14H17z"/></svg></button>
      <button type="button" data-act="play" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z"/></svg></button>
      <button type="button" data-act="next" aria-label="Next frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5H7v14H4.5zM8.5 5v14L18 12z"/></svg></button>
      <button type="button" data-act="last" aria-label="Go to end"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5v14l6.5-7zM11 5v14l6.5-7zM17.5 5H20v14h-2.5z"/></svg></button>
      <span class="time">00:00.00 / 00:00.00</span>
      <span class="frame">f –</span>
      <span class="spacer"></span>
      <button type="button" data-act="in" aria-label="Set In point">In</button>
      <button type="button" data-act="out" aria-label="Set Out point">Out</button>
      <button type="button" data-act="loop" aria-label="Loop">Loop</button>
      <label class="res">Preview <select id="resSelect">
        <option value="360">360p</option><option value="540" selected>540p</option><option value="720">720p</option><option value="1080">1080p</option><option value="0">Source</option>
      </select></label>
    </div>
    <canvas class="strip" aria-label="Timeline"></canvas>
  </footer>
  <dialog id="exportDialog" aria-label="Export"></dialog>
  <input id="presetFileInput" type="file" accept=".json,application/json" hidden>
  <input id="mapFileInput" type="file" hidden>
  <input id="plateFileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <input id="maskFileInput" type="file" accept="video/*" hidden>
  <input id="fileInput" type="file" accept="video/*" hidden>
</div>
<!--@modules:io/demux.js,io/mp4.js,io/encoder-config.js,maps/builtin.js,maps/curve.js,modes/slit.js,analysis/regions.js,analysis/cleanplate.js,gpu/store.js,gpu/gl.js,gpu/blend.js,gpu/mapgen.js,gpu/slit.js,gpu/mask.js,gpu/edge.js,gpu/engine.js,app/settings.js,app/platform.js,app/player.js,maps/mapsource.js,app/gpu-client.js,app/preview.js,app/ui/timeline.js,app/ui/widgets.js,app/ui/curve.js,app/random.js,app/ui/inspector.js,app/analysis.js,app/ui/handles.js,app/ui/tools.js,app/export.js,app/ui/exportdialog.js,app/history.js,app/presets.js,app/ui/layout.js,app/ui/startscreen.js,app/main.js-->
</body>
</html>
